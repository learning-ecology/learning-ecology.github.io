<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài kiểm tra · Learning Ecology</title>
<meta name="robots" content="noindex">
<!-- The Chinese Test Generator module is embedded UNCHANGED (black box). We only
     drive it through its documented seams: window.CTG_CONTEXT, __EMBEDDED_TEST__,
     CTG_ON_RESULT. Same-origin, so this page holds the Supabase session and saves
     the attempt itself (submit_ctg_attempt → test_attempts gradebook + progress). -->
<link rel="stylesheet" href="HSK%20Test%20Generator/css/common.css">
<link rel="stylesheet" href="HSK%20Test%20Generator/css/student.css">
<style>
  .lms-bar{ display:flex; align-items:center; gap:.7rem; padding:.55rem 1rem; background:#0f1725; color:#fff; flex-wrap:wrap; }
  .lms-bar .brand{ font-weight:800; }
  .lms-bar .sp{ flex:1; }
  .lms-bar a, .lms-bar .who{ color:#cdd6e6; font-size:.9rem; text-decoration:none; }
  .lms-bar a:hover{ color:#fff; }
  .lms-msg{ max-width:760px; margin:2.4rem auto; background:#fff; border:1px solid #dde3ec; border-radius:14px;
    padding:2rem; text-align:center; font-family:system-ui,Segoe UI,Roboto,sans-serif; color:#17263e; }
  .lms-msg a.btn{ display:inline-block; margin-top:1rem; background:#1e4f8f; color:#fff; text-decoration:none;
    padding:.6rem 1.2rem; border-radius:10px; font-weight:700; }
  .lms-toast{ position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); background:#0f1725; color:#fff;
    padding:.6rem 1rem; border-radius:10px; font-size:.9rem; z-index:9999; box-shadow:0 6px 24px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div class="lms-bar">
  <span class="brand">📝 Learning Ecology</span>
  <span class="who" id="lms-who"></span>
  <span class="sp"></span>
  <a href="dashboard.html">← Bảng điều khiển</a>
</div>

<div id="app"><div class="lms-msg">Đang tải bài kiểm tra…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth-gate.js"></script>
<script>
(function () {
  "use strict";
  var MOD = "HSK%20Test%20Generator/";
  var app = document.getElementById("app");
  function fail(html) { app.innerHTML = '<div class="lms-msg">' + html + '</div>'; }
  function toast(t) { var d = document.createElement("div"); d.className = "lms-toast"; d.textContent = t;
    document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3500); }

  var q = new URLSearchParams(location.search);
  var homeworkId = q.get("hw") || null;
  var slug = q.get("lesson") || q.get("test") || null;   // ctg_tests.lesson_id

  boot();
  async function boot() {
    var sess;
    try { sess = (await sb.auth.getSession()).data.session; } catch (e) {}
    if (!sess || !sess.user) {
      location.href = "login.html?next=" + encodeURIComponent(location.pathname + location.search);
      return;
    }
    var user = sess.user;

    // profile (display name only — never expose others' data here)
    var prof = null;
    try { prof = (await sb.from("profiles").select("full_name, role").eq("id", user.id).maybeSingle()).data; } catch (e) {}
    document.getElementById("lms-who").textContent = (prof && prof.full_name) || user.email || "";

    // resolve the assignment (if opened as homework) → its test slug + re-attempt rules
    var hw = null, className = null, courseTitle = null;
    if (homeworkId) {
      try { hw = (await sb.from("hsk_homework").select("*").eq("id", homeworkId).maybeSingle()).data; } catch (e) {}
      if (!hw) { fail("Không mở được bài tập này (có thể bài chưa giao cho bạn). <br><a class=\"btn\" href=\"dashboard.html\">Về Bảng điều khiển</a>"); return; }
      if (hw.kind !== "ctg") { fail("Bài tập này không phải bài kiểm tra."); return; }
      slug = slug || hw.lesson_id;
      // friendly pre-check of the attempt limit (server re-checks authoritatively)
      if (hw.start_at && new Date(hw.start_at) > new Date()) {
        fail("Bài kiểm tra sẽ mở lúc <b>" + new Date(hw.start_at).toLocaleString("vi-VN") + "</b>."); return;
      }
      if (hw.max_attempts && hw.max_attempts > 0) {
        try {
          var c = await sb.from("hsk_attempts").select("id", { count: "exact", head: true })
            .eq("homework_id", homeworkId).eq("user_id", user.id).eq("kind", "ctg");
          if (typeof c.count === "number" && c.count >= hw.max_attempts) {
            fail("Bạn đã hết lượt làm bài này (" + c.count + "/" + hw.max_attempts + ").<br><a class=\"btn\" href=\"dashboard.html\">Về Bảng điều khiển</a>"); return;
          }
        } catch (e) {}
      }
      try { if (hw.class_id) className = (await sb.from("classes").select("name").eq("id", hw.class_id).maybeSingle()).data?.name || null; } catch (e) {}
    }

    if (!slug) { fail("Thiếu mã bài kiểm tra."); return; }

    // fetch the self-contained test package (RLS: published/free/enrolled, or via assignment)
    var row = null;
    try { row = (await sb.from("ctg_tests").select("package, title, course_id, attach_lesson").eq("lesson_id", slug).maybeSingle()).data; } catch (e) {}
    if (!row || !row.package) { fail("Không tìm thấy bài kiểm tra, hoặc bạn chưa có quyền mở.<br><a class=\"btn\" href=\"dashboard.html\">Về Bảng điều khiển</a>"); return; }
    try { if (row.course_id) courseTitle = (await sb.from("courses").select("title").eq("id", row.course_id).maybeSingle()).data?.title || null; } catch (e) {}

    // ---- drive the black-box module through its documented seams ----
    window.CTG_CONTEXT = {
      studentId: user.id,
      studentName: (prof && prof.full_name) || user.email || null,
      "class": className,
      course: courseTitle,
      lessonId: row.attach_lesson || slug,
      assignedTestId: slug
      // attemptId omitted → the adapter mints a fresh one
    };
    window.__EMBEDDED_TEST__ = row.package;

    var saved = false;
    window.CTG_ON_RESULT = async function (attempt) {
      if (saved) return; // one submit → one gradebook row
      try {
        var res = await sb.rpc("submit_ctg_attempt", { p_attempt: attempt, p_homework: homeworkId });
        var out = res.data || {};
        if (res.error) { toast("Lưu điểm lỗi: " + res.error.message); return; }
        if (out.ok === false) {
          toast(out.reason === "no_attempts_left" ? "Đã hết lượt làm bài — điểm không được lưu."
              : "Không lưu được điểm (" + (out.reason || "?") + ").");
          return;
        }
        saved = true;
        toast("✓ Đã lưu điểm " + (out.score != null ? out.score + "/" + out.max : "") + " vào sổ điểm.");
      } catch (e) { toast("Lưu điểm lỗi: " + (e.message || e)); }
    };

    // load the module engine + player IN ORDER, after the globals are set
    loadSeq([
      MOD + "js/core/schema.js",
      MOD + "js/core/pinyin.js",
      MOD + "js/core/scoring.js",
      MOD + "js/core/lms-adapter.js",
      MOD + "js/student-app.js"
    ]);
  }

  function loadSeq(list) {
    var i = 0;
    (function next() {
      if (i >= list.length) return;
      var s = document.createElement("script");
      s.src = list[i++];
      s.onload = next;
      s.onerror = function () { fail("Không tải được trình chạy bài kiểm tra. Hãy thử lại."); };
      document.body.appendChild(s);
    })();
  }
})();
</script>
</body>
</html>
