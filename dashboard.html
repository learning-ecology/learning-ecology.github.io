            if (rec.organization) {
              org_id = orgByName[normH(rec.organization)] || null;
              if (!org_id) errors.push('unknown organization "' + rec.organization + '"');
            }
            if (!org_id) errors.push("no organization");
            const courseIds = [];
            if (rec.courses) {
              for (const cName of rec.courses.split(/[;|]/).map(x => x.trim()).filter(Boolean)) {
                const cid = courseByName[normH(cName)];
                if (cid) courseIds.push(cid);
                else errors.push('unknown course "' + cName + '"');
              }
            }
            const expires = normDate(rec.access_expires);
            if (expires === "bad") errors.push('invalid date "' + rec.access_expires + '" (use YYYY-MM-DD)');
            const pwGiven = rec.password || "";
            if (pwGiven && pwGiven.length < 6) errors.push("password under 6 characters");
            return {
              line: ix + 2, full_name: rec.full_name || null, email,
              password: pwGiven || genPw(), pwAuto: !pwGiven,
              role: role || "student", org_id, courseIds,
              access_expires: expires === "bad" ? null : expires, errors
            };
          });

          renderPreview();
        });

        function renderPreview() {
          const ok = parsed.filter(r => !r.errors.length);
          const bad = parsed.filter(r => r.errors.length);
          const stat = (k, v) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
          box.innerHTML = `
            <div class="stat-grid">
              ${stat("Rows in file", parsed.length)}
              ${stat("Ready to create", ok.length)}
              ${stat("Rows with problems", bad.length)}
            </div>
            <div style="max-height:300px; overflow:auto; border:1px solid var(--line); border-radius:var(--radius);">
              <table><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Role</th><th>Courses</th><th>Status</th></tr></thead>
              <tbody>${parsed.slice(0, 300).map(r => `
                <tr class="${r.errors.length ? "row-off" : ""}">
                  <td>${r.line}</td>
                  <td>${esc(r.full_name || "—")}</td>
                  <td>${esc(r.email || "—")}</td>
                  <td>${esc(r.role)}</td>
                  <td>${r.courseIds.length || "—"}</td>
                  <td>${r.errors.length
                        ? `<span class="pill bad">✕</span> <span class="kind" style="text-transform:none; letter-spacing:0;">${esc(r.errors.join("; "))}</span>`
                        : `<span class="pill done">ready${r.pwAuto ? " · auto password" : ""}</span>`}</td>
                </tr>`).join("")}</tbody></table>
              ${parsed.length > 300 ? `<p class="kind" style="padding:0.5rem;">…showing the first 300 of ${parsed.length} rows.</p>` : ""}
            </div>
            ${bad.length ? `
            <label style="font-size:0.85rem; color:var(--muted); cursor:pointer; display:block; margin-top:0.6rem;">
              <input type="checkbox" id="bi-skip" /> Skip the ${bad.length} problem row(s) and import the ${ok.length} valid one(s) — or fix the file and choose it again
            </label>` : ""}
            <div class="form-row" style="margin-top:0.7rem;">
              <button id="bi-go" ${(!ok.length || bad.length) ? "disabled" : ""}>Create ${ok.length} account(s)</button>
              <button class="ghost" id="bi-cancel">Cancel</button>
            </div>
            <div id="bi-run"></div>`;

          const goBtn = document.getElementById("bi-go");
          document.getElementById("bi-cancel").addEventListener("click", () => {
            parsed = null; fileIn.value = ""; box.innerHTML = "";
          });
          const skip = document.getElementById("bi-skip");
          if (skip) skip.addEventListener("change", () => { goBtn.disabled = !(skip.checked && ok.length); });
          goBtn.addEventListener("click", () => runImport(ok));
        }

        async function runImport(rows) {
          const run = document.getElementById("bi-run");
          document.getElementById("bi-go").disabled = true;
          const inviteMode = document.getElementById("bi-invite").checked;
          const { data: { session } } = await sb.auth.getSession();
          const today = dstr(new Date());
          const results = [];
          for (let i = 0; i < rows.length; i++) {
            const r = rows[i];
            run.innerHTML = `
              <p class="kind" style="margin:0.7rem 0 0.25rem;">Creating ${i + 1} of ${rows.length} — ${esc(r.email)}</p>
              <div class="progress"><span style="width:${Math.round(i / rows.length * 100)}%;"></span></div>`;
            try {
              const payload = { action: "create", email: r.email, full_name: r.full_name,
                                role: r.role, org_id: r.org_id };
              if (inviteMode) {
                payload.invite = true;
                payload.redirect = new URL("reset.html", location.href).href;
              } else payload.password = r.password;
              const res = await fetch(SUPABASE_URL + "/functions/v1/manage-user", {
                method: "POST",
                headers: { "Content-Type": "application/json",
                           Authorization: "Bearer " + session.access_token,
                           apikey: SUPABASE_ANON_KEY },
                body: JSON.stringify(payload)
              });
              const out = await res.json();
              if (!res.ok || out.error) throw new Error(out.error || "request failed");
              let note = [];
              if (r.role === "student" && r.courseIds.length) {
                const { error: enErr } = await sb.from("enrollments").insert(
                  r.courseIds.map(cid => ({ student_id: out.user_id, course_id: cid,
                                            teacher_id: user.id, org_id: r.org_id })));
                note.push(enErr ? "enrollment failed: " + enErr.message : r.courseIds.length + " course(s)");
              }
              if (r.role === "student" && r.access_expires) {
                const { error: exErr } = await sb.from("profiles")
                  .update({ access_start: today, access_expires: r.access_expires })
                  .eq("id", out.user_id);
                note.push(exErr ? "expiry failed" : "until " + r.access_expires);
              }
              results.push({ email: r.email, full_name: r.full_name || "", status: "created",
                             detail: note.join(" · "),
                             password: inviteMode ? "(invitation email)" : r.password });
            } catch (err) {
              results.push({ email: r.email, full_name: r.full_name || "", status: "FAILED",
                             detail: String(err.message || err), password: "" });
            }
          }
          const okN = results.filter(x => x.status === "created").length;
          const badN = results.length - okN;
          run.innerHTML = `
            <div class="progress"><span style="width:100%;"></span></div>
            <div class="stat-grid" style="margin-top:0.7rem;">
              <div class="stat"><div class="k">Created</div><div class="v">${okN}</div></div>
              <div class="stat"><div class="k">Failed</div><div class="v">${badN}</div></div>
            </div>
            ${badN ? `<p class="msg err">${results.filter(x => x.status === "FAILED").slice(0, 5)
                .map(x => esc(x.email + ": " + x.detail)).join("<br>")}${badN > 5 ? "<br>…" : ""}</p>` : ""}
            <div class="form-row" style="margin-top:0.5rem;">
              <button class="ghost" id="bi-report">⬇ Download report${inviteMode ? "" : " (includes the passwords — keep it safe!)"}</button>
              <button id="bi-done">Done — refresh</button>
            </div>`;
          document.getElementById("bi-report").addEventListener("click", () =>
            UI.csv("import-report.csv", results));
          document.getElementById("bi-done").addEventListener("click", () => renderAdmin());
        }
      })();
      // =============== END BULK ACCOUNT IMPORT ===============

      // ================= V-SAT EXAM MANAGEMENT (Phase 50) =================
      // Uploading an exam does not touch the test engine: vsat.html renders
      // whatever data it is given. Here we only store, order and gate it.
      (function () {
        const listEl = document.getElementById("vs-list");
        if (!listEl) return;
        const msg = document.getElementById("vs-msg");
        const said = (t, err) => { msg.textContent = t; msg.className = "msg" + (err ? " err" : ""); };
        const countEl = document.getElementById("vs-count");

        function questionCount(exam) {
          let n = 0;
          (((exam || {}).mock || {}).parts || []).forEach(p => (p.blocks || []).forEach(b => {
            if (b.type === "gapfill") n += (b.nums || []).length;
            else if (b.type !== "passage") n += 1;
          }));
          return n;
        }

        function renderVs() {
          countEl.textContent = vsRows.length ? "(" + vsRows.length + ")" : "";
          if (!vsRows.length) {
            listEl.innerHTML = '<p class="empty">Chưa có đề nào. Tải lên tệp <b>.vsat.json</b> hoặc <b>.xlsx</b> ở trên.</p>';
            return;
          }
          listEl.innerHTML = vsRows.map(e => `
            <div class="lesson" style="flex-wrap:wrap;">
              <div class="meta">
                <div class="title">${esc(e.title)}${e.published ? "" : ' <span class="pill off">nháp</span>'}</div>
                <span class="kind">${esc(e.subtitle || "")}${e.questions ? " · " + e.questions + " câu" : ""}${e.duration_min ? " · " + e.duration_min + " phút" : ""}${e.max_raw ? " · tối đa " + e.max_raw + " điểm" : ""}</span>
              </div>
              <input type="number" class="vs-ord" data-id="${e.id}" value="${e.sort_order ?? 0}" min="0" title="Thứ tự hiển thị" style="max-width:70px; flex:none;" />
              <select class="vs-tier" data-id="${e.id}" style="max-width:110px;" title="Miễn phí hay Premium">
                <option value="free" ${e.tier === "free" ? "selected" : ""}>Miễn phí</option>
                <option value="premium" ${e.tier !== "free" ? "selected" : ""}>👑 Premium</option>
              </select>
              <select class="vs-course" data-id="${e.id}" style="max-width:190px;" title="Gắn với khoá học (học viên của khoá này mở được)">
                <option value="">— không gắn khoá —</option>
                ${(courses || []).map(c => `<option value="${c.id}" ${e.course_id === c.id ? "selected" : ""}>${esc(c.title)}</option>`).join("")}
              </select>
              <label style="font-size:0.85rem; color:var(--muted); white-space:nowrap;">
                <input type="checkbox" class="vs-pub" data-id="${e.id}" ${e.published ? "checked" : ""} /> đăng</label>
              <a class="ghost btn" href="vsat.html?exam=${encodeURIComponent(e.exam_id)}" target="_blank" rel="noopener" style="text-decoration:none;">👁</a>
              <button class="ghost" data-vsdel="${e.id}" style="color:var(--danger); border-color:var(--danger);">🗑</button>
            </div>`).join("");
        }

        async function patch(id, fields) {
          const { error } = await sb.from("vsat_exams").update(fields).eq("id", id);
          if (error) { said("Không lưu được: " + error.message, true); return false; }
          const row = vsRows.find(r => r.id === id);
          if (row) Object.assign(row, fields);
          return true;
        }

        listEl.addEventListener("change", async e => {
          const t = e.target;
          if (t.classList.contains("vs-tier")) { if (await patch(t.dataset.id, { tier: t.value })) said("Đã đổi loại truy cập ✓"); }
          if (t.classList.contains("vs-pub")) { if (await patch(t.dataset.id, { published: t.checked })) said(t.checked ? "Đã đăng ✓" : "Đã gỡ xuống ✓"); }
          if (t.classList.contains("vs-ord")) { if (await patch(t.dataset.id, { sort_order: Number(t.value) || 0 })) said("Đã đổi thứ tự ✓"); }
          if (t.classList.contains("vs-course")) { if (await patch(t.dataset.id, { course_id: t.value || null })) said("Đã gắn khoá học ✓"); }
        });
        listEl.addEventListener("click", async e => {
          const b = e.target.closest("[data-vsdel]"); if (!b) return;
          const row = vsRows.find(r => r.id === b.dataset.vsdel); if (!row) return;
          const ok = await UI.confirmDialog({ title: "Xoá đề này?", danger: true, okText: "Xoá",
            body: `“${row.title}” sẽ bị xoá khỏi thư viện. Kết quả học viên đã làm vẫn được giữ.` });
          if (!ok) return;
          const { error } = await sb.from("vsat_exams").delete().eq("id", row.id);
          if (error) { said("Không xoá được: " + error.message, true); return; }
          vsRows = vsRows.filter(r => r.id !== row.id);
          renderVs(); said("Đã xoá ✓");

        /* ---- upload: .vsat.json straight in, .xlsx through the ported parser ---- */
        document.getElementById("vs-file").addEventListener("change", async ev => {
          const files = [...(ev.target.files || [])];
          ev.target.value = "";
          if (!files.length) return;
          let added = 0, failed = 0;
          for (const f of files) {
            said("Đang xử lý " + f.name + "…");
            let exam = null;
            try {
              if (/\.(xlsx|xls)$/i.test(f.name)) {
                const XLSXlib = await loadXLSX();
                const wb = XLSXlib.read(await f.arrayBuffer(), { type: "array" });
                exam = window.VSATParser.parseWorkbook(wb);
                if (exam && window.VSATParser.autogenExercises) window.VSATParser.autogenExercises(exam);
              } else {
                exam = JSON.parse(await f.text());
              }
            } catch (err) { said(f.name + ": không đọc được — " + err.message, true); failed++; continue; }

            const errs = (window.VSATParser && window.VSATParser.validateExamFull)
              ? window.VSATParser.validateExamFull(exam) : [];
            if (errs && errs.length) { said(f.name + ": " + errs.slice(0, 3).join(" "), true); failed++; continue; }
            if (!exam || !exam.meta || !exam.meta.id) { said(f.name + ": thiếu meta.id", true); failed++; continue; }

            const q = questionCount(exam);
            const row = {
              exam_id: exam.meta.id,
              title: exam.meta.title || exam.meta.id,
              subtitle: exam.meta.subtitle || "",
              institution: exam.meta.institution || "",
              subject: exam.meta.subject || "",
              duration_min: Number(exam.meta.durationMinutes) || 60,
              questions: q,
              max_raw: Number(exam.meta.maxScore) || q * 6,
              data: exam,
              sort_order: vsRows.length,
              created_by: user.id
            };
            /* re-uploading the same exam_id replaces its content but keeps the
               tier / published / order the teacher already set */
            const { data: ins, error } = await sb.from("vsat_exams")
              .upsert(row, { onConflict: "exam_id" }).select().single();
            if (error) { said(f.name + ": " + error.message, true); failed++; continue; }
            const i = vsRows.findIndex(r => r.exam_id === ins.exam_id);
            if (i >= 0) vsRows[i] = ins; else vsRows.push(ins);
            added++;
          }
          renderVs();
          said(added + " đề đã tải lên" + (failed ? " · " + failed + " tệp lỗi" : "") +
               (added ? " — nhớ tick “đăng” để học viên thấy." : ""), failed && !added);
        });

        document.getElementById("vs-hint").textContent =
          "Tải lại cùng một đề sẽ cập nhật nội dung, giữ nguyên cài đặt.";
        renderVs();
      })();

        /* Bảng kiểm tra hiện TRƯỚC khi thầy tick "đăng": lỗi thì không tải lên,

        function showReport(name, v, ok) {
          const box = document.createElement("div");
          box.className = "card";
          box.style.cssText = "margin:0.5rem 0 0; padding:0.7rem 0.9rem;";
          const s = v.stats || {};
          box.innerHTML =
            `<div style="font-weight:700; margin-bottom:0.35rem;">${ok ? "✅" : "⛔"} ${esc(name)}</div>` +
            `<div class="kind" style="text-transform:none; letter-spacing:0; margin-bottom:0.4rem;">` +
              `${s.passages || 0} bài đọc · ${s.questions || 0} câu · tối đa ${s.maxScore || 0} điểm · ` +
              `${s.vocab || 0} từ vựng · ${s.grammar || 0} cấu trúc ngữ pháp</div>` +
            ((v.errs && v.errs.length)
              ? `<div style="color:var(--danger); font-size:0.85rem;"><b>Lỗi phải sửa (${v.errs.length}):</b><ul style="margin:0.3rem 0 0 1.1rem;">` +
                v.errs.slice(0, 12).map(x => `<li>${esc(x)}</li>`).join("") +
                (v.errs.length > 12 ? `<li>… và ${v.errs.length - 12} lỗi nữa</li>` : "") + `</ul></div>` : "") +
            ((v.warns && v.warns.length)
              ? `<div style="color:var(--muted); font-size:0.85rem; margin-top:0.35rem;"><b>Nhắc (${v.warns.length}):</b><ul style="margin:0.3rem 0 0 1.1rem;">` +
                v.warns.slice(0, 8).map(x => `<li>${esc(x)}</li>`).join("") +
                (v.warns.length > 8 ? `<li>… và ${v.warns.length - 8} mục nữa</li>` : "") + `</ul></div>` : "");
          report.appendChild(box);
        }

        document.getElementById("vp-file").addEventListener("change", async ev => {
          const files = [...(ev.target.files || [])];
          ev.target.value = "";
          if (!files.length) return;
          report.innerHTML = "";
          let added = 0, failed = 0;
          for (const f of files) {
            said("Đang xử lý " + f.name + "…");
            let exam = null;
            try {
              if (/\.(xlsx|xls)$/i.test(f.name)) {
                const XLSXlib = await loadXLSX();
                const wb = XLSXlib.read(await f.arrayBuffer(), { type: "array" });
                exam = window.VSTEPParser.parseWorkbook(wb);
                window.VSTEPParser.autogenExercises(exam);
              } else {
                exam = JSON.parse(await f.text());
              }
            } catch (err) { said(f.name + ": không đọc được — " + err.message, true); failed++; continue; }

            const v = window.VSTEPParser.validateExamFull(exam);
            if (v.errs && v.errs.length) { showReport(f.name, v, false); failed++; continue; }

            const nQ = (exam.reading || []).reduce((a, p) => a + ((p.questions || []).length), 0);
            const scale = Number(exam.meta.scorePerQuestion) || 0.25;
            const row = {
              exam_id: exam.meta.id,
              title: exam.meta.title || exam.meta.id,
              subtitle: exam.meta.subtitle || "",
              institution: exam.meta.institution || "",
              subject: exam.meta.subject || "Tiếng Anh",
              duration_min: Number(exam.meta.durationMinutes) || 60,
              questions: nQ,
              max_raw: Math.round(nQ * scale),
              data: exam,
              kind: "vstep-reading",
              sort_order: vpRows.length,
              created_by: user.id
            };
            /* tải lại cùng exam_id = cập nhật nội dung, giữ nguyên
               Miễn phí/Premium, trạng thái đăng và thứ tự thầy đã đặt */
            const { data: ins, error } = await sb.from("vsat_exams")
              .upsert(row, { onConflict: "exam_id" }).select().single();
            if (error) {
              said(f.name + ": " + error.message +
                (/kind/.test(error.message || "") ? " — hình như chưa chạy migration53_vstep.sql." : ""), true);
              failed++; continue;
            }
            const i = vpRows.findIndex(r => r.exam_id === ins.exam_id);
            if (i >= 0) vpRows[i] = ins; else vpRows.push(ins);
            showReport(f.name, v, true);
            added++;
          }
          renderVp();
          said(added + " đề đã tải lên" + (failed ? " · " + failed + " tệp lỗi" : "") +
               (added ? " — bấm 👁 xem thử, rồi tick “đăng” để học viên thấy." : ""), failed && !added);
        });

        renderVp();
      })();

      // ================= VSTEP LISTENING (Phase 55) =================
      // Cùng tab VSTEP, chuyển qua lại giữa 📖 Đọc và 🎧 Nghe.
      // Đề Nghe nằm chung bảng vsat_exams (kind = 'vstep-listening'), chỉ
      // khác một việc: tệp mp3 phải tải lên kho tệp trước, rồi mới thay tên
      // tệp trong đề bằng đường dẫn thật.
      (function () {
        const listEl = document.getElementById("vl-list");
        if (!listEl) return;
        const msg = document.getElementById("vl-msg");
        const report = document.getElementById("vl-report");
        const countEl = document.getElementById("vl-count");
        const said = (t, err) => { msg.textContent = t; msg.className = "msg" + (err ? " err" : ""); };

        /* chuyển Đọc ↔ Nghe */
        document.querySelectorAll("[data-vskill]").forEach(b => {
          b.addEventListener("click", () => {
            const skill = b.dataset.vskill;
            document.querySelectorAll("[data-vskill]").forEach(x => x.classList.toggle("on", x === b));
            const r = document.getElementById("vp-pane-reading"), l = document.getElementById("vp-pane-listening");
            if (r) r.hidden = skill !== "reading";
            if (l) l.hidden = skill !== "listening";
          });
        });

        function renderVl() {
          countEl.textContent = vlRows.length ? "(" + vlRows.length + ")" : "";
          if (!vlRows.length) {
            listEl.innerHTML = '<p class="empty">Chưa có đề Nghe nào. Tải tệp Excel mẫu ở trên, điền nội dung rồi tải lên cùng các tệp mp3.</p>';
            return;
          }
          listEl.innerHTML = vlRows.map(e => `
            <div class="lesson" style="flex-wrap:wrap;">
              <div class="meta">
                <div class="title">${esc(e.title)}${e.published ? "" : ' <span class="pill off">nháp</span>'}</div>
                <span class="kind">${esc(e.subtitle || "")}${e.questions ? " · " + e.questions + " câu" : ""}</span>
              </div>
              <input type="number" class="vl-ord" data-id="${e.id}" value="${e.sort_order == null ? 0 : e.sort_order}" min="0" title="Thứ tự hiển thị" style="max-width:70px; flex:none;" />
              <select class="vl-tier" data-id="${e.id}" style="max-width:110px;" title="Miễn phí hay Premium">
                <option value="free" ${e.tier === "free" ? "selected" : ""}>Miễn phí</option>
                <option value="premium" ${e.tier !== "free" ? "selected" : ""}>👑 Premium</option>
              </select>
              <select class="vl-course" data-id="${e.id}" style="max-width:190px;" title="Gắn với khoá học">
                <option value="">— không gắn khoá —</option>
                ${(courses || []).map(c => `<option value="${c.id}" ${e.course_id === c.id ? "selected" : ""}>${esc(c.title)}</option>`).join("")}
              </select>
              <label style="font-size:0.85rem; color:var(--muted); white-space:nowrap;">
                <input type="checkbox" class="vl-pub" data-id="${e.id}" ${e.published ? "checked" : ""} /> đăng</label>
              <a class="ghost btn" href="vstep-listening.html?exam=${encodeURIComponent(e.exam_id)}" target="_blank" rel="noopener" style="text-decoration:none;" title="Xem thử">👁</a>
              <button class="ghost" data-vldel="${e.id}" style="color:var(--danger); border-color:var(--danger);">🗑</button>
            </div>`).join("");
        }

        async function patch(id, fields) {
          const { error } = await sb.from("vsat_exams").update(fields).eq("id", id);
          if (error) { said("Không lưu được: " + error.message, true); return false; }
          const row = vlRows.find(r => r.id === id);
          if (row) Object.assign(row, fields);
          return true;
        }
        listEl.addEventListener("change", async e => {
          const t = e.target;
          if (t.classList.contains("vl-tier")) { if (await patch(t.dataset.id, { tier: t.value })) said("Đã đổi loại truy cập ✓"); }
          if (t.classList.contains("vl-pub"))  { if (await patch(t.dataset.id, { published: t.checked })) said(t.checked ? "Đã đăng ✓" : "Đã gỡ xuống ✓"); }
          if (t.classList.contains("vl-ord"))  { if (await patch(t.dataset.id, { sort_order: Number(t.value) || 0 })) said("Đã đổi thứ tự ✓"); }
          if (t.classList.contains("vl-course")) { if (await patch(t.dataset.id, { course_id: t.value || null })) said("Đã gắn khoá học ✓"); }
        });
        listEl.addEventListener("click", async e => {
          const b = e.target.closest("[data-vldel]"); if (!b) return;
          const row = vlRows.find(r => r.id === b.dataset.vldel); if (!row) return;
          const ok = await UI.confirmDialog({ title: "Xoá đề Nghe này?", danger: true, okText: "Xoá",
            body: `“${row.title}” sẽ bị xoá khỏi thư viện. Tệp âm thanh vẫn còn trong kho; kết quả học viên đã làm vẫn được giữ.` });
          if (!ok) return;
          const { error } = await sb.from("vsat_exams").delete().eq("id", row.id);
          if (error) { said("Không xoá được: " + error.message, true); return; }
          vlRows = vlRows.filter(r => r.id !== row.id);
          renderVl(); said("Đã xoá ✓");
        });

        function showReport(name, v, ok, extra) {
          const box = document.createElement("div");
          box.className = "card";
          box.style.cssText = "margin:0.5rem 0 0; padding:0.7rem 0.9rem;";
          const s = v.stats || {};
          box.innerHTML =
            `<div style="font-weight:700; margin-bottom:0.35rem;">${ok ? "✅" : "⛔"} ${esc(name)}</div>` +
            `<div class="kind" style="text-transform:none; letter-spacing:0; margin-bottom:0.4rem;">` +
              `${s.parts || 0} phần · ${s.questions || 0} câu · ${s.audio || 0} tệp âm thanh${extra ? " · " + esc(extra) : ""}</div>` +
            ((v.errs && v.errs.length)
              ? `<div style="color:var(--danger); font-size:0.85rem;"><b>Lỗi phải sửa (${v.errs.length}):</b><ul style="margin:0.3rem 0 0 1.1rem;">` +
                v.errs.slice(0, 12).map(x => `<li>${esc(x)}</li>`).join("") +
                (v.errs.length > 12 ? `<li>… và ${v.errs.length - 12} lỗi nữa</li>` : "") + `</ul></div>` : "") +
            ((v.warns && v.warns.length)
              ? `<div style="color:var(--muted); font-size:0.85rem; margin-top:0.35rem;"><b>Nhắc (${v.warns.length}):</b><ul style="margin:0.3rem 0 0 1.1rem;">` +
                v.warns.slice(0, 8).map(x => `<li>${esc(x)}</li>`).join("") +
                (v.warns.length > 8 ? `<li>… và ${v.warns.length - 8} mục nữa</li>` : "") + `</ul></div>` : "");
          report.appendChild(box);
        }

        /* Tải lên: chọn CÙNG LÚC một tệp .xlsx và các tệp mp3 của đề đó. */
        document.getElementById("vl-file").addEventListener("change", async ev => {
          const files = [...(ev.target.files || [])];
          ev.target.value = "";
          if (!files.length) return;
          report.innerHTML = "";

          const book = files.find(f => /\.(xlsx|xls)$/i.test(f.name));
          const audio = files.filter(f => /\.(mp3|m4a|wav|ogg|webm|mp4)$/i.test(f.name));
          if (!book) { said("Chưa chọn tệp Excel của đề (.xlsx).", true); return; }

          let exam = null;
          try {
            const XLSXlib = await loadXLSX();
            const wb = XLSXlib.read(await book.arrayBuffer(), { type: "array" });
            exam = window.VLISTENParser.parseWorkbook(wb);
          } catch (err) { said(book.name + ": không đọc được — " + err.message, true); return; }

          const v = window.VLISTENParser.validateExamFull(exam, audio.map(f => f.name));
          if (v.errs && v.errs.length) { showReport(book.name, v, false); said("Chưa tải lên được — xem lỗi bên dưới.", true); return; }

          /* tải mp3 lên kho, đặt trong thư mục riêng của đề */
          const map = {};
          let done = 0;
          for (const f of audio) {
            said(`Đang tải âm thanh ${++done}/${audio.length}: ${f.name} …`);
            const path = exam.testId + "/" + f.name;
            const up = await sb.storage.from("vstep-audio")
              .upload(path, f, { upsert: true, contentType: f.type || "audio/mpeg", cacheControl: "31536000" });
            if (up.error) {
              said("Không tải được " + f.name + ": " + up.error.message +
                (/Bucket not found/i.test(up.error.message || "") ? " — hình như chưa chạy migration54_vstep_audio.sql." : ""), true);
              return;
            }
            map[f.name] = sb.storage.from("vstep-audio").getPublicUrl(path).data.publicUrl;
          }
          window.VLISTENParser.applyAudioUrls(exam, map);

          const row = {
            exam_id: exam.testId,
            title: exam.title || exam.testId,
            subtitle: exam.subtitle || "",
            institution: "",
            subject: "Tiếng Anh",
            duration_min: 40,
            questions: exam.totalQuestions,
            max_raw: 10,
            data: exam,
            kind: "vstep-listening",
            sort_order: vlRows.length,
            created_by: user.id
          };
          const { data: ins, error } = await sb.from("vsat_exams")
            .upsert(row, { onConflict: "exam_id" }).select().single();
          if (error) { said(book.name + ": " + error.message, true); return; }
          const i = vlRows.findIndex(r => r.exam_id === ins.exam_id);
          if (i >= 0) vlRows[i] = ins; else vlRows.push(ins);
          showReport(book.name, v, true, audio.length + " tệp đã tải lên kho");
          renderVl();
          said("Đã tải đề Nghe lên — bấm 👁 xem thử, rồi tick “đăng” để học viên thấy.");
        });

        renderVl();
      })();

      // ================= HSK SLIDES GENERATOR (Phase 56) =================
      // Cùng khuôn với V-SAT và VSTEP: tải mẫu → nhập Excel → kiểm tra →
      // xem thử → đăng. Khác một việc: sau khi kiểm tra xong, hệ thống đi
      // tìm ảnh minh hoạ cho những từ có từ khoá tiếng Anh, và mỗi ảnh đã
      // duyệt được ghi vào thư viện hsk_media để bài sau dùng lại.
      (function () {
        const listEl = document.getElementById("hs-list");
        if (!listEl) return;
        let hsLvl = 0;        // HSK-level filter (0 = Tất cả) — uses each lesson's hsk_level
        let hsStatus = "all"; // lọc theo trạng thái ảnh: all | review | done
        let hsOpenId = null;  // which lesson's inline editor is open (one at a time)
        let hsPasteOff = null; // detaches the current editor's ⌘V paste listener
        const lvlSel = document.getElementById("hs-lvl");
        if (lvlSel) lvlSel.addEventListener("change", () => { hsLvl = Number(lvlSel.value) || 0; closeEditor(); renderHs(); });
        const stSel = document.getElementById("hs-status");
        if (stSel) stSel.addEventListener("change", () => { hsStatus = stSel.value || "all"; closeEditor(); renderHs(); });
        /* số từ CHƯA có ảnh trong một bài = số ảnh cần xem lại */
        function reviewCountOf(data){ return (data && Array.isArray(data.vocabulary)) ? data.vocabulary.filter(v => !(v.image && v.image.url)).length : 0; }
        function reviewCount(l){ return reviewCountOf(l && l.data); }
        function goReviewFilter(){ hsStatus = "review"; if (stSel) stSel.value = "review"; closeEditor(); renderHs();
          const c = document.querySelector('[data-tab="hsk"] #hs-list'); if (c) c.scrollIntoView({ behavior: "smooth", block: "start" }); }

        /* Thư viện phát âm dùng chung với trang bài giảng: thầy nghe thử ở
           đây là bản ghi đã nằm sẵn trong thư viện cho học viên. */
        window.ZhSpeech.configure({
          db: sb, canCache: true,
          async mediaGet(key) {
            try { const { data } = await sb.from("hsk_media").select("url")
              .eq("media_key", key).eq("kind", "audio").maybeSingle();
              return (data && data.url) || ""; } catch (e) { return ""; }
          },
          async mediaPut(key, blob) {
            const path = "audio/" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7) + ".mp3";
            const up = await sb.storage.from("hsk-media")
              .upload(path, blob, { upsert: true, contentType: "audio/mpeg", cacheControl: "31536000" });
            if (up.error) throw up.error;
            const url = sb.storage.from("hsk-media").getPublicUrl(path).data.publicUrl;
            await sb.from("hsk_media").upsert({ media_key: key, kind: "audio", url,
              source: "generated", created_by: user.id }, { onConflict: "media_key,kind" });
            return url;
          }
        });
        const msg = document.getElementById("hs-msg");
        const report = document.getElementById("hs-report");
        const countEl = document.getElementById("hs-count");
        const said = (t, err) => { msg.textContent = t; msg.className = "msg" + (err ? " err" : ""); };

        /* ---------- danh sách bài ---------- */
        function hsView() {
          let v = hsLvl ? hskRows.filter(l => Number(l.hsk_level) === hsLvl) : hskRows.slice();
          if (hsStatus === "review") v = v.filter(l => reviewCount(l) > 0).sort((a, b) => reviewCount(b) - reviewCount(a));
          else if (hsStatus === "done") v = v.filter(l => reviewCount(l) === 0);
          return v;
        }
        function renderHs() {
          const view = hsView();
          countEl.textContent = hskRows.length
            ? "(" + view.length + (hsLvl ? " / " + hskRows.length : "") + ")" : "";
          if (!hskRows.length) {
            listEl.innerHTML = '<p class="empty">Chưa có bài giảng nào. Tải tệp Excel mẫu ở trên, điền nội dung rồi tải lên.</p>';
            return;
          }
          if (!view.length) {
            listEl.innerHTML = '<p class="empty">Không có bài giảng nào ở cấp này.</p>';
            return;
          }
          listEl.innerHTML = view.map(l => { const rc = reviewCount(l); return `
            <div class="lesson${rc > 0 ? " hs-warn" : ""}" data-hsrow="${l.id}" style="flex-wrap:wrap;">
              <div class="meta">
                <div class="title">HSK ${l.hsk_level} · ${esc(l.title)}${l.published ? "" : ' <span class="pill off">nháp</span>'}<span class="hs-badge" data-hsbadge="${l.id}"${rc > 0 ? "" : ' style="display:none;"'}>⚠️ ${rc} ảnh cần xem lại</span></div>
                <span class="kind hs-sum">${esc(l.subtitle || "")} · ${l.vocab_count || 0} từ · ${l.slide_count || 0} slide</span>
              </div>
              <input type="number" class="hs-ord" data-id="${l.id}" value="${l.sort_order == null ? 0 : l.sort_order}" min="0" title="Thứ tự" style="max-width:70px; flex:none;" />
              <select class="hs-tier" data-id="${l.id}" style="max-width:110px;">
                <option value="free" ${l.tier === "free" ? "selected" : ""}>Miễn phí</option>
                <option value="premium" ${l.tier !== "free" ? "selected" : ""}>👑 Premium</option>
              </select>
              <select class="hs-course" data-id="${l.id}" style="max-width:180px;" title="Gắn với khoá học">
                <option value="">— không gắn khoá —</option>
                ${(courses || []).map(c => `<option value="${c.id}" ${l.course_id === c.id ? "selected" : ""}>${esc(c.title)}</option>`).join("")}
              </select>
              <label style="font-size:0.85rem; color:var(--muted); white-space:nowrap;">
                <input type="checkbox" class="hs-pub" data-id="${l.id}" ${l.published ? "checked" : ""} /> đăng</label>
              <button class="ghost" data-hsedit="${l.id}" title="Sửa nội dung">✏️</button>
              <a class="ghost btn" href="hsk-slides.html?lesson=${encodeURIComponent(l.lesson_id)}" target="_blank" rel="noopener" style="text-decoration:none;" title="Xem thử">👁</a>
              <button class="ghost" data-hsdup="${l.id}" title="Nhân bản">⧉</button>
              <button class="ghost" data-hsdel="${l.id}" style="color:var(--danger); border-color:var(--danger);">🗑</button>
            </div>
            <div class="hs-editrow" data-editrow="${l.id}"></div>`; }).join("");
        }

        async function patch(id, fields) {
          const { error } = await sb.from("hsk_lessons").update(fields).eq("id", id);
          if (error) { said("Không lưu được: " + error.message, true); return false; }
          const row = hskRows.find(r => r.id === id);
          if (row) Object.assign(row, fields);
          return true;
        }
        listEl.addEventListener("change", async e => {
          const t = e.target;
          if (t.classList.contains("hs-tier"))   { if (await patch(t.dataset.id, { tier: t.value })) said("Đã đổi loại truy cập ✓"); }
          if (t.classList.contains("hs-pub"))    { if (await patch(t.dataset.id, { published: t.checked })) said(t.checked ? "Đã đăng ✓" : "Đã gỡ xuống ✓"); }
          if (t.classList.contains("hs-ord"))    { if (await patch(t.dataset.id, { sort_order: Number(t.value) || 0 })) said("Đã đổi thứ tự ✓"); }
          if (t.classList.contains("hs-course")) { if (await patch(t.dataset.id, { course_id: t.value || null })) said("Đã gắn khoá học ✓"); }
        });

        listEl.addEventListener("click", async e => {
          const del = e.target.closest("[data-hsdel]");
          const dup = e.target.closest("[data-hsdup]");
          const edt = e.target.closest("[data-hsedit]");
          if (del) {
            const row = hskRows.find(r => r.id === del.dataset.hsdel); if (!row) return;
            const ok = await UI.confirmDialog({ title: "Xoá bài giảng?", danger: true, okText: "Xoá",
              body: `“${row.title}” sẽ bị xoá. Ảnh trong thư viện vẫn giữ để bài khác dùng lại.` });
            if (!ok) return;
            const { error } = await sb.from("hsk_lessons").delete().eq("id", row.id);
            if (error) { said("Không xoá được: " + error.message, true); return; }
            hskRows = hskRows.filter(r => r.id !== row.id); closeEditor(); renderHs(); said("Đã xoá ✓");
          }
          if (dup) {
            const row = hskRows.find(r => r.id === dup.dataset.hsdup); if (!row) return;
            const { data: full } = await sb.from("hsk_lessons").select("*").eq("id", row.id).single();
            if (!full) return;
            const copy = Object.assign({}, full);
            delete copy.id; delete copy.created_at; delete copy.updated_at;
            copy.lesson_id = full.lesson_id + "-copy-" + Date.now().toString(36);
            copy.title = full.title + " (bản sao)";
            copy.published = false;
            copy.data = Object.assign({}, full.data, { lessonId: copy.lesson_id, title: copy.title });
            const { data: ins, error } = await sb.from("hsk_lessons").insert(copy).select().single();
            if (error) { said("Không nhân bản được: " + error.message, true); return; }
            hskRows.push(ins); closeEditor(); renderHs(); said("Đã nhân bản ✓ — nhớ đổi mã bài và tên trước khi đăng.");
          }
          if (edt) openEditor(edt.dataset.hsedit);
        });

        /* ---------- kho ảnh dùng chung: tải lên, dán, kéo thả ----------
           Một chỗ duy nhất đẩy ảnh lên bucket hsk-media rồi ghi vào thư
           viện, nên nhập Excel và sửa tay đều cho ra cùng một kiểu dữ liệu. */
        async function putImage(word, blobOrFile, source) {
          const ext = (blobOrFile.type || "").indexOf("png") >= 0 ? "png"
                    : (blobOrFile.type || "").indexOf("webp") >= 0 ? "webp" : "jpg";
          const path = "vocab/" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7) + "." + ext;
          const up = await sb.storage.from("hsk-media")
            .upload(path, blobOrFile, { upsert: true, contentType: blobOrFile.type || "image/jpeg", cacheControl: "31536000" });
          if (up.error) throw up.error;
          const url = sb.storage.from("hsk-media").getPublicUrl(path).data.publicUrl;
          if (word) {
            try {
              await sb.from("hsk_media").upsert({
                media_key: word, kind: "image", url, source: source || "teacher",
                credit: "", created_by: user.id
              }, { onConflict: "media_key,kind" });
            } catch (e) {}
          }
          return url;
        }

        /* ---------- trình sửa nội dung (mở NGAY DƯỚI bài đang sửa) ---------- */
        function closeEditor() {
          if (hsPasteOff) { hsPasteOff(); hsPasteOff = null; }
          if (hsOpenId == null) return;
          const prev = listEl.querySelector('.hs-editrow[data-editrow="' + hsOpenId + '"]');
          if (prev) prev.innerHTML = "";
          hsOpenId = null;
        }
        async function openEditor(id) {
          if (hsOpenId === id) { closeEditor(); return; }   // bấm lại ✏️ → thu gọn
          closeEditor();                                     // chỉ mở một trình sửa cùng lúc
          const row = hskRows.find(r => r.id === id); if (!row) return;
          const box = listEl.querySelector('.hs-editrow[data-editrow="' + id + '"]');
          if (!box) return;
          box.innerHTML = '<p class="kind" style="padding:0.5rem 0;">Đang tải…</p>';
          hsOpenId = id;
          const { data: full } = await sb.from("hsk_lessons").select("data").eq("id", id).single();
          const L = full && full.data;
          if (!L) { box.innerHTML = '<p class="msg err">Không tải được nội dung.</p>'; return; }
          if (hsOpenId !== id) return;   // người dùng đã đóng/đổi trong lúc tải
          let active = -1;            // ô ảnh đang chọn — chỗ nhận ảnh dán bằng ⌘V
          const open = {};            // từ nào đang mở phần chi tiết

          box.innerHTML = `
            <div class="card">
              <div class="card-head"><h2>✏️ Sửa nội dung — ${esc(L.title || "")}</h2>
                <button class="ghost" id="hs-ed-close">Đóng</button></div>
              <p class="kind" style="text-transform:none;letter-spacing:0;">Sửa xong bấm <b>Lưu</b>. Ô pinyin có chữ
                <i>tự động</i> là do hệ thống tạo — sửa tay thì hệ thống sẽ không ghi đè nữa.
                <b>Ảnh minh hoạ:</b> bấm vào ô ảnh rồi <b>dán (⌘V)</b>, hoặc <b>kéo thả</b> ảnh vào ô,
                hoặc bấm 📁 chọn tệp, 🔗 dán link. Ảnh hiện lên là xem thử — bấm <b>Lưu</b> mới ghi vào bài.</p>
              <div class="form-row" style="margin:0 0 0.6rem;">
                <div class="field" style="max-width:280px;"><label>Giọng đọc của bài này</label>
                  <select id="hs-ed-voice"></select></div>
                <div class="field" style="max-width:170px;"><label>Tốc độ đọc</label>
                  <select id="hs-ed-rate">
                    <option value="-20">Chậm (tập đọc)</option>
                    <option value="0">Bình thường</option>
                    <option value="10">Nhanh hơn một chút</option>
                  </select></div>
                <button class="ghost" id="hs-ed-tryvoice" style="flex:none;align-self:flex-end;">🔊 Nghe thử</button>
              </div>
              <div id="hs-ed-rows"></div>
              <div class="form-row" style="margin-top:0.8rem;">
                <button id="hs-ed-save">💾 Lưu nội dung</button>
                <button class="ghost" id="hs-ed-repinyin">↻ Tạo lại pinyin cho ô trống</button>
                <span class="kind" id="hs-ed-note"></span>
              </div>
            </div>`;
          const rows = document.getElementById("hs-ed-rows");
          const note = t => { document.getElementById("hs-ed-note").textContent = t || ""; };

          /* giọng đọc đặt theo TỪNG BÀI và đi theo bài tới mọi học viên —
             không để lộn xộn trên slide lúc đang dạy (yêu cầu 9) */
          const vSel = document.getElementById("hs-ed-voice"), rSel = document.getElementById("hs-ed-rate");
          vSel.innerHTML = window.ZhSpeech.AZURE_VOICES
            .map(v => `<option value="${esc(v.id)}">${esc(v.label)}</option>`).join("");
          L.speech = L.speech || {};
          vSel.value = L.speech.voice || "zh-CN-XiaoxiaoNeural";
          rSel.value = String(typeof L.speech.rate === "number" ? L.speech.rate : 0);
          const applyVoice = () => window.ZhSpeech.configure({ voice: vSel.value, rate: Number(rSel.value) || 0 });
          vSel.onchange = rSel.onchange = () => {
            L.speech = { voice: vSel.value, rate: Number(rSel.value) || 0 };
            applyVoice(); note("Đổi giọng xong nhớ bấm Lưu.");
          };
          document.getElementById("hs-ed-tryvoice").onclick = () => {
            applyVoice();
            const w = (L.vocabulary || [])[0];
            window.ZhSpeech.speak(w && w.chinese ? (w.examples && w.examples[0] ? w.examples[0].zh : w.chinese) : "你好，很高兴认识你。");
          };

          const thumb = (v, i) => {
            const on = active === i;
            const isEmo = window.__EMO && window.__EMO.isEmojiImg(v.image);
            const inner = v.image && v.image.url
              ? `<img src="${esc(v.image.url)}" alt="" style="width:100%;height:100%;object-fit:${isEmo ? "contain" : "cover"};${isEmo ? "padding:5px;background:#fff;" : ""}border-radius:7px;" onerror="this.style.opacity=.25;" />`
              : `<span style="font-size:0.72rem;color:var(--muted);text-align:center;line-height:1.25;">＋<br />ảnh</span>`;
            return `<div class="hs-thumb" data-thumb="${i}" title="Bấm để chọn, rồi dán ⌘V — hoặc kéo thả ảnh vào đây"
              style="width:74px;height:56px;flex:none;border:2px ${on ? "solid var(--accent)" : "dashed var(--line)"};
                     border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;
                     cursor:pointer;background:${on ? "#eff5ff" : "#fafbfd"};">${inner}</div>`;
          };

          const draw = () => {
            rows.innerHTML = (L.vocabulary || []).map((v, i) => {
              const ex = v.examples || [];
              const exRows = [0, 1].map(k => {
                const e = ex[k] || { zh: "", pinyin: "", vi: "" };
                return `<div class="form-row" style="gap:0.3rem;margin-top:0.3rem;">
                    <input data-ex="zh" data-k="${k}" data-i="${i}" value="${esc(e.zh)}" placeholder="Câu ví dụ ${k + 1} (chữ Hán)" style="flex:1;min-width:150px;" />
                    <input data-ex="pinyin" data-k="${k}" data-i="${i}" value="${esc(e.pinyin)}" placeholder="pinyin (để trống = tự tạo)" style="flex:1;min-width:130px;" />
                    <input data-ex="vi" data-k="${k}" data-i="${i}" value="${esc(e.vi)}" placeholder="nghĩa tiếng Việt" style="flex:1;min-width:150px;" />
                  </div>`;
              }).join("");
              const detail = open[i] ? `
                <div style="width:100%;border-top:1px dashed var(--line);margin-top:0.45rem;padding-top:0.45rem;">
                  <div class="form-row" style="gap:0.3rem;">
                    <input data-f="imageUrl" data-i="${i}" value="${esc(v.image ? v.image.url : "")}" placeholder="link ảnh minh hoạ (https://…)" style="flex:1;min-width:220px;" />
                    <input data-f="imageKeyword" data-i="${i}" value="${esc(v.imageKeyword || "")}" placeholder="từ khoá tìm ảnh (tiếng Anh)" style="max-width:190px;" />
                  </div>
                  ${exRows}
                  <div class="form-row" style="gap:0.3rem;margin-top:0.3rem;">
                    <input data-f="notes" data-i="${i}" value="${esc(v.notes || "")}" placeholder="ghi chú / mẹo nhớ chữ" style="flex:1;min-width:260px;" />
                  </div>
                </div>` : "";
              const needImg = !(v.image && v.image.url);
              return `<div class="lesson${needImg ? " vrow-warn" : ""}" style="flex-wrap:wrap;gap:0.4rem;align-items:flex-start;">
                ${thumb(v, i)}
                <div style="display:flex;flex-direction:column;gap:0.25rem;align-items:center;">
                  ${needImg ? '<span class="vrow-badge">⚠️ Cần xem lại ảnh</span>' : ""}
                  <div style="display:flex;gap:0.15rem;">
                    <button class="ghost" data-emo="${i}" title="Chọn lại emoji minh hoạ" style="padding:0.2rem 0.4rem;">🔄</button>
                    <button class="ghost" data-up="${i}" title="Tải ảnh từ máy" style="padding:0.2rem 0.4rem;">📁</button>
                    <button class="ghost" data-url="${i}" title="Dán link ảnh" style="padding:0.2rem 0.4rem;">🔗</button>
                    <button class="ghost" data-noimg="${i}" title="Xoá ảnh" style="padding:0.2rem 0.4rem;">✕</button>
                  </div>
                </div>
                <input data-f="chinese" data-i="${i}" value="${esc(v.chinese)}" style="max-width:90px" placeholder="Hán tự" />
                <input data-f="pinyin" data-i="${i}" value="${esc(v.pinyin)}" style="max-width:130px" placeholder="pinyin"
                  title="${v.pinyinSource === "auto" ? "Do hệ thống tạo" : "Do thầy nhập"}" />
                <input data-f="wordClass" data-i="${i}" value="${esc(v.wordClass || "")}" style="max-width:80px" placeholder="từ loại" />
                <input data-f="vietnamese" data-i="${i}" value="${esc(v.vietnamese)}" style="min-width:170px;flex:1" placeholder="nghĩa tiếng Việt" />
                <span class="kind" style="align-self:center;">${v.pinyinSource === "auto" ? "tự động" : ""}</span>
                <button class="ghost" data-more="${i}" title="Ví dụ, ghi chú, ảnh">${open[i] ? "▴ thu gọn" : "▾ chi tiết"}</button>
                <button class="ghost" data-mv="up" data-i="${i}" title="Lên">↑</button>
                <button class="ghost" data-mv="down" data-i="${i}" title="Xuống">↓</button>
                <button class="ghost" data-rm="${i}" style="color:var(--danger);" title="Xoá từ">✕</button>
                ${detail}
              </div>`;
            }).join("");
            updateListBadge();
          };
          /* cập nhật ngay huy hiệu ở dòng danh sách (không cần lưu / tải lại) */
          function updateListBadge() {
            const rc = reviewCountOf(L);
            const row = listEl.querySelector('.lesson[data-hsrow="' + id + '"]');
            const badge = listEl.querySelector('[data-hsbadge="' + id + '"]');
            if (row) row.classList.toggle("hs-warn", rc > 0);
            if (badge) { badge.textContent = "⚠️ " + rc + " ảnh cần xem lại"; badge.style.display = rc > 0 ? "" : "none"; }
          }
          draw();
          /* keep the editor next to its lesson — never jump to the top of the page */
          box.scrollIntoView({ behavior: "smooth", block: "nearest" });

          /* ---- nhận ảnh từ tệp / clipboard / kéo thả ---- */
          async function takeImage(i, file) {
            const v = L.vocabulary[i]; if (!v || !file) return;
            if (!/^image\//.test(file.type || "")) { note("Tệp đó không phải ảnh."); return; }
            if (file.size > 8 * 1024 * 1024) { note("Ảnh nặng quá 8 MB — nén bớt rồi thử lại."); return; }
            note("Đang tải ảnh của " + v.chinese + "…");
            try {
              const url = await putImage(v.chinese, file, "teacher");
              v.image = { url, source: "teacher", credit: "" };
              draw(); note("Đã thay ảnh cho " + v.chinese + " ✓ — nhớ bấm Lưu.");
            } catch (e) { note("Không tải được ảnh: " + (e.message || e)); }
          }
          const filePick = document.createElement("input");
          filePick.type = "file"; filePick.accept = "image/*"; filePick.hidden = true;
          box.appendChild(filePick);
          filePick.addEventListener("change", () => {
            const i = Number(filePick.dataset.i);
            if (filePick.files && filePick.files[0]) takeImage(i, filePick.files[0]);
            filePick.value = "";
          });

          const onPaste = ev => {
            if (active < 0 || !document.body.contains(rows)) return;
            const items = [...((ev.clipboardData || {}).items || [])];
            const it = items.find(x => /^image\//.test(x.type));
            if (it) { ev.preventDefault(); takeImage(active, it.getAsFile()); return; }
            /* dán một đường dẫn ảnh cũng được */
            const txt = (ev.clipboardData || {}).getData ? ev.clipboardData.getData("text") : "";
            if (/^https?:\/\/\S+$/i.test((txt || "").trim())) {
              ev.preventDefault();
              const v = L.vocabulary[active];
              v.image = { url: txt.trim(), source: "teacher", credit: "" };
              draw(); note("Đã gán link ảnh cho " + v.chinese + " ✓ — nhớ bấm Lưu.");
            }
          };
          document.addEventListener("paste", onPaste);
          hsPasteOff = () => document.removeEventListener("paste", onPaste);

          rows.addEventListener("dragover", e => {
            if (e.target.closest("[data-thumb]")) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; }
          });
          rows.addEventListener("drop", e => {
            const t = e.target.closest("[data-thumb]"); if (!t) return;
            e.preventDefault();
            const f = (e.dataTransfer.files || [])[0];
            if (f) { active = Number(t.dataset.thumb); takeImage(active, f); return; }
            const url = (e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text") || "").trim();
            if (/^https?:\/\//i.test(url)) {
              const i = Number(t.dataset.thumb);
              L.vocabulary[i].image = { url, source: "teacher", credit: "" };
              draw(); note("Đã gán link ảnh ✓ — nhớ bấm Lưu.");
            }
          });

          rows.addEventListener("input", e => {
            const i = Number(e.target.dataset.i);
            const v = L.vocabulary[i]; if (!v) return;
            const f = e.target.dataset.f, xf = e.target.dataset.ex;
            if (xf) {
              const k = Number(e.target.dataset.k);
              v.examples = v.examples || [];
              while (v.examples.length <= k) v.examples.push({ zh: "", pinyin: "", vi: "" });
              v.examples[k][xf] = e.target.value;
              return;
            }
            if (!f) return;
            if (f === "imageUrl") v.image = e.target.value.trim() ? { url: e.target.value.trim(), source: "teacher", credit: "" } : null;
            else { v[f] = e.target.value; if (f === "pinyin") v.pinyinSource = "teacher"; }
          });

          rows.addEventListener("click", e => {
            const th = e.target.closest("[data-thumb]");
            const up = e.target.closest("[data-up]"), ur = e.target.closest("[data-url]");
            const ni = e.target.closest("[data-noimg]"), mo = e.target.closest("[data-more]");
            const mv = e.target.closest("[data-mv]"), rm = e.target.closest("[data-rm]");
            const em = e.target.closest("[data-emo]");
            if (em) { const i = Number(em.dataset.emo), v = L.vocabulary[i];
              const cands = (window.__EMO ? window.__EMO.candidates(v) : []);
              if (!cands.length) { note("⚠️ Chưa có emoji phù hợp cho “" + v.chinese + " / " + (v.vietnamese || "") + "” — hãy tự tải/dán ảnh."); return; }
              const cur = (v.image && v.image.emoji) ? cands.indexOf(v.image.emoji) : -1;
              const nx = cands[(cur + 1) % cands.length];
              L.vocabulary[i].image = { url: window.__EMO.url(nx), source: "emoji", emoji: nx, credit: "" };
              draw(); note("Emoji " + nx + (cands.length > 1 ? " — bấm 🔄 để đổi (" + cands.length + " lựa chọn)" : "") + " · nhớ Lưu."); return; }
            if (th) { active = Number(th.dataset.thumb); draw();
                      note("Ô ảnh của “" + L.vocabulary[active].chinese + "” đang chọn — dán ảnh bằng ⌘V."); return; }
            if (up) { active = Number(up.dataset.up); filePick.dataset.i = up.dataset.up; filePick.click(); return; }
            if (ur) { const i = Number(ur.dataset.url);
                      const u = prompt("Dán link ảnh minh hoạ cho “" + L.vocabulary[i].chinese + "”:",
                                       L.vocabulary[i].image ? L.vocabulary[i].image.url : "");
                      if (u == null) return;
                      L.vocabulary[i].image = u.trim() ? { url: u.trim(), source: "teacher", credit: "" } : null;
                      draw(); note("Nhớ bấm Lưu."); return; }
            if (ni) { const i = Number(ni.dataset.noimg); L.vocabulary[i].image = null; draw(); note("Đã bỏ ảnh — nhớ bấm Lưu."); return; }
            if (mo) { const i = Number(mo.dataset.more); open[i] = !open[i]; draw(); return; }
            if (mv) { const i = Number(mv.dataset.i), j = mv.dataset.mv === "up" ? i - 1 : i + 1;
              if (j < 0 || j >= L.vocabulary.length) return;
              const a = L.vocabulary; [a[i], a[j]] = [a[j], a[i]]; a.forEach((x, k) => x.order = k + 1); active = -1; draw(); return; }
            if (rm) { L.vocabulary.splice(Number(rm.dataset.rm), 1);
              L.vocabulary.forEach((x, k) => x.order = k + 1); active = -1; draw(); }
          });

          document.getElementById("hs-ed-close").onclick = () => closeEditor();   // keeps scroll position
          document.getElementById("hs-ed-repinyin").onclick = () => {
            (L.vocabulary || []).forEach(v => {
              if (!v.pinyin) { const p = window.HSKParser.autoPinyin(v.chinese); if (p) { v.pinyin = p; v.pinyinSource = "auto"; } }
              (v.examples || []).forEach(e => { if (e.zh && !e.pinyin) e.pinyin = window.HSKParser.autoPinyin(e.zh); });
            });
            draw(); said("Đã tạo lại pinyin cho các ô trống ✓ — nhớ bấm Lưu.");
          };
          document.getElementById("hs-ed-save").onclick = async () => {
            /* dọn: bỏ câu ví dụ rỗng, đánh lại số thứ tự, tính lại chữ Hán */
            (L.vocabulary || []).forEach((v, k) => {
              v.order = k + 1;
              v.examples = (v.examples || []).filter(e => (e.zh || "").trim());
              v.chars = Array.from(String(v.chinese || "")).filter(c => /[一-鿿㐀-䶿]/.test(c));
            });
            L.speech = { voice: vSel.value, rate: Number(rSel.value) || 0 };
            const plan = window.HSKParser.buildSlidePlan(L);
            const { error } = await sb.from("hsk_lessons").update({
              data: L, vocab_count: (L.vocabulary || []).length, slide_count: plan.length,
              updated_at: new Date().toISOString()
            }).eq("id", id);
            if (error) { said("Không lưu được: " + error.message, true); return; }
            const r = hskRows.find(x => x.id === id);
            if (r) { r.vocab_count = (L.vocabulary || []).length; r.slide_count = plan.length; r.data = L; }
            updateListBadge();   // giữ số "cần xem lại" đúng sau khi lưu
            /* update this lesson's summary IN PLACE — no full re-render, so the
               inline editor stays open, the scroll position and the HSK filter
               are all preserved */
            const sum = listEl.querySelector('.lesson[data-hsrow="' + id + '"] .hs-sum');
            if (sum && r) sum.textContent = (r.subtitle || "") + " · " + (r.vocab_count || 0) + " từ · " + (r.slide_count || 0) + " slide";
            said("Đã lưu nội dung ✓"); note("Đã lưu.");
          };
        }

        /* ---------- ảnh minh hoạ: thư viện trước, Pexels sau ----------
           Phase 56 chỉ đi tìm ảnh khi thầy điền cột imagekeyword, nên bài
           nào bỏ trống cột đó là KHÔNG có ảnh nào cả — đúng cái đã xảy ra
           với Bài 1. Nay nghĩa tiếng Việt cũng dùng làm từ khoá tìm được
           (Pexels có hỗ trợ tìm tiếng Việt), ảnh kiểu này đánh dấu là
           "tự tìm" để bảng kiểm tra nhắc thầy xem lại. */

          low(s){ return String(s || "").toLowerCase().trim(); },
          words(s){ return this.low(s).split(/[,;/()\[\]{}·|"'.]+|\s+|–|-/).map(w => w.trim()).filter(Boolean); },
          hit(m, str){ const k = this.low(str); if (m[k]) return m[k]; const s = k.replace(/s$/, ""); return (s !== k && m[s]) ? m[s] : null; },
          candidates(v){
            const out = []; const add = e => (Array.isArray(e) ? e : [e]).forEach(x => { if (x && out.indexOf(x) < 0) out.push(x); });
            const tryM = (m, str) => { const h = this.hit(m, str); if (h) add(h); };
            const kw = (v.imageKeyword || "").trim();
            if (kw) { tryM(this.MAP, kw); this.words(kw).forEach(w => tryM(this.MAP, w)); }
            if (v.en) { tryM(this.MAP, v.en); this.words(v.en).forEach(w => tryM(this.MAP, w)); }
            const vi = (v.vietnamese || "").trim();
            if (vi) { tryM(this.VI, vi); tryM(this.VI, this.low(vi).split(/[,;(/]/)[0].trim()); this.words(vi).forEach(w => tryM(this.VI, w)); }
            return out;
          },
          pick(v){ const c = this.candidates(v); return c[0] || null; },
          toCodePoint(str, sep){
            let r = [], c = 0, p = 0, i = 0;
            while (i < str.length) { c = str.charCodeAt(i++);
              if (p) { r.push((0x10000 + ((p - 0xd800) << 10) + (c - 0xdc00)).toString(16)); p = 0; }
              else if (0xd800 <= c && c <= 0xdbff) { p = c; }
              else r.push(c.toString(16)); }
            return r.join(sep || "-");
          },
          cp(emoji){ const Z = String.fromCharCode(0x200d);
            return this.toCodePoint(emoji.indexOf(Z) < 0 ? emoji.replace(/️/g, "") : emoji); },
          url(emoji){ return "https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/" + this.cp(emoji) + ".svg"; },
          /* nguồn phụ (Layer 3): OpenMoji — bộ emoji NÉT KHÁC, cùng nghĩa, URL khác,
             công khai, không cần khoá, không watermark, ổn định (jsDelivr). */
          urlAlt(emoji){ return "https://cdn.jsdelivr.net/npm/openmoji@14.0.0/color/svg/" + this.cp(emoji).toUpperCase() + ".svg"; },
          isEmojiImg(img){ return !!(img && (img.source === "emoji" || img.source === "emoji2" || /twemoji|openmoji/.test(img.url || ""))); },
          /* Gán ảnh cho CẢ BÀI, KHÔNG trùng: emoji tốt nhất chưa dùng → emoji thay thế
             → OpenMoji (nguồn phụ) → nếu hết thì để trống & đánh dấu xem lại.
             Ảnh thầy tự đặt (source 'teacher') luôn giữ nguyên. */
          assignLesson(vocabulary){
            const used = new Set();
            (vocabulary || []).forEach(v => { if (v.image && v.image.url && v.image.source === "teacher") used.add(v.image.url); });
            const st = { emoji: 0, alt: 0, second: 0, review: 0 };
            // gán từ có ÍT lựa chọn trước (ràng buộc nhất) để giảm đụng độ
            const list = (vocabulary || []).filter(v => !(v.image && v.image.source === "teacher"));
            const withC = list.map(v => ({ v, c: this.candidates(v) })).sort((a, b) => (a.c.length || 99) - (b.c.length || 99));
            withC.forEach(({ v, c }) => {
              v._review = false;
              // Layer 1/2 — Twemoji chưa dùng
              for (let i = 0; i < c.length; i++) { const u = this.url(c[i]);
                if (!used.has(u)) { v.image = { url: u, source: "emoji", emoji: c[i], credit: "" }; used.add(u); (i === 0 ? st.emoji++ : st.alt++); return; } }
              // Layer 3 — OpenMoji (nét khác) chưa dùng
              for (let i = 0; i < c.length; i++) { const u = this.urlAlt(c[i]);
                if (!used.has(u)) { v.image = { url: u, source: "emoji2", emoji: c[i], credit: "" }; used.add(u); st.second++; return; } }
              // cuối — để trống, đánh dấu xem lại (KHÔNG ép ảnh sai)
              v.image = null; v._review = true; st.review++;
            });
            return st;
          }

        /* Tự chọn EMOJI minh hoạ cho từ chưa có ảnh (thay cho tìm ảnh ngoài).

        async function fetchImages(lesson, log) {
          /* Gán KHÔNG TRÙNG trong cả bài: emoji tốt nhất → emoji thay thế →
             OpenMoji (nguồn phụ) → để trống & xem lại. Giữ ảnh thầy tự đặt. */
          const st = EMO.assignLesson(lesson.vocabulary || []);
          (lesson.vocabulary || []).forEach(v => { if (v._review && log) log("• " + v.chinese + " (" + (v.vietnamese || "") + "): chưa có ảnh riêng phù hợp — tự chọn ảnh ở ✏️."); delete v._review; });

          catch (e) { said("Không tải được: " + (e.message || e), true); return; }
          const agg = { emoji: 0, alt: 0, second: 0, review: 0 };
          let lessons = 0, dupRemain = 0;
          for (const row of rows) {
            const data = row.data; if (!data || !Array.isArray(data.vocabulary) || !data.vocabulary.length) continue;
            const before = data.vocabulary.map(v => (v.image && v.image.url) || "").join("|");
            const st = EMO.assignLesson(data.vocabulary);          // gán lại KHÔNG trùng, giữ 'teacher'
            agg.emoji += st.emoji; agg.alt += st.alt; agg.second += st.second; agg.review += st.review;
            const seen = {};                                        // đếm URL tự động còn trùng trong bài
            data.vocabulary.forEach(v => { if (v.image && v.image.url && v.image.source !== "teacher") { if (seen[v.image.url]) dupRemain++; else seen[v.image.url] = 1; } });
            const after = data.vocabulary.map(v => (v.image && v.image.url) || "").join("|");
            data.vocabulary.forEach(v => { delete v._review; });    // không lưu cờ tạm
            if (after !== before) {
              const { error } = await sb.from("hsk_lessons").update({ data, updated_at: new Date().toISOString() }).eq("id", row.id);

          msg.className = "msg";

            (agg.review ? ' <a href="#" id="hs-goreview" style="font-weight:700;">Xem các bài cần xử lý (' + lessonsNeed + ")</a>" : "");
          const goLink = document.getElementById("hs-goreview");
