  <style id="stu-skin">

  :root[data-theme="dark"]{ --stu-bg:#0e1826; --stu-soft:#1a2942; --stu-line:#26364f; --stu-ring:rgba(224,190,120,.3); }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --stu-bg:#0e1826; --stu-soft:#1a2942; --stu-line:#26364f; --stu-ring:rgba(224,190,120,.3); } }

  body.stu #subnav, body.stu .sn-backdrop, body.stu .sn-burger{ display:none!important; }

  body.stu .topbar{ position:sticky; top:0; z-index:60; }
  .stu-tabs{ position:sticky; top:56px; z-index:50; background:color-mix(in srgb,var(--stu-bg) 90%,transparent);

  .stu-tabs-in{ max-width:1140px; margin:0 auto; display:flex; gap:.4rem; overflow-x:auto; scrollbar-width:none;

  .stu-tabs-in::-webkit-scrollbar{ display:none; }
  .stu-tab{ flex:none; white-space:nowrap; border:1.5px solid var(--stu-line); background:var(--card);

    font-weight:800; font-size:.9rem; cursor:pointer; transition:border-color .15s,background .15s,transform .12s; }
  .stu-tab:hover{ border-color:var(--stu-ring); transform:translateY(-1px); }
  .stu-tab.on{ border-color:var(--accent); background:var(--info-bg); color:var(--accent-ink); }

    border:1px solid var(--stu-line); border-radius:20px; padding:clamp(1.3rem,4vw,2.1rem); margin:1rem 0 1.4rem; }
  .stu-hero .kick{ display:inline-block; font-size:.76rem; font-weight:800; letter-spacing:.03em; color:var(--gold);

  .stu-chips{ display:flex; flex-wrap:wrap; gap:.55rem; margin-bottom:.2rem; }
  .stu-chip{ display:inline-flex; align-items:center; gap:.4rem; background:var(--card); border:1px solid var(--stu-line);

  .stu-cc:hover{ transform:translateY(-4px); box-shadow:0 22px 44px -22px rgba(23,38,62,.5); border-color:var(--stu-ring); }

  .stu-badge.enr{ background:var(--info-bg); color:var(--accent-ink); }

  /* công cụ học tập */
  .stu-tools-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:.85rem; }
  .stu-tool{ display:flex; align-items:center; gap:.75rem; background:var(--card); border:1px solid var(--stu-line);
    border-radius:16px; padding:.85rem .95rem; box-shadow:0 12px 30px -22px rgba(23,38,62,.4); cursor:pointer;

  .stu-tool:hover{ transform:translateY(-2px); border-color:var(--stu-ring); }
  .stu-tool .ti{ width:42px; height:42px; flex:none; border-radius:12px; display:grid; place-items:center; font-size:1.2rem;

  /* dải phụ (lịch, thống kê, xếp hạng, thông báo) — nhạt hơn, dưới cùng */
  .stu-more{ background:var(--stu-soft); border:1px solid var(--stu-line); border-radius:20px;
    padding:clamp(1rem,3vw,1.5rem); margin:0 0 1.4rem; }
  .stu-more-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:1rem; align-items:start; }
  .stu-more-grid > .card{ margin:0; }
  /* thẻ chung mềm hơn cho học viên */

  body.stu #app .btn{ border-radius:999px; }

  @media (max-width:640px){
    .stu-hero h1{ font-size:1.45rem; }

  /* Announcement ticker styling now lives in the shared ticker.js component. */
  /* Targeting chips in the Announcement-bar manager */
  .tk-scope{ font-size:0.83rem; cursor:pointer; display:inline-flex; align-items:center; gap:0.3rem;

  <script>
    applyI18n();
    const langBtn = document.getElementById("lang-btn");
    langBtn.textContent = LANG === "en" ? "VI" : "EN";
    langBtn.title = t("lang_name");
    langBtn.addEventListener("click", () => setLang(otherLang()));

    const app = document.getElementById("app");
    const who = document.getElementById("who");
    let user = null;
    let adminTab = "lessons";

    document.getElementById("signout").addEventListener("click", async () => {
      await sb.auth.signOut();
      window.location.href = "login.html";
    });

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }

    // Wait for a pause in typing before rebuilding lists/tables —
    // keeps every keystroke instant even with hundreds of rows.
    function debounce(fn, ms) {
      let t;
      return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms || 200); };
    }

    /* The announcement ticker is the shared ticker.js component (site-wide).
       These thin shims let the owner-management code drive its preview + refresh. */
    const tkPreviewHtml = ann => (window.LETicker ? window.LETicker.previewHTML(ann) : "");
    const tkStartAnim = box => { if (window.LETicker) window.LETicker.startAnim(box); };
    const tickerReload = () => { if (window.LETicker) window.LETicker.reload(); };

    // Shared by the account importer and the reading importer.
    // Handles quoted cells, "" escapes, and line breaks inside cells.
    function parseCSV(text) {
      const rows = []; let row = [], cell = "", q = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (q) {
          if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
          else cell += ch;
        } else if (ch === '"') q = true;
        else if (ch === ",") { row.push(cell); cell = ""; }
        else if (ch === "\n" || ch === "\r") {
          if (ch === "\r" && text[i + 1] === "\n") i++;
          row.push(cell); cell = "";
          if (row.some(c => c.trim() !== "")) rows.push(row);
          row = [];
        } else cell += ch;
      }
      row.push(cell);
      if (row.some(c => c.trim() !== "")) rows.push(row);
      return rows;
    }

    /* ===== V-SAT Excel parser — lifted unchanged from vsat_admin.html =====
       It only needs the XLSX global, which loadXLSX() below already provides,
       so the same spreadsheet the offline admin accepts works here too. */
/* ===== VSAT Excel → exam JSON parser (shared by admin + tests) ===== */
(function(root){
/* ---- Đọc ô Excel GIỮ ĐƯỢC in đậm / nghiêng / gạch chân ------------------
   sheet_to_json chỉ trả về .v — phần chữ thuần, mọi định dạng bị bỏ. Đó là
   lý do bôi đậm trong Excel nhập vào thì mất. SheetJS có sẵn .h (bản dựng
   HTML của ô) nhưng KHÔNG dùng được cho mọi ô:

     ô thường        → .h escape hết:  "<p>Xin chào</p>" → "&lt;p&gt;…"
     ô có định dạng  → .h giữ nguyên:  "<p>… <b>đậm</b> …</p>"

   Nên chỉ lấy .h khi ô THẬT SỰ có định dạng, còn lại giữ .v y như trước —
   nhờ vậy mọi đề đang chạy không đổi một chữ nào.

   Lưu ý: bôi đậm CẢ Ô bằng nút B thì Excel lưu ở phần định dạng ô chứ không
   nằm trong chữ, và SheetJS bản miễn phí không đọc được. Muốn in đậm thì
   bôi đen ĐÚNG phần chữ cần đậm ngay trong ô rồi mới bấm B. */
function richToHtml(h){
  return String(h)
    .replace(/<span[^>]*text-decoration:\s*underline[^>]*>([\s\S]*?)<\/span>/gi,'<u>$1</u>')
    .replace(/<\/?span[^>]*>/gi,'')
    /* SheetJS đổi mỗi lần xuống dòng trong ô thành <br/>. Ô bài đọc xuống
       dòng chỉ để dễ nhìn (giữa </p> và <p>), thêm <br/> vào sẽ hở ra một
       dòng trống. Trả về đúng ký tự xuống dòng như bản chữ thuần, để ô có
       bôi đậm và ô không bôi đậm cho ra kết quả giống hệt nhau. */
    .replace(/<br\s*\/?>/gi,'\n');
}
function cellText(c){
  if(!c) return '';
  if(c.h && /<(b|i|u)>|text-decoration:\s*underline/i.test(c.h)) return richToHtml(c.h);
  return c.v!=null ? c.v : '';
}
function aoa(ws){
  if(!ws || !ws['!ref']) return [];
  const R=XLSX.utils.decode_range(ws['!ref']), out=[];
  for(let r=R.s.r;r<=R.e.r;r++){
    const row=[]; let any=false;
    for(let c=R.s.c;c<=R.e.c;c++){
      const v=cellText(ws[XLSX.utils.encode_cell({r:r,c:c})]);
      row.push(v); if(String(v).trim()!=='') any=true;
    }
    if(any) out.push(row);      // giống blankrows:false trước đây
  }
  return out;
}
function objRows(ws,headers){
  if(!ws)return [];
  const rows=aoa(ws); const h0=headers[0];
  let hi=rows.findIndex(r=>r.map(x=>String(x).trim()).includes(h0));
  if(hi<0)return [];
  const head=rows[hi].map(x=>String(x).trim());
  const idx={}; headers.forEach(h=>idx[h]=head.indexOf(h));
  const out=[];
  for(let i=hi+1;i<rows.length;i++){const r=rows[i]; if(r.every(c=>String(c).trim()===''))continue;
    const o={}; headers.forEach(h=>{o[h]=idx[h]>=0?r[idx[h]]:'';}); out.push(o);}
  return out;
}
const S=v=>v==null?'':String(v).trim();
const NUM=v=>{const n=Number(v);return isNaN(n)?v:n;};
function parseKV(str){const m={};S(str).split('|').forEach(p=>{const i=p.indexOf('=');if(i>0)m[S(p.slice(0,i))]=S(p.slice(i+1));});return m;}

function parseWorkbook(wb){
  const sh=n=>wb.Sheets[n];
  // meta
  const meta={}; objRows(sh('Meta'),['Field','Value']).forEach(r=>{if(S(r.Field))meta[S(r.Field)]=r.Value;});
  ['durationMinutes','pages','maxScore','scoreVersion'].forEach(k=>{if(meta[k]!=='')meta[k]=NUM(meta[k]);});
  if(typeof meta.hasEssay==='string')meta.hasEssay=/^(true|1|yes|có)$/i.test(meta.hasEssay);
  // parts
  const parts=objRows(sh('Parts'),['code','title','instruction']).map(r=>({code:S(r.code),title:S(r.title),instruction:S(r.instruction),blocks:[],_bl:[]}));
  const partByCode={}; parts.forEach(p=>partByCode[p.code]=p);
  const push=(code,order,block)=>{const p=partByCode[code];if(p)p._bl.push({order:Number(order)||0,block});};
  // truefalse
  objRows(sh('TrueFalse'),['part','order','n','title','notice','s1','s2','s3','s4','a1','a2','a3','a4','explanation']).forEach(r=>{
    const b={type:'truefalse',n:NUM(r.n),title:S(r.title)||('Question '+r.n+' (Statements 1–4)'),
      statements:[1,2,3,4].map(i=>({t:S(r['s'+i]),a:S(r['a'+i]).toUpperCase()})),explanation:S(r.explanation)};
    if(S(r.notice))b.notice=S(r.notice); push(r.part,r.order,b);});
  // passage
  objRows(sh('Passage'),['part','order','id','html']).forEach(r=>push(r.part,r.order,{type:'passage',id:S(r.id),html:S(r.html)}));
  // mcq
  objRows(sh('MCQ'),['part','order','n','title','question','A','B','C','D','E','F','answer','explanation']).forEach(r=>{
    const opts=['A','B','C','D','E','F'].filter(v=>S(r[v])!=='').map(v=>({v,t:S(r[v])}));
    push(r.part,r.order,{type:'mcq',n:NUM(r.n),title:S(r.title)||('Question '+r.n),question:S(r.question),options:opts,answer:S(r.answer).toUpperCase(),explanation:S(r.explanation)});});
  // matching
  objRows(sh('Matching'),['part','order','n','title','prompt1','prompt2','prompt3','prompt4','A','B','C','D','E','F','ans1','ans2','ans3','ans4','explanation']).forEach(r=>{
    push(r.part,r.order,{type:'matching',n:NUM(r.n),title:S(r.title)||('Question '+r.n),
      prompts:[1,2,3,4].map(i=>S(r['prompt'+i])),options:['A','B','C','D','E','F'].map(v=>S(r[v])),
      answers:[1,2,3,4].map(i=>S(r['ans'+i]).toUpperCase()),explanation:S(r.explanation)});});
  // gapfill
  objRows(sh('GapFill'),['part','order','title','text','answers','explanations']).forEach(r=>{
    const ans=parseKV(r.answers), expl=parseKV(r.explanations);
    const nums=Object.keys(ans).map(Number).sort((a,b)=>a-b);
    push(r.part,r.order,{type:'gapfill',title:S(r.title)||'Gap-fill',text:S(r.text),nums,
      answers:Object.fromEntries(nums.map(n=>[n,ans[n]])),explanations:Object.fromEntries(nums.map(n=>[n,expl[n]||'']))});});
  parts.forEach(p=>{p._bl.sort((a,b)=>a.order-b.order);p.blocks=p._bl.map(x=>x.block);delete p._bl;});
  // practice
  const vocab=objRows(sh('Vocab'),['word','pos','ipa','def','vi','ex','exvi','forms','sec']).map(r=>({w:S(r.word),pos:S(r.pos),ipa:S(r.ipa),def:S(r.def),vi:S(r.vi),ex:S(r.ex),exvi:S(r.exvi),forms:S(r.forms),sec:S(r.sec)})).filter(v=>v.w);
  const grammar=objRows(sh('Grammar'),['id','name','en','vi','form','examples','usage','mistake']).map((r,i)=>({id:S(r.id)||('g'+(i+1)),name:S(r.name),en:S(r.en),vi:S(r.vi),form:S(r.form),
    ex:S(r.examples).split('||').map(s=>s.trim()).filter(Boolean).map(pair=>{const parts=pair.split('~~');return [S(parts[0]),S(parts[1]||'')];}),usage:S(r.usage),mistake:S(r.mistake)})).filter(g=>g.name);
  /* ---- Bài tập Practice do thầy tự soạn (5 sheet, mỗi sheet một KIỂU DỮ LIỆU).
     Cột `set` gom các dòng thành một bài tập; cột `bank` chọn Từ vựng hay Ngữ pháp;
     cột `kind` chọn tên kiểu trong nhóm (vd mcq / context / verbform).
     Sheet để trống = không sao: autogenExercises() sẽ tự sinh bài tập. ---- */
  const EXB={vocab:[],grammar:[]}, exSets={};
  function exGet(r,defType,defTitle,shape){
    const bank=/gram|ngữ|ngu/i.test(S(r.bank))?'grammar':'vocab';
    const key=bank+'|'+(S(r.set)||'1');
    if(!exSets[key]){
      const ex={type:(S(r.kind)||defType).toLowerCase(),title:S(r.title)||defTitle,sub:S(r.sub)};
      if(shape==='pairs')ex.pairs=[]; else if(shape==='gaps'){ex.text='';ex.gaps=[];} else ex.items=[];
      exSets[key]=ex; EXB[bank].push(ex);
    }
    const ex=exSets[key];
    if(S(r.title)&&ex.title===defTitle)ex.title=S(r.title);
    if(S(r.sub)&&!ex.sub)ex.sub=S(r.sub);
    return ex;
  }
  const PIPE=v=>S(v).split('|').map(s=>s.trim()).filter(s=>s!=='');

  // 1) ExChoice — chọn đáp án: mcq / context / verbform
  objRows(sh('ExChoice'),['bank','set','kind','title','sub','before','q','after','A','B','C','D','answer','explain']).forEach(r=>{
    const letters=['A','B','C','D'].filter(v=>S(r[v])!=='');
    if(letters.length<2)return;
    const ex=exGet(r,'mcq','Multiple choice','items');
    const it={opts:letters.map(v=>S(r[v])),a:Math.max(0,letters.indexOf(S(r.answer).toUpperCase())),ex:S(r.explain)};
    if(S(r.before)!==''||S(r.after)!==''){it.before=S(r.before);it.after=S(r.after);} else it.q=S(r.q);
    ex.items.push(it);
  });
  // 2) ExType — học viên GÕ đáp án: fill / transform / error
  objRows(sh('ExType'),['bank','set','kind','title','sub','before','q','after','prompt','answers','explain']).forEach(r=>{
    const ans=PIPE(r.answers); if(!ans.length)return;
    const ex=exGet(r,'fill','Gap-fill','items');
    const it={a:ans,ex:S(r.explain)};
    if(S(r.prompt)!==''){it.q=S(r.q);it.prompt=S(r.prompt);}
    else if(S(r.before)!==''||S(r.after)!==''){it.before=S(r.before);it.after=S(r.after);}
    else it.q=S(r.q);
    ex.items.push(it);
  });
  // 3) ExMatch — ghép cặp: match / halves
  objRows(sh('ExMatch'),['bank','set','kind','title','sub','left','right']).forEach(r=>{
    if(S(r.left)===''||S(r.right)==='')return;
    exGet(r,'match','Matching','pairs').pairs.push([S(r.left),S(r.right)]);
  });
  // 4) ExOrder — sắp xếp từ thành câu
  objRows(sh('ExOrder'),['bank','set','title','sub','words','answer','explain']).forEach(r=>{
    const w=PIPE(r.words); if(w.length<2||S(r.answer)==='')return;
    exGet(r,'order','Sentence ordering','items').items.push({words:w,a:S(r.answer),ex:S(r.explain)});
  });
  // 5) ExCloze — một đoạn văn, mỗi chỗ trống một dòng
  objRows(sh('ExCloze'),['bank','set','title','sub','text','gap','options','answer']).forEach(r=>{
    const ex=exGet(r,'cloze','Cloze passage','gaps');
    if(S(r.text)!==''&&!ex.text)ex.text=S(r.text);
    const opts=PIPE(r.options),n=Number(S(r.gap));
    if(opts.length<2||!n)return;
    ex.gaps.push({n,opts,a:S(r.answer)||opts[0]});
  });
  // bỏ những bài tập rỗng (thầy đặt tiêu đề nhưng chưa nhập dòng nào)
  const alive=ex=>(ex.items&&ex.items.length)||(ex.pairs&&ex.pairs.length)||(ex.gaps&&ex.gaps.length&&ex.text);
  EXB.vocab=EXB.vocab.filter(alive); EXB.grammar=EXB.grammar.filter(alive);

  const exam={schema:'vsat-exam/1.0',meta,mock:{parts:parts.map(p=>({code:p.code,title:p.title,instruction:p.instruction,blocks:p.blocks}))},practice:{vocab,grammar,vocabExercises:EXB.vocab,grammarExercises:EXB.grammar}};
  return exam;
}

/* Tự sinh bài tập Practice từ hai sheet Vocab / Grammar khi thầy KHÔNG tự soạn.
   Chỉ dùng dữ liệu đã có sẵn trong hai sheet đó — câu ví dụ thật, nghĩa tiếng
   Việt, dạng từ, công thức ngữ pháp — nên thầy không phải gõ thêm gì.
   Hai ngân hàng độc lập nhau: tự soạn bài tập ngữ pháp mà bỏ trống từ vựng thì
   phần từ vựng vẫn được sinh tự động. */
function autogenExercises(exam){
  const V=exam.practice.vocab||[], G=exam.practice.grammar||[];
  const ve=[], ge=[];
  const take=(a,n)=>a.slice(0,n);
  /* Xoay danh sách lựa chọn theo quy luật để đáp án đúng KHÔNG phải lúc nào
     cũng nằm ở nút đầu tiên — bản sinh tự động trước đây luôn đặt a:0, học
     viên chỉ cần bấm ô đầu là đúng hết. */
  const rot=(arr,k)=>{const n=arr.length,s=((k%n)+n)%n;return arr.slice(s).concat(arr.slice(0,s));};
  const shifted=(correct,others,i)=>{const o0=[correct,...others],n=o0.length,s=i%n;return {opts:rot(o0,n-s),a:s};};
  /* lấy n giá trị khác biệt từ các mục lân cận để làm phương án nhiễu */
  const foils=(list,i,get,n)=>{const out=[],mine=get(list[i]);
    for(let k=1;out.length<n&&k<list.length;k++){const x=get(list[(i+k)%list.length]);
      if(x&&x!==mine&&out.indexOf(x)<0)out.push(x);} return out;};
  /* ghép cặp phải là duy nhất ở vế phải, nếu không hai dòng cùng đáp án */
  const uniq=pairs=>{const seen={},out=[];pairs.forEach(p=>{if(p[0]&&p[1]&&!seen[p[1]]){seen[p[1]]=1;out.push(p);}});return out;};
  /* Tách câu ví dụ quanh từ đang học → thành chỗ trống thật.
     Nới ra hết TỪ để không cắt giữa chừng: "clamp" trong "will be clamped"
     phải thành "will be ___" (đáp án clamped), chứ không phải "will be ___ed". */
  const gapOf=(sentence,word)=>{
    const s=String(sentence||''),w=String(word||'');
    if(!s||!w)return null;
    let i=s.toLowerCase().indexOf(w.toLowerCase());
    if(i<0)return null;
    let j=i+w.length;
    const isL=c=>/[A-Za-zÀ-ÿ'’\-]/.test(c||'');
    while(i>0&&isL(s[i-1]))i--;
    while(j<s.length&&isL(s[j]))j++;
    return {before:s.slice(0,i),after:s.slice(j),hit:s.slice(i,j)};
  };

  if(V.length>=3){
    const wd=uniq(V.map(v=>[v.w,v.def]));
    if(wd.length>=3)ve.push({type:'match',title:'Word–definition matching',sub:'Match each word with its meaning.',pairs:take(wd,6)});

    const pool=take(V.filter(v=>v.def),8);
    if(pool.length>=3)ve.push({type:'mcq',title:'Meaning — multiple choice',sub:'Choose the correct meaning.',
      items:take(pool,6).map((v,i)=>{const s=shifted(v.def,foils(pool,i,x=>x.def,2),i);
        return {q:'<b>'+v.w+'</b> — ?',opts:s.opts,a:s.a,ex:v.w+' = '+v.def};})});

    const vi=uniq(V.filter(v=>v.vi).map(v=>[v.w,v.vi]));
    if(vi.length>=3)ve.push({type:'match',title:'Từ – nghĩa tiếng Việt',sub:'Ghép mỗi từ với nghĩa tiếng Việt.',pairs:take(vi,6)});

    /* từ nào có câu ví dụ chứa chính nó thì thành hai bài tập dùng câu THẬT */
    const gp=V.map(v=>({v,g:gapOf(v.ex,v.w)})).filter(x=>x.g);
    if(gp.length>=3){
      ve.push({type:'fill',title:'Gap-fill — câu trong đề',sub:'Type ONE word from the vocabulary bank. (Spelling matters.)',
        items:take(gp,6).map(x=>({before:x.g.before,after:x.g.after,
          a:[x.g.hit,x.v.w].filter((s,i,a)=>a.indexOf(s)===i),
          ex:x.v.vi?(x.v.w+' = '+x.v.vi):(x.v.def||'')}))});
      ve.push({type:'context',title:'Context word selection',sub:'Choose the word that best fits the sentence.',
        /* phương án nhiễu lấy từ CHÍNH dạng xuất hiện trong câu, để không lộ
           đáp án chỉ vì ba lựa chọn khác dạng nhau */
        items:take(gp,6).map((x,i)=>{const s=shifted(x.g.hit,foils(gp,i,y=>y.g.hit,2),i);
          return {before:x.g.before,after:x.g.after,opts:s.opts,a:s.a,
                  ex:x.v.vi?(x.v.w+' = '+x.v.vi):(x.v.def||'')};})});
    }
  }

  if(G.length>=2){
    const gf=uniq(G.map(g=>[g.name,String(g.form||'').split('\n')[0]]));
    if(gf.length>=2)ge.push({type:'match',title:'Grammar — structure & form',sub:'Match each structure with its form.',pairs:take(gf,6)});

    const pairs=[]; G.forEach(g=>(g.ex||[]).forEach(p=>{if(p&&p[0]&&p[1])pairs.push([p[0],p[1]]);}));
    const up=uniq(pairs);
    if(up.length>=3)ge.push({type:'match',title:'Ví dụ – nghĩa tiếng Việt',sub:'Ghép mỗi câu ví dụ với bản dịch tiếng Việt.',pairs:take(up,6)});

    const named=G.filter(g=>g.name&&g.ex&&g.ex.length&&g.ex[0][0]);
    if(named.length>=3)ge.push({type:'mcq',title:'Nhận diện cấu trúc',sub:'Câu sau dùng cấu trúc nào?',
      items:take(named,6).map((g,i)=>{const s=shifted(g.name,foils(named,i,x=>x.name,2),i);
        return {q:'“'+g.ex[0][0]+'”',opts:s.opts,a:s.a,ex:g.name+((g.form||'')?' — '+String(g.form).split('\n')[0]:'')};})});
  }

  if(!exam.practice.vocabExercises||!exam.practice.vocabExercises.length)exam.practice.vocabExercises=ve;
  if(!exam.practice.grammarExercises||!exam.practice.grammarExercises.length)exam.practice.grammarExercises=ge;
  return exam;
}

/* Full validation with detailed, teacher-friendly messages (VN). */
function validateExamFull(ex){
  const errs=[],warns=[];
  const need=(c,m)=>{if(!c)errs.push(m);};
  need(ex&&ex.meta,'Thiếu phần Meta.');
  if(ex&&ex.meta){need(S(ex.meta.id),'Meta: thiếu "id" (mã đề duy nhất).');need(S(ex.meta.title),'Meta: thiếu "title" (tiêu đề đề thi).');}
  need(ex&&ex.mock&&ex.mock.parts&&ex.mock.parts.length,'Không có phần thi nào (sheet Parts trống).');
  let qn=0,max=0; const seenN=new Set();
  (ex.mock&&ex.mock.parts||[]).forEach((p,pi)=>{
    need(S(p.code),`Phần thứ ${pi+1}: thiếu "code".`);
    (p.blocks||[]).forEach(b=>{
      if(b.type==='truefalse'){qn++;max+=6;
        if(seenN.has(b.n))errs.push(`Trùng số câu: ${b.n}.`);seenN.add(b.n);
        b.statements.forEach((s,i)=>{if(!S(s.t))errs.push(`Câu ${b.n}: tiểu mục ${i+1} trống.`);if(!['T','F'].includes(s.a))errs.push(`Câu ${b.n}: đáp án tiểu mục ${i+1} phải là T hoặc F (đang là "${s.a}").`);});}
      else if(b.type==='mcq'){qn++;max+=6;if(seenN.has(b.n))errs.push(`Trùng số câu: ${b.n}.`);seenN.add(b.n);
        if(b.options.length<2)errs.push(`Câu ${b.n}: cần ít nhất 2 lựa chọn.`);
        if(!b.options.some(o=>o.v===b.answer))errs.push(`Câu ${b.n}: đáp án "${b.answer}" không nằm trong các lựa chọn.`);}
      else if(b.type==='matching'){qn++;max+=6;if(seenN.has(b.n))errs.push(`Trùng số câu: ${b.n}.`);seenN.add(b.n);
        if(b.prompts.filter(S).length!==4)errs.push(`Câu ${b.n} (ghép hợp): cần đúng 4 câu (prompt1..4).`);
        if(b.options.filter(S).length<4)errs.push(`Câu ${b.n} (ghép hợp): cần ít nhất 4 phương án.`);
        b.answers.forEach((a,i)=>{if(!/^[A-F]$/.test(a))errs.push(`Câu ${b.n}: đáp án ans${i+1} phải là chữ cái A–F.`);});
        if(new Set(b.answers).size!==b.answers.length)warns.push(`Câu ${b.n}: có đáp án ghép hợp trùng nhau.`);}
      else if(b.type==='gapfill'){b.nums.forEach(n=>{qn++;max+=6;});
        b.nums.forEach(n=>{if(!S(b.answers[n]))errs.push(`Điền từ: chỗ trống ${n} thiếu đáp án.`);if(b.text.indexOf('{{'+n+'}}')<0)errs.push(`Điền từ: text thiếu token {{${n}}}.`);});}
      else if(b.type==='passage'){if(!S(b.html))warns.push('Có một Passage trống.');}
    });
  });
  if(ex.meta&&ex.meta.maxScore&&Number(ex.meta.maxScore)!==max)warns.push(`Meta.maxScore (${ex.meta.maxScore}) khác tổng điểm tính được (${max}). Sẽ dùng ${max}.`);
  return {errs,warns,stats:{questions:qn,maxScore:max,vocab:(ex.practice&&ex.practice.vocab||[]).length,grammar:(ex.practice&&ex.practice.grammar||[]).length}};
}
root.VSATParser={parseWorkbook,autogenExercises,validateExamFull};

   Từ vựng hay Ngữ pháp, và 5 sheet bài tập đều KHÔNG bắt buộc — bỏ trống thì
   hệ thống tự sinh bài tập từ hai sheet Vocab & Grammar.

   theo danh sách ở cột `bold`. Nên ở đây in đậm không được biến thành thẻ
   <b>, mà phải quay về đúng dạng cột `bold` hiểu được.

   Cách làm: đánh dấu tạm hai đầu đoạn in đậm bằng hai ký tự thuộc vùng
   riêng của Unicode (không bao giờ có trong bài đọc thật), rồi ở phần đọc

   Mọi cột khác gọi S() nên các dấu này bị gỡ, không lọt vào nội dung. */
const BON="", BOFF="";

    .replace(/<\/?(i|u|em|strong)>/gi,'')     /* VSTEP chỉ tô đậm được */
    .replace(/<br\s*\/?>/gi,'\n')             /* xuống dòng, không phải thẻ <br> */
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>')

function cellText(c){

function aoa(ws){

    if(ch===BOFF){ depth--; if(depth<=0){ depth=0; if(cur) spans.push({t:cur,at:plain.length-cur.length}); cur=''; } continue; }

/* đoạn in đậm này là lần xuất hiện thứ mấy? — đếm y hệt nthIndexOf của bộ máy */
function occurrenceOf(text,sub,at){
  let idx=-1;

function objRows(ws,headers){

}
const S=v=>v==null?'':String(v).replace(/[\uE000\uE001]/g,'').trim();
const N=v=>{const n=Number(v);return isNaN(n)?0:n;};
const PIPE=v=>S(v).split('|').map(x=>x.trim()).filter(x=>x!=='');

function parseWorkbook(wb){
  const sh=n=>wb.Sheets[n];

  /* ---- Meta ---- */
  const meta={};
  objRows(sh('Meta'),['Field','Value']).forEach(r=>{ if(S(r.Field)) meta[S(r.Field)]=r.Value; });
  ['durationMinutes','scorePerQuestion'].forEach(k=>{ if(meta[k]!=='' && meta[k]!=null) meta[k]=Number(meta[k]); });
  if(!meta.durationMinutes)  meta.durationMinutes=60;    // VSTEP Reading chuẩn
  if(!meta.scorePerQuestion) meta.scorePerQuestion=0.25; // 40 câu × 0,25 = 10 điểm
  meta.skill='reading';

  /* ---- Bài đọc: MỘT DÒNG = MỘT ĐOẠN VĂN ----
     Đoạn văn VSTEP rất dài, nhét cả bài vào một ô Excel thì không đọc và
     không sửa nổi; tách theo đoạn cũng chính là cách bộ máy lưu trữ. */
  const byP={};
  objRows(sh('Passages'),['passage','para','title','text','bold']).forEach(r=>{
    const pn=N(r.passage)||1;
    if(!byP[pn]) byP[pn]={id:pn,number:pn,title:'',bold:{},paragraphs:[],questions:[]};
    if(S(r.title)&&!byP[pn].title) byP[pn].title=S(r.title);
    const cut=splitBold(String(r.text==null?'':r.text));
    const txt=cut.plain.trim(); if(txt==='') return;
    const lead=cut.plain.length-cut.plain.replace(/^\s+/,'').length;   /* trim làm lệch vị trí */
    const i=byP[pn].paragraphs.length;
    byP[pn].paragraphs.push(txt);
    /* cột bold gõ tay: "word" = lần đầu tiên, "word#2" = lần thứ 2 */
    const b=PIPE(r.bold).map(w=>{ const m=w.match(/^(.*)#(\d+)$/); return m?[m[1].trim(),Number(m[2])]:w; });
    /* và chữ bôi đậm ngay trong ô Excel */
    cut.spans.forEach(sp=>{
      const t=sp.t.trim(); if(!t) return;
      const at=txt.indexOf(t, Math.max(0, sp.at-lead-2));
      const occ=occurrenceOf(txt, t, at<0?txt.indexOf(t):at);
      b.push(occ===1 ? t : [t,occ]);
    });
    const seen={}, uniq=[];
    b.forEach(x=>{ const k=JSON.stringify(x); if(!seen[k]){seen[k]=1;uniq.push(x);} });
    if(uniq.length) byP[pn].bold[i]=uniq;
  });

  /* ---- Câu hỏi: trắc nghiệm A–D, kèm giải thích và bằng chứng ---- */
  objRows(sh('Questions'),['passage','number','question','A','B','C','D','answer','explanation','evidenceType','evidenceText'])
   .forEach(r=>{
    const pn=N(r.passage)||1;
    if(!byP[pn]) byP[pn]={id:pn,number:pn,title:'',bold:{},paragraphs:[],questions:[]};
    if(S(r.question)==='') return;
    byP[pn].questions.push({
      text:S(r.question),
      options:{A:S(r.A),B:S(r.B),C:S(r.C),D:S(r.D)},
      correct:S(r.answer).toUpperCase(),
      explanation:S(r.explanation),
      evidence:{ type:(S(r.evidenceType)||'direct').toLowerCase(), text:S(r.evidenceText) }
    });
  });
  const reading=Object.keys(byP).map(Number).sort((a,b)=>a-b).map(n=>byP[n]);
  reading.forEach((p,i)=>{ p.number=i+1; p.id=i+1; });

  /* ---- Ngân hàng từ vựng & ngữ pháp cho Chế độ Luyện tập ---- */
  const vocab=objRows(sh('Vocab'),['word','pos','ipa','def','vi','ex','exVi','forms'])
    .map(r=>({w:S(r.word),word:S(r.word),pos:S(r.pos),ipa:S(r.ipa),def:S(r.def),vi:S(r.vi),
              ex:S(r.ex),exVi:S(r.exVi),forms:S(r.forms)}))
    .filter(v=>v.word);
  const grammar=objRows(sh('Grammar'),['id','name','en','vi','form','examples','usage','mistakes'])
    .map((r,i)=>({id:S(r.id)||('g'+(i+1)),name:S(r.name),en:S(r.en),vi:S(r.vi),form:S(r.form),
      /* "EN ~~ VI || EN ~~ VI" */
      examples:S(r.examples).split('||').map(x=>x.trim()).filter(Boolean).map(pair=>{
        const q=pair.split('~~'); return {en:S(q[0]),vi:S(q[1]||'')}; }),
      usage:S(r.usage),mistakes:S(r.mistakes)}))
    .filter(g=>g.name);

  /* ---- Bài tập thầy tự soạn (5 sheet, đều không bắt buộc) ---- */
  const EX={vocab:[],grammar:[]};
  const bankOf=r=>/gram|ngữ|ngu/i.test(S(r.bank))?'grammar':'vocab';

  // 1) ExChoice — trắc nghiệm
  objRows(sh('ExChoice'),['bank','q','A','B','C','D','answer','explain']).forEach(r=>{
    const letters=['A','B','C','D'].filter(L=>S(r[L])!=='');
    if(letters.length<2||S(r.q)==='')return;
    const ai=Math.max(0,letters.indexOf(S(r.answer).toUpperCase()));
    EX[bankOf(r)].push({type:'mcq',q:S(r.q),options:letters.map(L=>S(r[L])),answer:ai,explain:S(r.explain)});
  });
  // 2) ExType — gõ đáp án: fill (điền từ) hoặc error (sửa lỗi sai)
  objRows(sh('ExType'),['bank','kind','q','sentence','hint','answers','explain']).forEach(r=>{
    const ans=PIPE(r.answers); if(!ans.length||S(r.q)==='')return;
    const kind=/err|lỗi|loi/i.test(S(r.kind))?'error':'fill';
    const it={type:kind,q:S(r.q),answer:ans,explain:S(r.explain)};
    if(kind==='error'){ it.sentence=S(r.sentence); it.hint=S(r.hint); }
    EX[bankOf(r)].push(it);
  });
  // 3) ExOrder — sắp xếp từ thành câu (bộ máy tự tách câu đúng theo dấu cách)
  objRows(sh('ExOrder'),['bank','q','answer','explain']).forEach(r=>{
    if(S(r.answer)==='')return;
    EX[bankOf(r)].push({type:'order',q:S(r.q)||'Sắp xếp thành câu đúng:',answer:S(r.answer),explain:S(r.explain)});
  });
  // 4) ExMatch — ghép cặp, gom các dòng cùng `set` thành MỘT bài
  const mSets={};
  objRows(sh('ExMatch'),['bank','set','instruction','left','right','explain']).forEach(r=>{
    if(S(r.left)===''||S(r.right)==='')return;
    const b=bankOf(r), key=b+'|'+(S(r.set)||'1');
    if(!mSets[key]){ mSets[key]={type:'match',instruction:S(r.instruction)||'Nối các cặp phù hợp:',pairs:[],explain:S(r.explain)}; EX[b].push(mSets[key]); }
    mSets[key].pairs.push([S(r.left),S(r.right)]);
  });
  // 5) ExCloze — đoạn văn điền từ; text ở dòng đầu, chỗ trống đánh {0} {1} {2}…
  const cSets={};
  objRows(sh('ExCloze'),['bank','set','instruction','text','blank','options','answer','explain']).forEach(r=>{
    const b=bankOf(r), key=b+'|'+(S(r.set)||'1');
    if(!cSets[key]){ cSets[key]={type:'cloze',instruction:S(r.instruction)||'Điền vào chỗ trống:',text:'',blanks:[],explain:S(r.explain)}; EX[b].push(cSets[key]); }
    if(S(r.text)!==''&&!cSets[key].text) cSets[key].text=S(r.text);
    const opts=PIPE(r.options); if(opts.length<2)return;
    const bi=N(r.blank);
    let ai=opts.indexOf(S(r.answer)); if(ai<0) ai=0;
    cSets[key].blanks[bi]={options:opts,answer:ai};
  });
  // bỏ bài tập rỗng (đặt tiêu đề nhưng chưa nhập dòng nào)
  const alive=x=>x.type==='match'?x.pairs.length>0:(x.type==='cloze'?(x.text&&x.blanks.filter(Boolean).length>0):true);
  EX.vocab=EX.vocab.filter(alive); EX.grammar=EX.grammar.filter(alive);

  return { schema:'vstep-exam/1.0', meta, reading,
           practice:{ vocab, grammar, vocabExercises:EX.vocab, grammarExercises:EX.grammar } };
}

/* Tự sinh bài tập từ hai sheet Vocab / Grammar khi thầy không tự soạn.
   Giống Phase 52 của V-SAT nhưng dựng theo đúng hình dạng dữ liệu của
   bộ máy VSTEP (mcq dùng CHỈ SỐ đáp án, fill dùng MẢNG đáp án). */
function autogenExercises(exam){
  const V=(exam.practice&&exam.practice.vocab)||[], G=(exam.practice&&exam.practice.grammar)||[];
  const ve=[], ge=[], take=(a,n)=>a.slice(0,n);
  /* xoay lựa chọn để đáp án đúng không luôn nằm ở vị trí đầu */
  const rot=(a,k)=>{const n=a.length,s=((k%n)+n)%n;return a.slice(s).concat(a.slice(0,s));};
  const shifted=(correct,others,i)=>{const o=[correct].concat(others),n=o.length,s=i%n;return {options:rot(o,n-s),answer:s};};
  const foils=(list,i,get,n)=>{const out=[],mine=get(list[i]);
    for(let k=1;out.length<n&&k<list.length;k++){const x=get(list[(i+k)%list.length]);
      if(x&&x!==mine&&out.indexOf(x)<0)out.push(x);} return out;};
  const uniq=ps=>{const seen={},out=[];ps.forEach(p=>{if(p[0]&&p[1]&&!seen[p[1]]){seen[p[1]]=1;out.push(p);}});return out;};
  /* chỗ trống phải trùm hết TỪ, không cắt giữa chừng */
  const gapOf=(sent,word)=>{const s=String(sent||''),w=String(word||'');
    if(!s||!w)return null; let i=s.toLowerCase().indexOf(w.toLowerCase()); if(i<0)return null;
    let j=i+w.length; const isL=c=>/[A-Za-zÀ-ÿ'’\-]/.test(c||'');
    while(i>0&&isL(s[i-1]))i--; while(j<s.length&&isL(s[j]))j++;
    return {before:s.slice(0,i),after:s.slice(j),hit:s.slice(i,j)};};

  if(V.length>=3){
    const pool=take(V.filter(v=>v.def),8);
    if(pool.length>=3) take(pool,6).forEach((v,i)=>{
      const s=shifted(v.def,foils(pool,i,x=>x.def,2),i);
      ve.push({type:'mcq',q:'“'+v.word+'” nghĩa là gì?',options:s.options,answer:s.answer,
               explain:v.word+' = '+(v.vi||v.def)});
    });
    const wd=uniq(V.map(v=>[v.word,v.def]));
    if(wd.length>=3) ve.push({type:'match',instruction:'Nối từ với định nghĩa đúng:',pairs:take(wd,6),explain:''});
    const vi=uniq(V.filter(v=>v.vi).map(v=>[v.word,v.vi]));
    if(vi.length>=3) ve.push({type:'match',instruction:'Nối từ với nghĩa tiếng Việt:',pairs:take(vi,6),explain:''});
    const gp=V.map(v=>({v,g:gapOf(v.ex,v.word)})).filter(x=>x.g);
    take(gp,5).forEach(x=>{
      ve.push({type:'fill',q:x.g.before+'______'+x.g.after,
               answer:[x.g.hit,x.v.word].filter((s,i,a)=>a.indexOf(s)===i),
               explain:x.v.word+' = '+(x.v.vi||x.v.def||'')});
    });
  }
  if(G.length>=2){
    const gf=uniq(G.map(g=>[g.name,String(g.form||'').split('\n')[0]]));
    if(gf.length>=2) ge.push({type:'match',instruction:'Nối cấu trúc với công thức:',pairs:take(gf,6),explain:''});
    const pairs=[]; G.forEach(g=>(g.examples||[]).forEach(e=>{ if(e&&e.en&&e.vi) pairs.push([e.en,e.vi]); }));
    const up=uniq(pairs);
    if(up.length>=3) ge.push({type:'match',instruction:'Nối câu ví dụ với bản dịch:',pairs:take(up,6),explain:''});
    const named=G.filter(g=>g.name&&g.examples&&g.examples.length&&g.examples[0].en);
    if(named.length>=3) take(named,6).forEach((g,i)=>{
      const s=shifted(g.name,foils(named,i,x=>x.name,2),i);
      ge.push({type:'mcq',q:'Câu sau dùng cấu trúc nào? “'+g.examples[0].en+'”',
               options:s.options,answer:s.answer,
               explain:g.name+(g.form?(' — '+String(g.form).split('\n')[0]):'')});
    });
  }
  if(!exam.practice.vocabExercises||!exam.practice.vocabExercises.length)   exam.practice.vocabExercises=ve;
  if(!exam.practice.grammarExercises||!exam.practice.grammarExercises.length) exam.practice.grammarExercises=ge;
  return exam;
}

/* Kiểm tra trước khi đăng — thông báo bằng tiếng Việt, chỉ rõ dòng nào sai. */
function validateExamFull(ex){
  const errs=[], warns=[];
  if(!ex||!ex.meta||!S(ex.meta.id)) errs.push('Thiếu Meta → id (mã đề, phải là duy nhất).');
  if(!S((ex.meta||{}).title)) warns.push('Thiếu Meta → title (tên đề hiển thị cho học viên).');
  const R=(ex&&ex.reading)||[];
  if(!R.length){ errs.push('Không đọc được bài đọc nào — kiểm tra sheet Passages.');
                 return {errs,warns,stats:{passages:0,questions:0}}; }

  let total=0;
  R.forEach((p,pi)=>{
    const label='Bài đọc '+(pi+1);
    if(!p.paragraphs.length) errs.push(label+': chưa có đoạn văn nào.');
    if(!S(p.title)) warns.push(label+': chưa đặt tiêu đề (cột title ở sheet Passages).');
    const qs=p.questions||[];
    total+=qs.length;
    if(!qs.length) errs.push(label+': chưa có câu hỏi nào.');
    const joined=p.paragraphs.join('\n');
    qs.forEach((q,qi)=>{
      const at=label+' · câu '+(qi+1);
      if(!S(q.text)) errs.push(at+': thiếu nội dung câu hỏi.');
      ['A','B','C','D'].forEach(L=>{ if(!S(q.options[L])) errs.push(at+': thiếu phương án '+L+'.'); });
      if(['A','B','C','D'].indexOf(q.correct)<0) errs.push(at+': cột answer phải là A, B, C hoặc D (đang là “'+q.correct+'”).');
      if(!S(q.explanation)) warns.push(at+': chưa có giải thích — học viên sẽ không thấy phần “Vì sao đúng”.');
      const evT=S(q.evidence&&q.evidence.text);
      if(!evT) warns.push(at+': chưa có evidenceText — sẽ không tô sáng được câu dẫn chứng trong bài đọc.');
      /* Lỗi âm thầm nguy hiểm nhất: câu dẫn chứng phải là MỘT ĐOẠN CHỮ CÓ
         THẬT trong bài đọc, nếu không phần xem lại sẽ không tô được gì mà
         cũng chẳng báo lỗi. */
      else if(joined.indexOf(evT)<0)
        errs.push(at+': evidenceText không khớp nguyên văn trong bài đọc — hãy sao chép đúng từng chữ từ đoạn văn.');
      const ty=S(q.evidence&&q.evidence.type);
      if(ty && ['direct','inferred','vocab'].indexOf(ty)<0)
        warns.push(at+': evidenceType nên là direct, inferred hoặc vocab (đang là “'+ty+'”).');
    });
  });

  /* Cấu trúc chuẩn VSTEP Reading: 4 bài đọc × 10 câu = 40 câu.
     Báo nhắc chứ không chặn, phòng khi thầy cố ý ra đề luyện ngắn hơn. */
  if(R.length!==4) warns.push('Đề chuẩn VSTEP Reading có 4 bài đọc; đề này có '+R.length+'.');
  R.forEach((p,i)=>{ const n=(p.questions||[]).length;
    if(n!==10) warns.push('Bài đọc '+(i+1)+' có '+n+' câu; chuẩn VSTEP là 10 câu mỗi bài.'); });

  const scale=Number((ex.meta||{}).scorePerQuestion)||0.25;
  return {errs,warns,stats:{passages:R.length,questions:total,
          maxScore:+(total*scale).toFixed(2),
          vocab:((ex.practice||{}).vocab||[]).length,
          grammar:((ex.practice||{}).grammar||[]).length}};
}

root.VSTEPParser={parseWorkbook,autogenExercises,validateExamFull};
})(typeof window!=='undefined'?window:globalThis);

/* ===== VSTEP Listening: Excel → exam JSON (Phase 55) ===================
   Sinh ra ĐÚNG hình dạng dữ liệu mà bộ máy Nghe đang dùng, kể cả ba kiểu
   xếp khác nhau trong cùng một đề:
     • Phần có audio riêng, câu hỏi nằm thẳng trong phần, lời thoại theo CÂU
       (Phần 1: hội thoại ngắn)
     • Phần có audio chung, chia thành các đoạn, lời thoại theo ĐOẠN
       (Phần 2: hội thoại dài)
     • Mỗi đoạn một audio riêng, lời thoại theo ĐOẠN
       (Phần 3: bài nói / bài giảng)
   Quy tắc: phần nào có dòng ở sheet Sections thì dùng đoạn, không thì câu
   hỏi nằm thẳng trong phần.
   ===================================================================== */
(function(root){
function aoa(ws){return XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:''});}
function objRows(ws,headers){
  if(!ws)return [];
  const rows=aoa(ws); const h0=headers[0];
  let hi=rows.findIndex(r=>r.map(x=>String(x).trim()).includes(h0));
  if(hi<0)return [];
  const head=rows[hi].map(x=>String(x).trim());
  const idx={}; headers.forEach(h=>idx[h]=head.indexOf(h));
  const out=[];
  for(let i=hi+1;i<rows.length;i++){const r=rows[i]; if(r.every(c=>String(c).trim()===''))continue;
    const o={}; headers.forEach(h=>{o[h]=idx[h]>=0?r[idx[h]]:'';}); out.push(o);}
  return out;
}
const S=v=>v==null?'':String(v).trim();
const N=v=>{const n=Number(v);return isNaN(n)?0:n;};

function parseWorkbook(wb){
  const sh=n=>wb.Sheets[n];

  const meta={};
  objRows(sh('Meta'),['Field','Value']).forEach(r=>{ if(S(r.Field)) meta[S(r.Field)]=r.Value; });

  /* ---- Phần thi ---- */
  const parts=[], byId={};
  objRows(sh('Parts'),['part','title','instruction','audioFile']).forEach(r=>{
    const id=N(r.part); if(!id) return;
    const p={ id:id, title:S(r.title)||('Part '+id), instruction:S(r.instruction) };
    if(S(r.audioFile)) p.audioUrl=S(r.audioFile);   // dashboard đổi thành đường dẫn thật sau khi tải tệp lên
    parts.push(p); byId[id]=p;
  });
  parts.sort((a,b)=>a.id-b.id);

  /* ---- Đoạn (chỉ những phần có chia đoạn) ---- */
  const secKey=(p,s)=>p+'|'+s;
  const secs={};
  objRows(sh('Sections'),['part','section','title','audioFile','transcript']).forEach(r=>{
    const p=N(r.part), sid=N(r.section);
    if(!p||!sid||!byId[p]) return;
    const sec={ sectionId:sid, title:S(r.title)||('Section '+sid), transcript:S(r.transcript), questions:[] };
    if(S(r.audioFile)) sec.audioUrl=S(r.audioFile);
    if(!byId[p].sections) byId[p].sections=[];
    byId[p].sections.push(sec);
    secs[secKey(p,sid)]=sec;
  });
  Object.keys(byId).forEach(k=>{ if(byId[k].sections) byId[k].sections.sort((a,b)=>a.sectionId-b.sectionId); });

  /* ---- Câu hỏi ---- */
  const orphans=[];
  objRows(sh('Questions'),['part','section','number','question','A','B','C','D','answer','explanation','evidence','transcript'])
   .forEach(r=>{
    const p=N(r.part);
    if(!byId[p]){ if(S(r.question)) orphans.push({part:S(r.part),q:S(r.question)}); return; }
    if(S(r.question)==='') return;
    const q={
      question:S(r.question),
      /* Bộ máy tách chữ cái bằng /^([A-D])\./ — thiếu tiền tố "A. " thì nó
         lấy tạm ký tự đầu của nội dung, và đáp án sẽ không bao giờ khớp.
         Vì vậy tiền tố được ghép ở đây, thầy chỉ cần gõ nội dung. */
      options:['A','B','C','D'].map(L=>L+'. '+S(r[L])),
      correctAnswer:S(r.answer).toUpperCase(),
      explanation:S(r.explanation)
    };
    if(S(r.evidence)) q.evidence=S(r.evidence);
    if(S(r.transcript)) q.transcript=S(r.transcript);
    const sid=N(r.section);
    if(sid && secs[secKey(p,sid)]) secs[secKey(p,sid)].questions.push(q);
    else if(byId[p].sections && byId[p].sections.length) (byId[p].sections[0].questions).push(q);
    else { if(!byId[p].questions) byId[p].questions=[]; byId[p].questions.push(q); }
  });

  /* ---- đánh số: id trong phần + globalId toàn bài ---- */
  let g=0;
  parts.forEach(p=>{
    let inPart=0;
    const bump=q=>{ inPart++; g++; q.id=inPart; q.globalId=g; };
    if(p.questions) p.questions.forEach(bump);
    (p.sections||[]).forEach(sec=>sec.questions.forEach(bump));
  });

  return {
    schema:'vstep-listening/1.0',
    testId:S(meta.testId)||S(meta.id)||'vstep-listening',
    title:S(meta.title)||'VSTEP Listening',
    subtitle:S(meta.subtitle)||'',
    totalQuestions:g,
    parts:parts,
    _orphans:orphans

}

/* mọi tên tệp âm thanh đề này cần — dashboard đối chiếu với tệp thầy tải lên */
function audioFilesNeeded(exam){
  const out=[];
  (exam.parts||[]).forEach(p=>{
    if(p.audioUrl) out.push(p.audioUrl);
    (p.sections||[]).forEach(s=>{ if(s.audioUrl) out.push(s.audioUrl); });
  });
  return out.filter((v,i,a)=>a.indexOf(v)===i);
}
/* đổi tên tệp thành đường dẫn thật sau khi tải lên kho */
function applyAudioUrls(exam, map){
  (exam.parts||[]).forEach(p=>{
    if(p.audioUrl && map[p.audioUrl]) p.audioUrl=map[p.audioUrl];
    (p.sections||[]).forEach(s=>{ if(s.audioUrl && map[s.audioUrl]) s.audioUrl=map[s.audioUrl]; });
  });
  return exam;
}

function validateExamFull(ex, uploadedNames){
  const errs=[], warns=[];
  if(!ex||!S(ex.testId)) errs.push('Thiếu Meta → testId (mã đề, phải là duy nhất).');
  if(!S(ex.title)) warns.push('Thiếu Meta → title (tên đề hiển thị cho học viên).');
  const P=(ex&&ex.parts)||[];
  if(!P.length){ errs.push('Không đọc được phần thi nào — kiểm tra sheet Parts.');
                 return {errs,warns,stats:{parts:0,questions:0}}; }
  (ex._orphans||[]).forEach(o=>errs.push('Sheet Questions: có câu thuộc phần "'+o.part+'" nhưng phần này chưa khai ở sheet Parts.'));

  let total=0;
  P.forEach(p=>{
    const label='Phần '+p.id;
    const groups = p.sections && p.sections.length ? p.sections : [{__flat:true, questions:p.questions||[], transcript:''}];
    if(!p.sections && !(p.questions||[]).length) errs.push(label+': chưa có câu hỏi nào.');
    if(!p.instruction) warns.push(label+': chưa có phần hướng dẫn (cột instruction).');
    groups.forEach(gp=>{
      if(!gp.__flat && !(gp.questions||[]).length)
        errs.push(label+' · đoạn '+gp.sectionId+': chưa có câu hỏi nào.');
      (gp.questions||[]).forEach(q=>{
        total++;
        const at=label+' · câu '+q.globalId;
        ['A','B','C','D'].forEach((L,i)=>{
          if(S(q.options[i]).replace(/^[A-D]\.\s*/,'')==='') errs.push(at+': thiếu phương án '+L+'.');
        });
        if(['A','B','C','D'].indexOf(q.correctAnswer)<0)
          errs.push(at+': cột answer phải là A, B, C hoặc D (đang là “'+q.correctAnswer+'”).');
        if(!S(q.explanation)) warns.push(at+': chưa có giải thích.');
        const tr=S(q.transcript)||S(gp.transcript);
        if(!tr) warns.push(at+': chưa có lời thoại (transcript) — học viên sẽ không đọc lại được khi xem đáp án.');
        else if(S(q.evidence) && tr.indexOf(S(q.evidence))<0)
          warns.push(at+': evidence không khớp nguyên văn trong lời thoại nên sẽ không tô sáng được.');
      });
    });
  });

  /* âm thanh: mọi tên tệp nhắc trong Excel phải có mặt trong số tệp đã tải lên */
  const need=audioFilesNeeded(ex);
  if(!need.length) warns.push('Chưa khai tệp âm thanh nào (cột audioFile ở sheet Parts hoặc Sections).');
  if(uploadedNames){
    const have={}; uploadedNames.forEach(n=>have[n]=1);
    need.forEach(n=>{ if(!/^https?:\/\//i.test(n) && !have[n])
      errs.push('Thiếu tệp âm thanh “'+n+'” — hãy chọn tệp này cùng lúc với tệp Excel.'); });
  }

  /* cấu trúc chuẩn VSTEP Listening: 3 phần, 8 + 12 + 15 = 35 câu */
  if(P.length!==3) warns.push('Đề chuẩn VSTEP Listening có 3 phần; đề này có '+P.length+'.');
  const want=[8,12,15];
  P.forEach((p,i)=>{
    const n=(p.questions||[]).length + (p.sections||[]).reduce((a,s)=>a+(s.questions||[]).length,0);
    if(want[i]!=null && n!==want[i]) warns.push('Phần '+p.id+' có '+n+' câu; chuẩn VSTEP là '+want[i]+' câu.');
  });

  return {errs,warns,stats:{parts:P.length,questions:total,audio:need.length}};
}

root.VLISTENParser={parseWorkbook,validateExamFull,audioFilesNeeded,applyAudioUrls};
})(typeof window!=='undefined'?window:globalThis);

/* ===== HSK Slides: Excel → lesson JSON → slide plan =====================
   Phase 56 dựng khung; Phase 57 thay ngân hàng bài tập bằng sáu loại
   hoạt động TƯƠNG TÁC và thêm trạng thái tư liệu cho từng từ.
   Ba việc TÁCH RIÊNG, đúng như yêu cầu tách dữ liệu khỏi trình bày:

     parseWorkbook(wb)   Excel  → dữ liệu bài học thuần (không có HTML)
     enrichLesson(l)     điền pinyin còn thiếu, đánh dấu nguồn
     buildSlidePlan(l)   dữ liệu → danh sách slide có id, KHÔNG số cứng
     validateLesson(l)   kiểm tra trước khi đăng

   Không hàm nào ở đây sinh HTML. Trình chiếu tự dựng giao diện từ

(function (root) {

     objRows tự bỏ qua dòng trống nên không ảnh hưởng dữ liệu. */
  function aoa(ws) { return XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: true, defval: '' }); }
  function objRows(ws, headers) {
    if (!ws) return [];
    const rows = aoa(ws), h0 = headers[0];
    let hi = rows.findIndex(r => r.map(x => String(x == null ? '' : x).trim().toLowerCase())
                                 .includes(h0.toLowerCase()));
    if (hi < 0) return [];
    const head = rows[hi].map(x => String(x == null ? '' : x).trim().toLowerCase());
    const idx = {}; headers.forEach(h => idx[h] = head.indexOf(h.toLowerCase()));
    const out = [];
    for (let i = hi + 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || r.every(c => String(c == null ? '' : c).trim() === '')) continue;
      const o = {}; headers.forEach(h => { o[h] = idx[h] >= 0 ? r[idx[h]] : ''; });
      o._row = i + 1;                       // số dòng THẬT trong sheet (1-based) để báo lỗi đúng chỗ
      out.push(o);
    }
    return out;
  }
  const S = v => v == null ? '' : String(v).trim();
  const N = v => { const n = Number(v); return isNaN(n) ? 0 : n; };
  const HAN = /[一-鿿㐀-䶿]/;
  const onlyHan = s => Array.from(S(s)).filter(c => HAN.test(c));

  /* Sheet phải khớp CHÍNH XÁC theo thứ tự ưu tiên, không dùng "chứa chuỗi":
     bản cũ dò theo substring nên "Grammar Practice" có thể bị nhận nhầm
     thành sheet "Grammar" tuỳ thứ tự sheet trong tệp. */
  function pickSheet(wb, exact, fallbacks) {
    const names = wb.SheetNames;
    let hit = names.find(n => n.trim().toLowerCase() === exact.toLowerCase());
    if (hit) return wb.Sheets[hit];
    for (const f of (fallbacks || [])) {
      hit = names.find(n => n.trim().toLowerCase() === f.toLowerCase());
      if (hit) return wb.Sheets[hit];
    }
    return null;
  }

  /* Kiểm toán bảng tính TRƯỚC khi bóc dữ liệu: thiếu sheet bắt buộc, gõ sai
     tên sheet, hay thiếu cột tiêu đề chính — nói rõ để thầy sửa đúng chỗ,
     thay vì sheet lặng lẽ bị bỏ qua rồi báo "chưa có từ nào". */
  const SHEET_SPECS = [
    { key: 'LessonInfo', names: ['lessoninfo', 'lesson info', 'thông tin bài', 'info', 'meta'], required: true },
    { key: 'Vocabulary', names: ['vocabulary', 'từ vựng', 'vocab'], required: true, header: 'chinese' },
    { key: 'Reading', names: ['reading', 'bài đọc'] },
    { key: 'Grammar', names: ['grammar', 'ngữ pháp'] },
    { key: 'GrammarPractice', names: ['grammarpractice', 'grammar practice', 'luyện tập ngữ pháp'] },
    { key: 'VocabPractice', names: ['vocabpractice', 'vocab practice', 'luyện tập từ vựng'] },

  ];
  function auditWorkbook(wb) {
    const errs = [], warns = [];
    const actual = (wb.SheetNames || []).map(n => ({ raw: n, lc: String(n).trim().toLowerCase() }));
    const matchedRaw = new Set();
    SHEET_SPECS.forEach(spec => {
      const hit = actual.find(a => spec.names.indexOf(a.lc) >= 0);
      if (hit) matchedRaw.add(hit.raw);
      if (!hit && spec.required)
        errs.push('Thiếu sheet «' + spec.key + '» — hãy đặt tên sheet đúng (chấp nhận: ' + spec.names.join(', ') + ').');
      if (hit && spec.header) {
        const rows = aoa(wb.Sheets[hit.raw]);
        const has = rows.some(r => r.map(x => String(x == null ? '' : x).trim().toLowerCase()).indexOf(spec.header) >= 0);
        if (!has) errs.push('Sheet «' + hit.raw + '» thiếu cột tiêu đề «' + spec.header + '» — không đọc được từ vựng.');
      }
    });
    actual.forEach(a => {
      if (matchedRaw.has(a.raw)) return;
      if (SHEET_SPECS.some(s => s.names.indexOf(a.lc) >= 0)) return;   // trùng tên với sheet khác đã khớp
      warns.push('Sheet «' + a.raw + '» không được nhận diện nên bị bỏ qua — kiểm tra lại tên nếu đây là nội dung bài.');
    });

  }

  function parseWorkbook(wb) {
    if (typeof XLSX === 'undefined') throw new Error('Chưa tải được thư viện đọc Excel.');

    const info = {};
    const infoWs = pickSheet(wb, 'LessonInfo', ['Lesson Info', 'Thông tin bài', 'Info', 'Meta']);
    (aoa(infoWs) || []).forEach(r => {
      /* ô đầu có thể rỗng → r[0] là undefined; bản cũ gọi .toString() ở đây và văng lỗi */
      const k = S(r && r[0]).toLowerCase(), v = S(r && r[1]);
      if (!k) return;
      info[k] = v;
    });

    const lesson = {
      schema: 'hsk-lesson/1.0',
      lessonId:  pick('lessonid', 'mã bài', 'id'),
      course:    pick('course', 'khóa học', 'khoá học'),
      hskLevel:  N(pick('hsklevel', 'hsk', 'cấp độ')) || 1,
      lessonNo:  pick('lessonnumber', 'lessonno', 'số bài'),
      title:     pick('title', 'tiêu đề'),
      titleVi:   pick('titlevi', 'tiêu đề tiếng việt'),
      titleZh:   pick('titlezh', 'tiêu đề tiếng trung'),
      subtitle:  pick('subtitle', 'phụ đề'),
      theme:     pick('theme', 'chủ đề'),
      description: pick('description', 'mô tả'),
      vocabulary: [], reading: null, grammar: [],
      grammarPractice: [], vocabPractice: [], radicals: []
    };

    /* --- 2. Từ vựng --- */
    objRows(pickSheet(wb, 'Vocabulary', ['Từ vựng', 'Vocab']),
      ['order','chinese','pinyin','wordclass','vietnamese','example1','example1_vi',
       'example2','example2_vi','notes','image','imagekeyword','stroke'])
    .forEach((r, i) => {
      const zh = S(r.chinese);
      if (!zh) return;
      const ex = [];
      if (S(r.example1)) ex.push({ zh: S(r.example1), pinyin: '', vi: S(r.example1_vi) });
      if (S(r.example2)) ex.push({ zh: S(r.example2), pinyin: '', vi: S(r.example2_vi) });
      lesson.vocabulary.push({
        _row: r._row,
        order: N(r.order) || (i + 1),

        wordClass: S(r.wordclass),
        vietnamese: S(r.vietnamese),
        examples: ex,
        notes: S(r.notes),
        image: S(r.image) ? { url: S(r.image), source: 'teacher', credit: '' } : null,
        imageKeyword: S(r.imagekeyword),
        strokeOverride: S(r.stroke),
        chars: onlyHan(zh)
      });
    });

    /* --- 3. Bài đọc: mỗi dòng một câu/lượt thoại ---
       Bài đọc HSK sơ cấp phần lớn là HỘI THOẠI, nên có cột speaker.
       Bài văn xuôi thì để trống cột đó. */
    const rd = objRows(pickSheet(wb, 'Reading', ['Bài đọc']),
      ['title','speaker','chinese','pinyin','vietnamese','notes','audio']);
    const lines = rd.filter(r => S(r.chinese)).map(r => ({
      speaker: S(r.speaker), zh: S(r.chinese), pinyin: S(r.pinyin), vi: S(r.vietnamese)
    }));
    if (lines.length) {
      lesson.reading = {
        title: S(rd[0].title) || 'Bài đọc',
        lines,
        isDialogue: lines.some(l => l.speaker),
        notes: S(rd.find(r => S(r.notes)) ? rd.find(r => S(r.notes)).notes : ''),
        audio: S(rd.find(r => S(r.audio)) ? rd.find(r => S(r.audio)).audio : '')

    .forEach((r, i) => {

      if (!gmap[key]) {

      if (S(r.structure) && !gmap[key].structure) gmap[key].structure = S(r.structure);
      if (S(r.explanation) && !gmap[key].explanation) gmap[key].explanation = S(r.explanation);

       SÁU loại bài, tất cả đều TƯƠNG TÁC THẬT trên slide. Bản Phase 56 chỉ
       đọc ra rồi hiện sẵn đáp án; giờ mỗi loại có một cỗ máy riêng bên
       trình chiếu, nên chỗ này chỉ lo chuẩn hoá DỮ LIỆU:

         mcq      chọn A/B/C/D            → options[] + answerIndex
         fill     điền vào chỗ trống      → answers[] (chấp nhận nhiều đáp án)

  const EX_ALIAS = {

    'dien_vao_cho_trong':'fill', 'cloze':'fill', 'complete':'fill', 'sentence_completion':'fill',
    'correct':'fill', 'correction':'fill', 'sua_loi':'fill',
    'matching':'match', 'noi':'match', 'noi_tu':'match',
    'sentence_arrangement':'arrange', 'arrangement':'arrange', 'sap_xep':'arrange',
    'sap_xep_cau':'arrange', 'order':'arrange',
    'picture_matching':'picture', 'picture matching':'picture', 'noi_hinh':'picture', 'hinh_anh':'picture',
    'pinyin_matching':'pinyin', 'pinyin matching':'pinyin', 'noi_pinyin':'pinyin',
    'structure':'mcq',
    /* Phase 81/E — nhận thêm tên loại bài theo đề bài gốc; quy về máy tương tác sẵn có */
    'choose_correct':'mcq', 'choose the correct':'mcq', 'choose correct':'mcq',
    'choose_the_correct_answer':'mcq', 'chon_dap_an_dung':'mcq', 'chon_cau_dung':'mcq', 'chon_dung':'mcq',
    'true_false':'mcq', 'true/false':'mcq', 'dung_sai':'mcq',
    'transformation':'fill', 'transform':'fill', 'sentence_transformation':'fill',
    'rewrite':'fill', 'chuyen_doi':'fill', 'chuyen_doi_cau':'fill', 'bien_doi_cau':'fill', 'viet_lai_cau':'fill',
    'error_correction':'fill', 'error correction':'fill', 'find_the_error':'fill', 'sua_loi_sai':'fill'
  };
  const EX_TYPES = ['mcq','fill','arrange','match','picture','pinyin'];
  const PAIRED   = ['match','picture','pinyin'];
  const splitList = s => S(s).split(/\s*[\/|,、;]\s*|\s{2,}/).map(x => x.trim()).filter(Boolean);

  function readPractice(ws, bucket) {
    objRows(ws, ['type','question','a','b','c','d','answer','left','right','tokens','image','explanation'])
    .forEach(r => {
      let type = S(r.type).toLowerCase().replace(/\s+/g, ' ');
      type = EX_ALIAS[type] || EX_ALIAS[type.replace(/ /g, '_')] || type;
      if (!type && !S(r.question) && !S(r.left)) return;

      const item = { _row: r._row, type, question: S(r.question), explanation: S(r.explanation), _ok: true, _why: '' };
      const fail = why => { item._ok = false; item._why = why; };

      /* Dòng ghi một loại nhưng viết ra lại đúng khuôn trắc nghiệm (bốn
         phương án a–d + đáp án A/B/C/D) thì hiểu là trắc nghiệm. Bài mẫu
         gốc ghi "fill_blank" và "matching" cho những câu như vậy; theo
         đúng nhãn thì cả hai đều hỏng. */
      const asOpts = ['a','b','c','d'].map(k => S(r[k])).filter(Boolean);
      if (type !== 'mcq' && asOpts.length >= 2 && optionIndex(S(r.answer), asOpts) >= 0) {
        item._retyped = type; item.type = type = 'mcq';
      }

      if (EX_TYPES.indexOf(type) < 0) {
        fail('loại bài "' + (type || '(để trống cột type)') + '" chưa hỗ trợ — dùng một trong: ' +
             'mcq, fill, arrange, match, picture, pinyin (hoặc tên tương đương như choose_correct, transformation, error_correction).');
        bucket.push(item); return;
      }

      if (type === 'mcq') {
        item.options = ['a','b','c','d'].map(k => S(r[k])).filter(Boolean);
        item.answerIndex = optionIndex(S(r.answer), item.options);
        if (item.options.length < 2) fail('cần ít nhất hai phương án ở cột a–d');
        else if (item.answerIndex < 0) fail('cột answer phải là A/B/C/D hoặc trùng đúng chữ của một phương án');
      } else if (type === 'fill') {
