        /* ---------- thứ tự nét: chữ nào HanziWriter thật sự có? ----------
           Nói "vẽ được mọi chữ Hán" mà không kiểm tra thì đến lớp mới biết
           là thiếu. Hỏi thẳng kho dữ liệu, mỗi chữ chỉ hỏi một lần. */
        const strokeCache = {};
        async function checkStrokes(items) {
          const chars = new Set();
          items.forEach(it => (it.strokeChars || []).forEach(c => chars.add(c)));
          const todo = [...chars].filter(c => strokeCache[c] === undefined);
          await Promise.all(todo.map(async c => {
            try {
              const r = await fetch("https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/" +
                                    encodeURIComponent(c) + ".json", { cache: "force-cache" });
              strokeCache[c] = r.ok;
            } catch (e) { strokeCache[c] = false; }
          }));
          items.forEach(it => {
            const cs = it.strokeChars || [];
            if (!cs.length) { it.strokeStatus = "none"; return; }
            const miss = cs.filter(c => strokeCache[c] === false);
            it.strokeStatus = !miss.length ? "ready" : (miss.length === cs.length ? "missing" : "partial");
            if (miss.length) {
              it.notes.push("chưa vẽ được nét: " + miss.join(" "));
              if (it.status === "ready") it.status = "warn";
            }
          });
        }

        /* ---------- bảng kiểm tra ---------- */
        function showReport(name, v, ok, extra) {
          const s = v.stats || {};
          const box = document.createElement("div");
          box.className = "card"; box.style.cssText = "margin:0.5rem 0 0;padding:0.7rem 0.9rem;";
          const badge = st => st === "error" ? "⛔" : st === "warn" ? "⚠" : "✓";
          const ILL = { teacher: "✓ ảnh của thầy", emoji: "✓ emoji minh hoạ", library: "✓ ảnh dùng lại", pexels: "✓ ảnh đã tìm",
                        auto: "⚠ ảnh tự tìm — nên xem lại", none: "⚠ chưa có emoji — tự chọn ảnh" };
          const STR = { ready: "✓ có thứ tự nét", partial: "⚠ thiếu nét vài chữ",
                        missing: "⚠ chưa có thứ tự nét", none: "—", unknown: "" };
          box.innerHTML =
            `<div style="font-weight:700;margin-bottom:0.35rem;">${ok ? "✅" : "⛔"} ${esc(name)}</div>` +
            `<div class="kind" style="text-transform:none;letter-spacing:0;margin-bottom:0.4rem;">
               ${s.vocab || 0} từ · ${s.slides || 0} slide · ${s.sections || 0} mục · ${s.grammar || 0} ngữ pháp
               · ${s.drills || 0} bài tập · ${s.radicals || 0} bộ thủ · ${s.autoPinyin || 0} pinyin tự tạo
               · ${s.images || 0}/${s.vocab || 0} có ảnh${extra ? " · " + esc(extra) : ""}</div>` +
            (v.items && v.items.length
              ? `<table style="width:100%;border-collapse:collapse;font-size:0.82rem;margin-bottom:0.4rem;">
                   <tbody>` +
                v.items.map(i => `<tr style="border-top:1px solid var(--line);">
                   <td style="padding:0.2rem 0.4rem;white-space:nowrap;"><b>${badge(i.status)} ${esc(i.word || "?")}</b></td>
                   <td style="padding:0.2rem 0.4rem;color:var(--muted);">${esc(ILL[i.illustration] || "")}</td>
                   <td style="padding:0.2rem 0.4rem;color:var(--muted);">${esc(STR[i.strokeStatus] || "")}</td>
                   <td style="padding:0.2rem 0.4rem;color:var(--muted);">${esc((i.notes || []).join(", "))}</td>
                 </tr>`).join("") + `</tbody></table>` : "") +
            ((v.errs || []).length
              ? `<div style="color:var(--danger);font-size:0.85rem;"><b>Lỗi phải sửa (${v.errs.length}):</b><ul style="margin:0.3rem 0 0 1.1rem;">` +
                v.errs.slice(0, 12).map(x => `<li>${esc(x)}</li>`).join("") + `</ul></div>` : "") +
            ((v.warns || []).length
              ? `<div style="color:var(--muted);font-size:0.85rem;margin-top:0.35rem;"><b>Nhắc (${v.warns.length}):</b><ul style="margin:0.3rem 0 0 1.1rem;">` +
                v.warns.slice(0, 10).map(x => `<li>${esc(x)}</li>`).join("") +
                (v.warns.length > 10 ? `<li>… và ${v.warns.length - 10} mục nữa</li>` : "") + `</ul></div>` : "");
          report.appendChild(box);
        }

        /* ---------- nhập Excel ---------- */
        document.getElementById("hs-file").addEventListener("change", async ev => {
          const files = [...(ev.target.files || [])];
          ev.target.value = "";
          if (!files.length) return;
          report.innerHTML = "";
          for (const f of files) {
            said("Đang đọc " + f.name + "…");
            let lesson = null;
            try {
              const XLSXlib = await loadXLSX();
              await loadPinyinPro();
              const wb = XLSXlib.read(await f.arrayBuffer(), { type: "array" });
              lesson = window.HSKParser.enrichLesson(window.HSKParser.parseWorkbook(wb));
            } catch (err) { said(f.name + ": không đọc được — " + err.message, true); continue; }

            const v = window.HSKParser.validateLesson(lesson);
            /* Mã bài đã có → upsert sẽ GHI ĐÈ bài cũ. Không chặn (nhập lại là
               cách sửa bài), chỉ nhắc để thầy khỏi vô tình đè nhầm. */
            if (lesson.lessonId && hskRows.some(r => r.lesson_id === lesson.lessonId))
              v.warns.unshift('Mã bài «' + lesson.lessonId + '» đã tồn tại — tải lên sẽ GHI ĐÈ bài giảng cũ cùng mã.');
            if (v.errs.length) { showReport(f.name, v, false); said("Chưa tải lên được — xem lỗi bên dưới.", true); continue; }

            said("Đang tìm ảnh minh hoạ…");
            const logs = [];
            const img = await fetchImages(lesson, m => logs.push(m));
            /* chấm lại SAU khi có ảnh, rồi hỏi kho nét chữ — bảng kiểm tra
               phải nói đúng những gì bài học thật sự đang có */
            const v2 = window.HSKParser.validateLesson(lesson);
            said("Đang kiểm tra thứ tự nét…");
            await checkStrokes(v2.items);
            v.items = v2.items; v.stats = v2.stats; v.warns = v2.warns;

            const plan = window.HSKParser.buildSlidePlan(lesson);
            const row = {
              lesson_id: lesson.lessonId, title: lesson.title, subtitle: lesson.subtitle || "",
              course: lesson.course || "", hsk_level: lesson.hskLevel || 1, lesson_no: lesson.lessonNo || "",
              data: lesson, vocab_count: (lesson.vocabulary || []).length, slide_count: plan.length,
              sort_order: hskRows.length, created_by: user.id, updated_at: new Date().toISOString()
            };
            const { data: ins, error } = await sb.from("hsk_lessons")
              .upsert(row, { onConflict: "lesson_id" }).select().single();
            if (error) {
              said(f.name + ": " + error.message +
                (/hsk_lessons/.test(error.message || "") ? " — hình như chưa chạy migration55_hsk_slides.sql." : ""), true);
              continue;
            }
            const i = hskRows.findIndex(r => r.lesson_id === ins.lesson_id);
            if (i >= 0) hskRows[i] = ins; else hskRows.push(ins);
            v.warns = v.warns.concat(logs);
            showReport(f.name, v, true,
              `ảnh: ${img.got} từ có ảnh riêng` + (img.alt ? ` (${img.alt} emoji thay thế)` : "") + (img.second ? ` (${img.second} nguồn phụ)` : "") + (img.none ? `, ${img.none} từ cần tự chọn ảnh` : ""));
          }
          closeEditor(); renderHs();
          said("Xong — bấm ✏️ để sửa, 👁 xem thử, rồi tick “đăng” cho học viên thấy.");
        });

        /* pinyin-pro chỉ nạp khi thật sự nhập bài, không làm nặng dashboard */
        function loadPinyinPro() {
          if (window.pinyinPro) return Promise.resolve();
          return new Promise((ok, bad) => {
            const s = document.createElement("script");
            s.src = "https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js";
            s.onload = ok; s.onerror = bad; document.head.appendChild(s);
          });
        }

        renderHs();
      })();

      // ================= GIAO BÀI TẬP HSK (Homework) — Phase 80 =================
      // Chủ/giáo viên giao một bài giảng HSK cho lớp (hoặc chọn học viên).
      // Lưu vào hsk_homework; học viên thấy ở Bảng điều khiển → Bài tập, điểm
      // và tiến độ lưu trong hsk_attempts (migration65/66).
      (function () {
        const card = document.getElementById("hw-card");
        if (!card) return;
        const $ = id => document.getElementById(id);
        const selLesson = $("hw-lesson"), selClass = $("hw-class"), selWho = $("hw-who"),
              stuWrap = $("hw-stu-wrap"), selStu = $("hw-students"),
              inStart = $("hw-start"), inDue = $("hw-due"), inScore = $("hw-score"),
              inTries = $("hw-tries"), inTitle = $("hw-title"),
              btnSave = $("hw-save"), msg = $("hw-msg"), listBox = $("hw-list");
        let classes = [], members = {}, hwRows = [], loaded = false;

        const say = (t, err) => { msg.textContent = t || ""; msg.className = "msg" + (err ? " err" : ""); };
        const fmt = ts => { if (!ts) return ""; const d = new Date(ts);
          return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
        const toLocalInput = () => "";  // để trống mặc định

        function fillLessons() {
          selLesson.innerHTML = `<option value="">— Chọn bài giảng —</option>` +
            hskRows.slice().sort((a, b) => (a.hsk_level - b.hsk_level) || String(a.title).localeCompare(String(b.title)))
              .map(l => `<option value="${esc(l.lesson_id)}">${l.hsk_level ? "HSK " + l.hsk_level + " · " : ""}${esc(l.title || l.lesson_id)}</option>`).join("");
        }

        async function load() {
          if (loaded) return;
          loaded = true;
          // lớp + danh sách hsk_homework hiện có
          const [cRes, hwRes] = await Promise.all([
            sb.from("classes").select("id, name, course_id, org_id").order("starts_on", { ascending: true }),
            sb.from("hsk_homework").select("*").order("created_at", { ascending: false })
          ]);
          classes = (cRes.data || []);
          selClass.innerHTML = `<option value="">— Chọn lớp —</option>` +
            classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
          hwRows = (hwRes.error ? [] : (hwRes.data || []));
          fillLessons();
          renderList();
        }

        async function loadMembers(classId) {
          if (!classId) { selStu.innerHTML = ""; return; }
          if (members[classId]) { paintStudents(classId); return; }
          const cs = await sb.from("class_students").select("student_id").eq("class_id", classId);
          const ids = (cs.data || []).map(r => r.student_id);
          let profs = [];
          if (ids.length) {
            const pr = await sb.from("profiles").select("id, full_name, email").in("id", ids);
            profs = pr.data || [];
          }
          members[classId] = profs;
          paintStudents(classId);
        }
        function paintStudents(classId) {
          const profs = members[classId] || [];
          selStu.innerHTML = profs.length
            ? profs.map(p => `<option value="${p.id}">${esc(p.full_name || p.email)}</option>`).join("")
            : `<option disabled>(lớp chưa có học viên)</option>`;
        }

        function lessonTitle(lid) {
          const l = hskRows.find(r => r.lesson_id === lid);
          return l ? (l.title || lid) : lid;
        }
        function className(cid) {
          const c = classes.find(x => x.id === cid);
          return c ? c.name : "";
        }

        function renderList() {
          if (!hwRows.length) { listBox.innerHTML = `<p class="empty" style="margin:0;">Chưa giao bài nào.</p>`; return; }
          listBox.innerHTML = `<h3 style="margin:0 0 .5rem; font-size:1rem;">Đã giao (${hwRows.length})</h3>` +
            hwRows.map(h => {
              const who = (h.student_ids && h.student_ids.length) ? h.student_ids.length + " học viên" : "cả lớp";
              const meta = [
                className(h.class_id) ? "Lớp " + esc(className(h.class_id)) : "",
                who,
                h.due_at ? "Hạn " + esc(fmt(h.due_at)) : "",
                h.required_score ? "cần " + h.required_score + "%" : "",
                h.max_attempts ? h.max_attempts + " lượt" : "không giới hạn lượt"
              ].filter(Boolean).join(" · ");
              return `
                <div class="lesson" style="flex-wrap:wrap;">
                  <div class="meta">
                    <div class="title">${esc(h.title || lessonTitle(h.lesson_id))}</div>
                    <span class="kind">${esc(lessonTitle(h.lesson_id))} · ${meta}</span>
                  </div>
                  <button class="ghost hw-del" data-id="${h.id}">Xoá</button>
                </div>`;
            }).join("");
        }

        selWho.addEventListener("change", () => {
          stuWrap.style.display = selWho.value === "some" ? "" : "none";
          if (selWho.value === "some") loadMembers(selClass.value);
        });
        selClass.addEventListener("change", () => {
          members[selClass.value] = members[selClass.value];  // no-op keep cache
          if (selWho.value === "some") loadMembers(selClass.value);
        });

        btnSave.addEventListener("click", async () => {
          const lesson_id = selLesson.value;
          const class_id = selClass.value;
          if (!lesson_id) { say("Hãy chọn bài giảng.", true); return; }
          if (!class_id) { say("Hãy chọn lớp.", true); return; }
          let student_ids = [];
          if (selWho.value === "some") {
            student_ids = [...selStu.selectedOptions].map(o => o.value).filter(Boolean);
            if (!student_ids.length) { say("Hãy chọn ít nhất một học viên, hoặc chuyển sang 'Cả lớp'.", true); return; }
          }
          const cls = classes.find(c => c.id === class_id);
          const row = {
            org_id: (cls && cls.org_id) || null,
            class_id, lesson_id,
            title: inTitle.value.trim(),
            student_ids,
            start_at: inStart.value ? new Date(inStart.value).toISOString() : null,
            due_at: inDue.value ? new Date(inDue.value).toISOString() : null,
            required_score: Math.max(0, Math.min(100, Number(inScore.value) || 0)),
            max_attempts: Math.max(0, Number(inTries.value) || 0),
            created_by: user.id
          };
          say("Đang lưu…");
          const { data, error } = await sb.from("hsk_homework").insert(row).select().single();
          if (error) {
            say(error.message + (/relation .* does not exist/i.test(error.message) ? " — hình như chưa chạy migration66_hsk_homework.sql." : ""), true);
            return;
          }
          hwRows.unshift(data);
          renderList();
          inTitle.value = ""; inStart.value = ""; inDue.value = "";
          selStu.selectedIndex = -1;
          say("Đã giao bài ✓");
        });

        listBox.addEventListener("click", async e => {
          const del = e.target.closest(".hw-del");
          if (!del) return;
          if (!confirm("Xoá bài đã giao này? Tiến độ của học viên vẫn được giữ.")) return;
          const id = del.dataset.id;
          const { error } = await sb.from("hsk_homework").delete().eq("id", id);
          if (error) { say(error.message, true); return; }
          hwRows = hwRows.filter(h => h.id !== id);
          renderList();
        });

        // nạp dữ liệu lần đầu khi mở tab HSK (hoặc ngay nếu tab đang mở)
        load();
      })();

      // ================= THEO DÕI TIẾN ĐỘ HSK (Progress) — Phase 81 =================
      // Owner/giáo viên xem tiến độ từng bài đã giao: ai làm chưa, điểm cao
      // nhất, số lượt, hoạt động gần nhất. Đọc hsk_homework + hsk_attempts
      // (RLS cho phép staff đọc hết) + danh sách lớp để biết cả những học
      // viên CHƯA làm (không có lượt nào).
      (function () {
        const card = document.getElementById("hp-card");
        if (!card) return;
        const $ = id => document.getElementById(id);
        const selClass = $("hp-class"), selHw = $("hp-hw"),
              sumBox = $("hp-summary"), chipBox = $("hp-chips"), body = $("hp-body");
        let classesReady = false;
        let assigns = [];        // hsk_homework của lớp đang chọn
        let attempts = [];       // hsk_attempts theo homework_id của lớp
        let roster = [];         // [{id, name}] học viên trong lớp
        let filter = "all";      // all | passed | failed | inprogress | notstarted

        const fmt = ts => { if (!ts) return "—"; const d = new Date(ts);
          const today = new Date().toDateString() === d.toDateString();
          return today ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
                       : d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
        const mmss = s => { s = Math.max(0, Math.round(s || 0)); const m = Math.floor(s / 60);
          return m ? m + "′" + String(s % 60).padStart(2, "0") + "″" : s + "″"; };
        const lessonTitle = lid => { const l = hskRows.find(r => r.lesson_id === lid); return l ? (l.title || lid) : lid; };

        async function loadClasses() {
          if (classesReady) return;
          classesReady = true;
          const cRes = await sb.from("classes").select("id, name").order("starts_on", { ascending: true });
          selClass.innerHTML = `<option value="">— Chọn lớp —</option>` +
            (cRes.data || []).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
        }

        async function loadClass(classId) {
          assigns = []; attempts = []; roster = [];
          if (!classId) { selHw.innerHTML = `<option value="">— Tất cả bài của lớp —</option>`; render(); return; }
          body.innerHTML = `<p class="empty" style="margin:0;">Đang tải…</p>`;
          const [aRes, rRes] = await Promise.all([
            sb.from("hsk_homework").select("*").eq("class_id", classId).order("created_at", { ascending: false }),
            sb.from("class_students").select("student_id").eq("class_id", classId)
          ]);
          assigns = (aRes.data || []);
          const sids = (rRes.data || []).map(r => r.student_id);
          let profs = [];
          if (sids.length) {
            const pr = await sb.from("profiles").select("id, full_name, email").in("id", sids);
            profs = pr.data || [];
          }
          roster = profs.map(p => ({ id: p.id, name: p.full_name || p.email }));
          const hwIds = assigns.map(a => a.id);
          if (hwIds.length) {
            const atRes = await sb.from("hsk_attempts").select("user_id, homework_id, status, score, attempt_no, vocab_correct, vocab_total, grammar_correct, grammar_total, time_spent_sec, updated_at").in("homework_id", hwIds);
            attempts = (atRes.data || []);
          }
          selHw.innerHTML = `<option value="">— Tất cả bài của lớp —</option>` +
            assigns.map(a => `<option value="${a.id}">${esc(a.title || lessonTitle(a.lesson_id))}</option>`).join("");
          render();
        }

        // học viên được giao 1 bài: student_ids nếu có, ngược lại là cả lớp
        function targetsOf(a) {
          if (a.student_ids && a.student_ids.length) {
            const set = new Set(a.student_ids);
            return roster.filter(r => set.has(r.id));
          }
          return roster;
        }

        // trạng thái của 1 học viên với 1 bài
        function statOf(a, sid) {
          const mine = attempts.filter(x => x.homework_id === a.id && x.user_id === sid);
          if (!mine.length) return { code: "notstarted", best: 0, used: 0, last: null, vc: 0, vt: 0, gc: 0, gt: 0, time: 0 };
          const best = mine.reduce((m, x) => Math.max(m, x.score || 0), 0);
          const bestRow = mine.slice().sort((p, q) => (q.score || 0) - (p.score || 0))[0] || mine[0];
          const doneAtt = mine.some(x => x.status === "completed");
          const last = mine.reduce((m, x) => (!m || x.updated_at > m) ? x.updated_at : m, null);
          const time = mine.reduce((s, x) => s + (x.time_spent_sec || 0), 0);
          let code = "inprogress";
          if (doneAtt) code = (!a.required_score || best >= a.required_score) ? "passed" : "failed";
          return { code, best, used: mine.length, last, time,
                   vc: bestRow.vocab_correct || 0, vt: bestRow.vocab_total || 0,
                   gc: bestRow.grammar_correct || 0, gt: bestRow.grammar_total || 0 };
        }

        const LABEL = { passed: "Hoàn thành", failed: "Chưa đạt", inprogress: "Đang làm", notstarted: "Chưa làm" };
        const PILL = { passed: "done", failed: "bad", inprogress: "todo", notstarted: "off" };

        function chipsRow(counts, total) {
          const defs = [
            ["all", "Tất cả", total],
            ["passed", "Hoàn thành", counts.passed],
            ["failed", "Chưa đạt", counts.failed],
            ["inprogress", "Đang làm", counts.inprogress],
            ["notstarted", "Chưa làm", counts.notstarted]
          ];
          chipBox.innerHTML = defs.map(([k, lb, n]) =>
            `<button class="ghost hp-chip${filter === k ? " on" : ""}" data-k="${k}"
               style="width:auto;padding:.3rem .6rem;font-size:.82rem;${filter === k ? "background:var(--tone-teal,#0d9488);color:#fff;border-color:transparent;" : ""}">${lb} (${n})</button>`).join("");
        }

        function studentTable(a) {
          const tg = targetsOf(a);
          const stats = tg.map(s => ({ s, st: statOf(a, s.id) }));
          const counts = { passed: 0, failed: 0, inprogress: 0, notstarted: 0 };
          stats.forEach(x => counts[x.st.code]++);
          const attempted = stats.filter(x => x.st.used > 0);
          const avg = attempted.length ? Math.round(attempted.reduce((s, x) => s + x.st.best, 0) / attempted.length) : 0;

          const shown = filter === "all" ? stats : stats.filter(x => x.st.code === filter);
          sumBox.innerHTML = `
            <div class="lesson" style="background:var(--surface,#0000000a);border-radius:8px;">
              <div class="meta">
                <div class="title">${esc(a.title || lessonTitle(a.lesson_id))}</div>
                <span class="kind">${esc(lessonTitle(a.lesson_id))}${a.required_score ? " · cần đạt " + a.required_score + "%" : ""}${a.max_attempts ? " · tối đa " + a.max_attempts + " lượt" : ""} · ${tg.length} học viên · điểm TB ${avg}%</span>
              </div>
            </div>`;
          chipsRow(counts, tg.length);

          if (!tg.length) { body.innerHTML = `<p class="empty" style="margin:0;">Bài này chưa nhắm tới học viên nào.</p>`; return; }
          const rows = shown.map(({ s, st }) => `
            <tr>
              <td>${esc(s.name)}</td>
              <td><span class="pill ${PILL[st.code]}">${LABEL[st.code]}</span></td>
              <td style="text-align:center;">${st.used ? st.best + "%" : "—"}</td>
              <td style="text-align:center;">${st.vt ? st.vc + "/" + st.vt : "—"}</td>
              <td style="text-align:center;">${st.gt ? st.gc + "/" + st.gt : "—"}</td>
              <td style="text-align:center;">${st.used || "—"}${a.max_attempts ? "/" + a.max_attempts : ""}</td>
              <td style="text-align:center;">${st.used ? mmss(st.time) : "—"}</td>
              <td style="white-space:nowrap;">${fmt(st.last)}</td>
            </tr>`).join("");
          body.innerHTML = `
            <div style="overflow-x:auto;">
              <table class="hp-table" style="width:100%;border-collapse:collapse;font-size:.9rem;">
                <thead><tr style="text-align:left;border-bottom:1px solid var(--line,#0002);">
                  <th style="padding:.4rem;">Học viên</th><th>Trạng thái</th>
                  <th style="text-align:center;">Điểm</th><th style="text-align:center;">Từ vựng</th>
                  <th style="text-align:center;">Ngữ pháp</th><th style="text-align:center;">Lượt</th>
                  <th style="text-align:center;">Thời gian</th><th>Gần nhất</th>
                </tr></thead>
                <tbody>${rows || `<tr><td colspan="8" style="padding:.6rem;color:var(--muted);">Không có học viên ở trạng thái này.</td></tr>`}</tbody>
              </table>
            </div>`;
        }

        // tổng quan cả lớp: mỗi bài một dòng, bấm để xem chi tiết
        function classOverview() {
          if (!assigns.length) { sumBox.innerHTML = ""; chipBox.innerHTML = "";
            body.innerHTML = `<p class="empty" style="margin:0;">Lớp này chưa được giao bài nào.</p>`; return; }
          sumBox.innerHTML = ""; chipBox.innerHTML = "";
          body.innerHTML = assigns.map(a => {
            const tg = targetsOf(a);
            const stats = tg.map(s => statOf(a, s.id));
            const passed = stats.filter(s => s.code === "passed").length;
            const started = stats.filter(s => s.used > 0);
            const avg = started.length ? Math.round(started.reduce((s, x) => s + x.best, 0) / started.length) : 0;
            return `
              <div class="lesson" style="flex-wrap:wrap;">
                <div class="meta">
                  <div class="title">${esc(a.title || lessonTitle(a.lesson_id))}</div>
                  <span class="kind">${esc(lessonTitle(a.lesson_id))} · ${passed}/${tg.length} hoàn thành · điểm TB ${avg}%${a.due_at ? " · hạn " + esc(fmt(a.due_at)) : ""}</span>
                </div>
                <button class="ghost hp-open" data-id="${a.id}">Xem chi tiết ▸</button>
              </div>`;
          }).join("");
        }

        function render() {
          const a = assigns.find(x => x.id === selHw.value);
          if (a) studentTable(a); else classOverview();
        }

        selClass.addEventListener("change", () => { filter = "all"; loadClass(selClass.value); });
        selHw.addEventListener("change", () => { filter = "all"; render(); });
        $("hp-refresh").addEventListener("click", () => { if (selClass.value) loadClass(selClass.value); });
        chipBox.addEventListener("click", e => {
          const c = e.target.closest(".hp-chip"); if (!c) return;
          filter = c.dataset.k; render();
        });
        body.addEventListener("click", e => {
          const o = e.target.closest(".hp-open"); if (!o) return;
          selHw.value = o.dataset.id; filter = "all"; render();
        });

        loadClasses();
      })();

      // ================= HSK VOCAB PRACTICE (Phase 85) =================
      // Quản lý bài Luyện từ vựng HSK y như HSK Slides: nhập Excel (Info/
      // Vocabulary/GapFill/Arrange) → dựng dữ liệu → xem/sửa/đăng. Lưu ở bảng
      // vocab_lessons (migration68); trang học là vocab-practice.html.
      (function () {
        const listEl = document.getElementById("vk-list");
        if (!listEl) return;
        const $ = id => document.getElementById(id);
        const msg = $("vk-msg"), report = $("vk-report"), countEl = $("vk-count");
        let ROWS = [], loaded = false, vLvl = 0, vQ = "", openId = null;
        const vsay = (m, err) => { msg.textContent = m || ""; msg.className = "msg" + (err ? " err" : ""); };
        const uid = () => Math.random().toString(36).slice(2, 9);
        const slug = s => (s || "").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
          .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32);

        /* ---- Excel: parse / validate / toData / template (bê từ công cụ gốc) ---- */
        const REQ = { Vocabulary: ["Hanzi", "Pinyin", "Vietnamese"],
          GapFill: ["Sentence", "CorrectAnswer", "Distractor1", "Distractor2"],
          Arrange: ["TargetSentence", "Chunks"] };
        const VX = {
          norm: s => String(s == null ? "" : s).trim(),
          isUrl: s => /^(https?:\/\/|data:image\/)/i.test(s),
          rows(wb, name) { const ws = wb.Sheets[name]; if (!ws) return null; return XLSX.utils.sheet_to_json(ws, { defval: "", raw: false }); },
          parse(wb) {
            let info = {}; const inf = this.rows(wb, "Info");
            if (inf && inf.length) {
              if ("Field" in inf[0] && "Value" in inf[0]) inf.forEach(r => { if (this.norm(r.Field)) info[this.norm(r.Field)] = this.norm(r.Value); });
              else { const r = inf[0]; Object.keys(r).forEach(k => info[this.norm(k)] = this.norm(r[k])); }
            }
            const vocab = this.rows(wb, "Vocabulary"), gapfill = this.rows(wb, "GapFill"), arrange = this.rows(wb, "Arrange");
            return { info, vocab, gapfill, arrange, sheets: { Vocabulary: vocab, GapFill: gapfill, Arrange: arrange } };
          },
          validate(p) {
            const errs = [], warns = [];
            const E = (s, r, m) => errs.push(s + (r ? " · dòng " + r : "") + ": " + m);
            const W = (s, r, m) => warns.push(s + (r ? " · dòng " + r : "") + ": " + m);
            const level = parseInt(p.info.Level || p.info.HSKLevel || "", 10);
            if (p.info.Level && (isNaN(level) || level < 1 || level > 6)) E("Info", "", 'Level phải là số 1–6 (đang là "' + p.info.Level + '").');
            if (!this.norm(p.info.LessonTitle)) W("Info", "", "chưa có LessonTitle — sẽ đặt tên mặc định.");
            ["Vocabulary", "GapFill", "Arrange"].forEach(sn => { if (!p.sheets[sn]) E(sn, "", "thiếu trang này trong tệp."); });
            const colCheck = (sn, rows) => {
              if (!rows || !rows.length) { if (p.sheets[sn]) E(sn, "", "trang không có dòng nào."); return false; }
              const have = Object.keys(rows[0]).map(k => this.norm(k));
              (REQ[sn] || []).forEach(c => { if (!have.includes(c)) E(sn, "tiêu đề", "thiếu cột «" + c + "»."); });
              return true;
            };
            if (p.vocab && colCheck("Vocabulary", p.vocab)) {
              const seen = {};
              p.vocab.forEach((r, i) => { const row = i + 2, hz = this.norm(r.Hanzi);
                if (!hz) { E("Vocabulary", row, "thiếu chữ Hán (cột Hanzi)."); return; }
                if (seen[hz]) W("Vocabulary", row, "«" + hz + "» trùng dòng " + seen[hz] + "."); else seen[hz] = row;
                if (!this.norm(r.Pinyin)) W("Vocabulary", row, "«" + hz + "» chưa có pinyin.");
                if (!this.norm(r.Vietnamese)) W("Vocabulary", row, "«" + hz + "» chưa có nghĩa tiếng Việt.");
                const img = this.norm(r.ImageURL); if (img && !this.isUrl(img)) W("Vocabulary", row, "«" + hz + "» ImageURL không hợp lệ.");
              });
            }
            if (p.gapfill && colCheck("GapFill", p.gapfill)) {
              p.gapfill.forEach((r, i) => { const row = i + 2, s = this.norm(r.Sentence);
                if (!s) E("GapFill", row, "thiếu câu (cột Sentence).");
                else if (!s.includes("___")) E("GapFill", row, "câu phải có «___» ở chỗ trống.");
                if (!this.norm(r.CorrectAnswer)) E("GapFill", row, "thiếu đáp án đúng (CorrectAnswer).");
                const dist = [r.Distractor1, r.Distractor2, r.Distractor3].map(x => this.norm(x)).filter(Boolean);
                if (dist.length < 2) E("GapFill", row, "cần ít nhất 2 phương án nhiễu.");
                else if (dist.length < 3) W("GapFill", row, "nên có 3 phương án nhiễu.");
              });
            }
            if (p.arrange && colCheck("Arrange", p.arrange)) {
              p.arrange.forEach((r, i) => { const row = i + 2, tg = this.norm(r.TargetSentence);
                if (!tg) E("Arrange", row, "thiếu câu đích (TargetSentence).");
                const chunks = this.norm(r.Chunks).split(/[\/|]/).map(c => c.trim()).filter(Boolean);
                if (chunks.length < 2) E("Arrange", row, "cần ít nhất 2 mảnh, cách nhau bằng «/».");
              });
            }
            return { errs, warns };
          },
          toData(p) {
            const vocab = (p.vocab || []).filter(r => this.norm(r.Hanzi)).map(r => ({ id: uid(),
              hanzi: this.norm(r.Hanzi), pinyin: this.norm(r.Pinyin), vi: this.norm(r.Vietnamese), en: this.norm(r.English),
              image: this.norm(r.ImageURL), audio: this.norm(r.AudioURL), exAudio: this.norm(r.ExampleAudioURL),
              exHanzi: this.norm(r.ExampleHanzi), exPinyin: this.norm(r.ExamplePinyin), exVi: this.norm(r.ExampleVietnamese),
              match: /^(n|no|false|0)$/i.test(this.norm(r.UseInMatching)) ? false : !!this.norm(r.ImageURL) }));
            const gapfill = (p.gapfill || []).filter(r => this.norm(r.Sentence)).map(r => ({ id: uid(),
              sentence: this.norm(r.Sentence), answer: this.norm(r.CorrectAnswer),
              distractors: [r.Distractor1, r.Distractor2, r.Distractor3].map(x => this.norm(x)).filter(Boolean), pinyin: this.norm(r.Pinyin) }));
            const arrange = (p.arrange || []).filter(r => this.norm(r.TargetSentence)).map(r => ({ id: uid(),
              target: this.norm(r.TargetSentence), chunks: this.norm(r.Chunks).split(/[\/|]/).map(c => c.trim()).filter(Boolean), pinyin: this.norm(r.Pinyin) }));
            return { vocab, gapfill, arrange };
          },
          buildTemplate() {
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Field", "Value"], ["Level", "1"],
              ["LessonTitle", "Bài mới"], ["LessonOrder", "2"], ["Instructions", "Điền các trang Vocabulary, GapFill, Arrange. Level là 1–6."]]), "Info");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
              ["Hanzi", "Pinyin", "Vietnamese", "English", "ImageURL", "AudioURL", "ExampleHanzi", "ExamplePinyin", "ExampleVietnamese", "ExampleAudioURL", "UseInMatching"],
              ["水", "shuǐ", "nước", "water", "https://loremflickr.com/400/320/water", "", "我喝水。", "Wǒ hē shuǐ.", "Tôi uống nước.", "", "yes"],
              ["书", "shū", "sách", "book", "https://loremflickr.com/400/320/book", "", "这是书。", "Zhè shì shū.", "Đây là sách.", "", "yes"],
              ["好", "hǎo", "tốt", "good", "", "", "你好！", "Nǐ hǎo!", "Xin chào!", "", "no"]]), "Vocabulary");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
              ["Sentence", "CorrectAnswer", "Distractor1", "Distractor2", "Distractor3", "Pinyin"],
              ["我___水。", "喝", "是", "吃", "看", "Wǒ ___ shuǐ."],
              ["这是我的___。", "书", "水", "好", "喝", "Zhè shì wǒ de ___."]]), "GapFill");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
              ["TargetSentence", "Chunks", "Pinyin"], ["我喝水。", "我 / 喝 / 水", "Wǒ hē shuǐ."], ["这是书。", "这 / 是 / 书", "Zhè shì shū."]]), "Arrange");
            return wb;
          }
        };

        function showReport(name, errs, warns, okMsg) {
          const box = document.createElement("div");
          box.className = "card";
          box.style.cssText = "margin:0.5rem 0; border-left:4px solid var(--" + (errs.length ? "danger" : "tone-teal,#0d9488") + ");";
          box.innerHTML = "<b>" + esc(name) + "</b>" +
            (okMsg ? '<div style="color:var(--tone-teal,#0d9488); font-size:.9rem; margin-top:.25rem;">' + esc(okMsg) + "</div>" : "") +
            (errs.length ? '<div style="color:var(--danger); font-size:.85rem; margin-top:.35rem;"><b>Lỗi phải sửa (' + errs.length + "):</b><ul style='margin:.3rem 0 0 1.1rem;'>" +
              errs.slice(0, 14).map(x => "<li>" + esc(x) + "</li>").join("") + (errs.length > 14 ? "<li>… và " + (errs.length - 14) + " lỗi nữa</li>" : "") + "</ul></div>" : "") +
            (warns.length ? '<div style="color:var(--muted); font-size:.85rem; margin-top:.35rem;"><b>Nhắc (' + warns.length + "):</b><ul style='margin:.3rem 0 0 1.1rem;'>" +
              warns.slice(0, 10).map(x => "<li>" + esc(x) + "</li>").join("") + (warns.length > 10 ? "<li>… và " + (warns.length - 10) + " mục nữa</li>" : "") + "</ul></div>" : "");
          report.appendChild(box);
        }

        async function load() {
          if (loaded) return; loaded = true;
          let res;
          /* chỉ quản lý bài TIẾNG TRUNG ở tab này (bài tiếng Anh có tab riêng);
             or(language.is.null) để tương thích hàng cũ trước migration69 */
          try { res = await sb.from("vocab_lessons").select("*").or("language.eq.zh,language.is.null").order("hsk_level").order("sort_order").order("created_at"); }
          catch (e) { res = { error: e }; }
          if (res.error) {
            listEl.innerHTML = '<p class="empty">Chưa dùng được — hãy chạy <b>migration68_vocab_lessons.sql</b>.</p>';
            return;
          }
          ROWS = res.data || [];
          render();
        }

        function view() {
          let v = vLvl ? ROWS.filter(r => Number(r.hsk_level) === vLvl) : ROWS.slice();
          if (vQ) { const q = vQ.toLowerCase(); v = v.filter(r => (r.title || "").toLowerCase().includes(q) || (r.lesson_id || "").toLowerCase().includes(q)); }
          return v;
        }
        function counts(r) { const d = r.data || {}; return { v: (d.vocab || []).length, g: (d.gapfill || []).length, a: (d.arrange || []).length }; }

        function render() {
          const v = view();
          countEl.textContent = ROWS.length ? "(" + v.length + (vLvl || vQ ? " / " + ROWS.length : "") + ")" : "";
          if (!ROWS.length) { listEl.innerHTML = '<p class="empty">Chưa có bài nào — tải một tệp Excel để tạo.</p>'; return; }
          if (!v.length) { listEl.innerHTML = '<p class="empty">Không có bài khớp bộ lọc.</p>'; return; }
          listEl.innerHTML = "";
          v.forEach(r => {
            const c = counts(r);
            const row = document.createElement("div");
            row.className = "lesson"; row.style.flexWrap = "wrap";
            row.innerHTML =
              '<div class="meta"><div class="title">' + esc(r.title) + (r.tier === "premium" ? " 👑" : "") + (r.published ? "" : ' <span class="pill off">nháp</span>') + "</div>" +
              '<span class="kind">HSK ' + esc(r.hsk_level) + " · #" + esc(r.lesson_no || "—") + " · " + c.v + " từ · " + c.g + " điền · " + c.a + " sắp xếp · <code>" + esc(r.lesson_id) + "</code></span></div>" +
              '<div style="display:flex; gap:.35rem; flex-wrap:wrap; align-items:center;">' +
                '<button class="ghost vk-up" title="Lên">▲</button>' +
                '<button class="ghost vk-down" title="Xuống">▼</button>' +
                '<a class="ghost" href="vocab-practice.html?lesson=' + encodeURIComponent(r.lesson_id) + '" target="_blank" rel="noopener" style="text-decoration:none;">👁</a>' +
                '<button class="ghost vk-edit">✏️</button>' +
                '<button class="ghost vk-tier">' + (r.tier === "premium" ? "Đặt Free" : "Đặt 👑") + "</button>" +
                '<button class="' + (r.published ? "ghost" : "") + ' vk-pub">' + (r.published ? "Ẩn" : "Đăng") + "</button>" +
                '<button class="ghost vk-dup">Nhân bản</button>' +
                '<button class="ghost vk-del" style="color:var(--danger);">Xoá</button>' +
              "</div>";
            row.querySelector(".vk-pub").onclick = () => togglePub(r);
            row.querySelector(".vk-tier").onclick = () => toggleTier(r);
            row.querySelector(".vk-del").onclick = () => delRow(r);
            row.querySelector(".vk-dup").onclick = () => dupRow(r);
            row.querySelector(".vk-edit").onclick = () => openEditor(r, row);
            row.querySelector(".vk-up").onclick = () => reorder(r, -1);
            row.querySelector(".vk-down").onclick = () => reorder(r, 1);
            listEl.appendChild(row);
            if (openId === r.id) mountEditor(r, row);
          });
        }

        async function togglePub(r) {
          const { error } = await sb.from("vocab_lessons").update({ published: !r.published, updated_at: new Date().toISOString() }).eq("id", r.id);
          if (error) { vsay(error.message, true); return; }
          r.published = !r.published; render();
        }
        async function toggleTier(r) {
          const nt = r.tier === "premium" ? "free" : "premium";
          const { error } = await sb.from("vocab_lessons").update({ tier: nt, updated_at: new Date().toISOString() }).eq("id", r.id);
          if (error) { vsay(error.message, true); return; }
          r.tier = nt; render();
        }
        async function delRow(r) {
          if (!confirm('Xoá bài «' + (r.title || r.lesson_id) + "»?")) return;
          const { error } = await sb.from("vocab_lessons").delete().eq("id", r.id);
          if (error) { vsay(error.message, true); return; }
          ROWS = ROWS.filter(x => x.id !== r.id); if (openId === r.id) openId = null; render();
        }
        async function dupRow(r) {
          const data = JSON.parse(JSON.stringify(r.data || {}));
          ["vocab", "gapfill", "arrange"].forEach(k => (data[k] || []).forEach(x => x.id = uid()));
          const ins = { lesson_id: (slug(r.title) || "vocab") + "-" + uid(), title: (r.title || "Bài") + " (copy)",
            hsk_level: r.hsk_level, course_id: r.course_id || null, lesson_no: r.lesson_no || "", tier: r.tier || "free",
            published: false, sort_order: ROWS.filter(x => x.hsk_level === r.hsk_level).length, data,
            vocab_count: (data.vocab || []).length, created_by: user.id };
          const { data: row, error } = await sb.from("vocab_lessons").insert(ins).select().single();
          if (error) { vsay(error.message, true); return; }
          ROWS.push(row); render(); vsay("Đã nhân bản ✓ — nhớ đổi tên và đăng lại.");
        }
        async function reorder(r, dir) {
          const sib = ROWS.filter(x => x.hsk_level === r.hsk_level).sort((a, b) => a.sort_order - b.sort_order);
          const i = sib.findIndex(x => x.id === r.id); const j = i + dir;
          if (j < 0 || j >= sib.length) return;
          const a = sib[i], b = sib[j]; const ao = a.sort_order, bo = b.sort_order;
          a.sort_order = bo; b.sort_order = ao;
          await Promise.all([
            sb.from("vocab_lessons").update({ sort_order: a.sort_order }).eq("id", a.id),
            sb.from("vocab_lessons").update({ sort_order: b.sort_order }).eq("id", b.id)
          ]);
          render();
        }

        /* ---- inline metadata editor (nội dung sửa bằng cách nhập lại Excel) ---- */
        function openEditor(r, row) { if (openId === r.id) { openId = null; render(); return; } openId = r.id; render(); }

        /* tải ảnh lên kho dùng chung hsk-media; hỏng thì nhúng thẳng data-URL */
        async function uploadImg(file, lessonId) {
          const ext = ((file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "")) || "jpg";
          const path = "vocab/" + (lessonId || "x") + "/" + uid() + "." + ext;
          try {
            const up = await sb.storage.from("hsk-media").upload(path, file, { upsert: true, contentType: file.type || "image/jpeg", cacheControl: "31536000" });
            if (!up.error) return sb.storage.from("hsk-media").getPublicUrl(path).data.publicUrl;
          } catch (e) {}
          return await new Promise(res => { const rd = new FileReader(); rd.onload = e => res(e.target.result); rd.readAsDataURL(file); });
        }

        function mountEditor(r, row) {
          const D = JSON.parse(JSON.stringify(r.data || {}));
          D.vocab = D.vocab || []; D.gapfill = D.gapfill || []; D.arrange = D.arrange || [];
          const box = document.createElement("div");
          box.style.cssText = "flex-basis:100%; margin-top:.6rem; padding:.7rem; border:1px dashed var(--line); border-radius:8px;";
          box.innerHTML =
            '<div class="form-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:.6rem;">' +
              '<div class="field" style="grid-column:1/-1;"><label>Tên bài</label><input id="ve-title" value="' + esc(r.title || "") + '"></div>' +
              '<div class="field"><label>Cấp HSK</label><select id="ve-lvl">' + [1, 2, 3, 4, 5, 6].map(n => '<option value="' + n + '"' + (Number(r.hsk_level) === n ? " selected" : "") + ">HSK " + n + "</option>").join("") + "</select></div>" +
              '<div class="field"><label>Số bài</label><input id="ve-no" value="' + esc(r.lesson_no || "") + '"></div>' +
              '<div class="field"><label>Quyền</label><select id="ve-tier"><option value="free"' + (r.tier !== "premium" ? " selected" : "") + '>Free</option><option value="premium"' + (r.tier === "premium" ? " selected" : "") + '>Premium 👑</option></select></div>' +
              '<div class="field"><label>Thứ tự</label><input id="ve-order" type="number" value="' + (r.sort_order || 0) + '"></div>' +
            "</div>" +
            '<div style="display:flex; align-items:center; justify-content:space-between; margin:.8rem 0 .4rem;">' +
              '<h3 style="margin:0; font-size:1rem;">Từ vựng <span class="kind" id="ve-vcount"></span></h3>' +
              '<button class="ghost" id="ve-add" type="button">+ Thêm từ</button>' +
            "</div>" +
            '<div id="ve-items"></div>' +
            '<div style="display:flex; gap:.5rem; align-items:center; margin-top:.7rem; flex-wrap:wrap;">' +
              '<button id="ve-save">Lưu tất cả</button>' +

        /* ---- import Excel → tạo bài mới ---- */
        $("vk-file").addEventListener("change", async ev => {

            const data = VX.toData(p);

            if (error) { showReport(f.name, [error.message + (/vocab_lessons/.test(error.message || "") ? " — hình như chưa chạy migration68." : "")], []); continue; }
            const i = ROWS.findIndex(x => x.lesson_id === ins.lesson_id); if (i >= 0) ROWS[i] = ins; else ROWS.push(ins);
            showReport(f.name, [], val.warns, "Đã tạo bài «" + title + "» (HSK " + level + ", " + data.vocab.length + " từ). Bấm ✏️ để sửa, 👁 xem thử, rồi Đăng.");

        $("vk-q").addEventListener("input", () => { vQ = $("vk-q").value.trim(); render(); });

        load();
      })();

      // ================= VOCAB PRACTICE — TIẾNG ANH (Phase 90) =================
      // Quản lý danh mục động + nhập bài tiếng Anh (Info/Vocabulary/MCQ).
      (function () {
        const zhBox = document.getElementById("vk-zh"), enBox = document.getElementById("vk-en");
        if (!enBox) return;
        const $ = id => document.getElementById(id);
        const uid = () => Math.random().toString(36).slice(2, 9);
        const slug = s => (s || "").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
          .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32);
        const now = () => new Date().toISOString();
        let TREE = [], ROWS = [], enLoaded = false, vQ = "", vFcat = "", openId = null;

        async function uploadImg(file, key) {
          const ext = ((file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "")) || "jpg";
          const path = "vocab-en/" + (key || "x") + "/" + uid() + "." + ext;
          try { const up = await sb.storage.from("hsk-media").upload(path, file, { upsert: true, contentType: file.type || "image/jpeg", cacheControl: "31536000" });
            if (!up.error) return sb.storage.from("hsk-media").getPublicUrl(path).data.publicUrl; } catch (e) {}
          return await new Promise(res => { const rd = new FileReader(); rd.onload = e => res(e.target.result); rd.readAsDataURL(file); });
        }

        // ---- language toggle ----
        function setLang(l) {
          $("vkl-zh").classList.toggle("on", l === "zh"); $("vkl-en").classList.toggle("on", l === "en");
          $("vkl-zh").style.cssText = "padding:0.4rem 0.9rem;border-radius:999px;border:1px solid var(--line);" + (l === "zh" ? "background:var(--tone-red,#c0392b);color:#fff;" : "background:#fff;");
          $("vkl-en").style.cssText = "padding:0.4rem 0.9rem;border-radius:999px;border:1px solid var(--line);" + (l === "en" ? "background:var(--tone-teal,#0d9488);color:#fff;" : "background:#fff;");
          zhBox.hidden = l !== "zh"; enBox.hidden = l !== "en";
          if (l === "en" && !enLoaded) { enLoaded = true; loadEn(); }
        }
        $("vkl-zh").addEventListener("click", () => setLang("zh"));
        $("vkl-en").addEventListener("click", () => setLang("en"));

        // ---- data ----
        async function loadEn() { await Promise.all([loadTree(), loadRows()]); }
        async function loadTree() {
          let cRes, sRes;
          try { [cRes, sRes] = await Promise.all([
            sb.from("vocab_categories").select("*").eq("language", "en").order("sort_order").order("name"),
            sb.from("vocab_subcategories").select("*").order("sort_order").order("name")]); }
          catch (e) { cRes = { error: e }; }
          if (cRes.error) { $("ven-cats").innerHTML = '<p class="empty">Chưa dùng được — hãy chạy <b>migration69</b>.</p>'; return; }
          const subs = (sRes && sRes.data) || [];
          TREE = (cRes.data || []).map(c => Object.assign({}, c, { subs: subs.filter(s => s.category_id === c.id).sort((a, b) => a.sort_order - b.sort_order) }));
          renderCats(); fillDropdowns();
        }
        async function loadRows() {
          let res; try { res = await sb.from("vocab_lessons").select("*").eq("language", "en").order("sort_order").order("created_at"); }
          catch (e) { res = { error: e }; }
          ROWS = res.error ? [] : (res.data || []); renderList();
        }
        const catName = id => { const c = TREE.find(x => x.id === id); return c ? c.name : "—"; };
        const subName = id => { for (const c of TREE) { const s = c.subs.find(x => x.id === id); if (s) return s.name; } return "—"; };
        const lessonsInCat = id => ROWS.filter(r => r.category_id === id);
        const lessonsInSub = id => ROWS.filter(r => r.subcategory_id === id);

        // ---- category / subcategory CRUD ----
        function renderCats() {
          const box = $("ven-cats");
          if (!TREE.length) { box.innerHTML = '<p class="empty" style="margin:0;">Chưa có danh mục. Thêm ở trên.</p>'; return; }
          box.innerHTML = "";
          TREE.forEach((c, ci) => {
            const cd = document.createElement("div");
            cd.style.cssText = "border:1px solid var(--line); border-radius:10px; padding:.55rem .7rem; margin-bottom:.55rem;";
            cd.innerHTML =
              '<div style="display:flex; align-items:center; gap:.4rem; flex-wrap:wrap;">' +
                '<b style="font-size:1rem; flex:1 1 auto;">' + esc(c.name) + ' <span class="kind">(' + lessonsInCat(c.id).length + ' bài · ' + c.subs.length + ' chủ đề)</span></b>' +
                '<button class="ghost c-up" title="Lên" style="padding:.2rem .5rem;">▲</button>' +
                '<button class="ghost c-down" title="Xuống" style="padding:.2rem .5rem;">▼</button>' +
                '<button class="ghost c-ren" style="padding:.2rem .5rem;">Đổi tên</button>' +
                '<button class="ghost c-del" style="padding:.2rem .5rem; color:var(--danger);">Xoá</button>' +
              "</div>" +
              '<div class="ven-subs" style="margin:.5rem 0 .2rem; padding-left:.6rem; border-left:2px solid var(--line);"></div>' +
              '<div style="display:flex; gap:.4rem; margin-top:.3rem;"><input class="c-newsub" placeholder="Thêm chủ đề…" style="max-width:220px;"><button class="ghost c-addsub" style="padding:.25rem .6rem;">+ Chủ đề</button></div>';
            const subsEl = cd.querySelector(".ven-subs");
            if (!c.subs.length) subsEl.innerHTML = '<span class="kind">Chưa có chủ đề.</span>';
            c.subs.forEach((s, si) => {
              const sr = document.createElement("div");
              sr.style.cssText = "display:flex; align-items:center; gap:.35rem; flex-wrap:wrap; padding:.2rem 0;";
              sr.innerHTML = '<span style="flex:1 1 auto;">• ' + esc(s.name) + ' <span class="kind">(' + lessonsInSub(s.id).length + ' bài)</span></span>' +
                '<button class="ghost s-up" style="padding:.15rem .45rem;">▲</button>' +
                '<button class="ghost s-down" style="padding:.15rem .45rem;">▼</button>' +
                '<button class="ghost s-ren" style="padding:.15rem .45rem;">Đổi tên</button>' +
                '<button class="ghost s-move" style="padding:.15rem .45rem;">Chuyển</button>' +
                '<button class="ghost s-del" style="padding:.15rem .45rem; color:var(--danger);">Xoá</button>';
              sr.querySelector(".s-up").onclick = () => reorderSub(c, si, -1);
              sr.querySelector(".s-down").onclick = () => reorderSub(c, si, 1);
              sr.querySelector(".s-ren").onclick = () => renameSub(s);
              sr.querySelector(".s-move").onclick = () => moveSub(s);
              sr.querySelector(".s-del").onclick = () => delSub(s);
              subsEl.appendChild(sr);
            });
            cd.querySelector(".c-up").onclick = () => reorderCat(ci, -1);
            cd.querySelector(".c-down").onclick = () => reorderCat(ci, 1);
            cd.querySelector(".c-ren").onclick = () => renameCat(c);
            cd.querySelector(".c-del").onclick = () => delCat(c);

          });
        }
        async function addCat(name) {
          const so = (TREE.reduce((m, c) => Math.max(m, c.sort_order), 0)) + 10;
          const { error } = await sb.from("vocab_categories").insert({ language: "en", name, sort_order: so });
          const m = $("ven-cmsg"); if (error) { m.textContent = error.message; m.className = "msg err"; return; }
          m.textContent = ""; $("ven-newcat").value = ""; await loadTree();
        }
        async function renameCat(c) { const v = prompt("Tên danh mục mới:", c.name); if (v == null) return; const n = v.trim(); if (!n || n === c.name) return;
          const { error } = await sb.from("vocab_categories").update({ name: n, updated_at: now() }).eq("id", c.id); if (error) { alert(error.message); return; } await loadEn(); }
        async function delCat(c) {
          const n = lessonsInCat(c.id).length;
          if (n > 0) {
            const dest = prompt("Danh mục «" + c.name + "» còn " + n + " bài.\nNhập TÊN danh mục khác để CHUYỂN bài sang, hoặc để trống = các bài thành “chưa phân loại” (không mất bài).\nBấm Cancel để huỷ.");
            if (dest == null) return;
            if (dest.trim()) { const t = TREE.find(x => x.name.toLowerCase() === dest.trim().toLowerCase() && x.id !== c.id);
              if (!t) { alert("Không tìm thấy danh mục «" + dest + "»."); return; }
              await sb.from("vocab_lessons").update({ category_id: t.id, subcategory_id: null }).eq("category_id", c.id); }
          } else if (!confirm("Xoá danh mục «" + c.name + "»?")) return;
          const { error } = await sb.from("vocab_categories").delete().eq("id", c.id);
          if (error) { alert(error.message); return; } await loadEn();
        }
        async function reorderCat(i, dir) { const j = i + dir; if (j < 0 || j >= TREE.length) return;
          const a = TREE[i], b = TREE[j], ao = a.sort_order, bo = b.sort_order;
          await Promise.all([sb.from("vocab_categories").update({ sort_order: bo }).eq("id", a.id), sb.from("vocab_categories").update({ sort_order: ao }).eq("id", b.id)]); await loadTree(); }
        async function addSub(c, name) { const so = (c.subs.reduce((m, s) => Math.max(m, s.sort_order), 0)) + 10;
          const { error } = await sb.from("vocab_subcategories").insert({ category_id: c.id, name, sort_order: so }); if (error) { alert(error.message); return; } await loadTree(); }
        async function renameSub(s) { const v = prompt("Tên chủ đề mới:", s.name); if (v == null) return; const n = v.trim(); if (!n || n === s.name) return;
          const { error } = await sb.from("vocab_subcategories").update({ name: n, updated_at: now() }).eq("id", s.id); if (error) { alert(error.message); return; } await loadEn(); }
        async function delSub(s) {
          const n = lessonsInSub(s.id).length;
          if (n > 0) { const dest = prompt("Chủ đề «" + s.name + "» còn " + n + " bài.\nNhập TÊN chủ đề khác (trong bất kỳ danh mục nào) để CHUYỂN bài sang, hoặc để trống = bỏ chủ đề (bài vẫn còn).\nCancel để huỷ.");
            if (dest == null) return;
            if (dest.trim()) { let td = null; for (const c of TREE) { const f = c.subs.find(x => x.name.toLowerCase() === dest.trim().toLowerCase() && x.id !== s.id); if (f) { td = f; break; } }
              if (!td) { alert("Không tìm thấy chủ đề «" + dest + "»."); return; }
              await sb.from("vocab_lessons").update({ subcategory_id: td.id, category_id: td.category_id }).eq("subcategory_id", s.id); }
          } else if (!confirm("Xoá chủ đề «" + s.name + "»?")) return;
          const { error } = await sb.from("vocab_subcategories").delete().eq("id", s.id); if (error) { alert(error.message); return; } await loadEn();
        }
        async function reorderSub(c, i, dir) { const j = i + dir; if (j < 0 || j >= c.subs.length) return;
          const a = c.subs[i], b = c.subs[j], ao = a.sort_order, bo = b.sort_order;
          await Promise.all([sb.from("vocab_subcategories").update({ sort_order: bo }).eq("id", a.id), sb.from("vocab_subcategories").update({ sort_order: ao }).eq("id", b.id)]); await loadTree(); }
        async function moveSub(s) {

        // ---- English Excel (Info / Vocabulary / MCQ) ----
        const EN_REQ = { Vocabulary: ["Word", "Vietnamese"], MCQ: ["Sentence", "CorrectAnswer", "Distractor1", "Distractor2"] };
        const EX = {
          norm: s => String(s == null ? "" : s).trim(),
          isUrl: s => /^(https?:\/\/|data:image\/)/i.test(s),
          rows(wb, name) { const ws = wb.Sheets[name]; if (!ws) return null; return XLSX.utils.sheet_to_json(ws, { defval: "", raw: false }); },
          parse(wb) {
            let info = {}; const inf = this.rows(wb, "Info");
            if (inf && inf.length) { if ("Field" in inf[0] && "Value" in inf[0]) inf.forEach(r => { if (this.norm(r.Field)) info[this.norm(r.Field)] = this.norm(r.Value); });
              else { const r = inf[0]; Object.keys(r).forEach(k => info[this.norm(k)] = this.norm(r[k])); } }
            const vocab = this.rows(wb, "Vocabulary"), mcq = this.rows(wb, "MCQ");
            return { info, vocab, mcq, sheets: { Vocabulary: vocab, MCQ: mcq } };
          },
          validate(p) {
            const errs = [], warns = [];
            const E = (s, r, m) => errs.push(s + (r ? " · dòng " + r : "") + ": " + m);
            const W = (s, r, m) => warns.push(s + (r ? " · dòng " + r : "") + ": " + m);
            if (!this.norm(p.info.LessonTitle)) W("Info", "", "chưa có LessonTitle — sẽ đặt tên mặc định.");
            ["Vocabulary", "MCQ"].forEach(sn => { if (!p.sheets[sn]) E(sn, "", "thiếu trang này trong tệp."); });
            const colCheck = (sn, rows) => { if (!rows || !rows.length) { if (p.sheets[sn]) E(sn, "", "trang không có dòng nào."); return false; }
              const have = Object.keys(rows[0]).map(k => this.norm(k)); (EN_REQ[sn] || []).forEach(c => { if (!have.includes(c)) E(sn, "tiêu đề", "thiếu cột «" + c + "»."); }); return true; };
            if (p.vocab && colCheck("Vocabulary", p.vocab)) {
              const seen = {}; p.vocab.forEach((r, i) => { const row = i + 2, w = this.norm(r.Word);
                if (!w) { E("Vocabulary", row, "thiếu từ (cột Word)."); return; }
                if (seen[w]) W("Vocabulary", row, "«" + w + "» trùng dòng " + seen[w] + "."); else seen[w] = row;
                if (!this.norm(r.Vietnamese)) E("Vocabulary", row, "«" + w + "» thiếu nghĩa tiếng Việt.");
                const img = this.norm(r.ImageURL); if (img && !this.isUrl(img)) W("Vocabulary", row, "«" + w + "» ImageURL không hợp lệ.");
                if (!img) W("Vocabulary", row, "«" + w + "» chưa có ảnh — sẽ không dùng cho trò Nối hình.");
              });
            }
            if (p.mcq && colCheck("MCQ", p.mcq)) {
              p.mcq.forEach((r, i) => { const row = i + 2, s = this.norm(r.Sentence);
                if (!s) E("MCQ", row, "thiếu câu (cột Sentence).");
                if (!this.norm(r.CorrectAnswer)) E("MCQ", row, "thiếu đáp án đúng (CorrectAnswer).");
                const dist = [r.Distractor1, r.Distractor2, r.Distractor3].map(x => this.norm(x)).filter(Boolean);
                if (dist.length < 2) E("MCQ", row, "cần ít nhất 2 phương án nhiễu.");
              });
            }
            return { errs, warns };
          },
          toData(p) {
            const vocab = (p.vocab || []).filter(r => this.norm(r.Word)).map(r => { const image = this.norm(r.ImageURL);
              return { id: uid(), word: this.norm(r.Word), pos: this.norm(r.PartOfSpeech || r.POS), vi: this.norm(r.Vietnamese),
                def: this.norm(r.Definition), example: this.norm(r.Example), image, imgKeyword: this.norm(r.ImageKeyword),
                audio: this.norm(r.AudioURL), match: !!image }; });
            const mcq = (p.mcq || []).filter(r => this.norm(r.Sentence)).map(r => ({ id: uid(), sentence: this.norm(r.Sentence),
              answer: this.norm(r.CorrectAnswer), distractors: [r.Distractor1, r.Distractor2, r.Distractor3].map(x => this.norm(x)).filter(Boolean),
              explanation: this.norm(r.Explanation) }));
            return { vocab, mcq };
          },
          buildTemplate() {
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Field", "Value"], ["LessonTitle", "B1 · Travel — Getting Around"],
              ["Category", "B1"], ["Subcategory", "Travel"], ["Order", "1"], ["Access", "free"],
              ["Instructions", "Điền Vocabulary + MCQ. Chọn Danh mục/Chủ đề khi nhập ở Bảng điều khiển."]]), "Info");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
              ["Word", "PartOfSpeech", "Vietnamese", "Definition", "Example", "ImageURL", "ImageKeyword", "AudioURL"],
              ["commute", "verb / noun", "đi lại hằng ngày", "to travel regularly between home and work", "She commutes to the city every day.", "https://loremflickr.com/400/320/commute,train", "commute", ""],
              ["luggage", "noun", "hành lý", "the bags you take when travelling", "We checked our luggage before the flight.", "https://loremflickr.com/400/320/luggage", "luggage", ""],
              ["departure", "noun", "sự khởi hành", "the act of leaving to start a journey", "The departure was delayed by two hours.", "https://loremflickr.com/400/320/airport", "departure", ""],
              ["fare", "noun", "giá vé", "the money you pay for a journey", "The bus fare went up last month.", "https://loremflickr.com/400/320/bus,ticket", "fare", ""]]), "Vocabulary");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
              ["Sentence", "CorrectAnswer", "Distractor1", "Distractor2", "Distractor3", "Explanation"],
              ["I ______ to work by train because driving is stressful.", "commute", "depart", "arrive", "wander", "commute = travel regularly to work"],
              ["Please keep your ______ with you at the airport.", "luggage", "fare", "departure", "commute", "luggage = travel bags"],
              ["The train ______ is at 9:15, so arrive by 9:00.", "departure", "luggage", "fare", "commute", "departure = the leaving/start of a journey"]]), "MCQ");
            return wb;
          }
        };
