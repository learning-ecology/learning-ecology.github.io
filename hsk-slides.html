<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài giảng HSK · Learning Ecology</title>
<meta name="description" content="Bài giảng HSK tương tác: từ vựng, hướng dẫn viết Hán tự theo thứ tự nét, bài đọc, ngữ pháp và luyện tập — trình chiếu ngay trên lớp." />
<link rel="canonical" href="https://learningecology.io.vn/hsk-slides.html" />
<link rel="icon" type="image/png" href="icons/logo-64.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#7a1113" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="hsk-plan.js"></script>
<script src="premium.js"></script>
<style>
:root{
  --ink:#1f2733; --muted:#5c6a7d; --line:#d9dee7; --paper:#fff; --bg:#f4f6fa;
  --brand:#7a1113; --gold:#c99a2e; --accent:#2563eb;
  --r:14px; --shadow:0 10px 30px -18px rgba(20,30,50,.55);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",serif;
  /* thang z-index thống nhất — bản mẫu có 9 lớp chồng nhau tuỳ hứng */
  --z-content:1; --z-annot:30; --z-spot:40; --z-ctrl:50; --z-panel:60;
  /* cỡ chữ trình chiếu: thầy chỉnh được ngay khi đang dạy, 20–80px */
  --fs:24px;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink)}
.hidden{display:none!important}
#leTop{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--paper);
  border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
#leTop .le-brand{display:inline-flex;align-items:center;gap:7px;font-weight:800;color:var(--ink);text-decoration:none}
#leTop .le-sep{color:var(--muted)} #leTop .le-page{color:var(--brand)}
#leTop .le-spacer{margin-left:auto} #leTop .le-who{color:var(--muted);font-size:13px}
#leTop .le-a{color:var(--brand);text-decoration:none;font-size:13px;white-space:nowrap;
  border:1px solid var(--line);border-radius:8px;padding:5px 10px}
#leTop .le-a.le-p{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
@media(max-width:640px){#leTop .le-page,#leTop .le-who{display:none}}

/* ---------- chọn bài ---------- */
#pickScreen{max-width:1100px;margin:0 auto;padding:2rem 1.25rem}
#pickScreen h2{font-size:1.6rem;margin:0 0 .3rem}
#pickScreen .lead{color:var(--muted);margin:0 0 1.6rem}
.lv{margin-bottom:2rem}
.lv h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 .8rem}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.lesson-card{position:relative;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r);padding:1.1rem 1.2rem;cursor:pointer;font:inherit;transition:transform .15s,box-shadow .15s}
.lesson-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.lesson-card.locked{opacity:.85}
.lesson-card.locked::after{content:"🔒";position:absolute;top:.9rem;right:1rem}
.lesson-card h4{margin:.35rem 0 .25rem;font-size:1.05rem;color:var(--brand)}
.lesson-card p{margin:0 0 .5rem;font-size:.83rem;color:var(--muted)}
.lc-no{font-size:.72rem;color:var(--muted)}
.lc-meta{display:block;font-size:.78rem;color:var(--muted)}
.lc-go{display:block;margin-top:.6rem;font-weight:700;font-size:.82rem;color:var(--accent)}
.tag{display:inline-block;font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:999px}
.tag.free{background:#e2f4e9;color:#146c3d}
.tag.prem{background:linear-gradient(135deg,#f4d68a,#d9a53c);color:#713f12}
.empty{color:var(--muted);padding:1.2rem;border:1px dashed var(--line);border-radius:var(--r);text-align:center}

/* ---------- sân khấu 16:9 ---------- */
#wrap{position:relative;background:#0e1116;min-height:calc(100vh - 46px);display:flex;
  align-items:center;justify-content:center;padding:14px}
#stageWrap{position:relative;width:min(100%,calc((100vh - 120px) * 16 / 9));aspect-ratio:16/9;
  background:var(--paper);border-radius:12px;overflow:hidden;box-shadow:0 24px 60px -30px #000;
  display:flex;flex-direction:column}
/* Thanh điều khiển là MỘT HÀNG THẬT dưới đáy, không phải nút nổi đè lên slide:
   chữ cuộn tới đâu cũng không bị nút che (yêu cầu 14–15). */
#stageArea{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
#stage{position:absolute;inset:0;z-index:var(--z-content);overflow:hidden}
#annot{position:absolute;inset:0;width:100%;height:100%;z-index:var(--z-annot);pointer-events:none;touch-action:none}
#spotlight{position:absolute;inset:0;z-index:var(--z-spot);pointer-events:none;
  background:radial-gradient(circle 130px at var(--x,50%) var(--y,50%),transparent 0 128px,rgba(0,0,0,.72) 132px)}
.laser-dot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  background:#ff2d2d;box-shadow:0 0 14px 5px rgba(255,45,45,.6);z-index:var(--z-spot);pointer-events:none}
.annot-text{position:absolute;z-index:var(--z-annot);min-width:90px;padding:4px 8px;font-weight:700;
  font-size:20px;background:rgba(255,255,255,.85);border:1px dashed var(--accent);border-radius:6px;outline:none}

/* ---------- khung slide chung (Phase 57) ----------
   MỌI slide đều là: đầu cố định + thân CUỘN ĐƯỢC. Nhờ vậy thầy phóng chữ
   to bao nhiêu cũng không có chữ nào bị cắt mất — phần nào không vừa thì
   cuộn, chứ hệ thống không tự thu nhỏ chữ lại. */
.sl{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  font-size:var(--fs,24px);line-height:1.35}
.sl-head{flex:0 0 auto;padding:2.2vmin 4vmin .7vmin}
.sl-head h2{margin:0;color:var(--brand);font-size:1.45em;line-height:1.15}
.sl-kind{display:block;font-size:.62em;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.sl-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:1.2vmin 4vmin 1.6em;scrollbar-width:thin;scrollbar-color:#c3ccda transparent}
.sl-body::-webkit-scrollbar{width:11px}
.sl-body::-webkit-scrollbar-thumb{background:#c3ccda;border-radius:99px;border:3px solid #fff}
.reveal{opacity:0;transform:translateY(6px);transition:opacity .28s,transform .28s}
.reveal.shown{opacity:1;transform:none}
.reveal:not(.shown){pointer-events:none}

/* mở đầu */
.sl.intro .sl-body{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:.5rem;padding-bottom:4em}
.sl.intro{background:linear-gradient(150deg,#fff,#fdf6ec)}
.intro .badge{background:var(--brand);color:#fff;padding:.35em 1em;border-radius:999px;font-size:1.1em;font-weight:700}
.intro h1{font-size:3.4em;margin:.25em 0 0;color:var(--brand)}
.intro .zh-title{font-family:var(--zh);font-size:2.4em;color:var(--gold)}
.intro .lesson-no{font-size:1.2em;color:var(--muted)}
.intro .sub{font-size:1.2em;color:var(--muted)}
.intro .desc{max-width:60ch;color:var(--muted)}
.btn-primary{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:.7em 1.6em;
  font:inherit;font-weight:700;cursor:pointer}
.btn-primary.big{font-size:1.3em;margin-top:.8em}

/* danh mục: đầu cố định, giữa cuộn (dùng chung khung .sl-head/.sl-body) */
.sl.hub .sl-head{border-bottom:1px solid var(--line)}
.hub-sub{color:var(--muted);font-size:.8em}
.hub-sec{margin-bottom:1.6em}
.hub-sec h3{margin:0 0 .5em;font-size:1.15em;color:var(--ink)}
.hub-sec .cnt{color:var(--muted);font-size:.8em}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.7em}
.hub-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.7em;cursor:pointer;
  font:inherit;text-align:center;display:flex;flex-direction:column;gap:.15em}
.hub-card:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.hc-zh{font-family:var(--zh);font-size:1.9em;color:var(--brand);font-weight:700}
.hc-py{color:var(--gold);font-size:.9em}
.hc-vi{color:var(--muted);font-size:.85em}
.hub-list{display:flex;flex-wrap:wrap;gap:.5em}
.hub-row{background:#fff;border:1px solid var(--line);border-radius:8px;padding:.55em 1em;
  cursor:pointer;font:inherit;text-align:left}
.hub-row:hover{border-color:var(--brand)}

/* từ vựng — cột trái là NGHĨA (ảnh minh hoạ), thứ tự nét là khối riêng
   bên dưới. Bản Phase 56 lấy chính chữ Hán mờ làm ảnh, nhìn thì đẹp
   nhưng chẳng giúp học viên hiểu nghĩa, lại lẫn với slide tập viết. */
.sl.vocab .sl-body{display:flex;flex-direction:row;gap:3vmin;align-items:flex-start}
.vc-left{flex:0 0 36%;position:sticky;top:0;display:flex;flex-direction:column;gap:.6em}
.vc-img{margin:0;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#f2f4f8;
  display:flex;align-items:center;justify-content:center;position:relative}
.vc-img img{width:100%;height:100%;object-fit:cover}
.vc-img figcaption{position:absolute;left:0;right:0;bottom:0;font-size:.55em;color:#fff;
  background:rgba(0,0,0,.45);padding:.25em .5em}
.vc-img.empty{flex-direction:column;gap:.3em;border:2px dashed #cdd5e0;background:#fafbfd;
  color:var(--muted);font-size:.72em;text-align:center;padding:1em}
.vc-img.empty b{font-size:1.5em;color:#b4820f}
.vc-strokes{border:1px solid var(--line);border-radius:10px;padding:.45em .6em;background:#fffdf8}
.vc-strokes .st-h{display:flex;align-items:center;justify-content:space-between;
  font-size:.62em;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:.35em}
.vc-mini{display:flex;gap:.45em;flex-wrap:wrap}
.vc-right{flex:1 1 auto;min-width:0}
.vc-head{display:flex;align-items:center;gap:.4em}
.vc-zh{font-family:var(--zh);font-size:4.4em;font-weight:700;color:var(--brand);cursor:pointer;line-height:1.05}
.vc-py{font-size:1.7em;color:var(--gold);font-weight:600}
.auto-tag{font-size:.42em;font-style:normal;color:var(--muted);border:1px solid var(--line);
  border-radius:6px;padding:.1em .5em;margin-left:.5em;vertical-align:middle}
.vc-wc{display:inline-block;font-size:.9em;color:var(--muted);border:1px solid var(--line);
  border-radius:6px;padding:.1em .6em;margin:.2em 0}
.vc-vi{font-size:1.5em;font-weight:700;margin:.3em 0 .5em}
.vc-ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5em}
.vc-ex li{border-left:3px solid var(--gold);padding-left:.7em}
.ex-zh{font-family:var(--zh);font-size:1.35em;color:var(--ink)}
.ex-py{display:block;color:var(--gold);font-size:.95em}
.ex-vi{display:block;color:var(--muted);font-size:.95em}
.vc-note{color:var(--muted);font-size:.95em}
.btn-mini{border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;
  font-size:.8em;padding:.1em .45em;margin-left:.3em}

/* hướng dẫn viết */
.sl.write .sl-head{text-align:center}
.sl.write .sl-head h2 b{font-family:var(--zh);font-size:1.3em}
.sl.write .sl-body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.8em}
.write-foot{color:var(--muted);font-size:1.05em}
.hz-wrap{display:flex;flex-direction:column;align-items:center;gap:.7em}
.hz-tabs{display:flex;gap:.4em}
.hz-tab{font-family:var(--zh);font-size:1.6em;border:1px solid var(--line);background:#fff;
  border-radius:8px;padding:.05em .5em;cursor:pointer}
.hz-tab.on{border-color:var(--brand);background:#fdf1f1;color:var(--brand);font-weight:700}
.hz-panels{display:flex;align-items:center;justify-content:center}
.hz-panel{display:flex;flex-direction:column;align-items:center;gap:.5em}
.tianzige{position:relative;border:2px solid var(--brand);border-radius:8px;background:#fffdf8}
.tzg-grid{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to right,transparent calc(50% - .5px),#e6cfcf 50%,transparent calc(50% + .5px)),
             linear-gradient(to bottom,transparent calc(50% - .5px),#e6cfcf 50%,transparent calc(50% + .5px))}
.hz-box{display:block}
.hz-fallback{font-family:var(--zh);font-size:5em;color:var(--brand);padding:.2em .4em}
.hz-bar{display:flex;align-items:center;gap:.5em}
.hz-label{color:var(--muted);font-size:.95em}
.hz-label b{font-family:var(--zh);font-size:1.3em;color:var(--brand)}
.btn-sm{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.3em .8em;
  cursor:pointer;font:inherit;font-size:.9em}
.btn-sm:hover{border-color:var(--brand);color:var(--brand)}

/* bài đọc / ngữ pháp / luyện tập / bộ thủ */
.rd-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6em}
.rd-line{border-left:3px solid var(--gold);padding-left:.8em}
.rd-who{display:inline-block;font-size:.85em;color:var(--muted);margin-right:.5em}
.rd-zh{font-family:var(--zh);font-size:1.5em}
.rd-py{display:block;color:var(--gold);font-size:.95em}
.rd-vi{display:block;color:var(--muted);font-size:.95em}
.rd-note{color:var(--muted)}
.gr-struct{font-family:var(--zh);font-size:1.6em;background:#fdf6ec;border:1px solid var(--gold);
  border-radius:10px;padding:.5em .8em;display:inline-block;white-space:pre-line}
.gr-exp{font-size:1.15em}
.gr-ex{list-style:none;margin:.6em 0 0;padding:0;display:flex;flex-direction:column;gap:.5em}
.gr-ex li{border-left:3px solid var(--gold);padding-left:.7em}
/* ---------- bài luyện tập TƯƠNG TÁC (Phase 57) ----------
   Bản cũ chỉ in sẵn "Đáp án: B" ra màn hình. Giờ mỗi loại là một hoạt
   động thật: bấm chọn → chấm ngay → giải thích, và không thấy đáp án
   trước khi trả lời. */
.pr-q{font-size:1.35em;white-space:pre-line;margin:0 0 .7em;font-weight:600}
.pr-q .zh{font-family:var(--zh)}
.ex-opts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.55em}
@media(max-width:900px){.ex-opts{grid-template-columns:1fr}}
.ex-opt{display:flex;align-items:center;gap:.5em;width:100%;text-align:left;font:inherit;
  border:2px solid var(--line);background:#fff;border-radius:12px;padding:.55em .8em;cursor:pointer;
  font-size:1.15em;transition:border-color .15s,background .15s,transform .1s}
.ex-opt .k{flex:0 0 auto;font-weight:800;color:var(--muted)}
.ex-opt .tx{font-family:var(--zh)}
.ex-opt:hover:not(:disabled){border-color:var(--brand);transform:translateY(-1px)}
.ex-opt.pick{border-color:var(--accent);background:#eff5ff}
.ex-opt.right{border-color:#1a7f4b;background:#e8f7ef}
.ex-opt.right .k{color:#1a7f4b}
.ex-opt.wrong{border-color:#c92a2a;background:#fdecec}
.ex-opt.wrong .k{color:#c92a2a}
/* nút đã chấm thì khoá lại, nhưng KHÔNG được mờ chữ đi — trên máy chiếu
   là không đọc nổi nữa */
.ex-opt:disabled{cursor:default;opacity:1;color:var(--ink);-webkit-text-fill-color:currentColor}
.ex-input{font:inherit;font-family:var(--zh);font-size:1.3em;padding:.35em .6em;min-width:8em;
  border:2px solid var(--line);border-radius:10px;background:#fff}
.ex-input:focus{outline:none;border-color:var(--accent)}
.ex-input.right{border-color:#1a7f4b;background:#e8f7ef}
.ex-input.wrong{border-color:#c92a2a;background:#fdecec}
.ex-row{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.ex-actions{display:flex;gap:.5em;flex-wrap:wrap;margin-top:.9em}
.ex-btn{font:inherit;font-size:.95em;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:.45em 1.1em;cursor:pointer}
.ex-btn.main{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.ex-btn:hover{border-color:var(--brand)}
.ex-fb{margin-top:.7em;font-size:1.1em;font-weight:700;min-height:1.4em}
.ex-fb.ok{color:#1a7f4b} .ex-fb.no{color:#c92a2a}
.ex-exp{color:var(--muted);font-size:.95em;margin:.4em 0 0;border-left:3px solid var(--gold);padding-left:.7em}

/* sắp xếp câu */
.ex-slot{min-height:2.6em;display:flex;flex-wrap:wrap;gap:.4em;align-items:center;padding:.5em;
  border:2px dashed #c3ccda;border-radius:12px;background:#fbfcfe}
.ex-slot.over{border-color:var(--accent);background:#eff5ff}
.ex-pool{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.7em;min-height:2.2em}
.ex-tok{font:inherit;font-family:var(--zh);font-size:1.35em;border:2px solid var(--line);background:#fff;
  border-radius:10px;padding:.2em .6em;cursor:grab;user-select:none}
.ex-tok:hover{border-color:var(--brand)}
.ex-tok.drag{opacity:.4}
.ex-hint{font-size:.78em;color:var(--muted);margin:.5em 0 0}

/* nối cặp */
.ex-match{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.ex-col{display:flex;flex-direction:column;gap:.45em}
.ex-cell{display:flex;align-items:center;gap:.5em;font:inherit;text-align:left;border:2px solid var(--line);
  background:#fff;border-radius:12px;padding:.45em .7em;cursor:pointer;font-size:1.1em;font-family:var(--zh)}
.ex-cell:hover{border-color:var(--brand)}
.ex-cell.pick{border-color:var(--accent);background:#eff5ff}
.ex-cell.done{border-style:solid}
.ex-cell.right{border-color:#1a7f4b;background:#e8f7ef}
.ex-cell.wrong{border-color:#c92a2a;background:#fdecec}
.ex-cell img{width:100%;max-height:3.2em;object-fit:cover;border-radius:8px}
.ex-cell.pic{flex-direction:column;align-items:stretch;padding:.35em}
.ex-badge{flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;font-size:.7em;font-weight:800;color:#fff;background:#c3ccda}
.sl.radical .sl-body{display:flex;flex-direction:row;gap:3vmin;align-items:flex-start}
.rad-left{flex:0 0 28%;text-align:center}
.rad-char{font-family:var(--zh);font-size:8em;color:var(--brand);line-height:1}
.rad-py{color:var(--gold);font-size:1.4em}
.rad-right h2{margin:0 0 .3em;color:var(--brand);font-size:1.8em}
.rad-mean{font-size:1.3em;font-weight:600}
.rad-pos,.rad-rel{color:var(--muted);margin-top:.3em}
.rad-rel b{font-family:var(--zh);font-size:1.3em;color:var(--ink)}

/* điều khiển cố định */
.ctrl{position:absolute;z-index:var(--z-ctrl)}
#dock{flex:0 0 auto;display:flex;align-items:center;gap:.6em;padding:7px 12px;
  border-top:1px solid var(--line);background:#fbfcfe}
#dock > *{position:static!important;transform:none!important}
#navBar{margin:0 auto;display:flex;align-items:center;gap:.4em;
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:.25em .5em}
.ctrl button,#btnHub,#btnToolkit{border:1px solid var(--line);background:#fff;
  border-radius:999px;padding:.45em .9em;font:inherit;font-size:13px;cursor:pointer}
#btnFull{box-shadow:var(--shadow);background:rgba(255,255,255,.94)}
.ctrl button:hover{border-color:var(--brand);color:var(--brand)}
#counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:64px;text-align:center}
#btnFull{right:14px;top:14px}

  border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);overflow:hidden}

  font:inherit;font-size:12px;cursor:pointer}

</style>

<!-- sân khấu -->

    <div id="toolkit" class="hidden">
      <div id="tkHandle"><span>⠿ Dụng cụ giảng dạy</span>
        <button id="tkClose" type="button" data-tk="close" title="Đóng bảng (annotation vẫn giữ nguyên)">✕</button></div>
      <div class="tk-body">
        <button data-tool="select" class="on">Con trỏ</button>
        <button data-tool="laser">Laser</button>

        <button data-tool="pen">Bút vẽ</button>

        <div class="tk-colors">

          <i data-color="#f5a524" style="background:#f5a524"></i>
          <i data-color="#30a46c" style="background:#30a46c"></i>

   </div>

  </div>

<script>
/* ==========================================================================
   HSK SLIDES — trình chiếu (Phase 56)
   Dựng lại từ bản mẫu, giữ nguyên trải nghiệm dạy học nhưng sửa các điểm
   yếu đã nêu trong phần rà soát:
     • MỌI chữ do thầy nhập đều đi qua esc() — bản cũ nhét thẳng vào
       innerHTML và vào 26 chỗ onclick="...'${chữ}'..." nên chỉ một dấu
       nháy trong nghĩa tiếng Việt là hỏng nút.
     • Không còn onclick nội tuyến: một trình bắt sự kiện duy nhất trên sân
       khấu, đọc data-act — nhờ vậy không cần biến toàn cục nào.
     • Đổi slide là DỌN sạch: huỷ HanziWriter, gỡ listener, xoá canvas.
       Bản cũ giữ window['writer_…'] mãi mãi.
     • Thứ tự nét CHỈ dùng HanziWriter (~9.000 chữ). Bản cũ ưu tiên 7 tệp
       GIF trích từ PPT mẫu — sai chỗ khác là 404.
     • Không số slide cứng: mọi thứ chạy theo slide plan sinh từ dữ liệu.
   ========================================================================== */
(function () {
  'use strict';

  /* ---------- tiện ích ---------- */
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const el = (tag, cls, html) => { const e = document.createElement(tag);
    if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  /* ---------- trạng thái ---------- */
  let LESSON = null, PLAN = [], SECTIONS = [], IDX = 0;
  let revealStep = 0, revealTotal = 0;
  let hubScroll = 0;                 // nhớ chỗ đang cuộn của danh mục
  const writers = [];                // HanziWriter đang sống của slide hiện tại

  const stage = () => $('#stage');

  /* ---------- phát âm ---------- */
  function speak(text) {
    try {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text || ''));
      u.lang = 'zh-CN'; u.rate = 0.85;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* ---------- thứ tự nét ---------- */
  function destroyWriters() {
    while (writers.length) {
      const w = writers.pop();
      try { w.cancelQuiz && w.cancelQuiz(); } catch (e) {}
      try { w.hideCharacter && w.hideCharacter(); } catch (e) {}
    }
  }
  function mountWriter(box, char, size) {
    if (typeof HanziWriter === 'undefined' || !box) return null;
    box.innerHTML = '';
    try {
      const w = HanziWriter.create(box, char, {
        width: size, height: size, padding: Math.max(4, Math.round(size * 0.05)),
        showOutline: true, strokeAnimationSpeed: 1.1, delayBetweenStrokes: 140,
        strokeColor: '#7a1113', radicalColor: '#c99a2e', outlineColor: '#e2d6c3'
      });
      w.animateCharacter();
      writers.push(w);
      return w;
    } catch (e) {
      box.innerHTML = '<div class="hz-fallback">' + esc(char) + '</div>';
      return null;
    }
  }
  /* khối thứ tự nét: nhiều chữ thì có tab chọn chữ */
  function strokeBlock(chars, size, idPrefix) {
    const tabs = chars.length > 1
      ? '<div class="hz-tabs">' + chars.map((c, i) =>
          '<button class="hz-tab' + (i === 0 ? ' on' : '') + '" data-act="hz-tab" data-i="' + i +
          '" data-p="' + esc(idPrefix) + '">' + esc(c) + '</button>').join('') + '</div>'
      : '';
    const panels = chars.map((c, i) =>
      '<div class="hz-panel' + (i ? ' hidden' : '') + '" id="' + esc(idPrefix) + '-p' + i + '">' +
        '<div class="tianzige"><div class="tzg-grid"></div>' +
          '<div class="hz-box" id="' + esc(idPrefix) + '-w' + i + '" data-char="' + esc(c) + '" data-size="' + size + '"></div>' +
        '</div>' +
        '<div class="hz-bar"><span class="hz-label">Chữ <b>' + esc(c) + '</b></span>' +
          '<button class="btn-sm" data-act="hz-replay" data-i="' + i + '" data-p="' + esc(idPrefix) + '">↻ Phát lại</button>' +
          '<button class="btn-sm" data-act="say" data-text="' + esc(c) + '">🔊 Đọc</button></div>' +
      '</div>').join('');
    return '<div class="hz-wrap">' + tabs + '<div class="hz-panels">' + panels + '</div></div>';
  }
  function bootWriters(root) {
    root.querySelectorAll('.hz-box').forEach(box => {
      if (box.closest('.hz-panel') && box.closest('.hz-panel').classList.contains('hidden')) return;
      mountWriter(box, box.dataset.char, Number(box.dataset.size) || 160);
    });
  }

  /* ---------- cỡ chữ trình chiếu (yêu cầu 11–13) ----------
     Mọi kích thước trên slide đều tính bằng em, nên đổi MỘT biến --fs là
     cả bài giảng to lên theo. Chữ to mà không vừa thì phần thân slide
     cuộn — hệ thống KHÔNG tự thu nhỏ chữ lại, vì thầy phóng to là có ý. */
  const FS_MIN = 20, FS_MAX = 80, FS_KEY = 'hskFontSize';
  let FS = 26;
  function applyFs() {
    const w = $('#stageArea');
    if (w) w.style.setProperty('--fs', FS + 'px');
    const lb = $('#fsLabel'); if (lb) lb.textContent = FS + 'px';
    try { localStorage.setItem(FS_KEY, String(FS)); } catch (e) {}
  }
  function bumpFs(d) {
    const was = FS;
    FS = Math.max(FS_MIN, Math.min(FS_MAX, FS + d));
    if (FS === was) return;
    applyFs();
    /* thứ tự nét vẽ bằng canvas/SVG theo px nên phải dựng lại cho khớp cỡ chữ */
    const keep = revealStep; render(); revealStep = keep; applyReveal();
  }
  function initFs() {
    let v = 0; try { v = Number(localStorage.getItem(FS_KEY)) || 0; } catch (e) {}
    if (v >= FS_MIN && v <= FS_MAX) FS = v;
    applyFs();
  }

  /* ---------- các loại slide ---------- */
  const V = i => (LESSON.vocabulary || [])[i] || {};
  const head = (title, kind) =>
    '<header class="sl-head">' + (kind ? '<span class="sl-kind">' + esc(kind) + '</span>' : '') +
    '<h2>' + title + '</h2></header>';

  /* khối thứ tự nét NHỎ, đặt dưới ảnh minh hoạ trên slide từ vựng.
     Tách hẳn khỏi ảnh minh hoạ: ảnh lo NGHĨA, khối này lo cách VIẾT. */
  function miniStrokes(chars, prefix) {
    if (!chars.length) return '';
    const size = Math.max(56, Math.round(FS * 3.2));
    return '<div class="vc-strokes"><div class="st-h"><span>✍ Thứ tự nét</span>' +
      '<button class="btn-sm" data-act="hz-replay-all" data-p="' + esc(prefix) + '">↻</button></div>' +
      '<div class="vc-mini">' + chars.map((c, i) =>
        '<div class="tianzige"><div class="tzg-grid"></div>' +
        '<div class="hz-box" id="' + esc(prefix) + '-w' + i + '" data-char="' + esc(c) +
        '" data-size="' + size + '"></div></div>').join('') + '</div></div>';
  }

  const renderers = {
    intro() {
      return '<div class="sl intro"><div class="sl-body">' +
        '<div class="badge">' + esc(LESSON.course || ('HSK ' + LESSON.hskLevel)) + '</div>' +
        '<h1>' + esc(LESSON.title) + '</h1>' +
        (LESSON.titleZh ? '<div class="zh-title">' + esc(LESSON.titleZh) + '</div>' : '') +
        (LESSON.lessonNo ? '<div class="lesson-no">Bài ' + esc(LESSON.lessonNo) + '</div>' : '') +
        (LESSON.subtitle ? '<div class="sub">' + esc(LESSON.subtitle) + '</div>' : '') +
        (LESSON.description ? '<p class="desc">' + esc(LESSON.description) + '</p>' : '') +
        '<button class="btn-primary big" data-act="go-hub">Bắt đầu →</button>' +
      '</div></div>';
    },

    /* MỘT slide danh mục duy nhất; phần giữa cuộn được, tiêu đề và nút cố định */
    hub() {
      const groups = SECTIONS.map(sec => {
        let inner = '';
        if (sec.key === 'vocab') {
          inner = '<div class="hub-grid">' + (LESSON.vocabulary || []).map((v, i) =>
            '<button class="hub-card" data-act="goto" data-id="vocab-' + i + '">' +
              '<span class="hc-zh">' + esc(v.chinese) + '</span>' +
              '<span class="hc-py">' + esc(v.pinyin) + '</span>' +
              '<span class="hc-vi">' + esc(v.vietnamese) + '</span>' +
            '</button>').join('') + '</div>';
        } else {
          const items = PLAN.filter(s => s.section === sec.key);
          inner = '<div class="hub-list">' + items.map(s =>
            '<button class="hub-row" data-act="goto" data-id="' + esc(s.id) + '">' +
              esc(s.title) + '</button>').join('') + '</div>';
        }
        return '<section class="hub-sec"><h3>' + sec.icon + ' ' + esc(sec.label) +
               ' <span class="cnt">' + sec.count + '</span></h3>' + inner + '</section>';
      }).join('');
      return '<div class="sl hub">' +
        '<header class="sl-head"><h2>DANH MỤC BÀI HỌC</h2>' +
          '<span class="hub-sub">' + esc(LESSON.title) + '</span></header>' +
        '<div class="sl-body" id="hubScroll">' + groups + '</div>' +
      '</div>';
    },

    /* Từ vựng: bên trái là NGHĨA (ảnh minh hoạ + thứ tự nét thu nhỏ),
       bên phải là chữ — hiện dần theo từng cú bấm. */
    vocab(s) {
      const v = V(s.index);
      const img = v.image && v.image.url
        ? '<figure class="vc-img"><img src="' + esc(v.image.url) + '" alt="' + esc(v.vietnamese) + '">' +
          (v.image.credit ? '<figcaption>Ảnh: ' + esc(v.image.credit) + '</figcaption>' : '') + '</figure>'
        : '<div class="vc-img empty"><b>⚠ Chưa có hình minh hoạ</b>' +
          '<span>Thêm ảnh ở Bảng điều khiển → HSK Slides → ✏️</span></div>';
      const nEx = (v.examples || []).length;
      const ex = (v.examples || []).map((e, k) =>
        '<li class="reveal" data-reveal="' + (k + 3) + '">' +
          '<span class="ex-zh">' + esc(e.zh) + '</span>' +
          '<button class="btn-mini" data-act="say" data-text="' + esc(e.zh) + '">🔊</button>' +
          '<span class="ex-py">' + esc(e.pinyin) + '</span>' +
          (e.vi ? '<span class="ex-vi">' + esc(e.vi) + '</span>' : '') +
        '</li>').join('');
      return '<div class="sl vocab"><div class="sl-body">' +
        '<div class="vc-left">' + img + miniStrokes(v.chars || [], 'v' + s.index) + '</div>' +
        '<div class="vc-right">' +
          '<div class="vc-head">' +
            '<span class="vc-zh" data-act="say" data-text="' + esc(v.chinese) + '">' + esc(v.chinese) + '</span>' +
            '<button class="btn-mini" data-act="say" data-text="' + esc(v.chinese) + '">🔊</button>' +
          '</div>' +
          '<div class="vc-py reveal" data-reveal="1">' + esc(v.pinyin) +
            (v.pinyinSource === 'auto' ? '<i class="auto-tag" title="Pinyin do hệ thống tạo">tự động</i>' : '') + '</div>' +
          (v.wordClass ? '<div class="vc-wc reveal" data-reveal="1">' + esc(v.wordClass) + '</div>' : '') +
          '<div class="vc-vi reveal" data-reveal="2">' + esc(v.vietnamese) + '</div>' +
          (ex ? '<ul class="vc-ex">' + ex + '</ul>' : '') +
          (v.notes ? '<p class="vc-note reveal" data-reveal="' + (nEx + 3) + '">' + esc(v.notes) + '</p>' : '') +
        '</div>' +
      '</div></div>';
    },

    write(s) {
      const v = V(s.index);
      const size = Math.max(180, Math.min(360, Math.round(FS * 11)));
      return '<div class="sl write">' +
        head('HƯỚNG DẪN VIẾT HÁN TỰ: <b>' + esc(v.chinese) + '</b>') +
        '<div class="sl-body">' + strokeBlock(v.chars || [], size, 'w' + s.index) +
          '<div class="write-foot">' + esc(v.pinyin) + ' · ' + esc(v.vietnamese) + '</div>' +
        '</div></div>';
    },

    reading() {
      const r = LESSON.reading || { lines: [] };
      const rows = (r.lines || []).map((l, i) =>
        '<li class="rd-line reveal" data-reveal="' + (i + 1) + '">' +
          (l.speaker ? '<span class="rd-who">' + esc(l.speaker) + '</span>' : '') +
          '<span class="rd-zh">' + esc(l.zh) + '</span>' +
          '<button class="btn-mini" data-act="say" data-text="' + esc(l.zh) + '">🔊</button>' +
          '<span class="rd-py">' + esc(l.pinyin) + '</span>' +
          (l.vi ? '<span class="rd-vi">' + esc(l.vi) + '</span>' : '') +
        '</li>').join('');
      return '<div class="sl reading">' + head(esc(r.title), 'Bài đọc') +
        '<div class="sl-body"><ul class="rd-list">' + rows + '</ul>' +
        (r.notes ? '<p class="rd-note">' + esc(r.notes) + '</p>' : '') + '</div></div>';
    },

    grammar(s) {
      const g = (LESSON.grammar || [])[s.index] || {};
      const ex = (g.examples || []).map((e, k) =>
        '<li class="reveal" data-reveal="' + (k + 2) + '">' +
          '<span class="ex-zh">' + esc(e.zh) + '</span>' +
          '<button class="btn-mini" data-act="say" data-text="' + esc(e.zh) + '">🔊</button>' +
          '<span class="ex-py">' + esc(e.pinyin) + '</span>' +
          (e.vi ? '<span class="ex-vi">' + esc(e.vi) + '</span>' : '') + '</li>').join('');
      return '<div class="sl grammar">' + head(esc(g.title), 'Ngữ pháp') + '<div class="sl-body">' +
        (g.structure ? '<div class="gr-struct">' + esc(g.structure) + '</div>' : '') +
        (g.explanation ? '<p class="gr-exp reveal" data-reveal="1">' + esc(g.explanation) + '</p>' : '') +
        (ex ? '<ul class="gr-ex">' + ex + '</ul>' : '') + '</div></div>';
    },

    practice(s) {
      const bank = s.bank === 'grammar' ? LESSON.grammarPractice : LESSON.vocabPractice;
      const a = (bank || [])[s.index] || {};
      const label = (window.HSKPlan.EX_LABEL || {})[a.type] || 'Luyện tập';
      return '<div class="sl practice">' +
        head(esc(s.bank === 'grammar' ? 'Luyện tập Ngữ pháp' : 'Luyện tập Từ vựng'), label) +
        '<div class="sl-body">' + exercise.render(s.id, a) + '</div></div>';
    },

    radical(s) {
      const r = (LESSON.radicals || [])[s.index] || {};
      return '<div class="sl radical">' + head(esc(r.nameVi || ('Bộ ' + r.radical)), 'Bộ thủ') +
        '<div class="sl-body">' +
        '<div class="rad-left"><div class="rad-char">' + esc(r.radical) + '</div>' +
          '<div class="rad-py">' + esc(r.pinyin) + '</div></div>' +
        '<div class="rad-right">' +
          (r.meaning ? '<div class="rad-mean reveal" data-reveal="1">' + esc(r.meaning) + '</div>' : '') +
          (r.position ? '<div class="rad-pos">' + esc(r.position) + '</div>' : '') +
          ((r.related || []).length ? '<div class="rad-rel">Chữ liên quan: ' +
             r.related.map(c => '<b>' + esc(c) + '</b>').join(' · ') + '</div>' : '') +
          (r.explanation ? '<p class="reveal" data-reveal="2">' + esc(r.explanation) + '</p>' : '') +
        '</div></div></div>';
    }
  };

  /* ==========================================================================
     CỖ MÁY BÀI TẬP TƯƠNG TÁC (Phase 57)
     Sáu loại dùng chung một khuôn: dựng HTML từ trạng thái → bấm → chấm.
     Trạng thái để trong exState theo id slide, nên rời slide rồi quay lại
     vẫn còn nguyên bài đã làm; "Làm lại" mới xoá.
     Đáp án KHÔNG bao giờ nằm sẵn trong HTML trước khi học viên trả lời.
     ========================================================================== */
  const exState = {};

  const exercise = (function () {
    const norm = s => String(s == null ? '' : s)
      .replace(/[\s。，、！？；：,.!?;:"'“”‘’]/g, '').toLowerCase();
    /* xáo trộn ỔN ĐỊNH theo id slide: vẽ lại slide không đảo lại thứ tự */
    function shuffled(n, seed) {
      const a = Array.from({ length: n }, (_, i) => i);
      let h = 0; for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
      for (let i = n - 1; i > 0; i--) { h = (h * 1103515245 + 12345) >>> 0; const j = h % (i + 1);
        const t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    }
    /* hsk-plan.js là bản DUY NHẤT — trang này không nạp thư viện đọc Excel,
       nên tuyệt đối không được trông vào HSKParser ở đây */
    const pairsOf = a => window.HSKPlan.pairsOf(a, LESSON);

    const actions = (extra) =>
      '<div class="ex-actions">' + extra + '</div>';
    const feedback = (st) => {
      if (!st.done) return '<div class="ex-fb"></div>';
      return '<div class="ex-fb ' + (st.ok ? 'ok' : 'no') + '">' + st.msg + '</div>';
    };
    const explain = (a, st) => (st.done && a.explanation)
      ? '<p class="ex-exp">' + esc(a.explanation) + '</p>' : '';
    const question = a => a.question
      ? '<p class="pr-q">' + esc(a.question) + '</p>' : '';

    /* ---- 1. trắc nghiệm ---- */
    function mcq(id, a, st) {
      const opts = a.options || [];
      const cls = i => {
        if (!st.done) return st.pick === i ? 'pick' : '';
        if (i === a.answerIndex) return 'right';
        return st.pick === i ? 'wrong' : '';
      };
      return question(a) +
        '<ul class="ex-opts">' + opts.map((o, i) =>
          '<li><button class="ex-opt ' + cls(i) + '" data-ex="pick" data-i="' + i + '"' +
          (st.done ? ' disabled' : '') + '><span class="k">' + 'ABCD'[i] + '.</span>' +
          '<span class="tx">' + esc(o) + '</span></button></li>').join('') + '</ul>' +
        feedback(st) +
        actions(st.done ? '<button class="ex-btn" data-ex="retry">↻ Làm lại</button>' : '') +
        explain(a, st);
    }
    function mcqPick(id, a, st, i) {
      if (st.done) return;
      st.pick = i; st.done = true; st.ok = (i === a.answerIndex);
      st.msg = st.ok ? '✓ Chính xác!'
                     : '✗ Chưa đúng — đáp án là ' + 'ABCD'[a.answerIndex] + '. ' + (a.options[a.answerIndex] || '');
    }

    /* ---- 2. điền vào chỗ trống ---- */
    function fill(id, a, st) {
      const cls = st.done ? (st.ok ? 'right' : 'wrong') : '';
      return question(a) +
        '<div class="ex-row"><input class="ex-input ' + cls + '" data-ex="fill" ' +
          'value="' + esc(st.val || '') + '" placeholder="gõ câu trả lời…" ' +
          (st.done && st.ok ? 'readonly' : '') + ' autocomplete="off" spellcheck="false"></div>' +
        feedback(st) +
        actions('<button class="ex-btn main" data-ex="check">Kiểm tra</button>' +
                '<button class="ex-btn" data-ex="retry">↻ Làm lại</button>') +
        explain(a, st);
    }
    function fillCheck(id, a, st) {
      const answers = a.answers || [];
      st.done = true;
      st.ok = answers.some(x => norm(x) === norm(st.val));
      st.msg = st.ok ? '✓ Chính xác!' : '✗ Chưa đúng — đáp án: ' + answers.join(' / ');
    }

    /* ---- 3. sắp xếp câu ---- */
    function arrangeInit(id, a, st) {
      if (st.slot) return;
      st.slot = []; st.pool = shuffled((a.tokens || []).length, id);
    }
    function arrange(id, a, st) {
      arrangeInit(id, a, st);
      const tok = (k, from) => '<button class="ex-tok" draggable="true" data-ex="tok" data-from="' + from +
        '" data-k="' + k + '">' + esc((a.tokens || [])[k]) + '</button>';
      return question(a) +
        '<div class="ex-slot" data-ex="slot">' + st.slot.map(k => tok(k, 'slot')).join('') + '</div>' +
        '<div class="ex-pool" data-ex="pool">' + st.pool.map(k => tok(k, 'pool')).join('') + '</div>' +
        '<p class="ex-hint">Bấm vào thẻ để đưa lên ô trả lời, bấm thẻ đã chọn để trả lại — hoặc kéo thả.</p>' +
        feedback(st) +
        actions('<button class="ex-btn main" data-ex="check">Kiểm tra</button>' +
                '<button class="ex-btn" data-ex="retry">↻ Làm lại</button>') +
        explain(a, st);
    }
    function arrangeCheck(id, a, st) {
      const got = st.slot.map(k => (a.tokens || [])[k]).join('');
      st.done = true;
      st.ok = norm(got) === norm(a.answer);
      st.msg = st.ok ? '✓ Chính xác!' : '✗ Chưa đúng — câu đúng là: ' + a.answer;
    }

    /* ---- 4·5·6. nối cặp: nối từ · nhìn hình chọn từ · nối pinyin ---- */
    function pairInit(id, a, st) {
      if (st.links) return;
      st.links = {};                       /* trái → phải */
      st.order = shuffled(pairsOf(a).length, id + '·r');
    }
    function pairs(id, a, st) {
      const P = pairsOf(a);
      pairInit(id, a, st);
      const seq = Object.keys(st.links);   /* để đánh số cặp đã nối */
      const numOfL = l => seq.indexOf(String(l)) + 1;
      const rightOwner = r => { for (const l in st.links) if (st.links[l] === r) return +l; return -1; };

      const cellL = (p, i) => {
        const linked = st.links[i] != null;
        let cls = linked ? 'done' : '';
        if (st.done && linked) cls += st.links[i] === i ? ' right' : ' wrong';
        if (st.pickL === i) cls += ' pick';
        const badge = linked ? '<span class="ex-badge">' + numOfL(i) + '</span>' : '<span class="ex-badge">·</span>';
        const body = a.type === 'picture' && p.image
          ? '<img src="' + esc(p.image) + '" alt="">'
          : '<span>' + esc(p.left) + '</span>';
        return '<button class="ex-cell ' + (a.type === 'picture' ? 'pic ' : '') + cls +
               '" data-ex="pl" data-i="' + i + '">' + badge + body + '</button>';
      };
      const cellR = (ri) => {
        const owner = rightOwner(ri);
        let cls = owner >= 0 ? 'done' : '';
        if (st.done && owner >= 0) cls += owner === ri ? ' right' : ' wrong';
        if (st.pickR === ri) cls += ' pick';
        const badge = owner >= 0 ? '<span class="ex-badge">' + numOfL(owner) + '</span>' : '<span class="ex-badge">·</span>';
        return '<button class="ex-cell ' + cls + '" data-ex="pr" data-i="' + ri + '" draggable="true">' +
               badge + '<span>' + esc(P[ri].right) + '</span></button>';
      };
      return question(a) +
        '<div class="ex-match"><div class="ex-col">' + P.map(cellL).join('') + '</div>' +
        '<div class="ex-col">' + st.order.map(cellR).join('') + '</div></div>' +
        '<p class="ex-hint">Bấm một ô bên trái rồi bấm ô tương ứng bên phải — hoặc kéo ô phải sang ô trái. ' +
        'Bấm lại một ô đã nối để bỏ nối.</p>' +
        feedback(st) +
        actions('<button class="ex-btn" data-ex="retry">↻ Làm lại</button>') +
        explain(a, st);
    }
    function pairLink(id, a, st, l, r) {
      /* mỗi ô chỉ thuộc về một cặp */
      for (const k in st.links) if (st.links[k] === r) delete st.links[k];
      st.links[l] = r;
      st.pickL = null; st.pickR = null;
      const P = pairsOf(a);
      if (Object.keys(st.links).length === P.length) {
        let n = 0; for (const k in st.links) if (st.links[k] === +k) n++;
        st.done = true; st.ok = (n === P.length);
        st.msg = st.ok ? '✓ Chính xác cả ' + P.length + ' cặp!' : '✗ Đúng ' + n + '/' + P.length + ' cặp — ô đỏ là nối sai.';
      }
    }

    const RENDER = { mcq, fill, arrange, match: pairs, picture: pairs, pinyin: pairs };

    function render(id, a) {
      const st = exState[id] || (exState[id] = {});
      const fn = RENDER[a.type];
      if (!fn) return '<p class="ex-hint">Loại bài tập này chưa hỗ trợ.</p>';
      return fn(id, a, st);
    }
    function reset(id) { exState[id] = {}; }

    /* mọi cú bấm trong bài tập đi qua đây; trả về true nếu cần vẽ lại slide */
    function handle(ev, id, a) {
      const t = ev.target.closest('[data-ex]');
      if (!t) return false;
      const st = exState[id] || (exState[id] = {});
      const what = t.dataset.ex;

      if (what === 'retry') { exState[id] = {}; return true; }
      if (what === 'check') return check(id, a);
      if (what === 'pick')  { mcqPick(id, a, st, +t.dataset.i); return true; }
      if (what === 'fill')  { return false; }
      if (what === 'tok') {
        arrangeInit(id, a, st);
        const k = +t.dataset.k;
        if (t.dataset.from === 'pool') { st.pool = st.pool.filter(x => x !== k); st.slot.push(k); }
        else { st.slot = st.slot.filter(x => x !== k); st.pool.push(k); }
        st.done = false;
        return true;
      }
      if (what === 'pl' || what === 'pr') {
        pairInit(id, a, st);
        const i = +t.dataset.i;
        if (st.done) return false;
        if (what === 'pl') {
          if (st.links[i] != null) { delete st.links[i]; st.pickL = null; return true; }
          if (st.pickR != null) { pairLink(id, a, st, i, st.pickR); return true; }
          st.pickL = (st.pickL === i ? null : i); return true;
        }
        for (const k in st.links) if (st.links[k] === i) { delete st.links[k]; st.pickR = null; return true; }
        if (st.pickL != null) { pairLink(id, a, st, st.pickL, i); return true; }
        st.pickR = (st.pickR === i ? null : i); return true;
      }
      return false;
    }

    /* kéo thả: thẻ sắp xếp và ô nối bên phải */
    function dragStart(ev) {
      const t = ev.target.closest('[data-ex="tok"],[data-ex="pr"]');
      if (!t) return;
      DRAG = { kind: t.dataset.ex, k: +t.dataset.k, from: t.dataset.from, i: +t.dataset.i };
      try { ev.dataTransfer.setData('text/plain', 'hsk'); ev.dataTransfer.effectAllowed = 'move'; } catch (e) {}
      t.classList.add('drag');
    }
    function dragOver(ev) {
      if (!DRAG) return;
      const zone = ev.target.closest('[data-ex="slot"],[data-ex="pool"],[data-ex="pl"],[data-ex="tok"]');
      if (!zone) return;
      if (DRAG.kind === 'tok' && zone.dataset.ex === 'pl') return;
      if (DRAG.kind === 'pr' && zone.dataset.ex !== 'pl') return;
      ev.preventDefault();
      const slot = ev.target.closest('[data-ex="slot"]');
      if (slot) slot.classList.add('over');
    }
    function drop(ev, id, a) {
      if (!DRAG) return false;
      const d = DRAG; DRAG = null;
      const st = exState[id] || (exState[id] = {});
      if (d.kind === 'pr') {
        const cell = ev.target.closest('[data-ex="pl"]');
        if (!cell || st.done) return false;
        ev.preventDefault(); pairInit(id, a, st); pairLink(id, a, st, +cell.dataset.i, d.i); return true;
      }
      const zone = ev.target.closest('[data-ex="slot"],[data-ex="pool"],[data-ex="tok"]');
      if (!zone) return false;
      ev.preventDefault();
      arrangeInit(id, a, st);
      st.pool = st.pool.filter(x => x !== d.k); st.slot = st.slot.filter(x => x !== d.k);
      const onTok = zone.dataset.ex === 'tok' ? zone : null;
      if (zone.dataset.ex === 'pool' || (onTok && onTok.dataset.from === 'pool')) st.pool.push(d.k);
      else if (onTok) { const at = st.slot.indexOf(+onTok.dataset.k); st.slot.splice(at < 0 ? st.slot.length : at, 0, d.k); }
      else st.slot.push(d.k);
      st.done = false;
      return true;
    }
    let DRAG = null;

    /* chấm bài — dùng chung cho nút Kiểm tra và phím Enter */
    function check(id, a) {
      const st = exState[id] || (exState[id] = {});
      if (a.type === 'fill') { fillCheck(id, a, st); return true; }
      if (a.type === 'arrange') { arrangeInit(id, a, st); arrangeCheck(id, a, st); return true; }
      return false;
    }

    return { render, reset, handle, check, dragStart, dragOver, drop,
             get dragging() { return !!DRAG; }, clearDrag() { DRAG = null; } };
  })();

  /* bài tập của slide đang mở (null nếu slide này không phải bài tập) */
  function currentActivity() {
    const s = PLAN[IDX];
    if (!s || s.kind !== 'practice') return null;
    const bank = s.bank === 'grammar' ? LESSON.grammarPractice : LESSON.vocabPractice;
    return (bank || [])[s.index] || null;
  }

  /* ---------- vẽ slide ---------- */
  function render() {
    const s = PLAN[IDX];
    if (!s) return;
    /* dọn trước khi vẽ: đây là chỗ bản cũ rò rỉ */
    destroyWriters();
    const st = stage();
    st.innerHTML = (renderers[s.kind] || (() => '<div class="sl"></div>'))(s);

    revealStep = 0;
    revealTotal = Math.max(0, ...[...st.querySelectorAll('[data-reveal]')].map(e => +e.dataset.reveal || 0));
    applyReveal();
    bootWriters(st);

    if (s.kind === 'hub') {
      const sc = st.querySelector('#hubScroll');
      if (sc) { sc.scrollTop = hubScroll; sc.addEventListener('scroll', onHubScroll, { passive: true }); }
    }
    $('#counter').textContent = (IDX + 1) + ' / ' + PLAN.length;
    $('#btnHub').style.visibility = (s.kind === 'hub' || s.kind === 'intro') ? 'hidden' : 'visible';
    annotation.slideChanged(s.id);
  }
  /* vẽ lại phần thân bài tập mà KHÔNG đụng tới slide (giữ nguyên cuộn, nét vẽ) */
  function repaintExercise() {
    const s = PLAN[IDX], body = stage().querySelector('.sl.practice .sl-body');
    if (!s || !body) return;
    const top = body.scrollTop;
    body.innerHTML = exercise.render(s.id, currentActivity() || {});
    body.scrollTop = top;
  }
  function onHubScroll(e) { hubScroll = e.target.scrollTop; }

  function applyReveal() {
    stage().querySelectorAll('[data-reveal]').forEach(e =>
      e.classList.toggle('shown', (+e.dataset.reveal || 0) <= revealStep));
  }

  /* Bấm vào NỀN slide = hiện thêm một bước (yêu cầu 8).
     Mũi tên dưới chân = CHUYỂN SLIDE, không dùng để hiện nội dung (yêu cầu 10). */
  function nextReveal() {
    if (revealStep < revealTotal) { revealStep++; applyReveal(); return true; }
    return false;
  }
  function nextSlide() { if (IDX < PLAN.length - 1) { IDX++; render(); } }
  function prevSlide() { if (IDX > 0) { IDX--; render(); } }
  function next() { if (!nextReveal()) nextSlide(); }
  function prev() { if (revealStep > 0) { revealStep--; applyReveal(); } else prevSlide(); }
  function goToId(id) {
    const i = PLAN.findIndex(s => s.id === id);
    if (i >= 0) { IDX = i; render(); }
  }

  /* Những thứ bấm vào là để LÀM VIỆC KHÁC, không phải để hiện slide (yêu cầu 9) */
  const INTERACTIVE = 'button,a,input,textarea,select,label,summary,[contenteditable],[data-act],[data-ex],[data-noreveal]';
  function initStageClicks() {
    const st = stage();
    st.addEventListener('click', ev => {
      const s = PLAN[IDX];
      /* bài tập tự xử lý cú bấm của nó trước */
      if (s && s.kind === 'practice') {
        const a = currentActivity();
        if (a && exercise.handle(ev, s.id, a)) { repaintExercise(); return; }
      }
      if (ev.target.closest(INTERACTIVE)) return;
      /* vừa bôi đen chữ để giảng thì đừng nhảy bước */
      const sel = window.getSelection && window.getSelection();
      if (sel && String(sel).length) return;
      nextReveal();
    });
    st.addEventListener('keydown', ev => {
      if (ev.key !== 'Enter') return;
      const inp = ev.target.closest('[data-ex="fill"]');
      if (!inp) return;
      ev.preventDefault();
      const s = PLAN[IDX], a = currentActivity();
      if (!s || !a) return;
      (exState[s.id] || (exState[s.id] = {})).val = inp.value;
      if (exercise.check(s.id, a)) repaintExercise();
    });
    st.addEventListener('input', ev => {
      const inp = ev.target.closest('[data-ex="fill"]');
      if (!inp) return;
      const s = PLAN[IDX]; if (!s) return;
      (exState[s.id] || (exState[s.id] = {})).val = inp.value;
    });
    /* kéo thả cho bài sắp xếp và bài nối */
    st.addEventListener('dragstart', exercise.dragStart);
    st.addEventListener('dragover', exercise.dragOver);
    st.addEventListener('dragleave', ev => {
      const slot = ev.target.closest('[data-ex="slot"]'); if (slot) slot.classList.remove('over');
    });
    st.addEventListener('drop', ev => {
      const s = PLAN[IDX], a = currentActivity();
      if (s && a && exercise.drop(ev, s.id, a)) repaintExercise();
      else exercise.clearDrag();
    });
    st.addEventListener('dragend', () => {
      exercise.clearDrag();
      stage().querySelectorAll('.drag,.over').forEach(n => n.classList.remove('drag', 'over'));
    });
  }

  /* ---------- một trình bắt sự kiện duy nhất (không onclick nội tuyến) ---------- */
  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    if (act === 'say')      { ev.stopPropagation(); speak(t.dataset.text); }
    else if (act === 'goto')    goToId(t.dataset.id);
    else if (act === 'go-hub')  goToId('hub');
    else if (act === 'hz-replay-all') {
      const p = t.dataset.p;
      document.querySelectorAll('[id^="' + p + '-w"]').forEach(box =>
        mountWriter(box, box.dataset.char, Number(box.dataset.size) || 160));
    }
    else if (act === 'hz-tab') {
      const p = t.dataset.p, i = +t.dataset.i;
      document.querySelectorAll('[data-act="hz-tab"][data-p="' + CSS.escape(p) + '"]')
        .forEach(b => b.classList.toggle('on', b === t));
      let k = 0, box = null;
      while (document.getElementById(p + '-p' + k)) {
        const panel = document.getElementById(p + '-p' + k);
        panel.classList.toggle('hidden', k !== i);
        if (k === i) box = document.getElementById(p + '-w' + k);
        k++;
      }
      if (box) mountWriter(box, box.dataset.char, Number(box.dataset.size) || 160);
    }
    else if (act === 'hz-replay') {
      const box = document.getElementById(t.dataset.p + '-w' + t.dataset.i);
      if (box) mountWriter(box, box.dataset.char, Number(box.dataset.size) || 160);
    }
  });

  document.addEventListener('keydown', ev => {
    if (/^(INPUT|TEXTAREA)$/.test((ev.target || {}).tagName) || ev.target.isContentEditable) return;
    if (ev.key === 'ArrowRight' || ev.key === ' ' || ev.key === 'PageDown') { ev.preventDefault(); next(); }
    else if (ev.key === 'ArrowLeft' || ev.key === 'Backspace' || ev.key === 'PageUp') { ev.preventDefault(); prev(); }
    else if (ev.key === 'Home') goToId('hub');
    else if (ev.key === '+' || ev.key === '=') { ev.preventDefault(); bumpFs(2); }
    else if (ev.key === '-' || ev.key === '_') { ev.preventDefault(); bumpFs(-2); }
    else if (ev.key.toLowerCase() === 'f') toggleFull();
    else if (ev.key === 'Escape') annotation.setTool('select');
  });

  document.addEventListener('fullscreenchange', () => setTimeout(() => annotation.resize(), 60));

  function toggleFull() {
    const w = $('#wrap');
    if (!document.fullscreenElement) (w.requestFullscreen ? w.requestFullscreen() : null);
    else document.exitFullscreen();
  }

  /* ---------- bộ dụng cụ giảng dạy ---------- */
  const annotation = (function () {
    let cv, ctx, tool = 'select', color = '#e5484d', drawing = false;
    let start = null, strokes = {}, cur = null, slideId = '';
    const spot = () => $('#spotlight');

    function init() {
      cv = $('#annot'); ctx = cv.getContext('2d');
      resize();
      /* Sân khấu đổi cỡ vì nhiều lý do — đổi cỡ cửa sổ, vào/ra toàn màn hình,
         hàng nút cao lên. Nghe mỗi 'resize' của cửa sổ là hụt, nên theo dõi
         thẳng vùng slide. */
      if (window.ResizeObserver) new ResizeObserver(resize).observe($('#stageArea'));
      window.addEventListener('resize', resize);
      cv.addEventListener('pointerdown', down);
      cv.addEventListener('pointermove', move);
      cv.addEventListener('pointerup', up);
      cv.addEventListener('pointerleave', up);
    }
    function resize() {
      const r = $('#stageArea').getBoundingClientRect();
      cv.width = Math.round(r.width); cv.height = Math.round(r.height);
      redraw();
    }
    /* chỉ đo lại khi kích thước thật sự khác — gọi ở mỗi lần đổi slide */
    function fit() {
      const r = $('#stageArea').getBoundingClientRect();
      if (Math.round(r.width) !== cv.width || Math.round(r.height) !== cv.height) resize();
    }
    function setTool(t) {
      tool = t;
      document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
      /* con trỏ thường: canvas KHÔNG chặn click vào slide — lỗi hay gặp nhất */
      cv.style.pointerEvents = (t === 'select') ? 'none' : 'auto';
      cv.style.cursor = t === 'eraser' ? 'cell' : (t === 'select' ? 'default' : 'crosshair');
      spot().classList.toggle('hidden', t !== 'spotlight');
      if (t !== 'laser') hideLaser();
    }
    function setColor(c) { color = c;
      document.querySelectorAll('[data-color]').forEach(d => d.classList.toggle('on', d.dataset.color === c)); }
    /* Nét vẽ lưu theo TỈ LỆ 0–1 chứ không theo pixel: đổi cỡ màn hình hay
       bật toàn màn hình thì hình vẽ vẫn nằm đúng chỗ trên slide. */
    function pos(e) {
      const r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left) / (r.width || 1), y: (e.clientY - r.top) / (r.height || 1) };
    }
    const toPx = p => ({ x: p.x * cv.width, y: p.y * cv.height });

    function down(e) {
      const p = pos(e);
      if (tool === 'laser') { showLaser(p); return; }
      if (tool === 'spotlight') { moveSpot(p); return; }
      if (tool === 'text') { addText(p); return; }
      if (tool === 'eraser') { eraseAt(p); return; }
      if (['pen', 'highlighter', 'arrow', 'rect', 'circle'].indexOf(tool) < 0) return;
      drawing = true; start = p;
      cur = { tool, color, pts: [p] };
      cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
    }
    function move(e) {
      const p = pos(e);
      if (tool === 'laser') { showLaser(p); return; }
      if (tool === 'spotlight') { moveSpot(p); return; }
      if (!drawing) return;
      if (tool === 'pen' || tool === 'highlighter') cur.pts.push(p);
      else cur.pts = [start, p];
      redraw(); drawOne(cur);
    }
    function up() {
      if (!drawing) return;
      drawing = false;
      (strokes[slideId] = strokes[slideId] || []).push(cur);
      cur = null; redraw();
    }
    function drawOne(s) {
      ctx.save();
      ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.lineWidth = s.tool === 'highlighter' ? 16 : 3;
      ctx.globalAlpha = s.tool === 'highlighter' ? 0.35 : 1;
      const p = s.pts.map(toPx);
      if (s.tool === 'pen' || s.tool === 'highlighter') {
        ctx.beginPath(); p.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.stroke();
      } else if (p.length >= 2) {
        const a = p[0], b = p[1];
        if (s.tool === 'rect') ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
        else if (s.tool === 'circle') {
          ctx.beginPath();
          ctx.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, Math.abs(b.x - a.x) / 2, Math.abs(b.y - a.y) / 2, 0, 0, 7);
          ctx.stroke();
        } else if (s.tool === 'arrow') {
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          const ang = Math.atan2(b.y - a.y, b.x - a.x), h = 14;
          ctx.beginPath(); ctx.moveTo(b.x, b.y);
          ctx.lineTo(b.x - h * Math.cos(ang - 0.4), b.y - h * Math.sin(ang - 0.4));
          ctx.lineTo(b.x - h * Math.cos(ang + 0.4), b.y - h * Math.sin(ang + 0.4));
          ctx.closePath(); ctx.fill();
        }
      }
      ctx.restore();
    }
    function redraw() {
      if (!ctx) return;
      ctx.clearRect(0, 0, cv.width, cv.height);
      (strokes[slideId] || []).forEach(drawOne);
    }
    function eraseAt(p) {
      const list = strokes[slideId] || [];
      for (let i = list.length - 1; i >= 0; i--) {
        if (list[i].pts.some(q => Math.hypot((q.x - p.x) * cv.width, (q.y - p.y) * cv.height) < 18)) { list.splice(i, 1); break; }
      }
      redraw();
    }
    function undo() { (strokes[slideId] || []).pop(); redraw(); }
    function clear() { strokes[slideId] = []; redraw();
      document.querySelectorAll('.annot-text').forEach(n => n.remove()); }
    function addText(p) {
      const box = el('div', 'annot-text');
      box.contentEditable = 'true';
      box.style.left = (p.x * 100) + '%'; box.style.top = (p.y * 100) + '%'; box.style.color = color;
      box.dataset.slide = slideId;
      $('#stageArea').appendChild(box);
      setTimeout(() => box.focus(), 0);
    }
    let laserEl = null;
    function showLaser(p) {
      if (!laserEl) { laserEl = el('div', 'laser-dot'); $('#stageArea').appendChild(laserEl); }
      laserEl.style.left = (p.x * 100) + '%'; laserEl.style.top = (p.y * 100) + '%';
    }
    function hideLaser() { if (laserEl) { laserEl.remove(); laserEl = null; } }
    function moveSpot(p) { spot().style.setProperty('--x', (p.x * 100) + '%'); spot().style.setProperty('--y', (p.y * 100) + '%'); }

    function slideChanged(id) {
      slideId = id;
      fit();
      /* chú thích dạng hộp chữ chỉ thuộc về slide của nó */
      document.querySelectorAll('.annot-text').forEach(n => { n.hidden = n.dataset.slide !== id; });
      redraw();
    }
    return { init, setTool, setColor, undo, clear, slideChanged, redraw, resize, fit };
  })();

  /* ---------- bảng dụng cụ: nút cố định, bảng kéo được bằng thanh tiêu đề ---------- */
  function initToolkit() {
    const panel = $('#toolkit'), handle = $('#tkHandle');

    function closeToolkit() {
      panel.classList.add('hidden');
      /* Nét vẽ và hộp chữ GIỮ NGUYÊN — chỉ trả con trỏ về bình thường, nếu
         không thì đóng bảng xong canvas vẫn nuốt hết cú bấm vào slide. */
      annotation.setTool('select');
    }
    $('#btnToolkit').addEventListener('click', () => {
      if (panel.classList.contains('hidden')) panel.classList.remove('hidden');
      else closeToolkit();
    });
    panel.addEventListener('click', ev => {
      const b = ev.target.closest('[data-tool],[data-color],[data-tk]');
      if (!b) return;
      ev.stopPropagation();
      if (b.dataset.tool) annotation.setTool(b.dataset.tool);
      else if (b.dataset.color) annotation.setColor(b.dataset.color);
      else if (b.dataset.tk === 'undo') annotation.undo();
      else if (b.dataset.tk === 'clear') annotation.clear();
      else if (b.dataset.tk === 'close') closeToolkit();
    });

    /* Kéo bảng bằng thanh tiêu đề.
       LỖI CŨ: pointerdown bắt con trỏ (setPointerCapture) NGAY, mà khi con
       trỏ đang bị bắt thì trình duyệt gửi luôn cả sự kiện click về phần tử
       bắt — tức là về thanh tiêu đề, không phải nút ✕. Nút đóng vì thế
       không bao giờ nhận được click. Nay chỉ bắt con trỏ khi đã kéo quá
       3px, và bấm trúng nút thì không kéo. */
    let drag = null;
    handle.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      drag = { x: e.clientX, y: e.clientY, l: panel.offsetLeft, t: panel.offsetTop, on: false, id: e.pointerId };
    });
    handle.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.on) {
        if (Math.abs(dx) + Math.abs(dy) < 3) return;
        drag.on = true;
        try { handle.setPointerCapture(drag.id); } catch (err) {}
      }
      panel.style.left = (drag.l + dx) + 'px';
      panel.style.top = (drag.t + dy) + 'px';
      panel.style.right = 'auto'; panel.style.bottom = 'auto';
    });
    const endDrag = () => {
      if (drag && drag.on) { try { handle.releasePointerCapture(drag.id); } catch (err) {} }
      drag = null;
    };
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
  }

  /* ---------- khởi động ---------- */
  function mountLesson(lesson) {
    LESSON = lesson;
    PLAN = window.HSKPlan.buildSlidePlan(lesson);
    SECTIONS = window.HSKPlan.buildSections(lesson);
    IDX = 0; hubScroll = 0;
    document.title = (lesson.title || 'Bài giảng HSK') + ' · Learning Ecology';
    $('#lessonName').textContent = lesson.title || '';
    render();
  }

  window.HSKSlides = {
    mount: mountLesson,
    init() {
      annotation.init(); initToolkit(); initFs(); initStageClicks();
      /* mũi tên dưới chân CHỈ để chuyển slide (yêu cầu 10) — muốn hiện thêm
         nội dung trên slide hiện tại thì bấm vào nền slide */
      $('#btnPrev').addEventListener('click', prevSlide);
      $('#btnNext').addEventListener('click', nextSlide);
      $('#btnHub').addEventListener('click', () => goToId('hub'));
      $('#btnFull').addEventListener('click', toggleFull);
      $('#btnFsUp').addEventListener('click', () => bumpFs(2));
      $('#btnFsDown').addEventListener('click', () => bumpFs(-2));
    },
    goToId, next, prev
  };
})();


/* ==========================================================================
   LỚP NỀN TẢNG — nhận diện người dùng, lấy bài từ cơ sở dữ liệu
   ========================================================================== */
(function () {
  const DB = (typeof sb !== 'undefined' && sb) ? sb : (window.sb || null);
  let LESSONS = [], GUEST = true, STAFF = false, PREMIUM = false, USER = null;
  const ENT = new Set();
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const pick = () => document.getElementById('pickScreen');
  const wrap = () => document.getElementById('wrap');

  function showPick() { pick().hidden = false; wrap().hidden = true; }
  function showStage() { pick().hidden = true; wrap().hidden = false; }

  function canOpen(l) { return !l.premium || STAFF || PREMIUM || ENT.has(l.lesson_id); }

  function renderPick() {
    const box = document.getElementById('lessonPick');
    if (!LESSONS.length) {
      box.innerHTML = '<div class="empty">Chưa có bài giảng nào được đăng. ' +
        (STAFF ? 'Vào <b>Bảng điều khiển → HSK Slides</b> để tải bài lên.' : 'Vui lòng quay lại sau.') + '</div>';
      return;
    }
    const byLevel = {};
    LESSONS.forEach(l => { (byLevel[l.hsk_level] = byLevel[l.hsk_level] || []).push(l); });
    box.innerHTML = Object.keys(byLevel).sort((a, b) => a - b).map(lv =>
      '<section class="lv"><h3>HSK ' + esc(lv) + '</h3><div class="lv-grid">' +
      byLevel[lv].map(l => {
        const open = canOpen(l);
        return '<button class="lesson-card' + (open ? '' : ' locked') + '" data-lesson="' + esc(l.lesson_id) + '">' +
          '<span class="tag ' + (l.premium ? 'prem' : 'free') + '">' + (l.premium ? '👑 Premium' : 'Miễn phí') + '</span>' +
          '<span class="lc-no">' + esc(l.lesson_no || '') + '</span>' +
          '<h4>' + esc(l.title) + '</h4>' +
          (l.subtitle ? '<p>' + esc(l.subtitle) + '</p>' : '') +
          '<span class="lc-meta">📚 ' + (l.vocab_count || 0) + ' từ · 🖼 ' + (l.slide_count || 0) + ' slide</span>' +
          '<span class="lc-go">' + (open ? 'Mở bài giảng →' : 'Cần mở khoá →') + '</span></button>';
      }).join('') + '</div></section>').join('');
  }

  async function openLesson(id) {
    const meta = LESSONS.find(l => l.lesson_id === id);
    if (!meta) return;
    if (!canOpen(meta)) {
      if (window.Premium) Premium.open({ section: 'reading', reason: 'Bài giảng này dành cho học viên Premium.' });
      else alert('Bài giảng này cần quyền Premium.');
      return;
    }
    let data = null;
    try {
      const { data: row } = await DB.from('hsk_lessons').select('data').eq('lesson_id', id).maybeSingle();
      data = row && row.data;
    } catch (e) {}
    if (!data) { alert('Không mở được bài giảng — kiểm tra kết nối.'); return; }
    showStage();
    window.HSKSlides.mount(data);
  }

  document.addEventListener('click', e => {
    const c = e.target.closest('.lesson-card');
    if (c) openLesson(c.dataset.lesson);
    const b = e.target.closest('#btnLessons');
    if (b) showPick();
  });

  async function boot() {
    window.HSKSlides.init();
    const who = document.getElementById('leWho'), auth = document.getElementById('leAuth'),
          back = document.getElementById('leBack');
    let session = null;
    try { session = DB ? (await DB.auth.getSession()).data.session : null; } catch (e) {}
    if (session) {
      GUEST = false; USER = session.user;
      try {
        const { data: p } = await DB.from('profiles').select('full_name,role,is_premium').eq('id', USER.id).maybeSingle();
        if (p) { STAFF = ['owner', 'admin', 'teacher'].indexOf(p.role) >= 0; PREMIUM = !!p.is_premium;
                 if (who) who.textContent = p.full_name || USER.email || ''; }
      } catch (e) {}
      if (auth) auth.hidden = true;
    } else {
      if (who) who.textContent = 'Khách';
      if (auth) auth.hidden = false;
      if (back) { back.textContent = '← Xem khóa học'; back.href = 'course.html'; }
    }
    try {
      const { data } = await DB.rpc('public_hsk_lessons', { p_level: null });
      LESSONS = Array.isArray(data) ? data : [];
    } catch (e) { LESSONS = []; }
    if (!GUEST) {
      try {
        const { data: en } = await DB.from('enrollments').select('course_id').eq('student_id', USER.id);
        const mine = new Set((en || []).map(x => x.course_id));
        LESSONS.forEach(l => { if (l.course_id && mine.has(l.course_id)) ENT.add(l.lesson_id); });
      } catch (e) {}
    }
    renderPick();
    const want = new URLSearchParams(location.search).get('lesson') || '';
    if (want && LESSONS.some(l => l.lesson_id === want)) await openLesson(want);
    else showPick();
  }
  boot();
})();

</script>
