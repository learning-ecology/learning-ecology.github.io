<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://lqeetnlfqmarlqmbxusn.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <title>Đăng ký — Learning Ecology</title>
  <meta name="description" content="Tạo tài khoản học viên Learning Ecology bằng Google — lớp học trực tuyến tiếng Anh và tiếng Trung của thầy Lê Quốc Thông." />
  <meta name="robots" content="noindex, follow" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    try { var __t = localStorage.getItem("hub_theme");
      if (__t === "dark" || (!__t && matchMedia("(prefers-color-scheme: dark)").matches))
        document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#17263e" />
  <link rel="icon" type="image/png" href="icons/logo-64.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
</head>
<body>
  <main class="login-wrap">
    <div style="width:100%; max-width:380px;">
      <div style="text-align:center; margin-bottom:1.1rem;">
        <a href="index.html"><img src="icons/logo-64.png" alt="Learning Ecology" width="60" height="60"
             style="border-radius:14px; box-shadow:0 10px 26px -10px rgba(0,0,0,0.55);" /></a>
        <div style="color:#fff; font-family:var(--serif); font-size:1.35rem; font-weight:700; margin-top:0.55rem; text-shadow:0 2px 8px rgba(0,0,0,0.35);">Learning Ecology</div>
      </div>

      <div class="login-card">
        <!-- form -->
        <div id="su-form">
          <h1 data-i18n="signup_title">Create your account</h1>

          <!-- Đăng ký / Đăng nhập với Google (Supabase OAuth) -->
          <p class="g-instruct" id="g-instruct">Bạn có thể đăng ký hoặc đăng nhập bằng cách chọn <b>Đăng nhập với Google</b>.</p>
          <button id="google-btn" type="button" class="g-btn">
            <span class="g-ic" aria-hidden="true"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span>
            <span data-i18n="g_btn">Đăng nhập với Google</span>
          </button>
          <p id="msg" class="msg"></p>

          <p data-i18n="signup_sub" style="color:var(--muted); margin:1.2rem 0 0; font-size:0.82rem; line-height:1.5;">
            Google is the only way to create an account — quick and secure.
          </p>

          <p style="text-align:center; margin:1.1rem 0 0; border-top:1px solid var(--line); padding-top:0.9rem; font-size:0.85rem;">
            <span data-i18n="su_have" style="color:var(--muted);">Already have an account?</span>
            <a href="login.html" id="to-login" data-i18n="su_signin">Sign in</a>
          </p>
        </div>

        <p style="text-align:center; margin:1.1rem 0 0; border-top:1px solid var(--line); padding-top:0.9rem;">
          <a href="#" id="lang-toggle" style="font-size:0.85rem; color:var(--muted);"></a>
        </p>
      </div>

      <p style="text-align:center; margin-top:1rem;">
        <a href="index.html" style="color:rgba(255,255,255,0.85); font-size:0.85rem;">← Learning Ecology</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lang.js"></script>
  <script src="config.js"></script>
  <script src="google-auth.js"></script>
  <script>
    applyI18n();
    const langLink = document.getElementById("lang-toggle");
    langLink.textContent = t("lang_name");
    langLink.addEventListener("click", (e) => { e.preventDefault(); setLang(otherLang()); });

    const $ = id => document.getElementById(id);
    const msg = $("msg");
    (function(){ const gi = $("g-instruct"); if (gi) gi.innerHTML = t("g_instruct"); })();

    /* Giữ điểm đến (?next= hoặc trang trước) để sau khi đăng nhập quay lại
       đúng chỗ. Chỉ nhận đường dẫn nội bộ, không phải login/signup/reset. */
    function safeNext(u){
      if (!u) return null;
      try { const url = new URL(u, location.href);
        if (url.origin !== location.origin) return null;
        const page = url.pathname.split("/").pop().toLowerCase();
        if (/^(login|signup|reset)\.html$/.test(page)) return null;
        return url.pathname + url.search + url.hash;
      } catch (e) { return null; }
    }
    const NEXT = safeNext(new URLSearchParams(location.search).get("next")) || safeNext(document.referrer);
    const goNext = () => { location.href = NEXT || "dashboard.html"; };

    // Wire "Đăng nhập với Google" (Supabase OAuth) — dùng cho cả đăng ký & đăng nhập.
    GoogleAuth.wireButton($("google-btn"), msg, NEXT);

    // Returned from Google? finish (create/link happens server-side, fill profile,
    // one-device rule) then go to the destination. Otherwise: already signed in → go.
    if (GoogleAuth.pendingReturn()) {
      GoogleAuth.completeReturn(msg).then((session) => { if (session) goNext(); });
    } else {
      sb.auth.getSession().then(({ data }) => { if (data.session) goNext(); });
    }

    // Account creation is Google-only. Keep the destination when the visitor
    // instead heads to sign-in for an EXISTING account.
    (function(){ const a = $("to-login"); if (a && NEXT) a.href = "login.html?next=" + encodeURIComponent(NEXT); })();
  </script>
  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:")
      navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
