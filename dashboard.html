        <div class="card">
          <h2>Posted announcements</h2>
          ${(anns || []).length ? (anns || []).map(a => `
            <div class="lesson">
              <span class="icon">📣</span>
              <div class="meta">
                <div class="title" style="font-weight:500;">${esc(stripHtml(a.body).slice(0, 140) || "🖼 (image)")}</div>
                <span class="kind">${a.course_id
                  ? esc((courses || []).find(c => c.id === a.course_id)?.title || "?")
                  : "All students"} · ${new Date(a.created_at).toLocaleDateString()}</span>
              </div>
              <button class="ghost a-del" data-id="${a.id}"
                      style="color:var(--danger); border-color:var(--danger);">Delete</button>
            </div>`).join("") : `<p class="empty">Nothing posted yet.</p>`}
        </div>
        </div>`;

      // ---- rich text editor wiring ----
      const rte = document.getElementById("a-body");
      let savedRange = null;
      const saveSel = () => {
        const s = window.getSelection();
        if (s.rangeCount && rte.contains(s.anchorNode)) savedRange = s.getRangeAt(0);
      };
      const restoreSel = () => {
        if (!savedRange) return;
        const s = window.getSelection();
        s.removeAllRanges(); s.addRange(savedRange);
      };
      rte.addEventListener("keyup", saveSel);
      rte.addEventListener("mouseup", saveSel);
      try { document.execCommand("styleWithCSS", false, true); } catch (e) {}
      const exec = (cmd, val) => {
        rte.focus(); restoreSel();
        document.execCommand(cmd, false, val ?? null);
        saveSel();
      };

      document.querySelectorAll("#rte-bar button[data-cmd]").forEach(b => {
        b.addEventListener("mousedown", e => e.preventDefault());
        b.addEventListener("click", () => exec(b.getAttribute("data-cmd")));
      });
      document.getElementById("rte-block").addEventListener("change", e => {
        if (e.target.value) { exec("formatBlock", e.target.value); e.target.value = ""; }
      });
      document.getElementById("rte-size").addEventListener("change", e => {
        if (e.target.value) { exec("fontSize", e.target.value); e.target.value = ""; }
      });
      document.getElementById("rte-fore").addEventListener("input", e => exec("foreColor", e.target.value));
      document.getElementById("rte-back").addEventListener("input", e => exec("hiliteColor", e.target.value));
      document.getElementById("rte-link").addEventListener("click", () => {
        const url = prompt("Link URL:", "https://");
        if (url && url !== "https://") exec("createLink", url);
      });

      // image upload → announcements bucket → insert at cursor
      const rteFile = document.getElementById("rte-file");
      document.getElementById("rte-img").addEventListener("click", () => rteFile.click());
      rteFile.addEventListener("change", async e => {
        const f = e.target.files[0]; rteFile.value = "";
        if (!f) return;
        if (f.size > 3 * 1024 * 1024) { alert("Images must be under 3 MB."); return; }
        const path = Date.now() + "-" + f.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const { error } = await sb.storage.from("announcements")
          .upload(path, f, { contentType: f.type });
        if (error) { alert("Upload failed: " + error.message); return; }
        const { data } = sb.storage.from("announcements").getPublicUrl(path);
        exec("insertImage", data.publicUrl);
      });

      // click an image to select it → resize / align / alt / remove
      let selImg = null;
      const imgTools = document.getElementById("img-tools");
      rte.addEventListener("click", e => {
        rte.querySelectorAll("img.sel").forEach(i => i.classList.remove("sel"));
        if (e.target.tagName === "IMG") {
          selImg = e.target;
          selImg.classList.add("sel");
          imgTools.style.display = "flex";
        } else { selImg = null; imgTools.style.display = "none"; }
      });
      imgTools.querySelectorAll("[data-w]").forEach(b => b.addEventListener("click", () => {
        if (selImg) { selImg.style.width = b.getAttribute("data-w") + "%"; selImg.style.height = "auto"; }
      }));
      imgTools.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => {
        if (!selImg) return;
        const a = b.getAttribute("data-a");
        selImg.style.float = ""; selImg.style.display = ""; selImg.style.margin = "";
        if (a === "left")   { selImg.style.float = "left";  selImg.style.margin = "0 1rem 0.5rem 0"; }
        if (a === "right")  { selImg.style.float = "right"; selImg.style.margin = "0 0 0.5rem 1rem"; }
        if (a === "center") { selImg.style.display = "block"; selImg.style.margin = "0.5rem auto"; }
      }));
      document.getElementById("img-alt").addEventListener("click", () => {
        if (!selImg) return;
        const alt = prompt("Describe this image (alt text):", selImg.alt || "");
        if (alt !== null) selImg.alt = alt;
      });
      document.getElementById("img-del").addEventListener("click", () => {
        if (selImg) { selImg.remove(); selImg = null; imgTools.style.display = "none"; }
      });

      // preview toggle
      const prevBox = document.getElementById("rte-prevbox");
      document.getElementById("rte-preview").addEventListener("click", () => {
        if (prevBox.style.display !== "none") { prevBox.style.display = "none"; return; }
        rte.querySelectorAll("img.sel").forEach(i => i.classList.remove("sel"));
        document.getElementById("rte-prevbody").innerHTML = rte.innerHTML;
        prevBox.style.display = "block";
      });

      document.getElementById("a-add").addEventListener("click", async () => {
        rte.querySelectorAll("img.sel").forEach(i => i.classList.remove("sel"));
        const body = rte.innerHTML.trim();
        const course_id = document.getElementById("a-course").value || null;
        const m = document.getElementById("a-msg");
        if (!stripHtml(body).trim() && !/<img/i.test(body)) {
          m.textContent = "Write a message first."; m.className = "msg err"; return;
        }
        const { error } = await sb.from("announcements").insert({ body, course_id, author_id: user.id });
        if (error) { m.textContent = "Could not post: " + error.message; m.className = "msg err"; return; }
        renderAdmin();
      });

      app.querySelectorAll(".a-del").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Delete this announcement?")) return;
          btn.disabled = true;
          const { error } = await sb.from("announcements").delete().eq("id", btn.getAttribute("data-id"));
          if (error) { btn.disabled = false; alert("Could not delete: " + error.message); return; }
          renderAdmin();
        });
      });

      // ---- share keys ----
      document.getElementById("sk-add").addEventListener("click", async () => {
        const label = document.getElementById("sk-label").value.trim();
        const course_id = document.getElementById("sk-course").value;
        const expires = document.getElementById("sk-exp").value || null;
        const m = document.getElementById("sk-msg");
        if (!label) { m.textContent = "Name the buyer so you can identify this key later."; m.className = "msg err"; return; }
        if (!course_id) { m.textContent = "Pick the course this key unlocks."; m.className = "msg err"; return; }
        const token = crypto.randomUUID().replace(/-/g, "");
        const { error } = await sb.from("share_keys").insert({ token, label, course_id, expires });
        if (error) { m.textContent = "Could not create: " + error.message; m.className = "msg err"; return; }
        renderAdmin();
      });

      app.querySelectorAll(".sk-toggle").forEach(btn => btn.addEventListener("click", async () => {
        const k = (skeys || []).find(x => x.id === btn.getAttribute("data-id"));
        if (k.active && !confirm("Revoke this key? All links using it stop working immediately.")) return;
        const { error } = await sb.from("share_keys").update({ active: !k.active }).eq("id", k.id);
        if (error) { alert("Could not update: " + error.message); return; }
        renderAdmin();
      }));

      app.querySelectorAll(".sk-del").forEach(btn => btn.addEventListener("click", async () => {
        if (!confirm("Delete this key permanently? Its links stop working and its usage history is lost.")) return;
        const { error } = await sb.from("share_keys").delete().eq("id", btn.getAttribute("data-id"));
        if (error) { alert("Could not delete: " + error.message); return; }
        renderAdmin();
      }));

      app.querySelectorAll(".sk-links").forEach(btn => btn.addEventListener("click", () => {
        const k = (skeys || []).find(x => x.id === btn.getAttribute("data-id"));
        const ls = (lessons || []).filter(l => l.course_id === k.course_id && l.url && !l.storage_path);
        const out = document.getElementById("sk-out");
        const links = ls.map(l =>
          l.title + "\n" + l.url + (l.url.includes("?") ? "&" : "?") + "lms=" + l.id + "&key=" + k.token);
        out.value = "Share links for: " + k.label + " (" + (courseName(k.course_id) || "") + ")\n" +
          (k.expires ? "Valid until " + k.expires : "No expiry") + "\n" +
          "Note: only linked HTML lessons can be shared this way (uploaded files are excluded).\n\n" +
          (links.join("\n\n") || "This course has no linked lessons yet.");
        out.style.display = "block";
        out.focus(); out.select();
        try { navigator.clipboard.writeText(out.value); } catch (e) {}
      }));


      // ================= LỚP HỌC — TOÀN HỆ THỐNG (Phase 29) =================
      // Chủ sở hữu xem lớp của MỌI trung tâm (chỉ đọc). Việc tạo/sửa lớp do
      // quản trị viên từng trung tâm làm trong admin.html — chủ sở hữu vẫn có
      // toàn quyền ở tầng cơ sở dữ liệu (policy "classes owner manage") nếu cần
      // can thiệp trực tiếp bằng SQL.
      (function () {
        let done = false;
        window.__ocInit = async function () {
          const box = document.getElementById("oc-root");
          if (!box || done) return;
          box.innerHTML = `<p class="empty">Đang tải…</p>`;
          const [cl, cs, orgs, crs, pe] = await Promise.all([
            sb.from("classes").select("*").order("created_at"),
            sb.from("class_students").select("class_id, student_id"),
            sb.from("organizations").select("id, name"),
            sb.from("courses").select("id, title"),
            sb.from("profiles").select("id, full_name, email").in("role", ["teacher", "admin"])
          ]);
          if (cl.error) {
            box.innerHTML = `<div class="card"><p class="empty">Chưa chạy <b>migration39_classes.sql</b>.
              Chạy migration đó trong SQL Editor rồi mở lại tab này.</p></div>`;
            return;
          }
          done = true;
          const classes = cl.data || [], mem = cs.data || [];
          if (!classes.length) {
            box.innerHTML = `<div class="card"><p class="empty">Chưa có trung tâm nào tạo lớp.</p></div>`;
            return;
          }
          const oName = id => ((orgs.data || []).find(o => o.id === id) || {}).name || "(không thuộc trung tâm)";
          const cTitle = id => ((crs.data || []).find(c => c.id === id) || {}).title || "—";
          const tName = id => {
            const p = (pe.data || []).find(x => x.id === id);
            return p ? (p.full_name || p.email) : "chưa phân công";
          };
          const nOf = id => mem.filter(m => m.class_id === id).length;
          const ST = { upcoming: "Sắp mở", active: "Đang học",
                       completed: "Kết thúc", archived: "Lưu trữ" };
          const PILL = { upcoming: "todo", active: "done", completed: "off", archived: "bad" };

          const byOrg = {};
          classes.forEach(c => { (byOrg[c.org_id] = byOrg[c.org_id] || []).push(c); });

          box.innerHTML = `
            <div class="card">
              <div class="card-head"><h2>🏫 Lớp học theo trung tâm</h2>
                <button class="ghost" id="oc-csv">Tải CSV</button></div>
              <div class="stat-grid">
                <div class="stat"><div class="k">Trung tâm</div><div class="v">${Object.keys(byOrg).length}</div></div>
                <div class="stat"><div class="k">Tổng số lớp</div><div class="v">${classes.length}</div></div>
                <div class="stat"><div class="k">Đang học</div><div class="v">${classes.filter(c => c.status === "active").length}</div></div>
                <div class="stat"><div class="k">Lượt học viên</div><div class="v">${mem.length}</div></div>
              </div>
            </div>
            ${Object.entries(byOrg).map(([oid, list]) => `
              <div class="card">
                <div class="card-head"><h2>${esc(oName(oid))}</h2>
                  <span class="pill">${list.length} lớp</span></div>
                <table class="stackable">
                  <thead><tr><th>Lớp</th><th>Khóa</th><th>Giáo viên</th>
                    <th>Học viên</th><th>Lịch</th><th>Trạng thái</th></tr></thead>
                  <tbody>${list.map(c => `
                    <tr>
                      <td data-th="Lớp">${esc(c.name)}</td>
                      <td data-th="Khóa">${esc(cTitle(c.course_id))}</td>
                      <td data-th="Giáo viên">${esc(tName(c.teacher_id))}</td>
                      <td data-th="Học viên">${nOf(c.id)}${c.max_students != null ? " / " + c.max_students : ""}</td>
                      <td data-th="Lịch">${esc(c.schedule || "—")}</td>
                      <td data-th="Trạng thái"><span class="pill ${PILL[c.status] || ""}">${ST[c.status] || ""}</span></td>
                    </tr>`).join("")}</tbody>
                </table>
              </div>`).join("")}`;

          document.getElementById("oc-csv").addEventListener("click", () => {
            const rows = [["Trung tâm", "Lớp", "Khóa", "Giáo viên", "Học viên", "Sĩ số tối đa",
                           "Lịch", "Bắt đầu", "Kết thúc", "Trạng thái"]];
            classes.forEach(c => rows.push([oName(c.org_id), c.name, cTitle(c.course_id),
              tName(c.teacher_id), nOf(c.id), c.max_students == null ? "" : c.max_students,
              c.schedule || "", c.starts_on || "", c.ends_on || "", ST[c.status] || ""]));
            const body = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob(["﻿" + body], { type: "text/csv;charset=utf-8" }));
            a.download = "lop-hoc.csv"; a.click(); URL.revokeObjectURL(a.href);
          });
        };
      })();
      // =============== HẾT LỚP HỌC TOÀN HỆ THỐNG ===============

      /* ================= KẾT QUẢ BÀI THI (Phase 36) =================
         Đọc bảng test_attempts (RLS đã giới hạn theo quyền). Mỗi lần học viên
         nộp là MỘT dòng — giữ toàn bộ lịch sử. Chấm điểm ở máy chủ, nên bảng
         này chỉ hiển thị, không chứa đáp án nào lộ ra trước khi nộp. */
      (function () {
        const root = document.getElementById("tests-root");
        if (!root) return;

        if (!document.getElementById("tq-css")) {
          const st = document.createElement("style"); st.id = "tq-css";
          st.textContent = `
            .tq-ov{position:fixed;inset:0;background:rgba(15,23,37,.55);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:2rem 1rem;overflow:auto;}
            .tq-modal{background:var(--card);border-radius:16px;max-width:680px;width:100%;padding:1.2rem;box-shadow:var(--shadow-pop);}
            .tq-legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:.2rem 0 .7rem;}
            .tq-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;}
            .tq-q{border:1px solid var(--line);border-left-width:5px;border-radius:9px;padding:.5rem .7rem;margin-bottom:.4rem;font-size:.92rem;}
            .tq-q .n{font-weight:800;margin-right:.5rem;}
            .tq-q.ok{border-left-color:var(--success);background:var(--success-bg);}
            .tq-q.bad{border-left-color:var(--danger);background:rgba(164,68,47,.08);}
            .tq-q.none{border-left-color:#94a3b8;background:rgba(90,101,119,.07);}
            .tq-chip{font-weight:800;padding:.03rem .45rem;border-radius:6px;border:1px solid var(--line);background:var(--card);}
            .tq-q.ok .tq-chip.stu{background:var(--success);color:#fff;border-color:var(--success);}
            .tq-q.bad .tq-chip.stu{background:var(--danger);color:#fff;border-color:var(--danger);}
            .tq-chip.cor{background:var(--success-bg);color:var(--success);border-color:transparent;}
            .tq-q .expl{display:block;color:var(--muted);font-size:.84rem;margin-top:.25rem;}`;
          document.head.appendChild(st);
        }

        let loaded = false, failed = false, A = [], NM = {}, q = "";
        const openHist = {};   // groupKey → expanded?

        const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d");
        const neOf = id => NM[id] || "—";
        const pct = a => a.max_score ? Math.round(a.score / a.max_score * 100) : 0;
        const fmtDT = s => { if (!s) return "—"; try { return new Date(s).toLocaleString("vi-VN", { dateStyle: "short", timeStyle: "short" }); } catch (e) { return String(s); } };
        const fmtDur = sec => { if (sec == null) return "—"; const m = Math.floor(sec / 60), s = Math.round(sec % 60); return m + "′" + String(s).padStart(2, "0") + "″"; };

        // Some tests (e.g. the CEFR placement test) attach a computed summary
        // (meta). Show the level + per-skill breakdown, all values escaped.
        function cefrBadge(meta) {
          if (!meta || meta.kind !== "cefr") return "";
          return `<span class="pill done" style="background:var(--info-bg);color:var(--accent-ink);">CEFR ${esc(meta.level_label || meta.level || "?")}</span>`;
        }
        function cefrBlock(meta) {
          if (!meta || meta.kind !== "cefr") return "";
          const areaVI = { Grammar: "Ngữ pháp", Vocabulary: "Từ vựng", Reading: "Đọc hiểu", Everyday: "Giao tiếp" };
          const barC = p => p >= 70 ? "var(--success)" : p >= 45 ? "var(--gold)" : "var(--danger)";
          const bar = (label, c, n, p) => `
            <div style="display:flex;align-items:center;gap:.5rem;margin:.2rem 0;">
              <span style="flex:none;width:96px;font-size:.82rem;font-weight:600;">${esc(label)}</span>
              <span style="flex:1;height:9px;background:var(--line);border-radius:6px;overflow:hidden;">
                <span style="display:block;height:100%;width:${Math.max(0, Math.min(100, +p || 0))}%;background:${barC(+p || 0)};"></span></span>
              <span style="flex:none;width:60px;text-align:right;font-size:.78rem;color:var(--muted);">${(+c || 0)}/${(+n || 0)}·${(+p || 0)}%</span>
            </div>`;
          const areas = (meta.areas || []).map(a => bar(areaVI[a.area] || a.area, a.c, a.n, a.pct)).join("");
          const levels = (meta.levels || []).map(l => bar(l.lvl, l.c, l.n, l.pct)).join("");
          return `
            <div style="background:linear-gradient(135deg,var(--info-bg),rgba(183,130,63,.08));border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;margin:.2rem 0 .8rem;">
              <div style="display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;">
                <span style="font-size:1.5rem;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-ink));padding:.05em .5em;border-radius:10px;">${esc(meta.level_label || meta.level || "?")}</span>
                <div><b>${esc(meta.level_name || "")}</b><div class="kind" style="text-transform:none;letter-spacing:0;">Trình độ ước lượng${meta.pct != null ? " · " + esc(String(meta.pct)) + "%" : ""}</div></div>
              </div>
              ${meta.desc ? `<p style="margin:.5rem 0 .2rem;color:var(--muted);font-size:.86rem;">${esc(meta.desc)}</p>` : ""}
              ${areas ? `<div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:.5rem 0 .1rem;">Theo kỹ năng</div>${areas}` : ""}
              ${levels ? `<div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:.5rem 0 .1rem;">Theo CEFR</div>${levels}` : ""}
              ${meta.next ? `<p style="margin:.5rem 0 0;font-size:.86rem;"><b>👉 Gợi ý:</b> ${esc(meta.next)}</p>` : ""}
            </div>`;
        }

        async function load() {
          const a = await sb.from("test_attempts").select("*").order("submitted_at", { ascending: false });
          if (a.error) { failed = true; return; }
          A = a.data || [];
          const ids = [...new Set(A.map(x => x.student_id))];
          if (ids.length) {
            const p = await sb.from("profiles").select("id, full_name, email").in("id", ids);
            (p.data || []).forEach(r => { NM[r.id] = r.full_name || r.email; });
          }
          loaded = true;
        }

        // group by student + test; keep every attempt
        function groups() {
          const g = {};
          A.forEach(a => {
            const k = a.student_id + "|" + a.test_key;
            (g[k] = g[k] || { key: k, sid: a.student_id, test: a.test_name, list: [] }).list.push(a);
          });
          return Object.values(g).map(grp => {
            grp.list.sort((x, y) => (y.submitted_at || "").localeCompare(x.submitted_at || ""));
            grp.latest = grp.list[0];
            grp.first = grp.list.reduce((a, b) => (a.attempt_no <= b.attempt_no ? a : b));
            grp.best = grp.list.reduce((a, b) => (b.score > a.score ? b : a));
            return grp;
          }).filter(grp => !q || norm(neOf(grp.sid)).includes(norm(q)) || norm(grp.test).includes(norm(q)))
            .sort((a, b) => (b.latest.submitted_at || "").localeCompare(a.latest.submitted_at || ""));
        }

        const statusPill = a => a.unanswered === 0
          ? '<span class="pill done">Hoàn thành</span>'
          : `<span class="pill todo">Nộp thiếu ${a.unanswered}</span>`;

        function attemptRow(a, grp) {
          const tags = [];
          if (a.id === grp.latest.id) tags.push('<span class="pill">mới nhất</span>');
          if (a.id === grp.best.id) tags.push('<span class="pill done">điểm cao nhất</span>');
          if (a.id === grp.first.id) tags.push('<span class="pill off">lần đầu</span>');
          return `
            <tr>
              <td data-th="Lần">#${a.attempt_no} ${tags.join(" ")}</td>
              <td data-th="Điểm"><b>${a.score}/${a.max_score}</b> · ${pct(a)}%</td>
              <td data-th="Đúng/Sai/Trống">${a.correct} / ${a.incorrect} / ${a.unanswered}</td>
              <td data-th="Thời gian">${fmtDur(a.seconds_spent)}</td>
              <td data-th="Nộp lúc">${fmtDT(a.submitted_at)}</td>
              <td>
                <button class="ghost" data-act="view" data-id="${a.id}">Xem chi tiết</button>
                <button class="ghost" data-act="link" data-id="${a.id}">🔗 Liên kết</button>
              </td>
            </tr>`;
        }

        function paint() {
          if (failed) {
            root.innerHTML = `<div class="card"><div class="card-head"><h2>📝 Kết quả bài thi</h2></div>
              <p class="empty">Chạy <b>migration44_test_results.sql</b> trong Supabase, rồi mở lại tab này.</p></div>`;
            return;
          }
          if (!loaded) { root.innerHTML = `<div class="card"><p class="empty">Đang tải kết quả bài thi…</p></div>`; return; }
          const gs = groups();
          const totalAttempts = A.length;
          const students = new Set(A.map(a => a.student_id)).size;
          root.innerHTML = `
            <div class="card">
              <div class="card-head">
                <h2>📝 Kết quả bài thi <span class="kind">${students} học viên · ${totalAttempts} lượt nộp</span></h2>
              </div>
              <div class="form-row" style="margin-bottom:.4rem;">
                <div class="field" style="min-width:220px;"><label>Tìm theo học viên hoặc đề</label>
                  <input id="tq" value="${esc(q)}" placeholder="gõ tên…"></div>
                ${q ? `<button class="ghost" data-act="tclear">✕ Xóa</button>` : ""}
              </div>
              ${!A.length ? `<p class="empty">Chưa có bài thi nào được nộp. Khi học viên nộp bài (mở từ Learning Hub, đã đăng nhập), kết quả sẽ hiện ở đây.</p>`
                : !gs.length ? `<p class="empty">Không có kết quả khớp "${esc(q)}".</p>`
                : gs.map(grp => {
                  const a = grp.latest, open = !!openHist[grp.key];
                  return `
                  <div style="border:1px solid var(--line); border-radius:12px; padding:.7rem .9rem; margin-bottom:.6rem;">
                    <div class="form-row" style="justify-content:space-between; align-items:center; gap:.6rem;">
                      <div style="min-width:0;">
                        <b>${esc(neOf(grp.sid))}</b> · ${esc(grp.test)} ${statusPill(a)} ${cefrBadge(a.meta)}
                        <div class="kind" style="text-transform:none; letter-spacing:0; margin-top:2px;">
                          Mới nhất: <b>${a.score}/${a.max_score}</b> (${pct(a)}%) · Cao nhất: <b>${grp.best.score}/${grp.best.max_score}</b>
                          · ${grp.list.length} lần làm · ${fmtDT(a.submitted_at)}</div>
                      </div>
                      <div class="form-row" style="gap:.35rem;">
                        <button class="ghost" data-act="view" data-id="${a.id}">Xem chi tiết</button>
                        <button class="ghost" data-act="link" data-id="${a.id}">🔗 Liên kết</button>
                        ${grp.list.length > 1 ? `<button class="ghost" data-act="hist" data-key="${esc(grp.key)}">${open ? "▾" : "▸"} ${grp.list.length} lần</button>` : ""}
                      </div>
                    </div>
                    ${open && grp.list.length > 1 ? `
                      <table class="stackable" style="margin-top:.6rem;">
                        <thead><tr><th>Lần</th><th>Điểm</th><th>Đúng/Sai/Trống</th><th>Thời gian</th><th>Nộp lúc</th><th></th></tr></thead>
                        <tbody>${grp.list.map(x => attemptRow(x, grp)).join("")}</tbody>
                      </table>` : ""}
                  </div>`;
                }).join("")}
            </div>`;
          const box = document.getElementById("tq");
          if (box && q) { box.focus(); box.setSelectionRange(q.length, q.length); }
        }

        /* ---- detailed answer review modal ---- */
        function reviewModal(a) {
          const rows = (a.detail || []).map(qd => {
            const cls = qd.student == null ? "none" : (qd.ok ? "ok" : "bad");
            const stu = qd.student == null
              ? `<span class="tq-chip" style="color:var(--muted);">Bỏ trống</span>`
              : `<span class="tq-chip stu">${esc(qd.student)}</span>`;
            return `<div class="tq-q ${cls}">
                <span class="n">Câu ${qd.n}</span>
                <span>Chọn: ${stu}</span>
                <span style="margin-left:.8rem;">Đúng: <span class="tq-chip cor">${esc(qd.correct)}</span></span>
                ${qd.explanation ? `<span class="expl">💡 ${esc(qd.explanation)}</span>` : ""}
              </div>`;
          }).join("");
          const wrap = document.createElement("div");
          wrap.className = "tq-ov"; wrap.id = "tq-ov";
          wrap.innerHTML = `
            <div class="tq-modal">
              <div class="card-head" style="position:sticky; top:0; background:var(--card); padding-bottom:.4rem;">
                <h2 style="font-size:1.1rem;">${esc(neOf(a.student_id))} · ${esc(a.test_name)}</h2>
                <button class="ghost" data-act="close">✕</button>
              </div>
              <p class="kind" style="text-transform:none; letter-spacing:0;">
                Điểm <b>${a.score}/${a.max_score}</b> (${pct(a)}%) · Đúng ${a.correct} · Sai ${a.incorrect} · Bỏ trống ${a.unanswered}
                · Lần #${a.attempt_no} · ${fmtDur(a.seconds_spent)} · ${fmtDT(a.submitted_at)}</p>
              ${cefrBlock(a.meta)}
              <div class="tq-legend">
                <span><i style="background:var(--success)"></i>Đúng</span>
                <span><i style="background:var(--danger)"></i>Sai</span>
                <span><i style="background:#94a3b8"></i>Bỏ trống</span>
              </div>
              ${rows || `<p class="empty">Không có chi tiết.</p>`}
              <div class="form-row" style="margin-top:.8rem;">
                <button data-act="openlink" data-id="${a.id}">🔗 Mở liên kết chỉ-đọc</button>
                <button class="ghost" data-act="close">Đóng</button>
              </div>
            </div>`;
          document.body.appendChild(wrap);
          wrap.addEventListener("click", e => {
            if (e.target === wrap || e.target.closest('[data-act="close"]')) wrap.remove();
            const lk = e.target.closest('[data-act="openlink"]'); if (lk) openLink(lk.getAttribute("data-id"));
          });
        }
        function openLink(id) {
          const a = A.find(x => x.id === id); if (!a) return;
          window.open("results.html?t=" + encodeURIComponent(a.share_token), "_blank", "noopener");
        }

        root.addEventListener("click", e => {
          const b = e.target.closest("[data-act]"); if (!b) return;
          const act = b.getAttribute("data-act");
          if (act === "tclear") { q = ""; return paint(); }
          if (act === "hist") { const k = b.getAttribute("data-key"); openHist[k] = !openHist[k]; return paint(); }
          if (act === "view") { const a = A.find(x => x.id === b.getAttribute("data-id")); if (a) reviewModal(a); return; }
          if (act === "link") { return openLink(b.getAttribute("data-id")); }
        });
        root.addEventListener("input", e => { if (e.target.id === "tq") { q = e.target.value; paint(); } });

        window.__testsInit = async function () {
          if (loaded || failed) { paint(); return; }
          paint(); await load(); paint();
        };
      })();
      // =============== HẾT KẾT QUẢ BÀI THI ===============

      /* ================= QUẢN LÝ ĐỀ THI (Phase 37) =================
         Thêm/sửa/xóa đề thi và ĐÁP ÁN mà không cần viết SQL. Ghi thẳng vào
         bảng test_keys (chủ sở hữu có quyền ghi qua RLS). Đáp án chỉ nằm ở
         cơ sở dữ liệu — không bao giờ nằm trong file HTML của bài thi. */
      (function () {
        const root = document.getElementById("testmgr-root");
        if (!root) return;

        let loaded = false, failed = false, KEYS = [], COUNTS = {}, editing = null, adding = false;

        async function load() {
          const k = await sb.from("test_keys").select("*").order("test_key");
          if (k.error) { failed = true; return; }
          KEYS = k.data || [];
          COUNTS = {};
          const a = await sb.from("test_attempts").select("test_key");
          if (!a.error) (a.data || []).forEach(r => { COUNTS[r.test_key] = (COUNTS[r.test_key] || 0) + 1; });
          loaded = true;
        }

        // "A C B ✓ ✕ E F" (spaces / commas / newlines) → ["A","C","B","✓","✕","E","F"]
        const parseAnswers = s => String(s || "").split(/[\s,]+/).map(x => x.trim()).filter(Boolean);
        // "5: vì ..." lines → { "5": "vì ..." }
        function parseExpl(s) {
          const out = {};
          String(s || "").split(/\r?\n/).forEach(line => {
            const m = line.match(/^\s*(\d+)\s*[:=]\s*(.+)$/);
            if (m) out[m[1]] = m[2].trim();
          });
          return out;
        }
        const explToText = obj => Object.entries(obj || {}).map(([n, t]) => n + ": " + t).join("\n");

        function form(k) {
          const isNew = !k.test_key || adding;
          const ans = Array.isArray(k.answer_key) ? k.answer_key.join(" ") : "";
          return `
            <div class="card" style="border-color:var(--accent-ink);">
              <div class="card-head"><h2>${isNew ? "➕ Đề thi mới" : "✏️ Sửa đề: " + esc(k.test_key)}</h2></div>
              <div class="form-row">
                <div class="field"><label>Mã đề (test_key) — không dấu, không cách *</label>
                  <input id="tk-key" value="${esc(k.test_key || "")}" placeholder="hsk1-h10902" ${isNew ? "" : "readonly style=\"opacity:.7;\""}></div>
                <div class="field"><label>Tên hiển thị *</label>
                  <input id="tk-name" value="${esc(k.test_name || "")}" placeholder="HSK 1 · H10902"></div>
                <div class="field" style="max-width:150px;"><label>Điểm mỗi câu</label>
                  <input type="number" min="1" id="tk-pts" value="${k.points_per || 1}"></div>
                <div class="field" style="max-width:170px;"><label>Điểm tối đa (tự tính nếu trống)</label>
                  <input type="number" min="1" id="tk-max" value="${k.max_score != null ? k.max_score : ""}" placeholder="tự tính"></div>
                <div class="field" style="max-width:230px;"><label>Gắn bài học (tùy chọn)</label>
                  <select id="tk-lesson"><option value="">— không gắn —</option>${(lessons || []).map(l =>
                    `<option value="${l.id}" ${k.lesson_id === l.id ? "selected" : ""}>${esc(l.title)}</option>`).join("")}</select></div>
              </div>
              <div class="form-row">
                <div class="field" style="flex-basis:100%;"><label>Đáp án (dán theo thứ tự câu 1 → hết, cách nhau bằng dấu cách)</label>
                  <textarea id="tk-ans" style="min-height:70px; font-family:var(--mono);" placeholder="A C B ✓ ✕ E F A B ...">${esc(ans)}</textarea>
                  <span class="kind" id="tk-count" style="text-transform:none; letter-spacing:0;"></span></div>
                <div class="field" style="flex-basis:100%;"><label>Giải thích (tùy chọn — mỗi dòng: "số câu: nội dung")</label>
                  <textarea id="tk-expl" style="min-height:56px;" placeholder="5: nghe lại đoạn 2&#10;12: từ này nghĩa là ...">${esc(explToText(k.explanations))}</textarea></div>
              </div>
              <div class="form-row" style="margin-top:.5rem;">
                <button data-act="tk-save">💾 Lưu đề</button>
                <button class="ghost" data-act="tk-cancel">Hủy</button>
              </div>
              <p class="msg" id="tk-msg"></p>
            </div>`;
        }

        function paint() {
          if (failed) {
            root.innerHTML = `<div class="card"><div class="card-head"><h2>📄 Quản lý đề thi</h2></div>
              <p class="empty">Chạy <b>migration44_test_results.sql</b> trong Supabase, rồi mở lại tab này.</p></div>`;
            return;
          }
          if (!loaded) { root.innerHTML = `<div class="card"><p class="empty">Đang tải…</p></div>`; return; }
          root.innerHTML = `
            <div class="card">
              <div class="card-head">
                <h2>📄 Quản lý đề thi <span class="kind">${KEYS.length} đề</span></h2>
                ${!adding && !editing ? `<button data-act="tk-add">➕ Thêm đề thi</button>` : ""}
              </div>
              <p class="kind" style="text-transform:none; letter-spacing:0; margin:.2rem 0 .6rem;">
                Thêm/sửa đáp án ngay tại đây — không cần viết SQL. <b>Mã đề</b> phải trùng với
                <code>testKey</code> trong file HTML của bài thi.</p>
              ${adding ? form({}) : ""}
              ${KEYS.length ? `
              <table class="stackable">
                <thead><tr><th>Mã đề</th><th>Tên</th><th>Số câu</th><th>Điểm</th><th>Lượt nộp</th><th></th></tr></thead>
                <tbody>${KEYS.map(k => `
                  ${editing === k.test_key ? `<tr><td colspan="6">${form(k)}</td></tr>` : `
                  <tr>
                    <td data-th="Mã đề"><code>${esc(k.test_key)}</code></td>
                    <td data-th="Tên">${esc(k.test_name)}</td>
                    <td data-th="Số câu">${k.total_questions}</td>
                    <td data-th="Điểm">${k.points_per}/câu · tối đa ${k.max_score ?? (k.total_questions * k.points_per)}</td>
                    <td data-th="Lượt nộp">${COUNTS[k.test_key] || 0}</td>
                    <td>
                      <button class="ghost" data-act="tk-edit" data-key="${esc(k.test_key)}">Sửa</button>
                      <button class="ghost" data-act="tk-del" data-key="${esc(k.test_key)}" style="color:var(--danger); border-color:var(--danger);">Xóa</button>
                    </td>
                  </tr>`}`).join("")}</tbody>
              </table>` : (!adding ? `<p class="empty">Chưa có đề thi nào. Bấm "Thêm đề thi" để tạo đề đầu tiên.</p>` : "")}
            </div>`;
          wireCount();
        }

        // live question count under the answer box
        function wireCount() {
          const ta = document.getElementById("tk-ans"), out = document.getElementById("tk-count");
          if (!ta || !out) return;
          const upd = () => { const n = parseAnswers(ta.value).length; out.textContent = n ? "→ " + n + " câu" : "Chưa có đáp án nào"; };
          ta.addEventListener("input", upd); upd();
        }

        async function save() {
          const msg = document.getElementById("tk-msg");
          const say = (t, e) => { if (msg) { msg.textContent = t; msg.className = "msg" + (e ? " err" : ""); } };
          const key = (document.getElementById("tk-key").value || "").trim();
          const name = (document.getElementById("tk-name").value || "").trim();
          const answers = parseAnswers(document.getElementById("tk-ans").value);
          const pts = Math.max(1, parseInt(document.getElementById("tk-pts").value, 10) || 1);
          const maxRaw = (document.getElementById("tk-max").value || "").trim();
          const lesson = document.getElementById("tk-lesson").value || null;
          const expl = parseExpl(document.getElementById("tk-expl").value);
          if (!/^[a-zA-Z0-9_-]+$/.test(key)) return say("Mã đề chỉ gồm chữ, số, gạch ngang/gạch dưới — không dấu, không cách.", 1);
          if (!name) return say("Thiếu tên hiển thị.", 1);
          if (!answers.length) return say("Chưa dán đáp án.", 1);
          const total = answers.length;
          const row = {
            test_key: key, test_name: name, answer_key: answers, explanations: expl,
            points_per: pts, total_questions: total,
            max_score: maxRaw === "" ? total * pts : Math.max(1, parseInt(maxRaw, 10) || total * pts),
            lesson_id: lesson, updated_at: new Date().toISOString()
          };
          // when adding, refuse to silently overwrite an existing id
          if (adding && KEYS.some(k => k.test_key === key))
            return say('Mã đề "' + key + '" đã tồn tại — chọn "Sửa" ở dòng đó, hoặc đổi mã.', 1);
          const { error } = await sb.from("test_keys").upsert(row);
          if (error) return say("Không lưu được: " + error.message, 1);
          adding = false; editing = null;
          await load(); paint();
          if (window.UI) UI.toast("✓ Đã lưu đề " + key);
        }

        root.addEventListener("click", async e => {
          const b = e.target.closest("[data-act]"); if (!b) return;
          const act = b.getAttribute("data-act"), key = b.getAttribute("data-key");
          if (act === "tk-add") { adding = true; editing = null; return paint(); }
          if (act === "tk-cancel") { adding = false; editing = null; return paint(); }
          if (act === "tk-edit") { editing = key; adding = false; return paint(); }
          if (act === "tk-save") { return save(); }
          if (act === "tk-del") {
            const n = COUNTS[key] || 0;
            const ok = window.UI ? await UI.confirmDialog({
              title: 'Xóa đề "' + key + '"?', danger: true, okText: "Xóa đề",
              body: (n ? "Đề này đã có <b>" + n + "</b> lượt nộp. " : "") +
                "Xóa đề chỉ xóa <b>đáp án</b> — các kết quả học viên đã nộp <b>vẫn được giữ</b> trong phần Kết quả bài thi. " +
                "Nếu còn bài thi HTML dùng mã này, học viên sẽ không nộp được cho tới khi bạn tạo lại đề."
            }) : confirm("Xóa đề " + key + "?");
            if (!ok) return;
            const { error } = await sb.from("test_keys").delete().eq("test_key", key);
            if (error) return window.UI ? UI.toast("Không xóa được: " + error.message, "err") : alert(error.message);
            await load(); paint();
            if (window.UI) UI.toast("🗑 Đã xóa đề " + key);
          }
        });

        window.__testMgrInit = async function () {
          if (loaded || failed) { paint(); return; }
          paint(); await load(); paint();
        };
      })();
      // =============== HẾT QUẢN LÝ ĐỀ THI ===============

      function showTab(t) {
        adminTab = t;
        if (t === "landing" && window.__lpmInit) window.__lpmInit();
        if (t === "progress" && window.__testsInit) window.__testsInit();
        if (t === "testmgr" && window.__testMgrInit) window.__testMgrInit();
        if (t === "modules" && window.__modInit) window.__modInit();
        if (t === "nav" && window.__navInit) window.__navInit();
        if (t === "visib" && window.__visibInit) window.__visibInit();
        if (t === "classes" && window.__ocInit) window.__ocInit();
        app.querySelectorAll(".tabpane").forEach(p =>
          p.classList.toggle("show", p.getAttribute("data-tab") === t));
        document.querySelectorAll("#subnav .sn-item[data-id]").forEach(b =>
          b.classList.toggle("on", b.getAttribute("data-id") === t));
        const lbl = document.querySelector(`#subnav .sn-item[data-id="${t}"] span`);
        const eb = app.querySelector(".eyebrow");
        if (eb && lbl) eb.textContent = "Admin / " + lbl.textContent;
      }
      if (window.UI && UI.initNav) UI.initNav({
        items: [
          { id: "lessons", label: "Lessons (" + (lessons || []).length + ")", icon: "book-open", group: "Content" },
          { id: "courses", label: "Courses (" + (courses || []).length + ")", icon: "layers", group: "Content" },
          { id: "flash", label: "Flashcards" + (cards.length ? " (" + cards.length + ")" : ""), icon: "wallet-cards", group: "Content" },
          { id: "reading", label: "Reading" + ((rtRes.data || []).length ? " (" + rtRes.data.length + ")" : ""), icon: "library", group: "Content" },
          { id: "vsat", label: "V-SAT" + (vsRows.length ? " (" + vsRows.length + ")" : ""), icon: "file-check", group: "Content" },
          { id: "hsk", label: "HSK Slides" + (hskRows.length ? " (" + hskRows.length + ")" : ""), icon: "presentation", group: "Content" },
          { id: "vocab", label: "HSK Vocab Practice", icon: "wallet-cards", group: "Content" },
          { id: "vstep", label: "VSTEP" + ((vpRows.length + vlRows.length) ? " (" + (vpRows.length + vlRows.length) + ")" : ""), icon: "book-open", group: "Content" },
          { id: "shadow", label: "Shadowing" + ((svRes.data || []).length ? " (" + svRes.data.length + ")" : ""), icon: "video", group: "Content" },
          { id: "dict", label: "Dictation", icon: "headphones", group: "Content" },
          { id: "landing", label: "Landing Page", icon: "globe", group: "Content" },
          { id: "testmgr", label: "Đề thi", icon: "file-text", group: "Content" },
          { id: "nav", label: "Điều hướng", icon: "list-tree", group: "Settings" },
          { id: "visib", label: "Hiển thị công khai", icon: "eye", group: "Settings" },
          { id: "pricing", label: "Giá & thanh toán", icon: "badge-dollar-sign", group: "Settings" },
          { id: "modules", label: "Tính năng", icon: "toggle-right", group: "Settings" },
          { id: "students", label: "Students (" + onlyStudents.length + ")" + (stuWarn ? " ⚠️" : ""), icon: "users", group: "Users" },
          { id: "classes", label: "Lớp học", icon: "layers", group: "Users" },
          { id: "progress", label: "Analytics", icon: "bar-chart-3", group: "Analytics" },
          { id: "announce", label: "Announce" + ((anns || []).length ? " (" + anns.length + ")" : ""), icon: "megaphone", group: "Community" },
          { href: "organizations.html", label: "Organizations & licenses", icon: "building-2", group: "Settings" },
        ],
        active: adminTab,
        onSelect: showTab,
        actions: [
          { label: "+ Lesson", icon: "plus",
            onClick: () => { showTab("lessons"); document.getElementById("l-title")?.focus(); } },
          { label: "+ Course", icon: "plus",
            onClick: () => { showTab("courses"); document.getElementById("c-title")?.focus(); } },
          { label: "+ User", icon: "user-plus",
            onClick: () => { showTab("students"); document.getElementById("nu-email")?.focus(); } },
        ]
      });
      showTab(adminTab);

      // --- drag & drop upload zone ---
      const drop = document.getElementById("l-drop");
      const fileInput = document.getElementById("l-file");
      const dropText = document.getElementById("l-drop-text");
      const dropDefault = dropText.innerHTML;
      const allowedExt = ["pdf","doc","docx","ppt","pptx","xls","xlsx","csv","txt",
                          "png","jpg","jpeg","webp","gif","mp3","wav","m4a","mp4","html"];

      function refreshDrop() {
        const f = fileInput.files[0];
        if (!f) { dropText.innerHTML = dropDefault; return; }
        dropText.innerHTML =
          `📄 <span class="file-picked">${esc(f.name)}</span>` +
          ` <span class="kind">(${(f.size / 1024 / 1024).toFixed(1)} MB)</span>` +
          `<span class="file-remove" id="l-file-remove">remove</span>`;
        // Autofill the title from the file name if it's still empty.
        const titleBox = document.getElementById("l-title");
        if (!titleBox.value.trim()) {
          titleBox.value = f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim();
        }
      }

      drop.addEventListener("click", (e) => {
        if (e.target.id === "l-file-remove") {
          fileInput.value = ""; refreshDrop(); return;
        }
        fileInput.click();
      });
      fileInput.addEventListener("change", refreshDrop);

      ["dragover", "dragenter"].forEach(ev =>
        drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("dragover"); }));
      ["dragleave", "dragend"].forEach(ev =>
        drop.addEventListener(ev, () => drop.classList.remove("dragover")));
      drop.addEventListener("drop", (e) => {
        e.preventDefault();
        drop.classList.remove("dragover");
        const f = e.dataTransfer.files[0];
        if (!f) return;
        const ext = (f.name.split(".").pop() || "").toLowerCase();
        const m = document.getElementById("l-msg");
        if (!allowedExt.includes(ext)) {
          m.textContent = "That file type isn't supported. Use PDF, Word, PowerPoint, Excel, image, audio, video, text, or HTML.";
          m.className = "msg err"; return;
        }
        m.textContent = ""; m.className = "msg";
        fileInput.files = e.dataTransfer.files;
        refreshDrop();
      });

      document.getElementById("l-add").addEventListener("click", async () => {
        const title = document.getElementById("l-title").value.trim();
        const url = document.getElementById("l-url").value.trim();
        const file = document.getElementById("l-file").files[0] || null;
        const sort_order = parseInt(document.getElementById("l-order").value, 10) || 0;
        const est_minutes = parseInt(document.getElementById("l-min").value, 10) || null;
        const course_id = document.getElementById("l-course").value || null;
        const m = document.getElementById("l-msg");
        m.className = "msg";

        if (!title || (!url && !file)) {
          m.textContent = "Add a title, plus either a link or a file."; m.className = "msg err"; return;
        }
        if (file && file.size > 50 * 1024 * 1024) {
          m.textContent = "Files must be under 50 MB."; m.className = "msg err"; return;
        }

        let storage_path = null;
        let kind = kindOf(file ? file.name : url) || (file ? "file" : "link");

        if (file) {
          m.textContent = "Uploading…";
          const folder = course_id || "shared";
          const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
          storage_path = folder + "/" + Date.now() + "-" + safe;
          const { error: upErr } = await sb.storage.from("materials")
            .upload(storage_path, file, { contentType: file.type || undefined });
          if (upErr) { m.textContent = "Upload failed: " + upErr.message; m.className = "msg err"; return; }
        }

        const tierV = document.getElementById("l-tier").value || null;
        const { data: newLesson, error } = await sb.from("lessons")
          .insert({ title, kind, url: url || null, sort_order, course_id, storage_path, est_minutes, tier: tierV })
          .select().single();
        if (error) { m.textContent = "Could not add: " + error.message; m.className = "msg err"; return; }
        const coverFile = document.getElementById("l-img-new").files[0] || null;
        if (coverFile && newLesson) {
          try {
            m.textContent = "Uploading cover image…";
            await uploadLessonImage(newLesson.id, coverFile);
          } catch (e) { /* the cover is optional — the lesson is already saved */ }
        }
        renderAdmin();
      });

      // predefined swatches for quick color choice
      const SWATCHES = ["#1e4f8f","#0e7c66","#b7823f","#a4442f","#6d28d9","#c026d3","#0891b2","#374151"];
      const swWrap = document.getElementById("c-swatches");
      swWrap.innerHTML = SWATCHES.map(col =>
        `<button type="button" data-col="${col}" style="background:${col};" title="${col}"></button>`).join("");
      swWrap.querySelectorAll("button").forEach(b =>
        b.addEventListener("click", () => { document.getElementById("c-color").value = b.getAttribute("data-col"); }));

      document.getElementById("c-add").addEventListener("click", async () => {
        const title = document.getElementById("c-title").value.trim();
        const description = document.getElementById("c-desc").value.trim() || null;
        const category = document.getElementById("c-cat").value.trim() || null;
        const color = document.getElementById("c-color").value || null;
        const m = document.getElementById("c-msg");
        if (!title) { m.textContent = "Give the course a title."; m.className = "msg err"; return; }
        if ((courses || []).some(c => c.title.trim().toLowerCase() === title.toLowerCase())) {
          m.textContent = "A course with this name already exists."; m.className = "msg err"; return;
        }
        const iconV = document.getElementById("c-icon").value.trim() || null;
        const bannerFile = document.getElementById("c-banner").files[0] || null;
        const { data: newCourse, error } = await sb.from("courses")
          .insert({ title, description, category, color, icon: iconV,
                    tier: document.getElementById("c-tier").value,
                    sort_order: (courses?.length || 0) + 1 }).select().single();
        if (error) { m.textContent = "Could not add: " + error.message; m.className = "msg err"; return; }
        if (bannerFile && window.UI && UI.resizeImage) {
          try {
            m.textContent = "Uploading banner…";
            const blob = await UI.resizeImage(bannerFile, 1200);
            const path = newCourse.id + "-" + Date.now() + ".jpg";
            const { error: upErr } = await sb.storage.from("banners")
              .upload(path, blob, { contentType: "image/jpeg", upsert: true });
            if (!upErr) {
              const { data: pub } = sb.storage.from("banners").getPublicUrl(path);
              await sb.from("courses").update({ banner_url: pub.publicUrl }).eq("id", newCourse.id);
            }
          } catch (e) { /* banner is optional */ }
        }
        renderAdmin();
      });

      app.querySelectorAll(".c-edit").forEach(btn => {
        btn.addEventListener("click", () => {
          const row = app.querySelector(`.c-editrow[data-id="${btn.getAttribute("data-id")}"]`);
          row.style.display = row.style.display === "none" ? "block" : "none";
        });
      });
      app.querySelectorAll(".ce-cancel").forEach(btn => {
        btn.addEventListener("click", () => {
          app.querySelector(`.c-editrow[data-id="${btn.getAttribute("data-id")}"]`).style.display = "none";
        });
      });
      app.querySelectorAll(".ce-save").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-id");
          const m = app.querySelector(`.ce-msg[data-id="${id}"]`);
          const title = app.querySelector(`.ce-title[data-id="${id}"]`).value.trim();
          const description = app.querySelector(`.ce-desc[data-id="${id}"]`).value.trim() || null;
          const category = app.querySelector(`.ce-cat[data-id="${id}"]`).value.trim() || null;
          const color = app.querySelector(`.ce-color[data-id="${id}"]`).value || null;
          const sequential = app.querySelector(`.ce-seq[data-id="${id}"]`).checked;
          const iconV = app.querySelector(`.ce-icon[data-id="${id}"]`).value.trim() || null;
          const tierV = app.querySelector(`.ce-tier[data-id="${id}"]`).value;
          const bFile = app.querySelector(`.ce-banner[data-id="${id}"]`).files[0] || null;
          m.className = "msg";
          if (!title) { m.textContent = "Course name can't be empty."; m.className = "msg err"; return; }
          const dup = (courses || []).some(c =>
            c.id !== id && c.title.trim().toLowerCase() === title.toLowerCase());
          if (dup) { m.textContent = "A course with this name already exists."; m.className = "msg err"; return; }
          btn.disabled = true;
          let banner_url;
          if (bFile && window.UI && UI.resizeImage) {
            try {

        // ---- bulk Free/Premium over the whole filtered group (DB-side) ----
        /* Describes exactly which group the current Level/Type/Search filters

        function bulkScope() {
          const parts = [rlang === "en" ? "English" : "Chinese"];
          parts.push(rtf.lvl ? lvlName(Number(rtf.lvl)) : "all levels");
          parts.push({ all: "all types", free: "Free", premium: "👑 Premium",
            assigned: "Assigned only", draft: "Drafts" }[rtf.type] || "all types");
          if (rtf.q.trim()) parts.push('“' + rtf.q.trim() + '”');

        function updateBulk() {
          const el = document.getElementById("rt-bulk-desc");
          if (!el || rtRes.error) return;
          const n = rtView().length;
          el.textContent = n
            ? `${n} text${n > 1 ? "s" : ""} match the current filters (${bulkScope()})`
            : "No texts match the current filters.";
        }
        async function bulkSetTier(target) {
          if (rtRes.error) return;
          const view = rtView();
          if (!view.length) { if (window.UI) UI.toast("No texts match the current filters.", "err"); return; }
          const targetLbl = target === "premium" ? "👑 Premium" : "Free";
          const fromLbl = target === "premium" ? "Free" : "👑 Premium";
          // only rows whose tier actually differs from the target need writing
          const affected = view.filter(t => (t.tier === "premium" ? "premium" : "free") !== target);
          if (!affected.length) {
            if (window.UI) UI.toast(`All ${view.length} matching text${view.length > 1 ? "s are" : " is"} already ${targetLbl}.`);
            return;
          }
          const n = affected.length, s = n > 1 ? "s" : "";
          const ok = window.UI ? await UI.confirmDialog({
            title: `Set ${n} text${s} to ${targetLbl}?`,
            body: `You are about to change <b>${n}</b> reading text${s} (${esc(bulkScope())}) from <b>${fromLbl}</b> to <b>${targetLbl}</b>.<br>Texts already ${targetLbl} are left unchanged. Continue?`,
            okText: `Change ${n} to ${targetLbl}`
          }) : confirm(`Change ${n} reading text${s} from ${fromLbl} to ${targetLbl}? Continue?`);
          if (!ok) return;
          const ids = affected.map(t => t.id);
          const bFree = document.getElementById("rt-bulk-free");
          const bPrem = document.getElementById("rt-bulk-prem");
          bFree.disabled = bPrem.disabled = true;
          let done = 0; let firstErr = null;
          /* Update in the database in chunks — one statement per chunk covers many
             rows at once, so this scales to hundreds/thousands without a per-row loop. */
          for (let i = 0; i < ids.length; i += 200) {
            const chunk = ids.slice(i, i + 200);
            const { error } = await sb.from("reading_texts").update({ tier: target }).in("id", chunk);
            if (error) { firstErr = firstErr || error; }
            else { done += chunk.length; chunk.forEach(id => { const t = rtexts.find(x => x.id === id); if (t) t.tier = target; }); }
          }
          bFree.disabled = bPrem.disabled = false;
          renderRt();              // reflect the new status immediately
          if (firstErr && !done) { if (window.UI) UI.toast("Could not change access: " + firstErr.message, "err"); }
          else if (firstErr) { if (window.UI) UI.toast(`✓ ${done} changed to ${targetLbl}; ${n - done} failed (${firstErr.message}).`, "err"); }
          else if (window.UI) UI.toast(`✓ ${done} reading text${done > 1 ? "s" : ""} changed to ${targetLbl}.`);
        }

        /* ==================================================================
           AUTOMATIC COVER IMAGES
           Finds a relevant photo for every reading text that has none.

           Why it searches the TAGS and not the title: the titles are literary
           ("The Art of Being Wrong", 为什么便宜的东西反而更贵) and produce nothing
           useful in a photo library, while every text already carries concrete
           Vietnamese tags. Each text is searched on its RAREST tag, so the
           query is as specific as the data allows.

           Pexels allows 200 requests/hour, so search results are cached per
           query — ~220 searches cover all 700 texts, and texts sharing a
           concept each take a DIFFERENT photo from the same result page.
           ================================================================== */
        const CV = {
          key: "", running: false, stop: false,
          cache: new Map(),          // query -> array of photos
          used: new Set(),           // photo ids already assigned
          missing: new Map(),        // tags with no English mapping yet
          log: [], done: 0, failed: 0, skipped: 0, total: 0
        };
        const cvEl = id => document.getElementById(id);
        const cvSay = (t, err) => { const m = cvEl("cv-msg"); m.textContent = t; m.className = "msg" + (err ? " err" : ""); };
        function cvLog(line) {
          CV.log.push(line);
          if (CV.log.length > 400) CV.log.shift();
          const el = cvEl("cv-log");
          el.textContent = CV.log.join("\n");
          el.scrollTop = el.scrollHeight;
        }
        const cvSleep = ms => new Promise(r => setTimeout(r, ms));

        /* Generic but pleasant queries for a text whose tags are all new. The
           dedupe rule still guarantees a different photo each time. */
        const CV_GENERIC = ["reading books study", "chinese culture daily life",
          "city street asia morning", "people conversation everyday",
          "notebook desk learning", "landscape nature calm"];
        let cvGenericI = 0;

        /* Pick the most specific tag we have an English query for. Nothing is
           ever skipped: unmapped tags are recorded (so they can be added to
           COVER_Q later) and the text still gets a reasonable image. */
        function cvQueryFor(t) {
          const terms = [...(t.tags || []).map(x => String(x).trim().toLowerCase())];
          const cat = String(t.category || "").trim().toLowerCase();
          if (cat && !terms.includes(cat)) terms.push(cat);
          const known = terms.filter(x => COVER_Q[x]);
          if (known.length) {
            known.sort((a, b) => (CV.freq[a] || 0) - (CV.freq[b] || 0));   // rarest first
            return { term: known[0], q: COVER_Q[known[0]], exact: true };
          }
          /* remember the words we could not translate, so they can be reported */
          terms.forEach(x => { if (x) CV.missing.set(x, (CV.missing.get(x) || 0) + 1); });
          /* an English text can search on its own title — it is already English */
          if ((t.lang || "zh") === "en" && t.title) {
            const words = String(t.title).replace(/[^A-Za-z ]/g, " ").split(/\s+/)
              .filter(w => w.length > 3 && !/^(the|and|that|with|your|from|this|what|when|why|how|for|our)$/i.test(w));
            if (words.length) return { term: "(tiêu đề)", q: words.slice(0, 4).join(" ").toLowerCase(), exact: false };
          }
          const g = CV_GENERIC[cvGenericI++ % CV_GENERIC.length];
          return { term: "(chung)", q: g, exact: false };
        }

        async function cvSearch(q) {
          if (CV.cache.has(q)) return CV.cache.get(q);
          const url = "https://api.pexels.com/v1/search?per_page=30&orientation=landscape&size=medium&query="
            + encodeURIComponent(q);
          const r = await fetch(url, { headers: { Authorization: CV.key } });
          if (r.status === 429) { throw new Error("RATE"); }
          if (!r.ok) throw new Error("Pexels HTTP " + r.status);
          const j = await r.json();
          const photos = (j.photos || []).filter(p => p.width >= 800 && p.width > p.height);
          CV.cache.set(q, photos);
          return photos;
        }

        /* fetch → shrink to a card-sized JPEG → upload to our own bucket, so the
           cover keeps working even if the source ever disappears */
        async function cvStore(photo, textId) {
          const src = (photo.src && (photo.src.large || photo.src.medium)) || photo.url;
          const res = await fetch(src);
          if (!res.ok) throw new Error("download HTTP " + res.status);
          const blob = await res.blob();
          const bmp = await createImageBitmap(blob);
          const W = 800, H = Math.round(W * 9 / 16);
          const cv = document.createElement("canvas");
          cv.width = W; cv.height = H;
          const ctx = cv.getContext("2d");
          const scale = Math.max(W / bmp.width, H / bmp.height);
          const dw = bmp.width * scale, dh = bmp.height * scale;
          ctx.drawImage(bmp, (W - dw) / 2, (H - dh) / 2, dw, dh);
          const out = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82));
          const path = textId + ".jpg";
          const up = await sb.storage.from("reading-covers")
            .upload(path, out, { upsert: true, contentType: "image/jpeg", cacheControl: "31536000" });
          if (up.error) throw up.error;
          return sb.storage.from("reading-covers").getPublicUrl(path).data.publicUrl + "?v=" + Date.now();
        }

        async function cvRun() {
          CV.running = true; CV.stop = false;
          cvEl("cv-start").disabled = true; cvEl("cv-stop").disabled = false;
          cvEl("cv-bar").hidden = false;

          /* tag frequency drives "rarest tag wins" */
          CV.freq = {};
          rtexts.forEach(t => {
            [...(t.tags || []), t.category].filter(Boolean)
              .forEach(x => { const k = String(x).trim().toLowerCase(); CV.freq[k] = (CV.freq[k] || 0) + 1; });
          });
          /* never hand out a photo that is already on another text */
          const { data: taken } = await sb.from("reading_texts")
            .select("cover_photo_id").neq("cover_photo_id", "");
          (taken || []).forEach(r => CV.used.add(String(r.cover_photo_id)));

          const todo = rtexts.filter(t => !t.cover_url);
          CV.total = todo.length; CV.done = CV.failed = CV.skipped = 0;
          cvLog("=== " + new Date().toLocaleString("vi-VN") + " — " + todo.length + " bài cần ảnh ===");

          for (let i = 0; i < todo.length; i++) {
            if (CV.stop) { cvLog("⏸ Đã tạm dừng — bấm Bắt đầu để chạy tiếp."); break; }
            const t = todo[i];
            const pct = Math.round((i / todo.length) * 100);
            cvEl("cv-fill").style.width = pct + "%";
            cvSay(`Đang xử lý ${i + 1}/${todo.length} — ${CV.done} xong · ${CV.skipped} bỏ qua · ${CV.failed} lỗi`);

            const qq = cvQueryFor(t);
            try {
              let photos = await cvSearch(qq.q);
              let pick = photos.find(p => !CV.used.has(String(p.id)));
              if (!pick) {                       // this concept is exhausted — widen once
                const wider = qq.q.split(" ").slice(0, 2).join(" ");
                photos = await cvSearch(wider);
                pick = photos.find(p => !CV.used.has(String(p.id)));
                await cvSleep(400);
              }
              if (!pick) {
                CV.failed++; cvLog("✗ " + t.title + " — hết ảnh mới cho “" + qq.q + "”");
                await sb.from("cover_jobs").upsert({ text_id: t.id, status: "failed", query: qq.q, note: "no unused photo" });
                continue;
              }
              CV.used.add(String(pick.id));
              const url = await cvStore(pick, t.id);
              const patch = {
                cover_url: url,
                cover_alt: t.title,
                cover_source: "pexels",
                cover_author: pick.photographer || "",
                cover_link: pick.url || "",
                cover_license: "Pexels License",
                cover_photo_id: String(pick.id),
                cover_query: qq.q
              };
              const { error } = await sb.from("reading_texts").update(patch).eq("id", t.id);
              if (error) throw error;
              Object.assign(t, patch);
              CV.done++;
              cvLog((qq.exact ? "✓ " : "≈ ") + t.title + "  ←  “" + qq.q + "” · " + (pick.photographer || "?"));
              await sb.from("cover_jobs").upsert({ text_id: t.id, status: "done", query: qq.q, note: pick.photographer || "" });
            } catch (e) {
              if (String(e.message) === "RATE") {
                cvLog("⏳ Pexels báo quá giới hạn — nghỉ 60 giây rồi thử lại…");
                await cvSleep(60000); i--; continue;      // retry this text
              }
              CV.failed++;
              cvLog("✗ " + t.title + " — " + (e.message || e));
              await sb.from("cover_jobs").upsert({ text_id: t.id, status: "failed", query: qq.q, note: String(e.message || e).slice(0, 180) });
            }
            await cvSleep(350);                  // gentle on Pexels and on Storage
          }

          cvEl("cv-fill").style.width = "100%";
          cvSay(`Xong: ${CV.done} bài có ảnh mới · ${CV.skipped} bỏ qua · ${CV.failed} lỗi.`);
          cvLog(`=== Kết thúc: ${CV.done} xong, ${CV.skipped} bỏ qua, ${CV.failed} lỗi ===`);
          if (CV.missing.size) {
            const list = [...CV.missing.entries()].sort((a, b) => b[1] - a[1]);
            cvLog("");
            cvLog("── " + list.length + " thẻ chưa có trong bản đồ tìm ảnh ──");
            cvLog("   (những bài này vẫn có ảnh, nhưng là ảnh chung chung — dấu ≈ ở trên)");
            cvLog("   " + list.map(([k, n]) => k + " ×" + n).join(" · "));
            cvLog("   → Gửi danh sách này cho Claude để bổ sung, ảnh sẽ sát chủ đề hơn.");
          }
          CV.running = false;
          cvEl("cv-start").disabled = false; cvEl("cv-stop").disabled = true;
          renderRt();
        }

        (async () => {
          const { data: cs } = await sb.from("cover_settings").select("pexels_key").eq("id", 1).maybeSingle();
          if (cs && cs.pexels_key) { CV.key = cs.pexels_key; cvEl("cv-key").value = "••••••••••••"; }
          const n = rtexts.filter(t => !t.cover_url).length;
          cvEl("cv-scope").textContent = n + " bài chưa có ảnh bìa / " + rtexts.length + " bài";
        })().catch(() => {});

        cvEl("cv-savekey").addEventListener("click", async () => {
          const v = cvEl("cv-key").value.trim();
          if (!v || v.startsWith("•")) { cvSay("Dán khoá Pexels vào ô bên cạnh trước.", true); return; }
          const { error } = await sb.from("cover_settings").update({ pexels_key: v, updated_at: new Date().toISOString() }).eq("id", 1);
          if (error) { cvSay("Không lưu được: " + error.message + " — chạy migration52 trước.", true); return; }
          CV.key = v; cvEl("cv-key").value = "••••••••••••";
          cvSay("Đã lưu khoá ✓");
        });
        cvEl("cv-stop").addEventListener("click", () => { CV.stop = true; cvSay("Đang dừng sau bài hiện tại…"); });
        cvEl("cv-start").addEventListener("click", async () => {
          if (CV.running) return;
          if (!CV.key) { cvSay("Cần khoá Pexels trước — bấm “Lấy khoá miễn phí” rồi dán vào và Lưu.", true); return; }
          if (!rtexts.filter(t => !t.cover_url).length) { cvSay("Mọi bài đã có ảnh bìa 🎉"); return; }
          try { await cvRun(); }
          catch (e) { cvSay("Dừng vì lỗi: " + (e.message || e), true); CV.running = false;
            cvEl("cv-start").disabled = false; cvEl("cv-stop").disabled = true; }
        });

        document.getElementById("rt-add").addEventListener("click", async () => {
          const title = document.getElementById("rt-title").value.trim();
          const content = document.getElementById("rt-content").value;
          if (!title || !content.trim()) { say(rtMsg, "Add a title and the Chinese text.", true); return; }

            tier: document.getElementById("rt-tier").value,
            audience: document.getElementById("rt-aud").value,
            published: document.getElementById("rt-pub").checked,
            translation: document.getElementById("rt-tr").value,
            sort_order: rtexts.length + 1,
            created_by: user.id
          };
          const { data: ins, error } = await sb.from("reading_texts").insert(row).select().single();
          if (error) { say(rtMsg, "Could not add: " + error.message + (rtRes.error ? " — run migration25/26 first." : ""), true); return; }
          rtexts.push(ins);
          ["rt-title", "rt-cat", "rt-tags", "rt-content", "rt-tr"].forEach(x => (document.getElementById(x).value = ""));
          say(rtMsg, "Reading text added ✓");
          renderRt();

        document.getElementById("rs-save").addEventListener("click", async () => {
          const v = Math.max(0, parseInt(limitIn.value, 10) || 0);
          const { error } = await sb.from("reading_settings").update({ free_limit: v }).eq("id", 1);
          if (error) { say(rtMsg, "Could not save the limit: " + error.message, true); return; }

        // ---- grants: one student, or everyone in a course ----
        const raStudent = document.getElementById("ra-student");
        const raCourse = document.getElementById("ra-course");
        const raWho = document.getElementById("ra-who");
        const raScope = document.getElementById("ra-scope");
        const raMsg = document.getElementById("ra-msg");
        raWho.addEventListener("change", () => {
          document.getElementById("ra-stu-w").style.display = raWho.value === "student" ? "" : "none";
          document.getElementById("ra-crs-w").style.display = raWho.value === "course" ? "" : "none";
          renderRa();
        });
        raScope.addEventListener("change", () => {
          document.getElementById("ra-txt-w").style.display = raScope.value === "text" ? "" : "none";
          document.getElementById("ra-lvl-w").style.display = raScope.value === "level" ? "" : "none";
        });
        function describe(g) {
          if (g.text_id) return "📄 " + textTitle(g.text_id);
          if (g.level) return "📚 All HSK " + g.level + " texts";
          return "🌐 The entire reading library";
        }
        function renderRa() {
          let mine;
          if (raWho.value === "course") {
            mine = raRows.filter(r => r.course_id === raCourse.value);
          } else {
            const sid = raStudent.value;
            const myCourses = (enrollments || []).filter(e => e.student_id === sid).map(e => e.course_id);
            mine = raRows.filter(r => r.student_id === sid || (r.course_id && myCourses.includes(r.course_id)));
          }
          document.getElementById("ra-list").innerHTML = mine.map(g => `
            <div class="lesson">
              <div class="meta"><div class="title" style="font-weight:500;">${esc(describe(g))}</div>
                <span class="kind">${g.course_id ? "🎓 whole course: " + esc(courseName(g.course_id) || "?") + " · " : ""}granted ${new Date(g.created_at).toLocaleDateString()}</span></div>
              <button class="ghost ra-del" data-id="${g.id}" data-course="${g.course_id || ""}" style="color:var(--danger); border-color:var(--danger);">Remove</button>
            </div>`).join("") || (raWho.value === "course"
              ? `<p class="empty">No grants for this course yet.</p>`
              : `<p class="empty">No personal grants for this student — they see "All students" texts, limited by their plan.</p>`);
          document.querySelectorAll(".ra-del").forEach(b => b.addEventListener("click", async () => {
            if (b.getAttribute("data-course") &&
                !confirm("This is a course-wide grant — removing it removes access for EVERY student in the course. Remove?")) return;

            const { error } = await sb.from("reading_access").delete().eq("id", b.getAttribute("data-id"));
            if (error) { b.disabled = false; say(raMsg, "Could not remove: " + error.message, true); return; }
            raRows = raRows.filter(r => r.id !== b.getAttribute("data-id"));
            renderRa();
          }));
        }

        document.getElementById("ra-add").addEventListener("click", async () => {
          const row = { student_id: null, text_id: null, level: null };
          if (raWho.value === "course") {
            row.course_id = raCourse.value || null;          // only sent for course grants → student grants still work before migration29
