      let chip = "all";
      try { chip = localStorage.getItem("hub_chip") || "all"; } catch (e) {}
      const chipPass = l => chip === "all" ? true
        : (chip === "done" ? done.has(l.id) : !done.has(l.id));

      // Which lessons are locked? In a "sequential" course, everything
      // after the first uncompleted lesson is locked.
      const lockedSet = new Set();
      for (const c of (courses || [])) {
        if (!c.sequential) continue;
        const ls = (lessons || []).filter(l => l.course_id === c.id);
        const fi = ls.findIndex(x => !done.has(x.id));
        if (fi === -1) continue;
        ls.forEach((l, i) => { if (i > fi) lockedSet.add(l.id); });
      }
      const fmtDur = m => m >= 60
        ? Math.floor(m / 60) + "h" + (m % 60 ? " " + (m % 60) + "m" : "")
        : m + " min";

      // Each course card can fold its lessons away (state remembered
      // per device, so students with many courses keep a short page).
      // DEFAULT: everything starts collapsed as a compact list, except
      // the course the student is currently working on (defaultOpenId,
      // decided below once "continue learning" is known). A student's
      // own open/close choices always win over the default.
      let collapsedCourses = {};
      try { collapsedCourses = JSON.parse(localStorage.getItem("hub_courses_closed") || "{}"); } catch (e) {}
      let defaultOpenId = null;

      // One roadmap card per course, grouped into collapsible categories.
      const courseCard = c => {
        const ls = (lessons || []).filter(l => l.course_id === c.id);
        const doneCount = ls.filter(l => done.has(l.id)).length;
        const pct = ls.length ? Math.round(doneCount / ls.length * 100) : 0;
        const complete = ls.length > 0 && doneCount === ls.length;
        const color = c.color || "#1e4f8f";
        const firstOpen = ls.findIndex(x => !done.has(x.id));
        const minsLeft = ls.filter(l => !done.has(l.id))
          .reduce((s, l) => s + (l.est_minutes || 0), 0);

        const BADGES = [["🌱", 25], ["⭐", 50], ["🏅", 75], ["🏆", 100]];
        const badgeRow = ls.length ? `
          <div class="badges">
            ${BADGES.map(([b, th]) =>
              `<span class="b ${pct >= th ? "earned" : ""}" title="${th}%">${b}</span>`).join("")}
          </div>` : "";

        const rows = ls.map((l, i) => {
          if (!chipPass(l)) return "";
          const isDone = done.has(l.id);
          const isLocked = lockedSet.has(l.id);
          const isPrem = premLocked.has(l.id);
          const isCurrent = !isDone && !isLocked && c.sequential && i === firstOpen;
          const state = isDone
            ? `<span class="lc-state" title="${t("completed_pill")}">✓</span>`
            : (isPrem || isLocked) ? `<span class="lc-state s-lock">🔒</span>` : "";
          const foot = isLocked
            ? `<span class="pill todo">🔒 ${t("locked")}</span>`
            : isPrem
            ? `<button class="ghost prem-btn lc-prem-btn" data-lesson="${l.id}">👑 Premium</button>`
            : `${l.storage_path
                ? `<button class="ghost open-file" data-lesson="${l.id}" data-path="${esc(l.storage_path)}">${t("open")}</button>`
                : `<a class="btn ghost open-link" data-lesson="${l.id}" href="${esc(withLms(l))}" target="_blank" rel="noopener">${t("open")}</a>`}
              ${isDone
                ? `<span class="pill done">${t("completed_pill")}</span>`
                : `<button data-lesson="${l.id}" class="mark">${t("mark_done")}</button>`}`;
          return `
            <div class="lcard ${isDone ? "done" : ""} ${isCurrent ? "current" : ""} ${isLocked ? "locked" : ""} ${isPrem ? "prem" : ""}">
              <div class="lc-thumb lk-${esc(l.kind || "file")}"${l.image_url ? ` style="background-image:url('${esc(l.image_url)}');"` : ""}>
                ${l.image_url ? "" : iconFor(l.kind)}
                <span class="lc-num ${isDone ? "n-done" : (isCurrent ? "n-current" : "")}">${i + 1}</span>
                ${state}
              </div>
              <div class="lc-body">
                <div class="lc-title">${esc(l.title)}</div>
                <span class="lc-kind">${esc(l.kind)}${l.est_minutes ? " · ~" + l.est_minutes + " min" : ""}${isLocked ? " · " + t("locked_hint") : ""}</span>
              </div>
              <div class="lc-foot">${foot}</div>
            </div>`;
        }).join("");

        // Hero banner: image (or color gradient + icon) with a gradient
        // shade and the course facts overlaid, Udemy/Coursera style.
        const isPremCourse = c.tier === "premium";
        const T4 = window.UI ? UI.t2 : (k => k);
        const banner = `
          <div class="course-banner">
            <div class="cb-bg" style="${c.banner_url
              ? `background-image:url('${esc(c.banner_url)}');`
              : `background:linear-gradient(120deg, ${esc(color)}, ${esc(color)}b3);`}">${c.banner_url ? "" : esc(c.icon || "📚")}</div>
            <div class="cb-shade"></div>
            ${c.category ? `<span class="cb-tag">${esc(c.category)}</span>` : ""}
            ${isPremCourse ? `<span class="cb-prem">👑 Premium</span>` : ""}
            <div class="cb-info">
              <div class="cb-title">${c.icon ? esc(c.icon) + " " : ""}${esc(c.title)}</div>
              <div class="cb-stats">
                <span>${pct}%</span>
                <span>${tf("done_count", { d: doneCount, t: ls.length })}</span>
                <span>${ls.length - doneCount} ${T4("lessons_left")}</span>
                ${minsLeft ? `<span>${tf("time_left", { t: fmtDur(minsLeft) })}</span>` : ""}
              </div>
              <div class="cb-bar"><span style="width:${pct}%;"></span></div>
            </div>
          </div>`;

        const isClosed = (c.id in collapsedCourses)
          ? !!collapsedCourses[c.id]
          : (c.id !== defaultOpenId);
        return `
          <div class="card course-card ${isClosed ? "collapsed" : ""}" id="course-${c.id}" style="border-top:4px solid ${esc(color)};">
            ${banner}
            <button class="course-toggle" type="button" data-course="${c.id}">
              <span class="chev">▸</span>
              <span style="flex:1; text-align:left;">${tf("done_count", { d: doneCount, t: ls.length })}</span>
              ${minsLeft ? `<span class="kind">${tf("time_left", { t: fmtDur(minsLeft) })}</span>` : ""}
            </button>
            <div class="course-body"><div>
              ${badgeRow}
              ${c.description ? `<p style="color:var(--muted); font-size:0.88rem; margin:0 0 0.5rem;">${esc(c.description)}</p>` : ""}
              ${rows ? `<div class="lesson-grid">${rows}</div>` : `<p class="empty">${t("no_lessons_course")}</p>`}
              ${complete ? `<div class="congrats">🎉 <span style="flex:1;">${esc(c.title)}${t("congrats")}</span>
                <button class="ghost cert-btn" data-course="${esc(c.title)}" style="flex:none;">🎓 ${T2c("cert_get")}</button>
                <button class="ghost cert-share" data-cid="${c.id}" style="flex:none;" title="${esc(t("cert_share"))}">📣 ${t("cert_share")}</button></div>` : ""}
            </div></div>
          </div>`;
      };

      // ---- study statistics ----
      const dloc = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      const lastNDays = n => { const out = []; for (let i = n - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); out.push(dloc(d)); } return out; };
      const dayMin = {}, activeDates = new Set();
      (myActs || []).forEach(r => {
        if (r.updated_at) activeDates.add(String(r.updated_at).slice(0, 10));
        if (r.kind === "time" && r.key && r.key.startsWith("d:")) {
          const d = r.key.slice(2);
          dayMin[d] = (dayMin[d] || 0) + Math.round((Number(r.value) || 0) / 60);
          activeDates.add(d);
        }
      });
      (mine || []).forEach(p => { if (p.updated_at) activeDates.add(String(p.updated_at).slice(0, 10)); });
      const totalSecs = (myActs || []).filter(r => r.kind === "time" && r.key === "total")
        .reduce((s, r) => s + (Number(r.value) || 0), 0);
      const weekMin = lastNDays(7).reduce((s, d) => s + (dayMin[d] || 0), 0);
      const monthMin = lastNDays(30).reduce((s, d) => s + (dayMin[d] || 0), 0);
      let curStreak = 0;
      { const d = new Date(); while (activeDates.has(dloc(d))) { curStreak++; d.setDate(d.getDate() - 1); } }
      let longestStreak = 0;
      { let run = 0, prev = null;
        [...activeDates].sort().forEach(x => {
          if (prev) { const p = new Date(prev); p.setDate(p.getDate() + 1); run = dloc(p) === x ? run + 1 : 1; }
          else run = 1;
          longestStreak = Math.max(longestStreak, run); prev = x;
        }); }
      // streak about to break? (studied yesterday and before, nothing today)
      let riskStreak = 0;
      if (!activeDates.has(dloc(new Date()))) {
        const rd = new Date(); rd.setDate(rd.getDate() - 1);
        while (activeDates.has(dloc(rd))) { riskStreak++; rd.setDate(rd.getDate() - 1); }
      }
      const streakBar = riskStreak >= 2
        ? `<div class="alert-bar">${tf("streak_risk", { n: riskStreak })}</div>` : "";

      const doneAll = (mine || []).filter(p => p.status === "completed").length;
      const week7 = lastNDays(7);
      const weekDone = (mine || []).filter(p => p.status === "completed" && p.updated_at &&
        week7.includes(String(p.updated_at).slice(0, 10))).length;
      const GOAL = 3;
      const xp = doneAll * 50 + Math.round(totalSecs / 60);
      const level = 1 + Math.floor(xp / 500);
      let badgesEarned = 0;
      (courses || []).forEach(c => {
        const ls = (lessons || []).filter(l => l.course_id === c.id);
        if (!ls.length) return;
        const pct = Math.round(ls.filter(l => done.has(l.id)).length / ls.length * 100);
        [25, 50, 75, 100].forEach(th => { if (pct >= th) badgesEarned++; });
      });
      const fmtHM = s => { const m = Math.round(s / 60); return m >= 60 ? Math.floor(m / 60) + "h " + (m % 60) + "m" : m + " min"; };
      const enc = curStreak >= 3 ? tf("enc_streak", { n: curStreak })
        : ((weekMin > 0 || weekDone > 0) ? t("enc_keep") : t("enc_start"));
      const chartDays = lastNDays(7).map(d => ({
        d, m: dayMin[d] || 0,
        wd: new Date(d + "T12:00:00").toLocaleDateString(LANG === "vi" ? "vi-VN" : "en-US", { weekday: "short" })
      }));
      const maxM = Math.max(1, ...chartDays.map(x => x.m));
      const chart = `<div class="mini-chart">${chartDays.map(x =>
        `<div class="bar" title="${x.d}: ${x.m} min"><span style="height:${Math.max(4, Math.round(x.m / maxM * 100))}%; ${x.m ? "" : "background:var(--line);"}"></span><i>${esc(x.wd)}</i></div>`).join("")}</div>`;
      const statx = (k, v, sub) =>
        `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
      const gPct = Math.min(100, Math.round(weekDone / GOAL * 100));
      const statsCard = `
        <div class="card">
          <h2>${t("my_progress")} <span class="kind" style="float:right;">Lv ${level} · ${xp} XP</span></h2>
          <div class="stat-grid" style="margin-bottom:0.5rem;">
            ${statx("🔥 " + t("streak"), curStreak, longestStreak > curStreak ? "max " + longestStreak : "")}
            ${statx(t("total_time"), fmtHM(totalSecs))}
            ${statx(t("this_week"), weekMin + " min", monthMin + " min " + t("this_month"))}
            ${statx(t("lessons_done"), doneAll)}
            ${statx(t("weekly_goal"), weekDone + "/" + GOAL,
              `<div class="progress" style="margin:0.35rem 0 0;"><span style="width:${gPct}%;"></span></div>`)}
            ${statx("🏅 " + t("badges_earned"), badgesEarned)}
          </div>
          <span class="kind">${t("last7")}</span>
          ${chart}
          <p class="kind" style="margin:0.3rem 0 0;">${enc}</p>
        </div>`;

      // ---- weekly class leaderboard (opt-out in Profile) ----
      const lbCard = (lbRows && lbRows.length && lbRows.some(r => r.xp > 0)) ? `
        <div class="card" style="border-top:4px solid var(--gold);">
          <h2>🏆 ${t("lb_title")}</h2>
          <p class="kind" style="margin:0 0 0.4rem;">${t("lb_hint")}</p>
          ${lbRows.map((r, i) => `
            <div class="lesson" style="padding:0.5rem 0.4rem;${r.student_id === user.id ? " background:rgba(183,130,63,0.09); border-radius:8px;" : ""}">
              <span style="width:1.7rem; text-align:center; font-weight:800; flex:none;">${i < 3 ? ["🥇", "🥈", "🥉"][i] : i + 1}</span>
              ${r.avatar_url
                ? `<img src="${esc(r.avatar_url)}" alt="" style="width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;" />`
                : `<span style="width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:0.72rem;font-weight:700;color:var(--muted);flex:none;">${esc(String(r.full_name || "?").charAt(0).toUpperCase())}</span>`}
              <div class="meta"><div class="title" style="font-weight:600;">${esc(r.full_name || "—")}
                ${r.student_id === user.id ? ` <span class="pill done">${t("lb_you")}</span>` : ""}</div></div>
              <span class="pill todo">${r.xp} XP</span>
            </div>`).join("")}
        </div>` : "";

      // ---- continue learning / next up ----
      const findL = id => (lessons || []).find(x => x.id === id);
      const lastByLesson = {};
      (myActs || []).forEach(r => {
        if (!r.updated_at || !r.lesson_id) return;
        if (!lastByLesson[r.lesson_id] || r.updated_at > lastByLesson[r.lesson_id])
          lastByLesson[r.lesson_id] = r.updated_at;
      });
      let contLesson = null, contIsNext = false;
      const cands = Object.entries(lastByLesson)
        .map(([id, ts]) => ({ l: findL(id), ts }))
        .filter(x => x.l && !done.has(x.l.id) && !lockedSet.has(x.l.id))
        .sort((a, b) => b.ts.localeCompare(a.ts));
      if (cands.length) contLesson = cands[0].l;
      else {
        for (const c of (courses || [])) {
          const ls = (lessons || []).filter(l => l.course_id === c.id);
          const nxt = ls.find(l => !done.has(l.id) && !lockedSet.has(l.id));
          if (nxt) { contLesson = nxt; contIsNext = true; break; }
        }
      }
      const contCourse = contLesson
        ? ((courses || []).find(c => c.id === contLesson.course_id)?.title || t("other_lessons")) : "";

      // the course being studied right now starts expanded; all others
      // start as compact strips (used by courseCard via defaultOpenId)
      defaultOpenId = contLesson?.course_id || (courses || [])[0]?.id || null;
      const heroCard = contLesson ? `
        <div class="card" style="background:linear-gradient(135deg,#1e4f8f,#153a6b); color:#fff; border:none;">
          <p class="eyebrow" style="color:rgba(255,255,255,0.72);">${contIsNext ? t("next_up") : t("continue_learning")}</p>
          <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
            <div style="flex:1; min-width:200px;">
              <div style="font-family:var(--serif); font-size:1.3rem; font-weight:600;">${esc(contLesson.title)}</div>
              <span style="opacity:0.78; font-size:0.85rem;">${esc(contCourse)}${contLesson.est_minutes ? " · ~" + contLesson.est_minutes + " min" : ""}</span>
            </div>
            <button id="cont-open" style="background:#fff; color:#153a6b; border-color:#fff;">
              ${contIsNext ? t("start_learning") : t("continue_learning")} →</button>
          </div>
        </div>` : "";

      const chipRow = `
        <div class="chip-row">
          <button class="chip ${chip === "all" ? "on" : ""}" data-chip="all">${t("chip_all")}</button>
          <button class="chip ${chip === "todo" ? "on" : ""}" data-chip="todo">${t("chip_doing")}</button>
          <button class="chip ${chip === "done" ? "on" : ""}" data-chip="done">${t("chip_done2")}</button>
        </div>`;

      const byCat = {};
      for (const c of (courses || [])) {
        const cat = c.category || t("cat_other");
        (byCat[cat] = byCat[cat] || []).push(c);
      }
      let collapsedCats = {};
      try { collapsedCats = JSON.parse(localStorage.getItem("hub_cats") || "{}"); } catch (e) {}

      const catSections = Object.entries(byCat).map(([cat, cs]) => `
        <div class="cat ${collapsedCats[cat] ? "collapsed" : ""}" data-cat="${esc(cat)}">
          <button class="cat-head" type="button">
            <span class="chev">▸</span>
            <span style="flex:1;">${esc(cat)}</span>
            <span class="kind">${cs.length} ${cs.length === 1 ? "course" : "courses"}</span>
          </button>
          <div class="cat-body"><div>${cs.map(courseCard).join("")}</div></div>
        </div>`).join("");

      const loose = (lessons || []).filter(l => !l.course_id);
      const looseCard = loose.length
        ? `<div class="card"><h2>${t("other_lessons")}</h2><div class="lesson-grid">${loose.map(lessonRow).join("")}</div></div>` : "";

      // Announcements card (RLS already filtered to this student's courses).
      const annBody = s => /<[a-z][\s\S]*>/i.test(s) ? s : esc(s).replace(/\n/g, "<br>");
      const annCard = (anns || []).length ? `
        <div class="card" id="ann-card" style="border-top:4px solid var(--gold);">
          <h2>📣 ${t("announcements")}</h2>
          ${(anns || []).map(a => `
            <div style="padding:0.55rem 0; border-bottom:1px solid var(--line); overflow:hidden;">
              <div class="ann-body" style="font-size:0.92rem;">${annBody(a.body)}</div>
              <span class="kind">${a.course_id
                ? esc((courses || []).find(c => c.id === a.course_id)?.title || "")
                : t("ann_all")} · ${new Date(a.created_at).toLocaleDateString()}</span>
            </div>`).join("")}
        </div>` : "";

      // Instructor panel (teacher profile is readable thanks to migration 8;
      // the row itself was prefetched in the parallel batch above).
      const teacher = (teachers || [])[0];
      const zaloUrl = "https://zalo.me/0961923983";
      const instructorCard = `
        <div class="card" style="border-top:4px solid var(--gold);">
          <h2>${t("your_teacher")}</h2>
          <div style="display:flex; gap:1.1rem; align-items:flex-start; flex-wrap:wrap;">
            ${teacher?.avatar_url
              ? `<img src="${esc(teacher.avatar_url)}" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:none;" />`
              : ""}
            <div style="flex:1; min-width:220px;">
              <div style="font-weight:700; font-size:1.05rem;">${esc(teacher?.full_name || "Thầy Lê Quốc Thông")}</div>
              <div class="creds">
                <span class="cred-badge">🎓 Master of TESOL</span>
                <span class="cred-badge">VSTEP C1 (9.0)</span>
                <span class="cred-badge">IELTS 7.5</span>
                <span class="cred-badge">HSK 5 (276/300)</span>
              </div>
              ${teacher?.bio ? `<p style="color:var(--muted); font-size:0.88rem; margin:0 0 0.7rem;">${esc(teacher.bio)}</p>` : ""}
              <a class="btn" href="${zaloUrl}" target="_blank" rel="noopener"
                 style="text-decoration:none; display:inline-block;">💬 ${t("zalo_chat")}: 0961 923 983</a>
            </div>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent(zaloUrl)}"
                 alt="Zalo QR" width="110" height="110" loading="lazy" decoding="async"
                 style="border:1px solid var(--line); border-radius:8px; flex:none;" />
          </div>
        </div>`;
      const hubFooter = `<footer class="hub-footer">Designed by Thầy Lê Quốc Thông · 📞 Zalo: 0961 923 983</footer>`;

      // ("me" was prefetched in the parallel batch above.)
      // Subscription visibility: quiet line normally, warning when close.
      let accessNote = "";
      if (me?.access_expires) {
        const t0 = new Date(); t0.setHours(0, 0, 0, 0);
        const daysLeft = Math.round((new Date(me.access_expires) - t0) / 86400000);
        const dShow = new Date(me.access_expires).toLocaleDateString();
        if (daysLeft >= 0 && daysLeft <= 7) {
          accessNote = `
            <div class="alert-bar" style="display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap;">
              <span style="flex:1;">${daysLeft === 0 ? t("acc_today") : tf("acc_warn", { n: daysLeft, d: dShow })}</span>
              <a class="btn ghost" href="https://zalo.me/0961923983" target="_blank" rel="noopener"
                 style="text-decoration:none; flex:none;">💬 ${t("contact_teacher")}</a>
            </div>`;
        } else if (daysLeft > 7) {
          accessNote = `<p class="kind" style="margin:-0.4rem 0 0.9rem;">${tf("acc_line", { n: daysLeft, d: dShow })}</p>`;
        }
      }

      const avatar = me?.avatar_url
        ? `<img src="${esc(me.avatar_url)}" alt="" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:1px solid var(--line);" />`
        : `<div style="width:84px;height:84px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:2rem;color:var(--muted);">${esc((me?.full_name || user.email || "?").charAt(0).toUpperCase())}</div>`;

      const profileCard = `
        <div class="card">
          <h2>${t("my_profile")}</h2>
          <div style="display:flex; gap:1.25rem; align-items:flex-start; flex-wrap:wrap;">
            <div style="text-align:center;">
              ${avatar}
              <input type="file" id="p-file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;" />
              <button class="ghost" id="p-pick" style="margin-top:0.6rem;">${t("change_photo")}</button>
            </div>
            <div style="flex:1; min-width:230px;">
              <div class="field"><label>${t("my_name")}</label>
                <input id="p-name" value="${esc(me?.full_name || "")}" placeholder="${esc(t("ph_name"))}" /></div>
              <div class="field"><label>${t("about_me")}</label>
                <input id="p-bio" value="${esc(me?.bio || "")}" placeholder="${esc(t("ph_bio"))}" /></div>
              <button id="p-save">${t("save_profile")}</button>
              <p id="p-msg" class="msg"></p>
              ${lbPref === null ? "" : `
              <label style="font-size:0.85rem; color:var(--muted); cursor:pointer; display:block; margin-top:0.5rem;">
                <input type="checkbox" id="p-lb" ${lbPref ? "checked" : ""} /> 🏆 ${t("lb_show_me")}
              </label>`}
            </div>
          </div>
        </div>`;

      const T2 = window.UI ? UI.t2 : (k => k);
      const todayStr = new Date().toISOString().slice(0, 10);
      const asgnCard = (myAsgns || []).length ? `
        <div class="card" id="asgn-card" style="border-top:4px solid var(--tone-purple);">
          <h2>📝 ${T2("asgn")}</h2>
          ${(myAsgns || []).map(a => {
            const sub = (mySubs || []).find(s => s.assignment_id === a.id);
            const late = a.due_on && a.due_on < todayStr && !sub;
            const pill = sub
              ? (sub.status === "graded"
                 ? `<span class="pill done">${T2("graded")}${sub.grade != null ? ": " + sub.grade + (a.points ? "/" + a.points : "") : ""}</span>`
                 : `<span class="pill todo">${T2("submitted")}</span>`)
              : (late ? `<span class="pill bad">${T2("overdue")}</span>`
                      : `<span class="pill todo">${T2("not_submitted")}</span>`);
            return `
            <div class="lesson" style="flex-wrap:wrap;">
              <div class="meta">
                <div class="title">${esc(a.title)}</div>
                <span class="kind">${esc((courses || []).find(c => c.id === a.course_id)?.title || "")}${a.due_on ? " · " + T2("due") + " " + esc(a.due_on) : ""}${a.points ? " · " + a.points + " pt" : ""}</span>
                ${a.instructions ? `<div style="font-size:0.88rem; white-space:pre-wrap; margin-top:0.25rem;">${esc(a.instructions)}</div>` : ""}
              </div>
              ${pill}
              ${sub?.status === "graded"
                ? (sub.feedback ? `<div style="flex-basis:100%; font-size:0.88rem; color:var(--muted);">💬 ${esc(sub.feedback)}</div>` : "")
                : `<div style="flex-basis:100%;">
                     <textarea class="as-body" data-id="${a.id}" placeholder="${esc(T2("your_answer"))}" style="min-height:72px;">${esc(sub?.body || "")}</textarea>
                     <div style="display:flex; gap:0.6rem; align-items:center; margin-top:0.4rem; flex-wrap:wrap;">
                       <button class="as-submit" data-id="${a.id}">${sub ? T2("edit_answer") : T2("submit_answer")}</button>
                       <span class="kind">${T2("editable_note")}</span>
                     </div>
                   </div>`}
            </div>`;
          }).join("")}
        </div>` : "";

      const discCard = (courses || []).length ? `
        <div class="card" id="disc-card" style="border-top:4px solid var(--tone-teal);">
          <h2>💬 ${T2("disc")}
            <select id="dc-course" style="float:right; width:auto; max-width:220px; font-size:0.85rem; padding:0.35rem 0.5rem;">
              ${(courses || []).map(c => `<option value="${c.id}">${esc(c.title)}</option>`).join("")}
            </select></h2>
          <div id="dc-body"></div>
        </div>` : "";

      // upcoming class sessions (next hour onwards, max 5)
      const upSess = (mySessions || []).filter(s =>
        new Date(s.starts_at).getTime() >= Date.now() - 3600e3).slice(0, 5);
      const schedCard = upSess.length ? `
        <div class="card" style="border-top:4px solid var(--tone-cyan);">
          <h2>🗓️ ${T2c("upcoming")}</h2>
          ${upSess.map(s => `
            <div class="lesson">
              <div class="meta">
                <div class="title">${esc(s.title)}</div>
                <span class="kind">${new Date(s.starts_at).toLocaleString()} · ${s.duration_min || 60} min${
                  s.course_id ? " · " + esc((courses || []).find(c => c.id === s.course_id)?.title || "") : ""}${
                  s.notes ? " · " + esc(s.notes) : ""}</span>
              </div>
              ${s.location ? (/^https?:\/\//.test(s.location)
                ? `<a class="btn ghost" href="${esc(s.location)}" target="_blank" rel="noopener" style="text-decoration:none;">${T2c("join")}</a>`
                : `<span class="pill done">${esc(s.location)}</span>`) : ""}
            </div>`).join("")}
        </div>` : "";

      // teacher materials, grouped by course
      const matsCard = (myMats || []).length ? `
        <div class="card" style="border-top:4px solid var(--tone-amber);">
          <h2>📎 ${T2c("materials_student")}</h2>
          ${(myMats || []).map(m => `
            <div class="lesson">
              <span class="icon">${m.storage_path ? "📎" : "🔗"}</span>
              <div class="meta">
                <div class="title">${esc(m.title)}</div>
                <span class="kind">${esc((courses || []).find(c => c.id === m.course_id)?.title || "")}</span>
              </div>
              <button class="ghost mat-open" data-id="${m.id}">${T2c("open_btn")}</button>
            </div>`).join("")}
        </div>` : "";

      // suggested review: lessons whose best quiz score is under 70%
      const bestScore = {};
      (myActs || []).forEach(r => {
        if (r.kind === "activity" && r.key !== "opened" && Number(r.max_value) > 1) {
          const ratio = (Number(r.value) || 0) / Number(r.max_value);
          if (!(r.lesson_id in bestScore) || ratio > bestScore[r.lesson_id])
            bestScore[r.lesson_id] = ratio;
        }
      });
      const reviewList = Object.entries(bestScore)
        .filter(([lid, rt]) => rt < 0.7 && findL(lid))
        .sort((a, b) => a[1] - b[1]).slice(0, 3);
      const reviewCard = reviewList.length ? `
        <div class="card" style="border-top:4px solid var(--tone-rose);">
          <h2>💡 ${T2c("review_title")}</h2>
          <p class="kind" style="margin:0 0 0.4rem;">${T2c("review_hint")}</p>
          ${reviewList.map(([lid, rt]) => `
            <div class="lesson">
              <div class="meta">
                <div class="title">${esc(findL(lid).title)}</div>
                <span class="kind">${Math.round(rt * 100)}%</span>
              </div>
              <button class="ghost rev-open" data-id="${lid}">${T2c("review_go")}</button>
            </div>`).join("")}
        </div>` : "";

      // ---- flashcard decks (SM-2 spaced repetition) ----
      const dstrLoc = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      const fcToday = dstrLoc(new Date());
      const revBy = {};
      myRevs.forEach(r => { revBy[r.card_id] = r; });
      const NEW_PER_DAY = 10;
      const deckStats = (courses || []).map(c => {
        const cs = myCards.filter(k => k.course_id === c.id);
        if (!cs.length) return null;
        const due = cs.filter(k => revBy[k.id] && revBy[k.id].due_on <= fcToday).length;
        const fresh = Math.min(cs.filter(k => !revBy[k.id]).length, NEW_PER_DAY);
        const locked = !isPremUser && c.tier === "premium";
        return { c, total: cs.length, due, fresh, locked };
      }).filter(Boolean);
      const flashPane = deckStats.length ? `
        <div class="card" style="border-top:4px solid var(--tone-purple);">
          <h2>🃏 ${t("flash_tab")}</h2>
          <p class="kind" style="margin:0 0 0.5rem;">${t("flash_hint")}</p>
          ${deckStats.map(d => `
            <div class="lesson">
              <span class="icon">${esc(d.c.icon || "🃏")}</span>
              <div class="meta">
                <div class="title">${esc(d.c.title)}</div>
                <span class="kind">${d.due} ${t("flash_due")} · ${d.fresh} ${t("flash_new")} · ${d.total} 🃏</span>
              </div>
              ${d.locked
                ? `<button class="ghost prem-btn lc-prem-btn">👑 Premium</button>`
                : (d.due + d.fresh
                   ? `<button class="fc-start" data-course="${d.c.id}">${t("flash_start")} · ${d.due + d.fresh}</button>`
                   : `<span class="pill done" title="${esc(t("flash_all_done"))}">✓</span>`)}
            </div>`).join("")}
        </div>`
        : `<div class="card"><p class="empty">${t("flash_none")}</p></div>`;

      const T2p = window.UI ? UI.t2 : (k => k);
      const anyPremiumContent = (lessons || []).some(l => tierOf(l) === "premium");
      const premBar = isPremUser
        ? `<p class="kind" style="margin:-0.4rem 0 0.9rem;">👑 ${T2p("premium_active")}${mePlan?.premium_until ? " → " + esc(mePlan.premium_until) : ""}</p>`
        : (anyPremiumContent ? `
          <div class="alert-bar" style="display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap;">
            <span style="flex:1;">👑 ${T2p("upgrade_hint")}</span>
            <button id="upg-open" class="ghost" style="flex:none;">${T2p("upgrade")}</button>
          </div>` : "");

      /* ---------- Phase 65: trang chủ học viên hướng-khóa-học ----------
         Dùng lại dữ liệu đã tải (courses, lessons, done, thống kê). Thẻ khóa
         học gọn có thanh tiến độ; bấm "Tiếp tục học" nhảy sang tab Khóa học
         và mở đúng khóa (giữ nguyên phần bài học chi tiết bên dưới). */
      const stuCovers = ["linear-gradient(140deg,#2b5c86,#0f3f4a)","linear-gradient(140deg,#3a4f86,#1c2b57)",
                         "linear-gradient(140deg,#7a4a2e,#3a2418)","linear-gradient(140deg,#4a6a3e,#243d20)"];
      let __cix = 0;
      function stuCourseCard(c){
        const ls = (lessons || []).filter(l => l.course_id === c.id);
        const total = ls.length, dn = ls.filter(l => done.has(l.id)).length;
        const pct = total ? Math.round(dn / total * 100) : 0;
        const cat = c.category || t("cat_other");
        const cov = c.banner_url
          ? `style="background-image:url('${esc(c.banner_url)}')"`
          : `style="background:${stuCovers[(__cix++) % stuCovers.length]}"`;
        return `
          <article class="stu-cc" data-course-open="${esc(c.id)}">
            <div class="stu-cov" ${cov}>
              <span class="tag">${esc(cat)}</span>
              ${c.tier === "premium" ? `<span class="prem">👑 Premium</span>` : ""}
              ${c.banner_url ? "" : `<span class="zh">${esc(c.title)}</span>`}
            </div>
            <div class="stu-cb">
              <h3>${c.icon ? esc(c.icon) + " " : ""}${esc(c.title)}</h3>
              <div class="meta"><span>${esc(cat)}</span><i></i><span>${tf("done_count", { d: dn, t: total })}</span></div>
              <div class="stu-pct"><span>${total ? tf("done_count", { d: dn, t: total }) : t("no_lessons_course")}</span><b>${pct}%</b></div>
              <div class="stu-bar"><i style="width:${pct}%"></i></div>
              <div class="foot"><button class="stu-btn" type="button" data-course-open="${esc(c.id)}">
                ${pct >= 100 ? t("chip_done2") : (pct > 0 ? t("continue_learning") : t("start_learning"))} →</button></div>
            </div>
          </article>`;
      }
      const stuMine = (courses || []).slice().sort((a, b) => {
        const pf = c => { const ls = (lessons || []).filter(l => l.course_id === c.id);
          const tt = ls.length, d2 = ls.filter(l => done.has(l.id)).length;
          const p = tt ? d2 / tt : 0; return p >= 1 ? 2 : (p > 0 ? 0 : 1); };
        return pf(a) - pf(b);
      });
      const stuMineGrid = stuMine.length
        ? `<div class="stu-grid">${stuMine.map(stuCourseCard).join("")}</div>`
        : `<div class="card"><p class="empty">${t("not_enrolled")}</p></div>`;

      /* Khóa học khác để khám phá — lấy từ public_courses, bỏ khóa đã ghi danh */
      const enrolledIds = new Set((courses || []).map(c => c.id));
      const stuOther = (window.__pubCourses || []).filter(c => !enrolledIds.has(c.id));
      function stuOtherCard(c){
        const cov = c.banner_url
          ? `style="background-image:url('${esc(c.banner_url)}')"`
          : `style="background:${stuCovers[(__cix++) % stuCovers.length]}"`;
        const prem = c.tier === "premium";
        return `
          <a class="stu-cc" href="course.html?id=${encodeURIComponent(c.id)}" style="text-decoration:none">
            <div class="stu-cov" ${cov}>
              <span class="tag">${esc(c.category || t("cat_other"))}</span>
              ${prem ? `<span class="prem">👑 Premium</span>` : ""}
              ${c.banner_url ? "" : `<span class="zh">${esc(c.title)}</span>`}
            </div>
            <div class="stu-cb">
              <h3>${c.icon ? esc(c.icon) + " " : ""}${esc(c.title)}</h3>
              <div class="meta"><span>${esc(c.category || t("cat_other"))}</span></div>
              <div class="foot">
                <span class="stu-badge ${prem ? "" : "free"}">${prem ? "👑 Premium" : t("free")}</span>
                <span class="stu-btn ghost">${t("preview") || "Xem thử"} →</span>
              </div>
            </div>
          </a>`;
      }
      const stuOtherGrid = stuOther.length
        ? `<section class="stu-sec"><div class="stu-sec-h"><h2>${t("explore_more") || "Khám phá thêm"}</h2>
             <a class="stu-sec-h" href="course.html" style="color:var(--accent-ink);font-weight:700;font-size:.9rem">${t("all_courses") || "Tất cả khóa học"} →</a></div>
             <div class="stu-grid">${stuOther.slice(0, 6).map(stuOtherCard).join("")}</div></section>`
        : "";

      /* Công cụ học tập — thẻ, không phải danh sách sidebar */
      const stuMod = window.__modules || {};
      const stuOn = k => stuMod[k] !== false;
      const toolCards = [
        { tab: "flash", ic: "🗂️", tt: t("flash_tab"), td: t("tool_flash_d") || "Ôn từ vựng bằng thẻ ghi nhớ" },
        stuOn("reading") ? { href: "reading.html", ic: "📖", tt: "Đọc hiểu HSK 阅读", td: t("tool_read_d") || "Bài đọc theo cấp độ, có pinyin" } : null,
        stuOn("shadow") ? { href: "shadow.html", ic: "🎤", tt: "Shadow Chinese 跟读", td: t("tool_shadow_d") || "Nói theo video, chấm phát âm" } : null,
        stuOn("writing") ? { href: "writing.html", ic: "✍️", tt: "Tập viết chữ Hán 写字", td: t("tool_write_d") || "Luyện thứ tự nét từng chữ" } : null,
        stuOn("dictation") ? { href: "dictation.html", ic: "🎧", tt: "Nghe chép chính tả 听写", td: t("tool_dict_d") || "Nghe và chép lại từng câu" } : null,
        { tab: "asgn", ic: "📋", tt: t("tool_asgn_t"), td: t("tool_asgn_d") },
        { tab: "community", ic: "💬", tt: t("tool_disc_t"), td: t("tool_disc_d") }
      ].filter(Boolean);
      const stuTools = `<div class="stu-tools-grid">${toolCards.map(tc => {
        const inner = `<span class="ti">${tc.ic}</span><span><span class="tt">${esc(tc.tt)}</span><br><span class="td">${esc(tc.td)}</span></span><span class="arw">→</span>`;
        return tc.href
          ? `<a class="stu-tool" href="${tc.href}">${inner}</a>`
          : `<button class="stu-tool" type="button" data-gototab="${tc.tab}">${inner}</button>`;
      }).join("")}</div>`;

      /* Hero chào mừng */
      const stuName = me?.full_name ? esc(me.full_name) : "";
      const stuHero = `
        <section class="stu-hero">
          <span class="kick">${curStreak >= 1 ? tf("streak_chip", { n: curStreak }) || ("🔥 " + curStreak + " ngày liên tiếp") : (t("welcome") || "Chào mừng")}</span>
          <h1>${(t("welcome_back") || "Chào mừng trở lại")}${stuName ? ", " + stuName : ""}!</h1>
          <p>${t("hero_motivate") || "Hôm nay học tiếp một chút nhé — đều đặn mỗi ngày là bí quyết chắc chắn nhất để tiến bộ."}</p>
          <div class="stu-chips">
            <span class="stu-chip">⏱ <b>${monthMin}</b>&nbsp;${t("min_this_month") || "phút tháng này"}</span>
            <span class="stu-chip">✅ <b>${doneAll}</b>&nbsp;${t("lessons_done") || "bài đã xong"}</span>
            <span class="stu-chip">🎯 <b>${(courses || []).length}</b>&nbsp;${t("courses_word") || "khóa học"}</span>
          </div>
          ${contLesson ? `<div class="cont"><button id="cont-open">${contIsNext ? (t("start_learning")) : (t("continue_learning"))} →</button></div>` : ""}
        </section>`;

      app.innerHTML = `
        ${accessNote}
        ${premBar}
        <div class="tabpane" data-tab="home">
          ${streakBar}
          ${stuHero}
          <div class="search-wrap">
            <input id="hub-search" placeholder="${esc(t("search_ph"))}" autocomplete="off" />
            <div id="search-results" class="search-results" style="display:none;"></div>
          </div>
          <section class="stu-sec"><div class="stu-sec-h"><h2>${t("your_courses")}</h2></div>
            ${stuMineGrid}</section>
          ${stuOtherGrid}
          <section class="stu-sec" id="stu-tools"><div class="stu-sec-h"><h2>${t("learning_tools") || "Công cụ học tập"}</h2></div>
            ${stuTools}</section>
          <div class="stu-more"><div class="stu-more-grid">
            ${schedCard}${statsCard}${lbCard}${annCard}
          </div></div>
        </div>
        <div class="tabpane" data-tab="courses">
          <div id="my-classes"></div>
          ${chipRow}
          ${catSections || `<div class="card"><p class="empty">${t("not_enrolled")}</p></div>`}
          ${looseCard}
          ${matsCard}
          ${reviewCard}
        </div>
        <div class="tabpane" data-tab="flash">
          ${flashPane}
        </div>
        <div class="tabpane" data-tab="asgn">
          <div id="hsk-hw"></div>
          ${asgnCard || (`<div class="card" id="asgn-empty"><p class="empty">${T2p("no_asgn_student")}</p></div>`)}
        </div>
        <div class="tabpane" data-tab="community">
          ${discCard || `<div class="card"><p class="empty">${T2p("no_data")}</p></div>`}
        </div>
        <div class="tabpane" data-tab="profile">
          ${instructorCard}
          ${profileCard}
        </div>
        ${hubFooter}`;

      // --- Lớp của tôi (Phase 29) — read-only; RLS shows only classes I'm in ---
      (async function myClasses() {
        const box = document.getElementById("my-classes");
        if (!box) return;
        const cs = await sb.from("class_students").select("class_id").eq("student_id", user.id);
        if (cs.error || !(cs.data || []).length) return;   // table missing, or not in any class
        const cl = await sb.from("classes").select("*")
          .in("id", cs.data.map(r => r.class_id)).order("starts_on", { ascending: true });
        if (cl.error || !(cl.data || []).length) return;
        const tIds = [...new Set(cl.data.map(c => c.teacher_id).filter(Boolean))];
        const tr = tIds.length
          ? await sb.from("profiles").select("id, full_name, email").in("id", tIds)
          : { data: [] };
        const tName = id => {
          const p = (tr.data || []).find(x => x.id === id);
          return p ? (p.full_name || p.email) : "";
        };
        const cTitle = id => ((courses || []).find(c => c.id === id) || {}).title || "";
        const ST = { upcoming: "Sắp mở", active: "Đang học",
                     completed: "Kết thúc", archived: "Lưu trữ" };
        const PILL = { upcoming: "todo", active: "done", completed: "off", archived: "bad" };
        box.innerHTML = `
          <div class="card">
            <div class="card-head"><h2>🎓 Lớp của tôi</h2></div>
            ${cl.data.map(c => `
              <div class="lesson">
                <div>
                  <b>${esc(c.name)}</b>
                  <span class="pill ${PILL[c.status] || ""}">${ST[c.status] || ""}</span>
                  <span class="kind">${esc(cTitle(c.course_id))}${
                    c.teacher_id ? " · Giáo viên: " + esc(tName(c.teacher_id)) : ""}${
                    c.schedule ? " · " + esc(c.schedule) : ""}${
                    c.starts_on ? " · từ " + esc(c.starts_on) : ""}${
                    c.ends_on ? " → " + esc(c.ends_on) : ""}</span>
                </div>
              </div>`).join("")}
          </div>`;
      })();

      /* ---- Bài tập tiếng Trung (HSK Slides giao cho lớp) — Phase 80 ----
         RLS chỉ trả về bài được giao cho tôi. Điểm/tiến độ lấy từ hsk_attempts.
         Bấm Bắt đầu/Tiếp tục → mở hsk-slides.html?hw=<id>&lesson=<mã bài>. */
      (async function hskHomework() {
        const box = document.getElementById("hsk-hw");
        if (!box) return;
        let hwRes;
        try { hwRes = await sb.from("hsk_homework").select("*").order("due_at", { ascending: true, nullsFirst: false }); }
        catch (e) { return; }                          // migration66 chưa chạy
        if (hwRes.error || !(hwRes.data || []).length) return;
        const hws = hwRes.data;
        const lids = [...new Set(hws.map(h => h.lesson_id))];
        const clids = [...new Set(hws.map(h => h.class_id).filter(Boolean))];
        const [lRes, atRes, cRes] = await Promise.all([
          sb.from("hsk_lessons").select("lesson_id, title, hsk_level").in("lesson_id", lids),
          sb.from("hsk_attempts").select("homework_id, status, score, attempt_no").eq("user_id", user.id).not("homework_id", "is", null),
          clids.length ? sb.from("classes").select("id, name").in("id", clids) : Promise.resolve({ data: [] })
        ]);
        const lMap = {}; (lRes.data || []).forEach(l => lMap[l.lesson_id] = l);
        const cMap = {}; (cRes.data || []).forEach(c => cMap[c.id] = c.name);
        const now = Date.now();
        const fmt = ts => { if (!ts) return ""; const d = new Date(ts);
          return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };

        const rows = hws.map(h => {
          // Nếu chưa đọc được hàng hsk_lessons (chưa chạy migration67, hay bài
          // chưa đăng) vẫn HIỆN bài đã giao — dùng tiêu đề của bài giao/mã bài —
          // để học viên không bị "mất" bài; mở được hay không tuỳ quyền đọc.
          const les = lMap[h.lesson_id] || { title: h.title || h.lesson_id, hsk_level: null };
          const mine = (atRes.data || []).filter(a => a.homework_id === h.id);
          const used = mine.length;
          const best = mine.reduce((m, a) => Math.max(m, a.score || 0), 0);
          const doneAtt = mine.some(a => a.status === "completed");
          const open = mine.find(a => a.status !== "completed");
          const notStarted = h.start_at && new Date(h.start_at).getTime() > now;
          const overdue = h.due_at && new Date(h.due_at).getTime() < now && !doneAtt;
          const passed = doneAtt && (!h.required_score || best >= h.required_score);
          const outOfTries = h.max_attempts > 0 && used >= h.max_attempts && !open;

          let pill;
          if (passed) pill = `<span class="pill done">Hoàn thành · ${best}%</span>`;
          else if (doneAtt) pill = `<span class="pill bad">Chưa đạt · ${best}% (cần ${h.required_score}%)</span>`;
          else if (open) pill = `<span class="pill todo">Đang làm · ${open.score || 0}%</span>`;
          else if (overdue) pill = `<span class="pill bad">Quá hạn</span>`;
          else pill = `<span class="pill todo">Chưa làm</span>`;

          const canGo = !notStarted && !(outOfTries && !passed);
          const label = open ? "Tiếp tục ▸" : (doneAtt ? "Làm lại ▸" : "Bắt đầu ▸");
          const href = "hsk-slides.html?hw=" + encodeURIComponent(h.id) + "&lesson=" + encodeURIComponent(h.lesson_id);
          const meta = [
            cMap[h.class_id] ? "Lớp " + esc(cMap[h.class_id]) : "",
            les.hsk_level ? "HSK " + les.hsk_level : "",
            h.due_at ? "Hạn: " + esc(fmt(h.due_at)) : "",
            h.required_score ? "Cần đạt " + h.required_score + "%" : "",
            h.max_attempts ? "Lượt: " + used + "/" + h.max_attempts : (used ? "Đã làm " + used + " lượt" : "")
          ].filter(Boolean).join(" · ");

          return `
            <div class="lesson" style="flex-wrap:wrap;">
              <div class="meta">
                <div class="title">${esc(h.title || les.title)}</div>
                <span class="kind">${meta}</span>
                ${notStarted ? `<div style="font-size:.85rem;color:var(--muted);margin-top:.2rem;">Mở lúc ${esc(fmt(h.start_at))}</div>` : ""}
                ${outOfTries && !passed ? `<div style="font-size:.85rem;color:var(--muted);margin-top:.2rem;">Đã hết lượt làm</div>` : ""}
              </div>
              ${pill}
              <div style="flex-basis:100%;margin-top:.4rem;">
                ${canGo
                  ? `<a class="btn ghost" href="${href}" style="text-decoration:none;display:inline-block;">${label}</a>`
                  : `<button class="ghost" disabled>${notStarted ? "Chưa mở" : "Hết lượt"}</button>`}
              </div>
            </div>`;
        }).filter(Boolean).join("");
        if (!rows) return;
        const emptyMsg = document.getElementById("asgn-empty");
        if (emptyMsg) emptyMsg.remove();
        box.innerHTML = `
          <div class="card" style="border-top:4px solid var(--tone-red,#c0392b);">
            <h2>🀄 Bài tập tiếng Trung</h2>

      // --- flashcard review session (SM-2 spaced repetition) ---
      function startReview(courseId) {
        const cs = myCards.filter(k => k.course_id === courseId);
        const due = cs.filter(k => revBy[k.id] && revBy[k.id].due_on <= fcToday);
        const fresh = cs.filter(k => !revBy[k.id]).slice(0, NEW_PER_DAY);
        const queue = [...due, ...fresh].sort(() => Math.random() - 0.5);
        if (!queue.length) return;
        let doneN = 0;
        const ov = document.createElement("div");
        ov.className = "cert-overlay";
        document.body.appendChild(ov);
        const finish = () => { ov.remove(); renderStudent(); };

        function show() {
          if (!queue.length) {
            ov.innerHTML = `
              <div class="modal" style="max-width:380px; text-align:center;">
                <div style="font-size:2.4rem;">🎉</div>
                <h3 style="font-family:var(--serif); margin:0.3rem 0;">${t("flash_done_t")}</h3>
                <p style="color:var(--muted);">${tf("flash_done_m", { n: doneN })}</p>
                <button id="fr-close">OK</button>
              </div>`;
            ov.querySelector("#fr-close").addEventListener("click", finish);
            return;
          }
          const card = queue[0];
          ov.innerHTML = `
            <div class="modal" style="max-width:440px; text-align:center;">
              <div class="kind" style="text-align:right;">${queue.length} ${t("flash_left")}</div>
              <div style="font-family:var(--serif); font-size:2.3rem; line-height:1.3; margin:1.1rem 0 0.4rem; overflow-wrap:anywhere;">${esc(card.front)}</div>
              <div id="fr-back" style="display:none;">
                ${card.reading ? `<div style="color:var(--muted); font-size:1.08rem;">${esc(card.reading)}</div>` : ""}
                <div style="font-size:1.3rem; font-weight:700; margin-top:0.5rem;">${esc(card.back)}</div>
                ${card.example ? `<div style="color:var(--muted); font-size:0.92rem; margin-top:0.6rem; overflow-wrap:anywhere;">${esc(card.example)}</div>` : ""}
                <div style="display:flex; gap:0.45rem; justify-content:center; margin-top:1.3rem; flex-wrap:wrap;">
                  <button class="ghost fr-g" data-g="0" style="color:var(--danger); border-color:var(--danger);">${t("flash_again")}</button>
                  <button class="ghost fr-g" data-g="3">${t("flash_hard")}</button>
                  <button class="fr-g" data-g="4">${t("flash_good")}</button>
                  <button class="fr-g" data-g="5" style="background:var(--success); border-color:var(--success);">${t("flash_easy")}</button>
                </div>
              </div>
              <button id="fr-flip" style="margin-top:1.1rem;">${t("flash_show")}</button>
              <div style="margin-top:0.9rem;"><button class="ghost" id="fr-x" style="font-size:0.85rem;">✕</button></div>
            </div>`;
          ov.querySelector("#fr-flip").addEventListener("click", () => {
            ov.querySelector("#fr-back").style.display = "block";
            ov.querySelector("#fr-flip").style.display = "none";
          });
          ov.querySelector("#fr-x").addEventListener("click", finish);
          ov.querySelectorAll(".fr-g").forEach(b => b.addEventListener("click", async () => {
            ov.querySelectorAll(".fr-g").forEach(x => (x.disabled = true));
            const g = Number(b.getAttribute("data-g"));
            const prev = revBy[card.id] || { ease: 2.5, interval_days: 0, reps: 0 };
            let ease = Number(prev.ease) || 2.5;
            let interval = Number(prev.interval_days) || 0;
            let reps = Number(prev.reps) || 0;
            if (g < 3) { reps = 0; interval = 0; }
            else {
              reps += 1;
              interval = reps === 1 ? 1 : reps === 2 ? 6 : Math.max(1, Math.round(interval * ease));
              ease = Math.max(1.3, ease + (0.1 - (5 - g) * (0.08 + (5 - g) * 0.02)));
            }
            const dd = new Date(); dd.setDate(dd.getDate() + interval);
            const rec = { student_id: user.id, card_id: card.id, ease,
                          interval_days: interval, reps, due_on: dstrLoc(dd),
                          last_grade: g, updated_at: new Date().toISOString() };
            revBy[card.id] = rec;
            // save in the background — the next card appears instantly
            sb.from("flashcard_reviews")
              .upsert(rec, { onConflict: "student_id,card_id" }).then(() => {});
            queue.shift();
            if (g < 3) queue.push(card);   // failed → comes back this session
            else doneN++;
            show();
          }));
        }
        show();
      }

                  <div class="field"><textarea id="dr-body" placeholder="${esc(T("reply_ph"))}" style="min-height:64px;"></textarea></div>
                  <button id="dr-send">${T("reply")}</button>
                </div>`}`;
            document.getElementById("dc-back").addEventListener("click", () => {
              window.__dcT = null; renderDisc();
            });
            const send = document.getElementById("dr-send");
            if (send) send.addEventListener("click", async () => {
              const bodyTxt = document.getElementById("dr-body").value.trim();
              if (!bodyTxt) return;
              const { error } = await sb.from("discussion_posts").insert({
                thread_id: th.id, author_id: user.id, author_name: myName2, body: bodyTxt });
              if (error) { if (window.UI) UI.toast(T("err_post") + error.message, "err"); return; }
              if (window.UI) UI.toast(T("reply_posted"));
              renderDisc();
            });
          }
        }
        sel.addEventListener("change", () => { window.__dcT = null; renderDisc(); });
        renderDisc();
      })();

      wireFileButtons(app);

      // --- collapsible course cards (state remembered per device) ---
      const toggleCourse = cardEl => {
        cardEl.classList.toggle("collapsed");
        const cid = cardEl.id.replace("course-", "");
        collapsedCourses[cid] = cardEl.classList.contains("collapsed");
        try { localStorage.setItem("hub_courses_closed", JSON.stringify(collapsedCourses)); } catch (e) {}
      };
      app.querySelectorAll(".course-toggle").forEach(h =>
        h.addEventListener("click", () => toggleCourse(h.closest(".course-card"))));
      // a collapsed strip expands when tapped anywhere on the banner
      app.querySelectorAll(".course-card .course-banner").forEach(b =>
        b.addEventListener("click", () => {
          const cardEl = b.closest(".course-card");
          if (cardEl.classList.contains("collapsed")) toggleCourse(cardEl);
        }));

      // --- collapsible categories (state remembered per device) ---
      app.querySelectorAll(".cat-head").forEach(h => {
        h.addEventListener("click", () => {
          const catEl = h.parentElement;
          catEl.classList.toggle("collapsed");
          collapsedCats[catEl.getAttribute("data-cat")] = catEl.classList.contains("collapsed");
          try { localStorage.setItem("hub_cats", JSON.stringify(collapsedCats)); } catch (e) {}
        });
      });

      // --- instant search across courses and lessons ---
      const sInput = document.getElementById("hub-search");
      const sBox = document.getElementById("search-results");
      const normTxt = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const sIndex = [
        ...(anns || []).map(a => ({ type: "ann", title: stripHtml(a.body).slice(0, 70) || "🖼", sub: t("announcements"), obj: a })),
        ...(courses || []).map(c => ({ type: "course", title: c.title, sub: c.category || "", obj: c })),
        ...(lessons || []).map(l => ({
          type: "lesson", title: l.title,
          sub: (courses || []).find(c => c.id === l.course_id)?.title || t("other_lessons"), obj: l
        }))
      ];
      const hiLite = (text, q) => {
        const i = text.toLowerCase().indexOf(q.toLowerCase());
        if (i < 0) return esc(text);
        return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
      };
      const logOpen = lid => {
        const ua = navigator.userAgent;
        const dtp = /iPad|Tablet/i.test(ua) ? "tablet"
          : (/Mobi|iPhone|Android.*Mobile/i.test(ua) ? "mobile" : "desktop");
        let dt = null; try { dt = localStorage.getItem("hub_device"); } catch (e) {}
        sb.from("access_events").insert({
          student_id: user.id, lesson_id: lid, event: "lesson_open",
          device: dt, device_type: dtp, agent: ""
        }).then(() => {});
      };
      const openLesson = l => {
        if (lockedSet.has(l.id)) { alert(t("locked_hint")); return; }
        if (premLocked.has(l.id)) { logLock(l.id); showUpgrade(l.id); return; }
        if (l.storage_path) logOpen(l.id);   // tracked pages log themselves
        sb.from("lesson_activity").upsert({
          student_id: user.id, lesson_id: l.id, kind: "activity",
          key: "opened", value: 1, max_value: 1, updated_at: new Date().toISOString()
        }, { onConflict: "student_id,lesson_id,kind,key" }).then(() => {});
        if (l.storage_path) {
          sb.storage.from("materials").createSignedUrl(l.storage_path, 3600)
            .then(({ data, error }) => {
              if (error) alert(t("file_open_fail") + error.message);
              else window.open(data.signedUrl, "_blank", "noopener");
            });
        } else window.open(withLms(l), "_blank", "noopener");
      };
      app.querySelectorAll(".rev-open").forEach(btn => btn.addEventListener("click", () => {
        const l = findL(btn.getAttribute("data-id"));
        if (l) openLesson(l);
      }));

      const contBtn = document.getElementById("cont-open");
      if (contBtn && contLesson) contBtn.addEventListener("click", () => openLesson(contLesson));

      app.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
        try { localStorage.setItem("hub_chip", b.getAttribute("data-chip")); } catch (e) {}
        renderStudent();
      }));

      sInput.addEventListener("input", debounce(() => {
        const q = sInput.value.trim();
        if (!q) { sBox.style.display = "none"; sBox.innerHTML = ""; return; }
        const nq = normTxt(q);
        const hits = sIndex.filter(it => normTxt(it.title).includes(nq) || normTxt(it.sub).includes(nq)).slice(0, 8);
        sBox.innerHTML = hits.length
          ? hits.map(it => `
              <button class="res" data-i="${sIndex.indexOf(it)}">
                <span>${it.type === "course" ? "📚" : it.type === "ann" ? "📣" : iconFor(it.obj.kind)}</span>
                <span style="flex:1;">${hiLite(it.title, q)}<br><span class="kind">${esc(it.sub)}</span></span>
              </button>`).join("")
          : `<div class="res" style="cursor:default;">${t("no_results")}</div>`;
        sBox.style.display = "block";
        sBox.querySelectorAll("button.res").forEach(b => b.addEventListener("click", () => {
          const it = sIndex[Number(b.getAttribute("data-i"))];
          sBox.style.display = "none"; sInput.value = "";
          if (it.type === "lesson") { openLesson(it.obj); return; }
          const el = it.type === "ann"
            ? document.getElementById("ann-card")
            : document.getElementById("course-" + it.obj.id);
          if (el) {
            if (window.__stuShowTab) window.__stuShowTab(it.type === "ann" ? "home" : "courses");
            const catEl = el.closest(".cat");
            if (catEl) catEl.classList.remove("collapsed");
            if (el.classList.contains("course-card")) el.classList.remove("collapsed");
            el.scrollIntoView({ behavior: "smooth", block: "start" });
            el.classList.add("flash");
            setTimeout(() => el.classList.remove("flash"), 1400);
          }
        }));
      }, 150));
      sInput.addEventListener("keydown", e => { if (e.key === "Escape") sBox.style.display = "none"; });
      if (!window.__hubDocClick) {
        window.__hubDocClick = true;
        document.addEventListener("click", e => {
          const box = document.getElementById("search-results");
          if (box && !e.target.closest(".search-wrap")) box.style.display = "none";
        });
      }

      // Record that the student opened a lesson (any type).
      app.querySelectorAll(".open-link, .open-file").forEach(el => {
        el.addEventListener("click", () => {
          const lid = el.getAttribute("data-lesson");
          if (!lid) return;
          if (el.classList.contains("open-file")) logOpen(lid);  // tracked pages log themselves
          sb.from("lesson_activity").upsert({
            student_id: user.id, lesson_id: lid, kind: "activity",
            key: "opened", value: 1, max_value: 1,
            updated_at: new Date().toISOString()
          }, { onConflict: "student_id,lesson_id,kind,key" }).then(() => {});
        });
      });

      app.querySelectorAll(".mark").forEach(btn => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          const lesson_id = btn.getAttribute("data-lesson");
          const { error } = await sb.from("progress").upsert(
            { student_id: user.id, lesson_id, status: "completed", updated_at: new Date().toISOString() },
            { onConflict: "student_id,lesson_id" }
          );
          if (error) { btn.disabled = false; alert(t("save_retry")); return; }
          renderStudent();
        });
      });
      window.scrollTo(0, __scrollY);
    }

    // ---------- ADMIN VIEW ----------
    async function renderAdmin() {
      const __scrollY = window.scrollY;

      // First visit: skeleton cards instead of a blank page.
      if (!app.querySelector(".tabpane") && window.UI) app.innerHTML = UI.skeleton(3);

      /* ── FIRST-PAINT SPEED ──────────────────────────────────────────────
         The heavy analytics/monitoring tables (progress, lesson_activity,
         access_events, lock_events, page_views, dict_days) grow without bound
         as students use the platform and were the real reason the dashboard
         sat on the skeleton for ~10s: the single Promise.all waited for the
         SLOWEST of all queries before ANY tab could paint. They feed only the
         Analytics / Students / Dictation / Visitors panes, so we now fetch them
         in the BACKGROUND (heavyP) and let the content tabs paint from the light
         "essential" queries. Those panes fill in via heavyReady when the data
         lands — no query was dropped, none is looped per-row, and nothing is
         merely hidden earlier: the blocking work itself is off the paint path. */
      const heavyP = Promise.all([
        // Every student's progress (feeds Analytics + the Students table).
        sb.from("progress")
          .select("student_id, lesson_id, status, updated_at")
          .order("updated_at", { ascending: false }),
        sb.from("access_events")
          .select("student_id, lesson_id, event, device, device_type, agent, created_at")
          .order("created_at", { ascending: false })
          .limit(2000),
        sb.from("lesson_activity")
          .select("student_id, lesson_id, kind, key, value, max_value, updated_at")
          .order("updated_at", { ascending: false }),
        sb.from("lock_events").select("lesson_id, student_id, created_at")
          .order("created_at", { ascending: false }).limit(2000),
        // landing-page visits, last 30 days (needs migration 24)
        sb.from("page_views").select("path, ref, device, created_at")
          .gte("created_at", new Date(Date.now() - 30 * 86400000).toISOString())
          .order("created_at", { ascending: false }).limit(1000),
        // dictation daily stats (needs migration 31)
        sb.from("dict_days").select("user_id, day, sent, ok, total, listen_sec")
          .order("day", { ascending: false }).limit(5000)
      ]);

      // Essential content — everything the manage-content tabs need to draw NOW.
      // All run IN PARALLEL — one round trip.
      const [
        { data: lessons }, { data: students }, { data: courses },
        { data: enrollments }, { data: anns }, { data: skeys }, { data: orgs },
        { data: allLics }, cardsRes, rtRes0, raRes, rsRes, svRes, saRes, ssRes,
        cpRes, psRes, spRes, vsRes, hsRes
      ] = await Promise.all([
        sb.from("lessons").select("*").order("sort_order").order("created_at"),
        sb.from("profiles")
          .select("id, full_name, email, role, org_id, avatar_url, bio, multi_device, access_start, access_expires, suspended, plan, premium_until")
          .order("created_at"),
        sb.from("courses").select("*").order("sort_order").order("created_at"),
        // profiles must be joined via the student link explicitly: enrollments has
        // TWO links to profiles (student_id + teacher_id since migration14), and an
        // ambiguous join makes the whole query fail → the list showed "No enrollments yet"
        sb.from("enrollments")
          .select("id, student_id, course_id, profiles!student_id(full_name, email), courses(title)")
          .order("created_at"),
        sb.from("announcements").select("*").order("created_at", { ascending: false }),
        sb.from("share_keys").select("*").order("created_at", { ascending: false }),
        sb.from("organizations").select("id, name, kind").order("name"),
        sb.from("course_licenses").select("org_id, course_id, seats, expires_on"),
        // flashcard decks (needs migration 23 — stays empty until then)
        sb.from("flashcards").select("*").order("sort_order").order("created_at"),
        // reading hub content + access (need migrations 25/26)
        sb.from("reading_texts")
          .select("id, title, level, tags, category, tier, audience, published, sort_order, created_at, lang")
          .order("sort_order").order("level").order("created_at"),
        sb.from("reading_access").select("*").order("created_at"),
        sb.from("reading_settings").select("free_limit").eq("id", 1).maybeSingle(),
        // shadowing videos + access (need migrations 27/28)
        sb.from("shadow_videos")
          .select("id, yt, title, level, tier, published, sort_order, created_by, created_at")
          .order("sort_order").order("created_at"),
        sb.from("shadow_access").select("*").order("created_at"),
        sb.from("shadow_settings").select("free_limit").eq("id", 1).maybeSingle(),
        // course pricing + payment settings (need migration 46)
        sb.from("course_pricing").select("course_id, config"),
        sb.from("payment_settings").select("config").eq("id", 1).maybeSingle(),
        sb.from("section_pricing").select("section, config"),
        sb.from("vsat_exams").select("*").order("sort_order").order("created_at"),
        sb.from("hsk_lessons").select("*").order("hsk_level").order("sort_order").order("created_at")
      ]);

      // Heavy results land later; the panes that use them fill in via heavyReady.
      // Kept empty until then so eagerly-rendered code never sees `undefined`.
      let prog = [], events = [], activity = [], lockEvents = [], pageViews = null, ddRes = { data: [] };
      const heavyReady = heavyP.then(r => {
        prog = r[0].data || []; events = r[1].data || []; activity = r[2].data || [];
        lockEvents = r[3].data || []; pageViews = r[4].data || null; ddRes = r[5] || { data: [] };
      }, () => { /* offline / RLS error → panes show their normal empty state */ });

      /* `lang` only exists after migration51. If the column is missing the
         reading query fails, so ask again without it: the Reading tab keeps
         working and simply finds no English texts until the migration runs. */
      /* vsat_exams only exists after migration52 — until then the tab shows
         an empty list instead of breaking the whole dashboard */
      /* migration53: vsat_exams là kho chung cho nhiều kỳ thi, cột `kind`
         quyết định đề thuộc kỳ nào. Đề tải lên TRƯỚC migration53 chưa có
         cột này nên mặc định coi là V-SAT. */
      const vsAll = (vsRes && !vsRes.error && vsRes.data) ? vsRes.data : [];
      /* hsk_lessons chỉ có sau migration55 — chưa chạy thì tab hiện danh sách rỗng
         thay vì làm hỏng cả bảng điều khiển */
      let hskRows = (hsRes && !hsRes.error && hsRes.data) ? hsRes.data : [];
      let vsRows = vsAll.filter(r => !r.kind || r.kind === "vsat");
      let vpRows = vsAll.filter(r => r.kind === "vstep-reading");
      let vlRows = vsAll.filter(r => r.kind === "vstep-listening");
      let rtRes = rtRes0;
      if (rtRes.error && /lang/i.test(rtRes.error.message || "")) {
        rtRes = await sb.from("reading_texts")
          .select("id, title, level, tags, category, tier, audience, published, sort_order, created_at")
          .order("sort_order").order("level").order("created_at");
      }
      let cards = cardsRes.data || [];

      const courseName = id => (courses || []).find(c => c.id === id)?.title || null;

      // account status: active / expiring / expired / suspended (+unlimited)
      const accStatus = s => {
        if (s.role !== "student") return { key: "active", unlimited: true };
        if (s.suspended) return { key: "suspended" };
        if (!s.access_expires) return { key: "active", unlimited: true };
        const t0 = new Date(); t0.setHours(0, 0, 0, 0);
        const days = Math.round((new Date(s.access_expires) - t0) / 86400000);
        if (days < 0) return { key: "expired", days: 0 };
        if (days <= 7) return { key: "expiring", days };
        return { key: "active", days };
      };
      const stuWarn = (students || []).filter(s => s.role === "student")
        .filter(s => ["expired", "expiring"].includes(accStatus(s).key)).length;
      const studentName = s => s.full_name || s.email || "—";
      const onlyStudents = (students || []).filter(s => s.role === "student");

      const lessonRowHtml = l => {
        const cc = (courses || []).find(x => x.id === l.course_id);
        const ccol = cc?.color || "#1e4f8f";
        const badge = cc
          ? `<span class="pill" style="background:${esc(ccol)}22; color:${esc(ccol)}; flex:none;">${esc(cc.title)}</span>`
          : `<span class="pill todo" style="flex:none;">no course</span>`;
        return `
        <div class="lesson">
          <span class="adm-thumb lk-${esc(l.kind || "file")}"${l.image_url ? ` style="background-image:url('${esc(l.image_url)}');"` : ""}>${l.image_url ? "" : iconFor(l.kind)}</span>
          <div class="meta">
            <div class="title">${esc(l.title)}</div>
            <span class="kind">#${l.sort_order ?? 0} · ${esc(l.kind)} · ${l.storage_path ? "uploaded file" : esc(l.url || "")}</span>
          </div>
          ${(l.tier || cc?.tier) === "premium" ? `<span class="pill todo" style="flex:none;">👑</span>` : ""}
          ${badge}
          <button class="ghost l-img" data-id="${l.id}" title="${l.image_url ? "Replace the cover image" : "Upload a cover image"}">🖼${l.image_url ? " ↻" : " +"}</button>
          ${l.image_url ? `<button class="ghost l-img-del" data-id="${l.id}" title="Remove the cover image" style="color:var(--danger); border-color:var(--danger);">🖼 ✕</button>` : ""}
          ${l.storage_path ? `<button class="ghost open-file" data-path="${esc(l.storage_path)}">Open</button>` : ""}
          <input type="number" class="l-min-edit" data-id="${l.id}" value="${l.est_minutes ?? ""}"
                 min="0" placeholder="min" title="Estimated minutes" style="max-width:70px; flex:none;" />
          <select class="l-tier" data-id="${l.id}" style="max-width:105px;" title="Access tier">

            <option value="">— no course —</option>

              `<option value="${c.id}" ${l.course_id === c.id ? "selected" : ""}>${esc(c.title)}</option>`).join("")}
          </select>
          <button class="ghost l-save" data-id="${l.id}">Save</button>

                  style="color:var(--danger); border-color:var(--danger);">Delete</button>
        </div>
        <div class="l-editrow" data-id="${l.id}" style="display:none; padding:0.7rem 0 1rem; border-bottom:1px solid var(--line);">
          <div class="form-row">

              <input class="le-title" data-id="${l.id}" value="${esc(l.title)}" /></div>
            <div class="field"><label>${l.storage_path ? "Uploaded file (link not editable)" : "Link (URL)"}</label>
              <input class="le-url" data-id="${l.id}" value="${esc(l.storage_path ? l.storage_path : (l.url || ""))}" ${l.storage_path ? "disabled" : ""} /></div>
            <div class="field" style="max-width:90px;"><label>Order</label>
              <input type="number" class="le-order" data-id="${l.id}" value="${l.sort_order ?? 0}" min="0" /></div>
            <button class="le-save" data-id="${l.id}">Save changes</button>
            <button class="ghost le-cancel" data-id="${l.id}">Cancel</button>
          </div>
          <p class="msg le-msg" data-id="${l.id}"></p>
        </div>`;
      };

      const courseOptions = (courses || []).map(c =>
        `<option value="${c.id}">${esc(c.title)}</option>`).join("");
      const studentOptions = onlyStudents.map(s =>
        `<option value="${s.id}">${esc(studentName(s))}</option>`).join("");

      const courseList = (courses || []).map(c => `
        <div class="lesson">
          <span style="width:14px;height:14px;border-radius:50%;background:${esc(c.color || "#1e4f8f")};flex:none;"></span>
          <div class="meta"><div class="title">${c.icon ? esc(c.icon) + " " : ""}${esc(c.title)}</div>
            <span class="kind">${(lessons || []).filter(l => l.course_id === c.id).length} lessons${c.category ? " · " + esc(c.category) : ""}${c.sequential ? " · in order" : ""}${c.description ? " · " + esc(c.description) : ""}</span></div>
          <button class="ghost c-students" data-id="${c.id}" title="See, enroll or remove this course's students">🎓 Students</button>
          <button class="ghost c-edit" data-id="${c.id}">✏️ Edit</button>
        </div>
        <div class="c-editrow" data-id="${c.id}" style="display:none; padding:0.7rem 0 1rem; border-bottom:1px solid var(--line);">
          <div class="form-row">
            <div class="field"><label>Title</label><input class="ce-title" data-id="${c.id}" value="${esc(c.title)}" /></div>
            <div class="field"><label>Description</label><input class="ce-desc" data-id="${c.id}" value="${esc(c.description || "")}" /></div>
            <div class="field" style="max-width:140px;"><label>Category</label><input class="ce-cat" data-id="${c.id}" value="${esc(c.category || "")}" placeholder="Chinese / IELTS…" /></div>
            <div class="field" style="max-width:90px;"><label>Color</label>
              <input type="color" class="ce-color" data-id="${c.id}" value="${esc(c.color || "#1e4f8f")}" style="height:42px; padding:0.2rem;" /></div>
            <div class="field" style="max-width:100px;"><label>Icon</label>
              <input class="ce-icon" data-id="${c.id}" value="${esc(c.icon || "")}" maxlength="4" placeholder="🀄" /></div>
            <div class="field" style="max-width:135px;"><label>Access</label>
              <select class="ce-tier" data-id="${c.id}">
                <option value="free" ${c.tier !== "premium" ? "selected" : ""}>Free</option>
                <option value="premium" ${c.tier === "premium" ? "selected" : ""}>👑 Premium</option>
              </select></div>
            <div class="field" style="max-width:210px;"><label>Banner</label>
              <input type="file" class="ce-banner" data-id="${c.id}" accept="image/*" style="padding:0.42rem;" /></div>
            <div class="field" style="max-width:120px;"><label>Unlock</label>
              <label style="font-size:0.85rem; color:var(--muted); cursor:pointer; display:block; padding:0.6rem 0;">
                <input type="checkbox" class="ce-seq" data-id="${c.id}" ${c.sequential ? "checked" : ""} /> in order
              </label></div>
            <button class="ce-save" data-id="${c.id}">Save</button>
            <button class="ghost ce-cancel" data-id="${c.id}">Cancel</button>
            <button class="ghost ce-del" data-id="${c.id}"
                    style="color:var(--danger); border-color:var(--danger);">🗑 Delete course</button>
          </div>
          <p class="msg ce-msg" data-id="${c.id}"></p>
        </div>`).join("");

      const enrollmentRows = (enrollments || []).map(e => `
        <tr class="en-row" data-course="${esc(e.course_id || "")}"
            data-q="${esc(((e.profiles?.full_name || "") + " " + (e.profiles?.email || "")).toLowerCase())}">
          <td>${esc(e.profiles?.full_name || e.profiles?.email || "—")}</td>
          <td>${esc(e.courses?.title || "—")}</td>
