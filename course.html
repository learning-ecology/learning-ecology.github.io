<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Bắt tay sẵn với hai máy chủ ngoài ngay khi trình duyệt đọc phần đầu trang:
       DNS + TCP + TLS chạy song song với việc tải trang, nên lượt gọi dữ
       liệu đầu tiên không phải chờ bắt tay nữa (~200–500 ms ở đường VN).
       supabase.co gọi bằng fetch CORS nên cần crossorigin; jsdelivr nạp
       bằng thẻ script thường nên KHÔNG được thêm, thêm vào là phí một kết nối. -->
  <link rel="preconnect" href="https://lqeetnlfqmarlqmbxusn.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <title>Khóa học — Learning Ecology</title>
  <link rel="canonical" href="https://learningecology.io.vn/course.html" />
  <meta name="description" content="Xem toàn bộ nội dung khóa học và học thử các bài miễn phí — Learning Ecology." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Khóa học — Learning Ecology" />
  <meta property="og:image" content="https://learningecology.io.vn/social-card.png?v=2" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" />
  <script>
    try { var __t = localStorage.getItem("hub_theme");
      if (__t === "dark" || (!__t && matchMedia("(prefers-color-scheme: dark)").matches))
        document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="icons/logo-64.png" />
  <meta name="theme-color" content="#17263e" />

  <style>
    /* ============ TRANG XEM TRƯỚC CÔNG KHAI — giao diện ấm, bo tròn (Phase 61)
       Học cách trình bày của youpass.vn: thân thiện, nhiều khoảng thở, nút bo
       tròn, thẻ mềm — NHƯNG giữ bản sắc Learning Ecology (navy + vàng gold).
       MỌI quy tắc ở đây chỉ áp cho trang này (bọc trong body.pv / .pv) nên
       không đụng tới styles.css dùng chung với bảng điều khiển. ============ */
    :root {
      --pv-bg: #faf7f2;        /* kem ấm thay cho xám lạnh */
      --pv-card: #ffffff;
      --pv-soft: #f4efe6;      /* nền mục phụ */
      --pv-ink: #17263e;
      --pv-ring: rgba(183,130,63,.35);
      --pv-font: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --pv-pill: 999px;
    }
    :root[data-theme="dark"] {
      --pv-bg: #0e1826; --pv-card: #16233a; --pv-soft: #1a2942; --pv-ink: #eaf0f8;
      --pv-ring: rgba(224,190,120,.28);
    }
    body.pv { overflow-x: hidden; background: var(--pv-bg); font-family: var(--pv-font); }
    body.pv .btn, body.pv button.btn, body.pv .ghost { font-family: var(--pv-font); }

    /* ---- header: giữ navy, nút bo tròn viên thuốc ---- */
    .lp-header {
      position: sticky; top: 0; z-index: 60;
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.7rem clamp(1rem, 4vw, 2.5rem);
      background: var(--lp-header-bg, rgba(23,38,62,0.96));
      backdrop-filter: blur(8px); color: var(--lp-header-text, #fff);
    }
    .lp-header img { width: 34px; height: 34px; border-radius: 9px; object-fit: contain; }
    .lp-header .name { font-family: var(--serif); font-size: 1.16rem; font-weight: 700; }
    .lp-header .spacer { flex: 1 1 auto; }
    .lp-header .btn.ghost, .lp-header #cp-theme {
      color: var(--lp-header-text, #fff); border-radius: var(--pv-pill);
      border-color: color-mix(in srgb, var(--lp-header-text, #fff) 42%, transparent);
      text-decoration: none;
    }
    .lp-header .btn:not(.ghost) {
      background: var(--lp-btn, var(--accent)); border-color: var(--lp-btn, var(--accent));
      color: var(--lp-btn-text, #fff); text-decoration: none; border-radius: var(--pv-pill); font-weight: 700;
    }
    .lp-header .btn:not(.ghost):hover { background: var(--lp-btn-hover, var(--accent-ink)); }


    /* ---- thanh danh mục (mega-menu) dính đầu trang (Phase 62) ----
       Gom khóa học & công cụ vào ít danh mục; chi tiết chỉ hiện khi rê chuột
       (máy tính) hoặc chạm (điện thoại). Menu con position:absolute nên mở ra
       KHÔNG đẩy layout. */
    .pv-nav { position: sticky; top: 52px; z-index: 40;
      background: color-mix(in srgb, var(--pv-bg) 90%, transparent); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line); }
    .pv-nav-in { max-width: 1280px; margin: 0 auto; padding: .5rem clamp(1rem,4vw,2rem);
      display: flex; align-items: center; gap: .5rem .8rem; flex-wrap: wrap; }
    /* KHÔNG dùng overflow ở đây: overflow-x sẽ cắt mất menu con thả xuống.
       Ít danh mục nên cho xuống dòng trên màn nhỏ thay vì cuộn ngang. */
    .pv-cats { display: flex; flex-wrap: wrap; gap: .45rem; flex: 1 1 auto; min-width: 0; }
    /* Ô tìm kiếm khóa học/công cụ — nằm trong thanh dính, luôn thấy khi cuộn. */
    .pv-search { flex: 0 0 auto; }
    .pv-search input { width: min(240px, 60vw); font: inherit; font-size: .9rem;
      padding: .48rem .9rem; border: 1.5px solid var(--line); border-radius: var(--pv-pill);
      background: var(--pv-card); color: var(--ink); }
    .pv-search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
    @media (max-width: 600px) { .pv-search { flex: 1 1 100%; } .pv-search input { width: 100%; } }

    .pv-cat { position: relative; }
    .pv-cat-btn { display: inline-flex; align-items: center; gap: .45rem; white-space: nowrap;
      background: var(--pv-card); border: 1.5px solid var(--line); border-radius: var(--pv-pill);
      padding: .5rem .95rem; cursor: pointer; color: var(--ink); font: inherit;
      font-weight: 800; font-size: .93rem; transition: border-color .15s, background .15s, transform .12s; }
    .pv-cat-btn:hover { border-color: var(--pv-ring); transform: translateY(-1px); }
    .pv-cat-ic { font-size: 1.05rem; line-height: 1; }
    .pv-cat-n { font-size: .72rem; font-weight: 800; color: var(--muted);
      background: var(--pv-soft); border-radius: 999px; padding: .04rem .42rem; }
    /* danh mục chứa mục đang xem: nổi bật navy */
    .pv-cat.has-active > .pv-cat-btn { border-color: var(--accent); background: var(--info-bg); color: var(--accent-ink); }
    :root[data-theme="dark"] .pv-cat.has-active > .pv-cat-btn { color: #cfe0f6; }
    .pv-cat.has-active > .pv-cat-btn .pv-cat-n { background: color-mix(in srgb, var(--accent) 18%, transparent); color: inherit; }

    /* Tiêu đề nhóm con (VSTEP · IELTS · V-SAT…) trong lưới thẻ khóa. */
    .cg-sub { font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      color: var(--muted); margin: 1.3rem 0 .6rem; }
    .cg-sub:first-of-type { margin-top: .2rem; }

    /* ---- vùng nội dung ---- */
    .pv-main { max-width: 1280px; margin: 0 auto; min-width: 0;
      padding: clamp(1.2rem,4vw,2rem) clamp(1rem,4vw,2rem) 3rem; }
    /* On phones, drop the "explore homepage" promo strip and tighten the top so
       the actual courses appear in the first screen instead of below a stack of
       banners. (The owner can still show/hide it site-wide from the dashboard.) */
    @media (max-width: 700px) {
      .se-promo { display: none !important; }
      .pv-main { padding-top: 1rem; }
    }
    .cp-mobilesel { display: none !important; }
    .cp-content .course-banner, .pv-main .course-banner { margin: 0 0 1.1rem; border-radius: 18px; }
    /* Ảnh khóa học (banner): LẤP ĐẦY khung gọn gàng (cover) + canh giữa, không
       méo. Dùng tỉ lệ khung vừa phải (5:2) thay cho khung quá dẹt → cắt ít đi
       nhiều mà vẫn đầy khung; tự co theo bề rộng nên đáp ứng mọi màn hình, mọi
       khung cùng một tỉ lệ + bo góc. (Phase 102) */
    /* Cap the hero height so the lesson list is visible without scrolling past a
       huge cover; the image stays "cover" so it never distorts. (Phase 132) */
    body.pv .course-banner { height: auto; aspect-ratio: 5 / 2; max-height: clamp(180px, 32vh, 320px); }
    body.pv .course-banner .cb-bg { background-size: cover; background-position: center;
      background-repeat: no-repeat; }
    @media (max-width: 640px) { body.pv .course-banner { aspect-ratio: 2 / 1; max-height: 34vh; } }
    .cp-desc { color: var(--muted); margin: 0 0 1.2rem; max-width: 72ch; }
    .cp-note { color: var(--muted); font-size: .95rem; margin: 0 0 1.1rem; }
    .cp-lead { font-size: 1.05rem; color: var(--muted); margin: .9rem 0 .2rem; }

    .cp-bens { list-style: none; padding: 0; margin: .6rem 0 1.3rem; display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: .5rem 1rem; }
    .cp-bens li { display: flex; gap: .55rem; align-items: flex-start; font-size: .98rem; }
    .cp-bens li span { color: var(--success); font-weight: 900; }

    .cp-cta { display: flex; gap: .7rem; flex-wrap: wrap; margin: .6rem 0 1.4rem; }
    body.pv .btn { border-radius: var(--pv-pill); font-weight: 800; padding: .62rem 1.3rem; }
    .cp-gold { background: linear-gradient(135deg,#f4d68a,#d9a53c) !important;
      border-color: #d9a53c !important; color: #5a3d0e !important; font-weight: 800; }
    .cb-price { font-weight: 800; color: #f4d68a; }

    /* ---- thẻ bài học: bo tròn hơn, bóng mềm, nút viên thuốc ---- */
    body.pv .lesson-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.1rem; }
    body.pv .lcard { background: var(--pv-card); border: 1.5px solid var(--line); border-radius: 18px;
      box-shadow: 0 10px 26px -20px rgba(23,38,62,.4); }
    body.pv .lcard:hover { transform: translateY(-4px);
      box-shadow: 0 22px 42px -22px rgba(23,38,62,.5); border-color: var(--pv-ring); }
    body.pv .lcard.prem { border-color: #e2c074; }
    body.pv .lc-body { padding: .9rem 1rem .4rem; }
    body.pv .lc-title { font-size: 1.02rem; font-weight: 800; }
    body.pv .lc-foot { padding: .5rem 1rem 1rem; display: flex; align-items: center;
      justify-content: space-between; gap: .5rem; }
    body.pv .lc-foot .btn, body.pv .lc-foot .ghost { border-radius: var(--pv-pill); padding: .45rem 1rem; }
    .cp-badge { font-size: .74rem; font-weight: 800; padding: .18rem .6rem; border-radius: 999px; }
    .cp-badge.free { background: var(--success-bg); color: var(--success); }
    .cp-badge.prem { background: rgba(183,130,63,0.18); color: var(--gold); }

    /* ---- Breadcrumb (Khóa học & Tài liệu › Danh mục › Khóa) ---- */
    .cp-crumbs { display: flex; flex-wrap: wrap; align-items: center; margin: 0 0 1.1rem; font-size: .9rem; line-height: 1.5; }
    .cp-crumbs a { color: var(--accent-ink); text-decoration: none; border-radius: 6px;
      max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cp-crumbs a:hover { text-decoration: underline; }
    .cp-crumbs a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .cp-crumbs .sep { color: var(--muted); margin: 0 .4rem; flex: none; }
    .cp-crumbs .cur { color: var(--muted); font-weight: 700;
      max-width: 52vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 560px) { .cp-crumbs { font-size: .84rem; }
      .cp-crumbs a, .cp-crumbs .cur { max-width: 34vw; } .cp-crumbs .sep { margin: 0 .28rem; } }

    /* ---- Compact course thumbnails grid (mọi danh mục) ---- */
    .cg-h { font-family: var(--serif); font-size: 1.3rem; margin: .1rem 0 1rem; color: var(--pv-ink); }
    /* Fill the row (auto-fit) and centre a short row so few courses don't leave
       a big empty margin on wide screens; cards keep a comfortable 240–330px. */
    .cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 330px));
      justify-content: center; gap: 1.1rem; margin: 0 0 1.4rem; }
    @media (max-width: 600px) { .cgrid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .7rem; } }
    .ccard { display: flex; flex-direction: column; text-decoration: none; color: inherit;
      background: var(--pv-card); border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden;
      box-shadow: 0 10px 26px -20px rgba(23,38,62,.4);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
    .ccard:hover { transform: translateY(-3px); box-shadow: 0 20px 40px -22px rgba(23,38,62,.5); border-color: var(--pv-ring); }
    .ccard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .ccard.prem { border-color: #e2c074; }
    .cc-thumb { position: relative; aspect-ratio: 16 / 9; background-size: cover; background-position: center;
      background-repeat: no-repeat; display: grid; place-items: center; font-size: 2rem;
      color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
    .cc-badge { position: absolute; top: .5rem; left: .5rem; font-size: .68rem; font-weight: 800;
      padding: .16rem .55rem; border-radius: 999px; }
    .cc-badge.free { background: rgba(22,124,84,.94); color: #fff; }
    .cc-badge.prem { background: linear-gradient(135deg,#f4d68a,#d9a53c); color: #5a3d0e; }
    .cc-body { padding: .6rem .75rem .75rem; display: flex; flex-direction: column; gap: .35rem; flex: 1; }
    .cc-title { font-weight: 800; font-size: .95rem; line-height: 1.25; color: var(--pv-ink);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cc-desc { color: var(--muted); font-size: .82rem; line-height: 1.4; margin: -.05rem 0 .1rem;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cc-stats { color: var(--muted); font-size: .78rem; margin-top: auto; display: flex; flex-wrap: wrap; gap: .05rem .5rem; }
    @media (max-width: 600px) { .cc-title { font-size: .88rem; } .cc-stats { font-size: .72rem; } .cc-thumb { font-size: 1.6rem; } }

    /* ---- so sánh Miễn phí ↔ Premium (mượn ý youpass) ---- */
    .pv-cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1.6rem 0 .4rem; }
    @media (max-width: 640px) { .pv-cmp { grid-template-columns: 1fr; } }
    .pv-cmp-col { background: var(--pv-card); border: 1.5px solid var(--line); border-radius: 18px;
      padding: 1.2rem 1.2rem 1.3rem; display: flex; flex-direction: column; }
    .pv-cmp-col.prem { border-color: #e2c074; background:
        linear-gradient(180deg, rgba(183,130,63,.08), transparent 55%), var(--pv-card); }
    .pv-cmp-h { font-family: var(--serif); font-size: 1.15rem; margin: 0 0 .2rem; color: var(--pv-ink); }
    .pv-cmp-sub { color: var(--muted); font-size: .88rem; margin: 0 0 .8rem; }
    .pv-cmp-col ul { list-style: none; padding: 0; margin: 0 0 1rem; display: grid; gap: .5rem; }
    .pv-cmp-col li { display: flex; gap: .55rem; align-items: flex-start; font-size: .96rem; }
    .pv-cmp-col li span { flex: none; font-weight: 900; }
    .pv-cmp-col.free li span { color: var(--success); }
    .pv-cmp-col.prem li span { color: var(--gold); }
    .pv-cmp-col .btn { margin-top: auto; align-self: flex-start; }

    .cp-unlock { margin-top: 1.6rem; border: 1.5px solid color-mix(in srgb, var(--gold) 30%, var(--line));
      border-radius: 20px; padding: 1.5rem; text-align: center; background:
        radial-gradient(90% 130% at 50% -10%, rgba(183,130,63,.12), transparent 60%), var(--pv-card); }
    .cp-unlock h3 { margin: 0 0 .4rem; font-family: var(--serif); }
    .cp-unlock p { margin: 0 0 1rem; color: var(--muted); }
    .cp-unlock .btn { text-decoration: none; margin: 0 .3rem .3rem 0; }
    /* "Bên trong Premium" — bảng liệt kê bài Premium sẽ mở khóa (Phase 134) */
    .cp-inside { margin: 1.3rem 0 0; border: 1px solid var(--line); border-radius: 16px;
      padding: 1rem 1.2rem; background: var(--pv-soft); }
    .cp-inside h3 { margin: 0 0 .25rem; font-size: 1.08rem; }
    .cp-inside-sub { margin: 0 0 .7rem; color: var(--muted); }
    .cp-inside-list { margin: 0; padding-left: 1.5rem; display: grid; gap: .4rem; counter-reset: none; }
    .cp-inside-list li { padding-left: .2rem; }
    .cp-inside-list .ci-t { font-weight: 700; }
    .cp-inside-list .ci-m { color: var(--muted); font-size: .85rem; margin-left: .5rem; white-space: nowrap; }
    .cp-inside-tip { margin: .8rem 0 0; color: var(--muted); font-size: .92rem; }
    /* Cảm nhận học viên (social proof) — Phase 135 */
    .tm-sec { margin: 2.2rem 0 .5rem; }
    .tm-h { font-family: var(--serif); margin: 0 0 .9rem; }
    .tm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .tm-card { background: var(--pv-card); border: 1px solid var(--line); border-radius: 16px;
      padding: 1rem 1.1rem; box-shadow: 0 10px 26px -22px rgba(23,38,62,.35);
      display: flex; flex-direction: column; gap: .7rem; }
    .tm-quote { margin: 0; font-size: .95rem; line-height: 1.5; color: var(--pv-ink); }
    .tm-quote::before { content: "\201C"; color: var(--accent); font-weight: 800; margin-right: .08rem; }
    .tm-who { display: flex; align-items: center; gap: .6rem; margin: 0; }
    .tm-av { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
      background: var(--info-bg); color: var(--accent-ink); font-weight: 800; }
    .tm-av-img { object-fit: cover; }
    .tm-meta { display: flex; flex-direction: column; line-height: 1.2; }
    .tm-role { color: var(--muted); font-size: .8rem; }

    /* ---- cửa sổ đọc thử + hộp khóa (giữ nguyên chức năng, chỉ mềm hơn) ---- */
    .cp-read { position: fixed; inset: 0; z-index: 900; background: rgba(8,14,26,.66);
      display: flex; align-items: flex-start; justify-content: center; padding: 22px 12px; overflow-y: auto; }
    .cp-read-in { width: 100%; max-width: 720px; background: var(--pv-card); color: var(--ink);
      border-radius: 20px; padding: 18px 20px 22px; margin: auto; box-shadow: 0 40px 90px -35px rgba(0,0,0,.7); }
    .rd-head { display: flex; align-items: center; gap: .8rem; justify-content: space-between;
      border-bottom: 1px solid var(--line); padding-bottom: .6rem; margin-bottom: .9rem; }
    .rd-body { max-height: min(62vh,620px); overflow-y: auto; }
    .rd-zh { font-size: 1.18rem; line-height: 1.85; margin: .7rem 0 .1rem; }
    .rd-tr { font-size: .93rem; color: var(--muted); margin: 0 0 .5rem; }
    .rd-yt { position: relative; padding-top: 56.25%; border-radius: 14px; overflow: hidden; margin-bottom: .9rem; }
    .rd-yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    @media (max-width: 640px) { .rd-body { max-height: 56vh; } }

    .cp-ov { position: fixed; inset: 0; background: rgba(15,23,37,.55); display: none;
      align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .cp-ov.on { display: flex; }
    .cp-modal { background: var(--pv-card); border-radius: 20px; max-width: 420px; width: 100%;
      padding: 1.5rem; box-shadow: var(--shadow-pop); text-align: center; }
    .cp-modal .lk { font-size: 2rem; }
    .cp-modal h3 { margin: .3rem 0 .4rem; font-family: var(--serif); }
    .cp-modal p { color: var(--muted); margin: 0 0 1rem; }
    .cp-modal .btn { text-decoration: none; margin: 0 .3rem .3rem 0; border-radius: var(--pv-pill); }
    .cp-foot { text-align: center; color: var(--muted); font-size: .88rem; padding: 1.6rem 1rem 2.6rem; }
    .cp-foot a { color: var(--accent-ink); }

    @media (max-width: 430px) {
      /* nút header hơi rộng hơn 375px một chút → ẩn tên chữ (giữ logo) và
         thu nhỏ lề để không sinh cuộn ngang */
      .lp-header { padding-left: .75rem; padding-right: .75rem; }
      .lp-header .name { display: none; }
    }
  </style>
</head>
<body class="pv">
  <header class="lp-header">
    <img id="cpLogo" src="icons/logo-64.png" alt="Learning Ecology" />
    <span class="name" id="cpName">Learning Ecology</span>
    <span class="spacer"></span>
    <a class="btn ghost" href="index.html" style="margin-right:.4rem;">← Trang chủ</a>
    <button id="cp-theme" class="ghost theme-btn" aria-label="Sáng / tối" style="margin-right:.4rem;">🌙</button>
    <a id="cp-login" class="btn" href="login.html">Vào học ngay →</a>
  </header>

  <nav class="pv-nav" aria-label="Danh sách khóa học &amp; công cụ">
    <div class="pv-nav-in">
      <div id="cpSideList" class="pv-cats"></div>
      <div class="pv-search">
        <input id="cpSearch" type="search" placeholder="🔎 Tìm khóa học / công cụ…"
               aria-label="Tìm khóa học hoặc công cụ" autocomplete="off" />
      </div>
    </div>
  </nav>

  <main class="pv-main">
    <select class="cp-mobilesel" id="cpMobileSel" aria-label="Chọn khóa học" hidden></select>
    <div id="cpMain"><p class="cp-note">Đang tải nội dung…</p></div>
  </main>

  <div class="cp-foot">
    © <span id="cpYear"></span> <span id="cpFootName">Learning Ecology</span> ·
    <a href="index.html">Trang chủ</a>
  </div>

  <div class="cp-ov" id="cpOverlay" role="dialog" aria-modal="true" aria-labelledby="cpMTitle">
    <div class="cp-modal">
      <div class="lk">🔒</div>
      <h3 id="cpMTitle">Bài học Premium</h3>
      <p>Liên hệ để mở khóa toàn bộ khóa học và học không giới hạn.</p>
      <div id="cpMBtns"></div>
      <button class="ghost" data-cpclose style="margin-top:.4rem;">Đóng</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="ticker.js"></script>
  <script src="premium.js"></script>
  <script src="site-nav.js" defer></script>
  <script>
    const $ = id => document.getElementById(id);
    function esc(s){ return String(s==null?"":s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
    function safeColor(v){ v=String(v==null?"":v).trim();
      return /^#[0-9a-fA-F]{3,8}$/.test(v) || /^rgba?\(\s*[\d.\s,%/]+\)$/i.test(v)
          || /^hsla?\(\s*[\d.\s,%/deg]+\)$/i.test(v) ? v : ""; }
    function iconFor(k){ return ({ html:"🌐", link:"🔗", pdf:"📄", video:"🎬", audio:"🎧",
      quiz:"📝", image:"🖼️", word:"📃", excel:"📊", powerpoint:"📽️", text:"📄" })[String(k||"").toLowerCase()] || "📄"; }
    /* Chuẩn hoá để tìm kiếm không dấu (bỏ dấu tiếng Việt + đ→d). */
    function normA(s){ return String(s == null ? "" : s).toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d"); }
    const CONTACT_FALLBACK = "https://zalo.me/0961923983";
    let CONTACT = CONTACT_FALLBACK;
    let COURSES = [], currentId = null;
    let SECTIONS = [];                 // các công cụ đang mở xem trước công khai
    let TESTIMONIALS = [];             // cảm nhận học viên (do chủ trung tâm nhập; ẩn nếu trống)
    // Tự quản lý vị trí cuộn (SPA) để back/forward/tải lại/quay về từ bài học
    // khôi phục đúng chỗ, không để trình duyệt nhảy lung tung.
    try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
    const SEC_META = {
      reading: { icon: "📖", name: "Thư viện Đọc hiểu", unit: "bài đọc" },
      shadow:  { icon: "🎤", name: "Luyện nói Shadowing", unit: "video" },
      dict:    { icon: "🎧", name: "Chép chính tả", unit: "video" },
      vsat:    { icon: "📝", name: "Luyện thi V-SAT", unit: "đề thi" },
      vstep:   { icon: "📖", name: "Luyện thi VSTEP", unit: "đề thi" },
      hsk:     { icon: "🀄", name: "Bài giảng HSK tương tác", unit: "bài giảng" },
      vocab:   { icon: "🧰", name: "Luyện từ vựng Tiếng Anh & Trung", unit: "từ" }
    };
    /* which page opens each tool at full size */
    const SEC_PAGE = { reading: "reading.html", shadow: "shadow.html",
                       dict: "dictation.html", vsat: "vsat.html", vstep: "vstep.html",
                       hsk: "hsk-slides.html", vocab: "vocab-practice.html" };
    /* tham số mở một mục: đề thi ?exam=, bài giảng HSK ?lesson=, còn lại ?open= */
    const SEC_PARAM = k => IS_EXAM(k) ? "?exam=" : k === "hsk" ? "?lesson=" : "?open=";
    /* Tên, biểu tượng, đơn vị: lấy từ cấu hình thầy đặt ở Bảng điều khiển →
       Hiển thị công khai; thiếu thì mới dùng bảng mặc định bên trên. */
    const secMeta = k => {
      const d = SEC_META[k] || {}, c = (SECTIONS.find(x => x.section === k) || {}).config || {};
      return { icon: c.icon || d.icon || "🧰",
               name: c.name || (c.title || "").replace(/^Mở khóa\s*/i, "") || d.name || k,
               unit: c.unit || d.unit || "bài" };
    };
    /* hai kỳ thi dùng chung một danh sách đề, chỉ khác cột kind */
    const IS_EXAM = k => k === "vsat" || k === "vstep";
    let LAST_ITEMS = [];
    const secCfg = k => (SECTIONS.find(x => x.section === k) || {}).config || {};

    $("cp-theme").addEventListener("click", () => {
      const root = document.documentElement;
      const dark = root.getAttribute("data-theme") === "dark";
      root.setAttribute("data-theme", dark ? "light" : "dark");
      try { localStorage.setItem("hub_theme", dark ? "light" : "dark"); } catch (e) {}
    });

    /* apply the owner's brand — same model as index.html */
    function applyBrand(cfg){
      const B = cfg.brand || {};
      if (B.logo_url) $("cpLogo").src = B.logo_url;
      if (B.site_name){ $("cpName").textContent = B.site_name; $("cpFootName").textContent = B.site_name; $("cpLogo").alt = B.site_name; }
      const c = B.colors || {}, light = [], dark = [], both = [];
      const put=(k,v,arr)=>{ const val=safeColor(c[k]); if(val) arr.push(v+":"+val); };
      [["bg","--paper"],["card","--card"],["heading","--ink"],["body","--muted"]].forEach(([k,v])=>put(k,v,light));
      [["primary","--accent"],["secondary","--accent-ink"],["accent","--gold"]].forEach(([k,v])=>{put(k,v,light);put(k,v,dark);});
      [["btn","--lp-btn"],["btn_hover","--lp-btn-hover"],["btn_text","--lp-btn-text"],
       ["header_bg","--lp-header-bg"],["header_text","--lp-header-text"]].forEach(([k,v])=>put(k,v,both));
      const css = ((light.length||both.length)?`:root{${light.concat(both).join(";")}}`:"")
                + ((dark.length||both.length)?`:root[data-theme="dark"]{${dark.concat(both).join(";")}}`:"");
      if (css){ const st=document.createElement("style"); st.textContent=css; document.head.appendChild(st); }
    }

    /* ---- contact modal ---- */
    function contactButtons(){
      const zalo = /zalo\.me/i.test(CONTACT);
      return `<a class="btn" href="${esc(CONTACT)}" target="_blank" rel="noopener">${zalo ? "💬 Liên hệ ngay" : "Liên hệ ngay"}</a>`
           + `<a class="btn ghost" href="index.html#lien-he">Xem thông tin liên hệ</a>`;
    }
    function showLocked(){
      // popup dùng chung (premium.js) — nội dung theo từng khóa, sửa trong Bảng điều khiển
      if (window.Premium && currentId){
        const c = COURSES.find(x => x.id === currentId) || {};
        Premium.open({ courseId: currentId, courseTitle: c.title || "", thumb: c.banner_url || "" });
        return;
      }
      $("cpMBtns").innerHTML = contactButtons(); $("cpOverlay").classList.add("on");
    }
    $("cpOverlay").addEventListener("click", e => {
      if (e.target.id === "cpOverlay" || e.target.hasAttribute("data-cpclose")) $("cpOverlay").classList.remove("on");
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") $("cpOverlay").classList.remove("on"); });

    /* ---- open a FREE lesson (link or signed URL) ---- */
    async function openLesson(l){
      if (l.url){ window.open(l.url, "_blank", "noopener"); return; }
      if (l.storage_path){
        const w = window.open("", "_blank");
        const { data, error } = await sb.storage.from("materials").createSignedUrl(l.storage_path, 3600);
        if (error || !data){ if (w) w.close(); alert("Không mở được bài học này. Vui lòng thử lại sau."); return; }
        if (w) w.location = data.signedUrl; else window.open(data.signedUrl, "_blank", "noopener");
      }
    }

    /* ---- sidebar ---- */
    function thumbStyle(banner, color){
      return banner ? `background-image:url('${esc(banner)}');`
        : `background:linear-gradient(120deg, ${esc(color||"#1e4f8f")}, ${esc(color||"#1e4f8f")}b3);`;
    }
    /* ============ THANH DANH MỤC (mega-menu) — Phase 62 ============
       Gom khóa học + công cụ vào ít danh mục cho gọn. Cách gom:
         • Khóa học gom theo NGÔN NGỮ (tiếng Trung / tiếng Anh).
         • Công cụ đứng riêng gom theo CHỨC NĂNG (giảng dạy / học tập).
       Đây là mặc định thông minh, nhưng có thể GHI ĐÈ từng mục:
         • Công cụ: đặt config.nav_group ở Bảng điều khiển → Hiển thị công khai.
         • Khóa học: đặt trường nav_group.
       Mục nào không rõ thì rơi vào "Khác" — không bao giờ bị mất. */
    const NAV_CATS = [
      { id: "zh",    key: "zh",    label: "Tiếng Trung",       icon: "🀄" },
      { id: "en",    key: "en",    label: "Tiếng Anh",         icon: "🔤" },
      { id: "teach", key: "teach", label: "Công cụ giảng dạy", icon: "🧑‍🏫" },
      { id: "learn", key: "learn", label: "Công cụ học tập",   icon: "🎧" },
      { id: "other", key: "other", label: "Khác",              icon: "✨" }
    ];
    /* NAV = cây điều hướng do chủ trung tâm đặt (migration61). Chưa chạy
       migration thì NAV=null và trang tự dùng bảng mặc định NAV_CATS như
       Phase 62 — không hỏng. */
    let NAV = null;
    function navCategories(){
      if (NAV && NAV.categories && NAV.categories.length){
        return NAV.categories.map(c => ({ id: c.id, key: c.key || "", label: c.name, icon: c.icon || "📂",
          subs: (c.subs || []).map(s => ({ id: s.id, name: s.name })) }));
      }
      return NAV_CATS.map(c => ({ id: c.id, key: c.key, label: c.label, icon: c.icon, subs: [] }));
    }
    const assignments = () => (NAV && NAV.assignments) || {};

    const HEUR = { reading: "learn", shadow: "learn", dict: "learn", vsat: "en", vstep: "en", hsk: "zh" };
    function sectionKey(section, cfg){
      const g = String((cfg && cfg.nav_group) || "").toLowerCase();
      return ["zh","en","teach","learn","other"].includes(g) ? g : (HEUR[section] || "other");
    }
    function courseKey(c){
      const g = String(c.nav_group || "").toLowerCase();
      if (["zh","en","teach","learn","other"].includes(g)) return g;
      const t = ((c.title || "") + " " + (c.category || "")).toLowerCase();
      if (/teaching tool|giảng dạy|giáo viên|teacher/.test(t)) return "teach";
      if (/hsk|中文|汉语|tiếng trung|chinese/.test(t)) return "zh";
      if (/ielts|vstep|v-?sat|tiếng anh|english/.test(t)) return "en";
      return "other";
    }
    function navItems(){
      const out = [];
      (COURSES || []).forEach(c => out.push({ cid: c.id, title: c.title || "",
        thumb: thumbStyle(c.banner_url, c.color), emptyIcon: c.banner_url ? "" : (c.icon || "📚"),
        desc: c.description || c.subtitle || "", hkey: courseKey(c) }));
      (SECTIONS || []).forEach(s => { const m = secMeta(s.section), cfg = s.config || {};
        out.push({ cid: "sec:" + s.section, title: m.name || s.section,
          thumb: thumbStyle(cfg.cover, "#0e7c66"), emptyIcon: cfg.cover ? "" : (m.icon || "🧰"),
          desc: cfg.tagline || cfg.subtitle || "", hkey: sectionKey(s.section, cfg) }); });
      return out;
    }
    /* mỗi mục → { catId, subId } theo: (1) chủ gán tay, (2) mặc định thông minh */
    function resolveItem(item, cats){
      const a = assignments()[item.cid];
      if (a){
        /* gán theo NHÓM CON: danh mục suy ra từ nhóm con → nhóm con đổi cha
           thì mục tự đi theo, không cần cập nhật gì thêm */
        if (a.s){
          for (const c of cats){ const sub = c.subs.find(s => s.id === a.s);
            if (sub) return { catId: c.id, subId: sub.id }; }
        }
        if (a.c){ const c = cats.find(x => x.id === a.c); if (c) return { catId: c.id, subId: null }; }
      }
      const byKey = cats.find(c => c.key === item.hkey)
                 || cats.find(c => c.key === "other") || cats[0];
      return { catId: byKey ? byKey.id : null, subId: null };
    }

    /* ---- Điều hướng chung (site-nav.js) ------------------------------------
       Ánh xạ neo URL của thanh điều hướng chính (#tieng-trung / #tieng-anh /
       #cong-cu-hoc-tap) sang danh mục tương ứng, mở khoá/mục ĐẦU TIÊN của danh
       mục đó. Đồng thời báo cho site-nav biết đang ở danh mục nào để tô sáng. */
    const SEC_TO_KEY = { "tieng-trung": "zh", "tieng-anh": "en", "cong-cu-hoc-tap": "learn" };
    const KEY_TO_NAV = { zh: "zh", en: "en", learn: "tools" };
    function _resolvedItems(){ const cats = navCategories();
      return { cats, items: navItems().map(it => Object.assign({}, it, resolveItem(it, cats))) }; }
    function firstCidInCatKey(catKey){
      const { cats, items } = _resolvedItems();
      const cat = cats.find(c => (c.key || "") === catKey); if (!cat) return null;
      const it = items.find(x => x.catId === cat.id); return it ? it.cid : null;
    }
    function catKeyOfCid(cid){
      const { cats, items } = _resolvedItems();
      const it = items.find(x => x.cid === cid); if (!it) return null;
      const cat = cats.find(c => c.id === it.catId); return cat ? (cat.key || "") : null;
    }
    function syncNavActive(cid){
      if (!window.SiteNav) return;
      window.SiteNav.setActiveSection(KEY_TO_NAV[catKeyOfCid(cid)] || null);
    }
    /* site-nav gọi khi bấm Tiếng Trung / Tiếng Anh / Công cụ học tập → mở LƯỚI
       thẻ khóa gọn của danh mục tương ứng (không nhảy vào một khóa cụ thể). */
    window.SiteNavHooks = { gotoSection(sec){
      const catKey = SEC_TO_KEY[sec]; if (!catKey) return false;
      const catId = catIdByKey(catKey); if (!catId) return false;
      showCategory(catId, true);
      return true;
    }};

    /* Thanh danh mục: chỉ còn NÚT tab (không còn menu thả xuống khi rê chuột).
       Bấm một tab → hiện lưới thẻ khóa của danh mục đó ở vùng nội dung. */
    function renderSidebar(){
      const cats = navCategories();
      const items = navItems().map(it => Object.assign(it, resolveItem(it, cats)));
      $("cpSideList").innerHTML = cats.map(cat => {
        const mine = items.filter(x => x.catId === cat.id);
        if (!mine.length) return "";
        return `
          <div class="pv-cat" data-cat="${esc(cat.id)}">
            <button class="pv-cat-btn" type="button">
              <span class="pv-cat-ic">${cat.icon}</span><span>${esc(cat.label)}</span>
              <span class="pv-cat-n">${mine.length}</span>
            </button>
          </div>`;
      }).join("");
      $("cpMobileSel").innerHTML = cats.map(cat => {
        const mine = items.filter(x => x.catId === cat.id);
        return mine.length ? `<optgroup label="${esc(cat.label)}">`
          + mine.map(x => `<option value="${esc(x.cid)}">${esc(x.title)}</option>`).join("") + `</optgroup>` : "";
      }).join("");
    }

    /* Đang xem một khóa → tô sáng đúng TAB danh mục chứa khóa đó (không còn
       menu con nên chỉ cần đánh dấu tab). */
    function markCurrent(id){ markCategoryTab(catIdOfCid(id)); }

    /* Bấm một tab danh mục → hiện lưới thẻ khóa của danh mục đó (KHÔNG còn
       menu thả xuống; không còn sự kiện rê chuột/mở-đóng). */
    $("cpSideList").addEventListener("click", e => {
      const btn = e.target.closest(".pv-cat-btn"); if (!btn) return;
      showCategory(btn.closest(".pv-cat").getAttribute("data-cat"), true);
    });
    // Breadcrumb: về tổng quan (root) hoặc về lưới danh mục — link thật nhưng
    // chặn để chạy SPA (không tải lại trang, không mất trạng thái).
    $("cpMain").addEventListener("click", e => {
      const a = e.target.closest(".cp-crumbs a"); if (!a) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
      e.preventDefault();
      const kind = a.getAttribute("data-crumb");
      if (kind === "root") { const d = defaultCatId(); if (d) showCategory(d, true); }
      else if (kind === "cat") { showCategory(a.getAttribute("data-cat"), true); }
    });
    $("cpMobileSel").addEventListener("change", e => { if (e.target.value) switchCourse(e.target.value, true); });
    // Back / Forward: đọc lại URL và vẽ đúng chế độ xem trước đó (+ khôi phục cuộn).
    window.addEventListener("popstate", () => { routeFromUrl(true); });

    /* ---- render one course (banner + visual lesson grid) ---- */
    function banner(c, lessons){
      const free = lessons.filter(l => !l.premium).length, prem = lessons.length - free;
      return `
        <div class="course-banner">
          <div class="cb-bg" style="${thumbStyle(c.banner_url, c.color)}">${c.banner_url ? "" : esc(c.icon || "📚")}</div>
          <div class="cb-shade"></div>
          ${c.category ? `<span class="cb-tag">${esc(c.category)}</span>` : ""}
          ${c.tier === "premium" ? `<span class="cb-prem">👑 Premium</span>` : ""}
          <div class="cb-info">
            <div class="cb-title">${c.icon ? esc(c.icon) + " " : ""}${esc(c.title)}</div>
            <div class="cb-stats">
              <span>📚 ${lessons.length} bài học</span>
              <span>🔓 ${free} học thử miễn phí</span>
              ${prem ? `<span>👑 ${prem} Premium</span>` : ""}
            </div>
          </div>
        </div>
        ${c.description ? `<p class="cp-desc">${esc(c.description)}</p>` : ""}`;
    }
    function lessonCard(l, n){
      const prem = !!l.premium;
      const kind = String(l.kind || "file").toLowerCase();
      const foot = prem
        ? `<span class="cp-badge prem">👑 Premium</span><button class="ghost prem-btn lc-prem-btn" data-lock>🔒 Mở khóa</button>`
        : (l.url || l.storage_path)
          ? `<span class="cp-badge free">Miễn phí</span><button class="btn" data-open='${esc(JSON.stringify({ url: l.url || "", storage_path: l.storage_path || "" }))}'>Học thử miễn phí</button>`
          : `<span class="cp-badge free">Miễn phí</span><span class="pill">sắp có</span>`;
      return `
        <div class="lcard ${prem ? "prem" : ""}">
          <div class="lc-thumb lk-${esc(kind)}"${l.image_url ? ` style="background-image:url('${esc(l.image_url)}');"` : ""}>
            ${l.image_url ? "" : iconFor(kind)}
            <span class="lc-num">${n}</span>
            ${prem ? `<span class="lc-state s-lock">🔒</span>` : ""}
          </div>
          <div class="lc-body">
            <div class="lc-title">${esc(l.title)}</div>
            <span class="lc-kind">${esc(l.kind || "")}${l.est_minutes ? " · ~" + l.est_minutes + " phút" : ""}</span>
          </div>
          <div class="lc-foot">${foot}</div>
        </div>`;
    }
    /* Khối so sánh Miễn phí ↔ Premium (mượn ý youpass): chỉ hiện khi có nội
       dung Premium, nếu không thì so sánh vô nghĩa. Nút Premium dùng lại đúng
       popup mở khóa sẵn có. */
    function cmpBlock(free, prem, opts){
      opts = opts || {};
      if (!prem) return "";
      const total = free + prem;
      const premBens = (opts.benefits && opts.benefits.length) ? opts.benefits.slice(0, 4) : [
        "Mở khóa toàn bộ " + total + " mục",
        "Học không giới hạn, cập nhật trọn đời",
        "Ưu tiên hỗ trợ từ giáo viên"
      ];
      return `
        <div class="pv-cmp">
          <div class="pv-cmp-col free">
            <h3 class="pv-cmp-h">Miễn phí</h3>
            <p class="pv-cmp-sub">Bắt đầu ngay hôm nay</p>
            <ul>
              <li><span>✓</span>Học thử ${free} mục — đăng nhập nhanh bằng Google</li>
              <li><span>✓</span>Trải nghiệm giao diện học thật</li>

          <div class="cb-info">

            <div class="cb-stats">

    function secCard(it, n, sec){
      const lvl = it.level ? "HSK " + it.level : "";
      const sub = sec === "reading"
        ? [lvl, it.words ? "✍ " + it.words + " từ" : ""].filter(Boolean).join(" · ")
        : sec === "hsk"
        ? [lvl, it.vocab ? "📚 " + it.vocab + " từ" : "",
           it.slides ? "🖼 " + it.slides + " slide" : ""].filter(Boolean).join(" · ")
        : IS_EXAM(sec)
        ? [it.questions ? "📝 " + it.questions + " câu" : "",
           it.duration_min ? "⏱ " + it.duration_min + " phút" : "",
           it.max_raw ? "🎯 " + it.max_raw + " điểm" : ""].filter(Boolean).join(" · ")
        : [lvl, it.lines ? "🗣 " + it.lines + " câu" : ""].filter(Boolean).join(" · ");
      const foot = it.premium
        ? `<span class="cp-badge prem">👑 Premium</span><button class="ghost lc-prem-btn" data-sec-lock>🔒 Mở khóa</button>`
        : `<span class="cp-badge free">Miễn phí</span><button class="btn" data-sec-open="${esc(it.id)}">Học thử</button>`;
      return `
        <div class="lcard ${it.premium ? "prem" : ""}">
          <div class="lc-thumb"${it.cover_url ? ` style="background-image:url('${esc(it.cover_url)}');"` : ""}>
            ${it.cover_url ? "" : secMeta(sec).icon}
            <span class="lc-num">${n}</span>
            ${it.premium ? `<span class="lc-state s-lock">🔒</span>` : ""}
          </div>
          <div class="lc-body">
            <div class="lc-title">${esc(it.title || "")}</div>
            ${it.title_vi ? `<div class="lc-vi">${esc(it.title_vi)}</div>` : ""}
            <span class="lc-kind">${esc(sub)}</span>
          </div>
          <div class="lc-foot">${foot}</div>
        </div>`;
    }

    // Mở một mục MIỄN PHÍ ngay trên trang — máy chủ chỉ trả nội dung khi mục đó free
    async function openSecItem(sec, id){
      const ov = document.createElement("div");
      ov.className = "cp-read";
      ov.innerHTML = `<div class="cp-read-in"><p class="cp-note">Đang tải…</p></div>`;
      document.body.appendChild(ov);
      const close = () => ov.remove();
      ov.addEventListener("click", e => { if (e.target === ov) close(); });
      document.addEventListener("keydown", function esc2(e){
        if (e.key === "Escape"){ close(); document.removeEventListener("keydown", esc2); } });

      const res = sec === "reading"
        ? await sb.rpc("public_reading_text", { p_id: id }).then(r => r, () => ({ data: null }))
        : await sb.rpc("public_video", { p_id: id, p_kind: sec }).then(r => r, () => ({ data: null }));
      const d = res && res.data;
      if (!d){
        ov.querySelector(".cp-read-in").innerHTML =
          `<p class="cp-note">Nội dung này cần mở khóa Premium.</p>
           <div class="cp-cta"><button class="btn cp-gold" id="rdBuy">👑 Mở khóa Premium</button>
           <button class="ghost" id="rdX">Đóng</button></div>`;
        ov.querySelector("#rdBuy").addEventListener("click", () =>
          Premium.open({ section: sec, courseTitle: (SEC_META[sec]||{}).name }));
        ov.querySelector("#rdX").addEventListener("click", close);
        return;
      }

      let body = "";
      if (sec === "reading"){
        const lines = String(d.content || "").split("\n").filter(x => x.trim());
        const trs = String(d.translation || "").split("\n");
        body = lines.map((ln, i) => `<p class="rd-zh">${esc(ln)}</p>` +
          (trs[i] && trs[i].trim() ? `<p class="rd-tr">${esc(trs[i])}</p>` : "")).join("");
      } else {
        const subs = Array.isArray(d.subs) ? d.subs : [];
        body = `<div class="rd-yt"><iframe src="https://www.youtube-nocookie.com/embed/${esc(d.yt)}"
                  title="${esc(d.title || "")}" frameborder="0" allowfullscreen
                  allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture"></iframe></div>`
          + subs.slice(0, 8).map(x => `<p class="rd-zh">${esc(x.zh || "")}</p>` +
              (x.tr ? `<p class="rd-tr">${esc(x.tr)}</p>` : "")).join("")
          + (subs.length > 8 ? `<p class="cp-note">… còn ${subs.length - 8} câu nữa trong ứng dụng.</p>` : "");
      }
      ov.querySelector(".cp-read-in").innerHTML = `
        <div class="rd-head">
          <div><b>${esc(d.title || "")}</b>${d.title_vi ? ` — <span class="cp-note" style="display:inline">${esc(d.title_vi)}</span>` : ""}</div>
          <button class="ghost" id="rdX2">✕</button>
        </div>
        <div class="rd-body">${body}</div>
        <div class="cp-unlock" style="margin-top:1rem;">
          <h3>Thích cách học này?</h3>
          <p>Đăng nhập để lưu từ vựng, xem pinyin, chấm phát âm và theo dõi tiến độ — hoặc mở khóa toàn bộ ${esc((SEC_META[sec]||{}).name || "")}.</p>
          <div><a class="btn" href="login.html">Đăng nhập / Đăng ký</a>
               <button class="btn cp-gold" id="rdBuy2">👑 Mở khóa Premium</button></div>
        </div>`;
      ov.querySelector("#rdX2").addEventListener("click", close);
      ov.querySelector("#rdBuy2").addEventListener("click", () =>
        Premium.open({ section: sec, courseTitle: secMeta(sec).name, thumb: secCfg(sec).cover || "" }));
    }
    const money = v => (v == null || v === "" || isNaN(Number(v))) ? "" : Number(v).toLocaleString("vi-VN") + "đ";

    /* ================= ĐIỀU HƯỚNG THEO CẤP + TRẠNG THÁI TRÊN URL =================
       Hai chế độ xem, đều lưu vào URL để bookmark/chia sẻ/back-forward:
         • Lưới danh mục   → course.html?cat=<catId>   (thẻ khóa gọn)
         • Xem một khóa    → course.html?id=<courseId>  (banner + danh sách bài)
       Không tạo mục lịch sử thừa: chỉ đẩy (pushState) khi NGƯỜI DÙNG bấm; khi
       tải lần đầu / back-forward thì chỉ đọc URL và vẽ lại (không đẩy). */

    /* -- tiện ích danh mục -- */
    function categoryById(catId){ return navCategories().find(c => c.id === catId) || null; }
    function catIdByKey(key){ const c = navCategories().find(c => (c.key || "") === key); return c ? c.id : null; }
    function catIdOfCid(cid){ const { cats, items } = _resolvedItems();
      const it = items.find(x => x.cid === cid); if (!it) return null; return it.catId; }
    function itemsInCat(catId){ const { items } = _resolvedItems(); return items.filter(x => x.catId === catId); }
    function defaultCatId(){ const cats = navCategories();
      for (const c of cats) if (itemsInCat(c.id).length) return c.id; return cats[0] && cats[0].id; }

    function markCategoryTab(catId){
      $("cpSideList").querySelectorAll(".ci").forEach(b => b.classList.remove("on"));
      $("cpSideList").querySelectorAll(".pv-cat").forEach(cat =>
        cat.classList.toggle("has-active", cat.getAttribute("data-cat") === catId));
      const sel = $("cpMobileSel"); if (sel) sel.value = "";
    }
    function syncNavActiveByCat(catId){
      if (!window.SiteNav) return;
      const c = categoryById(catId);
      window.SiteNav.setActiveSection(KEY_TO_NAV[c && c.key] || null);
    }

    /* -- breadcrumb -- */
    function crumbs(levels){
      const parts = levels.map((lv, i) => {
        if (lv.cur || i === levels.length - 1) return `<span class="cur">${esc(lv.label)}</span>`;
        const attr = lv.root ? ' data-crumb="root"' : (lv.cat ? ` data-crumb="cat" data-cat="${esc(lv.cat)}"` : "");
        const href = lv.root ? "course.html" : (lv.cat ? "course.html?cat=" + encodeURIComponent(lv.cat) : "course.html");
        return `<a href="${href}"${attr}>${esc(lv.label)}</a>`;
      });
      return `<nav class="cp-crumbs" aria-label="Breadcrumb">` +
        parts.join('<span class="sep" aria-hidden="true">›</span>') + `</nav>`;
    }
    function courseCrumb(title){
      const catId = catIdOfCid(currentId), cat = catId ? categoryById(catId) : null;
      const levels = [{ label: "Khóa học & Tài liệu", root: true }];
      if (cat) levels.push({ label: cat.label, cat: cat.id });
      levels.push({ label: title, cur: true });
      return crumbs(levels);
    }

    /* -- đếm số bài (miễn phí / Premium) cho từng thẻ, có bộ nhớ đệm -- */
    const COUNTS = {};
    async function sectionItems(sec){
      if (sec === "vocab"){
        const [zr, er] = await Promise.all([
          sb.rpc("public_vocab_lessons", { p_level: null, p_language: "zh" }).then(r => r, () => ({ data: null })),
          sb.rpc("public_vocab_lessons", { p_level: null, p_language: "en" }).then(r => r, () => ({ data: null }))
        ]);
        const rows = [].concat(Array.isArray(zr && zr.data) ? zr.data : [], Array.isArray(er && er.data) ? er.data : []);
        return rows.map(l => ({ id: l.lesson_id, title: l.title, premium: (l.tier || "free") === "premium" }));
      }
      const res = sec === "reading" ? await sb.rpc("public_reading_list").then(r => r, () => ({ data: null }))
        : sec === "hsk" ? await sb.rpc("public_hsk_lessons", { p_level: null }).then(r => r, () => ({ data: null }))
        : sec === "vstep" ? await Promise.all([
            sb.rpc("public_vsat_list", { p_kind: "vstep-reading" }).then(r => r, () => ({ data: null })),
            sb.rpc("public_vsat_list", { p_kind: "vstep-listening" }).then(r => r, () => ({ data: null }))
          ]).then(rs => ({ data: rs.reduce((a, r) => a.concat(Array.isArray(r && r.data) ? r.data : []), []) }))
        : IS_EXAM(sec) ? await sb.rpc("public_vsat_list", { p_kind: "vsat" }).then(r => r, () => ({ data: null }))
        : await sb.rpc("public_video_list", { p_kind: sec }).then(r => r, () => ({ data: null }));
      let items = Array.isArray(res && res.data) ? res.data : [];
      if (sec === "hsk") items = items.map(l => ({ id: l.lesson_id, title: l.title, title_vi: l.subtitle || "",
        premium: !!l.premium, cover_url: "", level: l.hsk_level, vocab: l.vocab_count, slides: l.slide_count }));
      else if (IS_EXAM(sec)) items = items.map(e => ({ id: e.exam_id, title: e.title, title_vi: e.subtitle || "",
        premium: !!e.premium, cover_url: "", questions: e.questions, duration_min: e.duration_min, max_raw: e.max_raw,
        page: e.kind === "vstep-listening" ? "vstep-listening.html" : e.kind === "vstep-reading" ? "vstep.html" : "vsat.html" }));
      return items;
    }
    async function getCounts(cid){
      if (COUNTS[cid]) return COUNTS[cid];
      let total = 0, free = 0, prem = 0;
      try {
        if (String(cid).startsWith("sec:")){
          const items = await sectionItems(cid.slice(4));
          total = items.length; prem = items.filter(i => i.premium).length; free = total - prem;
        } else {
          const r = await sb.rpc("public_course", { p_course: cid }).then(x => x, () => ({ data: null }));
          const lessons = (r && r.data && r.data.lessons) || [];
          total = lessons.length; prem = lessons.filter(l => l.premium).length; free = total - prem;
        }
      } catch (e) {}
      COUNTS[cid] = { total, free, prem };
      return COUNTS[cid];
    }

    /* -- thẻ khóa gọn (compact) -- */
    function courseCard(item){
      const href = "course.html?id=" + encodeURIComponent(item.cid);
      return `
        <a class="ccard" href="${href}" data-cid="${esc(item.cid)}">
          <div class="cc-thumb" style="${item.thumb}">${item.emptyIcon ? esc(item.emptyIcon) : ""}
            <span class="cc-badge" data-badge hidden></span>
          </div>
          <div class="cc-body">
            <div class="cc-title">${esc(item.title)}</div>
            ${item.desc ? `<div class="cc-desc">${esc(item.desc)}</div>` : ""}
            <div class="cc-stats" data-stats>…</div>
          </div>
        </a>`;
    }
    function fillCard(card, c){
      const stats = card.querySelector("[data-stats]");
      if (stats) stats.innerHTML = `📚 ${c.total} bài · 🔓 ${c.free} miễn phí` + (c.prem ? ` · 👑 ${c.prem} Premium` : "");
      const badge = card.querySelector("[data-badge]");
      if (badge){ badge.hidden = false;
        if (c.free > 0){ badge.className = "cc-badge free"; badge.textContent = "Miễn phí"; }
        else { badge.className = "cc-badge prem"; badge.textContent = "👑 Premium"; }
      }
      if (c.total > 0 && c.free === 0) card.classList.add("prem");
    }
    function renderCategoryGrid(catId){
      const cat = categoryById(catId);
      const its = itemsInCat(catId);
      document.title = (cat ? cat.label : "Khóa học") + " — Learning Ecology";
      /* Sắp thẻ theo NHÓM CON có sẵn (VSTEP · IELTS · V-SAT…). Chỉ hiện tiêu đề
         nhóm nào CÓ khóa; giữ nguyên gán khóa→nhóm (không tạo/đổi/xóa nhóm).
         Khóa không thuộc nhóm con nào thì xếp cuối, không tiêu đề. */
      let body = "";
      if (its.length){
        const subs = (cat && cat.subs) || [];
        subs.forEach(sub => {
          const inSub = its.filter(x => x.subId === sub.id);
          if (!inSub.length) return;   // ẩn tiêu đề nhóm rỗng
          body += `<h3 class="cg-sub">${esc(sub.name)}</h3><div class="cgrid">${inSub.map(courseCard).join("")}</div>`;
        });
        const noSub = its.filter(x => !x.subId);
        if (noSub.length) body += `<div class="cgrid">${noSub.map(courseCard).join("")}</div>`;
      } else {
        body = `<p class="cp-note">Danh mục này chưa có khóa học nào.</p>`;
      }
      $("cpMain").innerHTML =
        crumbs([{ label: "Khóa học & Tài liệu", root: true }, { label: cat ? cat.label : catId, cur: true }])
        + `<h2 class="cg-h">${cat ? esc((cat.icon || "") + " " + cat.label) : ""}</h2>`
        + body
        + testimonialsHtml();
      // thẻ mở khóa nào bấm cũng vào xem khóa đó (SPA, không tải lại trang)
      const cards = {};
      $("cpMain").querySelectorAll(".ccard").forEach(a => {
        cards[a.getAttribute("data-cid")] = a;
        a.addEventListener("click", e => {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;   // cho mở tab mới
          e.preventDefault(); switchCourse(a.getAttribute("data-cid"), true);
        });
      });
      // đếm số bài (nền, có đệm) rồi điền vào từng thẻ
      its.forEach(item => getCounts(item.cid).then(c => { const card = cards[item.cid]; if (card) fillCard(card, c); }));
    }

    /* -- Cảm nhận học viên (social proof). Chỉ hiện khi chủ trung tâm đã nhập
          trong Bảng điều khiển → Landing → Cảm nhận học viên. Không bịa. -- */
    function testimonialsHtml(){
      if (!TESTIMONIALS.length) return "";
      const cards = TESTIMONIALS.slice(0, 12).map(t => {
        const text = String(t.text || t.quote || "");
        const name = String(t.name || "").trim();
        const role = String(t.role || "").trim();
        const avImg = t.avatar && /^https?:\/\//i.test(t.avatar)
          ? `<img class="tm-av tm-av-img" src="${esc(t.avatar)}" alt="" loading="lazy" />`
          : `<span class="tm-av">${name ? esc(name.charAt(0).toUpperCase()) : "★"}</span>`;
        return `<figure class="tm-card">
            <blockquote class="tm-quote">${esc(text)}</blockquote>
            <figcaption class="tm-who">${avImg}
              <span class="tm-meta"><b>${esc(name || "Học viên")}</b>${role ? `<span class="tm-role">${esc(role)}</span>` : ""}</span>
            </figcaption>
          </figure>`;
      }).join("");
      return `<section class="tm-sec"><h3 class="tm-h">💬 Học viên nói gì</h3><div class="tm-grid">${cards}</div></section>`;
    }

    /* -- Tìm kiếm khóa học/công cụ (mọi danh mục, không dấu) -- */
    function renderSearch(q){
      const nq = normA(q);
      const { cats, items } = _resolvedItems();
      const catLabel = {}, subName = {};
      cats.forEach(c => { catLabel[c.id] = c.label; (c.subs || []).forEach(s => { subName[s.id] = s.name; }); });
      const hay = it => normA([it.title, catLabel[it.catId] || "", subName[it.subId] || ""].join(" "));
      const matches = items.filter(it => hay(it).includes(nq));
      document.title = "Tìm: " + q + " — Learning Ecology";
      const body = matches.length
        ? `<div class="cgrid">${matches.map(courseCard).join("")}</div>`
        : `<p class="cp-note">Không tìm thấy khóa học/công cụ nào khớp “${esc(q)}”. Thử từ khóa khác (vd HSK, VSTEP, IELTS, nghe, đọc…).</p>`;
      $("cpMain").innerHTML =
        crumbs([{ label: "Khóa học & Tài liệu", root: true }, { label: "Kết quả tìm kiếm", cur: true }])
        + `<h2 class="cg-h">🔎 ${matches.length} kết quả cho “${esc(q)}”</h2>`
        + body;
      const cards = {};
      $("cpMain").querySelectorAll(".ccard").forEach(a => {
        cards[a.getAttribute("data-cid")] = a;
        a.addEventListener("click", e => {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
          e.preventDefault(); switchCourse(a.getAttribute("data-cid"), true);
        });
      });
      matches.forEach(it => getCounts(it.cid).then(c => { const card = cards[it.cid]; if (card) fillCard(card, c); }));
      afterRender(false);
    }
    function wireSearch(){
      const inp = $("cpSearch"); if (!inp || inp._wired) return; inp._wired = true;
      let t = null;
      inp.addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(() => {
          const q = inp.value.trim();
          if (q) renderSearch(q); else routeFromUrl(false);   // ô rỗng → khôi phục đúng chế độ theo URL
        }, 160);
      });
      inp.addEventListener("keydown", e => { if (e.key === "Escape") { inp.value = ""; routeFromUrl(false); } });
    }

    function showCategory(catId, push, restore){
      if (!catId) return;
      currentId = "cat:" + catId;
      markCategoryTab(catId);
      syncNavActiveByCat(catId);
      if (push === "replace") { try { history.replaceState(null, "", "course.html?cat=" + encodeURIComponent(catId)); } catch(e){} }
      else if (push) { try { history.pushState(null, "", "course.html?cat=" + encodeURIComponent(catId)); } catch(e){} }
      renderCategoryGrid(catId);
      afterRender(restore);
    }

    /* -- lưu / khôi phục vị trí cuộn theo URL (đọc lại khi back-forward, tải lại,
          hay quay về từ một bài học) -- */
    const _saveScroll = () => { try { sessionStorage.setItem("cp_scroll_" + location.search, String(Math.round(scrollY))); } catch(e){} };
    let _scrollT = null;
    addEventListener("scroll", () => { if (_scrollT) return;
      _scrollT = setTimeout(() => { _scrollT = null; _saveScroll(); }, 150);
    }, { passive: true });
    // Rời trang (mở một bài học ở trang khác) → lưu vị trí để lúc BACK quay về đúng chỗ.
    addEventListener("pagehide", _saveScroll);
    function afterRender(restore){
      if (restore){
        let y = 0; try { y = parseInt(sessionStorage.getItem("cp_scroll_" + location.search) || "0", 10) || 0; } catch(e){}
        window.scrollTo(0, y);
        if (y) setTimeout(() => window.scrollTo(0, y), 250);   // giữ đúng chỗ sau khi ảnh/số liệu tải xong
      } else { window.scrollTo(0, 0); }
    }

    /* -- chọn đúng chế độ xem từ URL (dùng cho tải lần đầu + back/forward) -- */
    function routeFromUrl(restore){
      const p = new URLSearchParams(location.search);
      const id = p.get("id"), cat = p.get("cat");
      const isSec = v => String(v || "").startsWith("sec:") && SECTIONS.some(x => "sec:" + x.section === v);
      if (id && (COURSES.some(c => c.id === id) || isSec(id))) return switchCourse(id, false, restore);
      if (cat && categoryById(cat)) return showCategory(cat, false, restore);
      const hashSec = (location.hash || "").slice(1);
      if (SEC_TO_KEY[hashSec]) { const cid = catIdByKey(SEC_TO_KEY[hashSec]); if (cid) return showCategory(cid, "replace", restore); }
      if (id) return switchCourse(id, false, restore);        // id lạ → vẫn thử (hiện "không tìm thấy")
      const first = defaultCatId();
      if (first) return showCategory(first, "replace", restore);   // mặc định: lưới danh mục đầu tiên
      $("cpMain").innerHTML = notFoundHtml();
    }

    async function switchCourse(id, push, restore){
      if (!id) return;
      currentId = id;
      markCurrent(id);
      syncNavActive(id);
      if (push){ try { history.pushState({ id }, "", "course.html?id=" + encodeURIComponent(id)); } catch(e){} }
      $("cpMain").innerHTML = `<p class="cp-note">Đang tải…</p>`;
      if (String(id).startsWith("sec:")) { renderSection(id.slice(4)); afterRender(restore); return; }
      const res = await sb.rpc("public_course", { p_course: id }).then(r => r, () => ({ data: null }));
      const data = res && res.data;
      if (!data || !data.course){ document.title = "Khóa học — Learning Ecology"; $("cpMain").innerHTML = notFoundHtml(); afterRender(restore); return; }
      renderCourse(data);
      afterRender(restore);
    }

    async function boot(){
      $("cpYear").textContent = new Date().getFullYear();
      const id = new URLSearchParams(location.search).get("id");
      const [setRes, listRes, secRes, navRes, fbRes] = await Promise.all([
        sb.from("landing_settings").select("config").eq("id", 1).maybeSingle().then(r => r, () => ({ data: null })),
        sb.rpc("public_courses").then(r => r, () => ({ data: null })),
        sb.rpc("public_sections").then(r => r, () => ({ data: null })),  // cần migration47
        sb.rpc("public_nav").then(r => r, () => ({ data: null })),       // cần migration61 — thiếu thì dùng mặc định
        // Cảm nhận học viên ĐÃ ĐĂNG (dùng lại kho có sẵn ở Landing → không tạo mới, không bịa)
        sb.from("landing_feedback").select("student_name, role_label, course_label, feedback, avatar_url")
          .eq("status", "published").order("sort_order").then(r => r, () => ({ data: null }))
      ]);
      SECTIONS = Array.isArray(secRes && secRes.data) ? secRes.data : [];
      NAV = (navRes && navRes.data && Array.isArray(navRes.data.categories) && navRes.data.categories.length)
            ? navRes.data : null;
      const cfg = (setRes && setRes.data && setRes.data.config) || {};
      applyBrand(cfg);
      TESTIMONIALS = ((fbRes && Array.isArray(fbRes.data)) ? fbRes.data : [])
        .filter(f => f && f.feedback)
        .map(f => ({ name: f.student_name, role: f.role_label || f.course_label || "",
                     text: f.feedback, avatar: f.avatar_url || "" }));
      const cUrl = cfg.trial && cfg.trial.s_url;
      if (cUrl && /^https?:\/\//i.test(cUrl)) CONTACT = cUrl;
      sb.auth.getSession().then(({ data }) => {
        const el = $("cp-login");
        if (data && data.session) { el.textContent = "Vào học ngay →"; el.href = "dashboard.html"; }
        else el.textContent = "Đăng nhập";
      }).catch(() => {});

      COURSES = (listRes && Array.isArray(listRes.data)) ? listRes.data : [];
      if (!COURSES.length && !SECTIONS.length && !id){
        const nav = document.querySelector(".pv-nav"); if (nav) nav.style.display = "none";
        $("cpMain").innerHTML = notFoundHtml();
        return;
      }
      renderSidebar();
      // thanh điều hướng chung + ô "Về trang chủ" (có thể chủ trung tâm chỉnh
      // trong landing_settings.config.home_promo: {show,title,desc,btnLabel,href,badge})
      if (window.SiteNav) window.SiteNav.renderPromo((cfg && cfg.home_promo) || {});
      // Vẽ đúng chế độ xem theo URL: ?id=<khóa> · ?cat=<danh mục> · #tieng-anh…
      // (mặc định = lưới danh mục đầu tiên). Khôi phục vị trí cuộn nếu có
      // (tải lại / quay về từ một bài học).
      routeFromUrl(true);
      wireSearch();
    }
    boot();
  </script>
</body>
</html>
